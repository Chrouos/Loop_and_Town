character_id: doctor
entries:
  - id: doctor_leave_hospital
    at: { day: 0, time: "17:40" }
    visibility: hidden
    when: { path: characters.doctor.route, op: eq, value: old_station }
    effects:
      - set: { path: characters.doctor.location, value: road_to_old_station }
  - id: doctor_arrive_station
    at: { day: 0, time: "17:58" }
    visibility: hidden
    when: { path: characters.doctor.route, op: eq, value: old_station }
    effects:
      - set: { path: characters.doctor.location, value: old_station }
  - id: doctor_leave_station_via_maintenance
    at: { day: 0, time: "18:12" }
    visibility: hidden
    when:
      all:
        - { path: characters.wakaharu.route, op: eq, value: home }
        - { path: characters.doctor.location, op: eq, value: old_station }
        - { path: world.station_handoff_completed, op: eq, value: false }
    effects:
      - set: { path: characters.doctor.location, value: road_to_maintenance_tunnel }
  - id: doctor_enter_maintenance
    at: { day: 0, time: "18:24" }
    visibility: hidden
    when: { path: characters.doctor.location, op: eq, value: road_to_maintenance_tunnel }
    effects:
      - set: { path: characters.doctor.location, value: maintenance_tunnel }
      - add_flag: world.doctor_maintenance_exposed

