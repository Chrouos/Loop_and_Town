      - tingan: 喂？哪位？
      - me: 葉小姐。我是林知夏的妹妹。
      - pause: 1.5
      - tingan: ……妳怎麼會有我的號碼？
      - me: 一點十分。圖書館，地方史室。
      - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
