# 第四章｜五年前
# 盲眼主角版。格式見 docs/design.md §11；故事見 docs/story.md §5。
chapter: 4
title: 五年前
start: c4_train
advance:
  - if: know.k_recorder_voice && know.k_medical_records && know.k_research_purpose && know.k_zhixia_saw_my_death
    to: 5

scenes:
  # ─────────────────────────── 06:12 列車 ───────────────────────────
  - id: c4_train
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    threads:
      gossip:
        beats:
          - { old_man: 鐘樓那邊這禮拜也在拉線。, at: back-left, as: 後座的老先生 }
          - { old_woman: 鐘都拆了，還拉什麼線？, at: back-left, as: 後座的老太太 }
          - { old_man: 說是舊的線路要接回去。防災用的。, at: back-left, as: 後座的老先生 }
          - { old_woman: 五年前也說是防災用的。, at: back-left, as: 後座的老太太 }
          - pause: 1
          - { narr: 塑膠袋窸窣了一陣，老太太把橘子皮包起來，沒有再接話。 }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 六點十二分。
      - if: chloop >= 2
        then:
          - narr: 後座那聲咳嗽準時響了，橘子皮的味道也是。
          - think: 我讓它們照原樣過去。
          - if: know.c4_let_it_happen
            then:
              - think: 有一次，我沒有動任何人。
              - think: 若晴的名字，是在餐館的電視裡聽見的。
              - pause: 1.5
          - think: 五年前那一天，我還有一大半沒聽到。再走一次。
        else:
          - narr: 我醒來的時候，手已經在外套口袋裡了。
          - narr: 指尖壓著那一行凸點。不、要、回、來。
          - pause: 1.5
          - think: 十八點三十一分，我已經聽過三次。
          - think: 有人死，午夜會重來。沒有人死，午夜也照樣敲十二下。
          - think: 那我在今天裡面把誰挪到哪裡，好像都沒有差。
          - pause: 1
          - { think: 為什麼偏偏是十八點三十一分？, mem: m_c4_why_1831 }
          - think: 五年前，到底發生了什麼？
          - { sfx: cough, at: back-left, dist: mid, text: 咳 }
          - narr: 後面有人咳嗽，跟前三次是同一個時候。
          - { cue: gossip, at: back-left, text: 窸窸窣窣, sfx: whisper }
      - think: 下車之前，我得先想好今天要不要動別人。
      - choice:
          timeout: 14
          options:
            - text: （像上次那樣，先把所有人移開）
              then:
                - set: dispersed
                - think: 若晴、陳醫生、予安。先一通一通打電話，把他們放到不會出事的地方。
                - think: 然後再去問五年前的事。
            - text: （這次，不動任何人）
              then:
                - set: c4_baseline
                - think: 上次我把所有人都移開，一整天安安靜靜，什麼也沒問到。
                - pause: 1.5
                - think: 六點三十一分舊車站會發生什麼，我知道。
                - think: 若晴會去。這次我不打那通電話。
      - { sfx: station_chime, at: front, dist: far, text: 叮咚—— }
      - { announcer: 下一站，灰潮鎮。, as: 廣播 }
      - { sfx: train_brake, at: front, dist: mid, text: 嘰—— }
    next: c4_platform

  # ─────────────────────────── 07:40 月台 ───────────────────────────
  - id: c4_platform
    time: "07:40"
    place: 灰潮鎮站
    ambience: [platform]
    cast: { yuan: front-right }
    beats:
      - { sfx: train_door, at: right, dist: near, text: 嘶——喀 }
      - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
      - yuan: 比我想的早。
      - me: 車沒誤點。
      - narr: 接下來那幾句，我讓它們從耳邊滑過去。
      - yuan: 請扶著我的左手肘。前面有階梯。
      - narr: 他袖子上有機油和黃銅的味道。
      - me: 予安。九點以後，可以帶我去派出所嗎？
      - pause: 1
      - yuan: 派出所？
      - yuan: ……妳一下車就要去報案喔？
      - me: 我想問我姊的事。
      - pause: 2
      - yuan: 好。
      - narr: 他沒有問為什麼。手肘往下沉了一點，腳步放得比剛才慢。
      - { sfx: construction_drill, at: left, dist: far, text: 噠噠噠 }
      - if: flag.dispersed
        then:
          - goto: c4_calls
      - think: 這一次，我一通電話也不打。
      - think: 今天每個人都照自己原本的行程走。
    next: c4_police

  # ─────────────────────────── 08:30 電話（分散） ───────────────────────────
  - id: c4_calls
    time: "08:30"
    place: 林家老屋，客廳
    ambience: [old_house]
    cast: { ruoqing: right, yuan: left, old_woman: right }
    beats:
      - { sfx: door_creak, at: front, dist: near, text: 碰——吱呀 }
      - narr: 門還是卡住，他還是用肩膀頂開。灰塵落在我的手背上。
      - narr: 予安去買早餐了。客廳只剩我和手機。
      - phone: 撥號中。老街咖啡店。
      - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
      - { old_woman: 喂，咖啡店你好。, as: 店長 }
      - me: 請問若晴在嗎？
      - { old_woman: 若晴！電話！, as: 店長 }
      - pause: 1.5
      - ruoqing: 喂？請問哪位？
      - me: 妳不認識我。我是林知夏的妹妹。
      - pause: 1.5
      - { sfx: strap_click, at: right, dist: near, text: 喀 }
      - narr: 電話那頭，金屬扣響了一下。
      - me: 今天傍晚，不要去舊車站。
      - ruoqing: ……妳怎麼知道我要去？
      - me: 拜託妳。過了六點半再決定。
      - pause: 2
      - ruoqing: 欸……好啦。我跟陳醫生說改天。
      - ruoqing: 可是妳欠我一個解釋喔。
      - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
      - phone: 撥號中。周予安。
      - { sfx: phone_ring, at: left, dist: mid, text: 嘟—— }
      - yuan: 我在排隊。蛋餅要不要加蛋？
      - me: 今天傍晚六點到七點，你待在店裡。
      - pause: 1
      - yuan: ……好的。
      - narr: 他平常會先答應，再問為什麼。這次電話裡只有煎台滋滋響，他什麼都沒問。
      - { sfx: phone_hangup, at: left, dist: mid, text: 嘟 }
      - think: 陳醫生，中午再當面跟他說。
      - pause: 1.5
      - { think: 我又一次替所有人安排好今天。, mem: m_c4_arranged }
      - think: 像把桌上的杯子，一個一個推離桌緣。
    next: c4_police

  # ─────────────────────────── 09:10 派出所 ───────────────────────────
  - id: c4_police
    time: "09:10"
    place: 灰潮鎮派出所
    ambience: [police_office]
    cast: { zhiyuan: front, yuan: back, man: back-right }
    threads:
      radio:
        beats:
          - { sfx: static_burst, at: back-right, dist: mid, text: 嘶嘶 }
          - { man: 北區巡邏，施工路段改道，請注意。, as: 無線電, at: back-right }
          - { man: 舊車站正門那邊還封著，行人走側邊。, as: 無線電, at: back-right }
          - { man: 收到。, as: 另一個員警, at: back-right }
    beats:
      - { sfx: door_open, at: back, dist: near, text: 吱 }
      - narr: 電扇在頭頂轉。裡面有人用兩根手指打字，一個鍵一個鍵慢慢敲。
      - narr: 有菸味，可是沒有打火機的聲音，也沒有人在吸。
      - think: 是他。
      - yuan: 我在外面等。
      - { sfx: door_close, at: back, dist: mid, text: 碰 }
      - { sfx: chair_scrape, at: front, dist: near, text: 嘎 }
      - zhiyuan: 小姐，什麼事？
      - me: 我姓林。林知夏是我姊。
      - me: 我想聽她的案子。
      - pause: 1.5
      - zhiyuan: ……我姓周。
      - zhiyuan: 案子結了。
      - zhiyuan: 意外。家屬當年有簽名。
      - narr: 他說完「結了」，椅背嘎一聲往後靠。
      - choice:
          timeout: 16
          options:
            - text: 「你抽屜最深的那一格，有一台沒有登錄的錄音機。」
              if: know.k_recorder_voice
              then:
                - pause: 3
                - narr: 電扇轉過來，又轉過去。他一直沒有開口。
                - zhiyuan: 誰跟妳講的。
                - me: 你。
                - zhiyuan: 這件事我沒跟任何人講過。
                - me: 我知道。
                - set: c4_zy_shaken
            - text: 「她的錶停在六點三十一分。筆記本背面，寫滿了同一個時間。」
              if: know.k_watch_1831 && know.k_notebook_1831
              then:
                - zhiyuan: 那是妳家的東西。妳摸得到，不代表什麼。
                - me: 那你呢？你到現場的時候，是幾點？
                - pause: 2
                - zhiyuan: ……比那更晚。
                - set: c4_zy_details
            - text: 「她的錶，停在六點三十一分。」
              if: know.k_watch_1831 && !know.k_notebook_1831
              then:
                - zhiyuan: 那是妳家的東西。妳摸得到，不代表什麼。
                - me: 那你呢？你到現場的時候，是幾點？
                - pause: 2
                - zhiyuan: ……比那更晚。
                - set: c4_zy_details
            - text: 「她的筆記本背面，寫滿了十八點三十一分。」
              if: know.k_notebook_1831 && !know.k_watch_1831
              then:
                - zhiyuan: 那是妳家的東西。妳摸得到，不代表什麼。
                - me: 那你呢？你到現場的時候，是幾點？
                - pause: 2
                - zhiyuan: ……比那更晚。
                - set: c4_zy_details
            - text: 「十八點三十一分。我已經聽過三次了。」
              then:
                - zhiyuan: 什麼意思？
                - if: know.k_zhixia_note_1831
                  then:
                    - me: 第一次，停電，還有相機背帶的扣子一直響。
                  else:
                    - me: 第一次，整座鎮停了一拍。冰箱的嗡嗡聲斷掉，過一下又自己轉起來。
                - if: know.k_maintenance_passage
                  then:
                    - me: 第二次，很深的地方有東西倒下來。
                  else:
                    - me: 第二次，咖啡機斷電，然後很遠的地方有警笛。
                - me: 第三次什麼都沒有，只有一個嗡鳴。
                - pause: 3
                - zhiyuan: 五年前那次停電，報告裡有寫。
                - zhiyuan: 沒有對外公開。
                - set: c4_zy_truth
            - text: （什麼都不說，等他）
              then:
                - pause: 4
                - narr: 他的指節在桌面敲了一下，隔了好一陣子才敲第二下。
                - zhiyuan: ……妳還不走？
                - me: 你是第一批到場的人。那份摘要，你不用翻就背得出來。
                - zhiyuan: ……誰跟妳講的？
                - me: 沒有人。
      - pause: 2
      - { sfx: chair_scrape, at: front, dist: near, text: 嘎—— }
      - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
      - narr: 他站起來往右走，腳步越過檔案櫃，停在更裡面的地方。
      - { sfx: key_jingle, at: front-right, dist: mid, text: 鏘 }
      - { sfx: drawer, at: front-right, dist: mid, text: 喀啦啦 }
      - narr: 那個抽屜很少被拉開，卡了兩次才出來。
      - { sfx: step, at: front, dist: near, text: 叩 }
      - narr: 一個很小的東西，叩一聲放在我面前的桌上。
      - zhiyuan: 這個沒有登錄。
      - zhiyuan: 五年前在現場撿到的。計時停在十八點三十一分。
      - zhiyuan: 來源不明。時間碼可疑。
      - zhiyuan: 我跟自己說，先確認，再登錄。
      - pause: 1.5
      - zhiyuan: 然後就五年了。
      - pause: 2
      - narr: 我摸到它。塑膠殼的邊角磨圓了，按鍵有點黏。
      - zhiyuan: 妳要聽嗎？
      - me: 要。
      - { sfx: tape_rewind, at: front, dist: near, text: 嘰嘰嘰嘰—— }
      - { sfx: recorder_click, at: front, dist: near, text: 喀嚓 }
      - pause: 1
      - { sfx: tape_hiss, at: front, dist: near, text: 沙———— }
      - pause: 2.5
      - narr: 先是沙沙聲，像有人拿很細的砂紙在磨桌面。
      - { sfx: wind_gust, at: front-left, dist: far, text: 嗚—— }
      - narr: 然後是風。風從破掉的窗灌進挑高的大廳，繞一圈，又從別的地方出去。
      - if: know.k_in_station_hall
        then:
          - think: 這個回音我聽過。舊車站的大廳。
        else:
          - think: 這個風聲我聽過。在舊車站對面，從破窗灌進大廳的就是這種風。
      - { sfx: step, at: front, dist: far, text: 叩……叩…… }
      - narr: 很遠的地方有腳步，踩在碎玻璃上。
      - pause: 1.5
      - { sfx: bell_toll_far, at: front-left, dist: far, text: 噹—— }
      - pause: 2.5
      - narr: 錄音裡，有鐘聲。
      - think: 那時候，鐘樓還有鐘。
      - pause: 2
      - think: 我以為，下一個聲音會是她。
      - pause: 2
      - { zhiyuan: ……有人嗎？聽得到嗎？, as: 錄音裡的男聲, at: front, dist: far }
      - { sfx: static_burst, at: front, dist: near, text: 嘶 }
      - pause: 1
      - narr: 聲音很低，一個字一個字分得很開。
      - me: 這是你的聲音。
      - { sfx: recorder_click, at: front, dist: near, text: 喀 }
      - pause: 3
      - { zhiyuan: ……我那時候還在路上。, learn: k_recorder_voice, mem: m_c4_on_the_way }
      - zhiyuan: 通報是六點四十幾分進來的。我到現場，又過了二十分鐘。
      - zhiyuan: 可是這台機器，停在十八點三十一分。
      - pause: 2
      - zhiyuan: 時間碼壞掉、有人剪接、機器被調包，我都想過。
      - zhiyuan: 都有可能。所以我一個都不能寫進報告。
      - choice:
          timeout: 12
          options:
            - text: 「你怕交出去以後，被查的人變成你。」
              then:
                - pause: 2
                - zhiyuan: ……對。
                - zhiyuan: 這不是什麼好理由。我知道。
            - text: 「謝謝你沒有丟掉它。」
              then:
                - pause: 1.5
                - zhiyuan: 我也沒交出去。不用謝我。
            - text: （再聽一次那陣風）
              then:
                - { sfx: recorder_click, at: front, dist: near, text: 喀嚓 }
                - { sfx: tape_hiss, at: front, dist: near, text: 沙—— }
                - { sfx: bell_toll_far, at: front-left, dist: far, text: 噹—— }
                - narr: 風聲裡夾著那一下鐘。我把它們一起記住。
                - { sfx: recorder_click, at: front, dist: near, text: 喀 }
      - zhiyuan: 這個不能讓妳帶走。
      - me: 不用帶。我已經記住了。
      - { cue: radio, at: back-right, text: 嘶嘶——, sfx: static_burst }
      - { sfx: drawer, at: front-right, dist: mid, text: 喀啦 }
      - narr: 抽屜推回去的時候，又卡了兩次。
      - { wait: 10 }
    next: c4_hospital

  # ─────────────────────────── 11:40 醫院 ───────────────────────────
  - id: c4_hospital
    time: "11:40"
    place: 灰潮鎮醫院，診間
    ambience: [hospital]
    cast: { boxun: front, woman: back-right, tingan: right }
    threads:
      ward:
        beats:
          - { sfx: step, at: back-right, dist: mid, text: 叩叩叩 }
          - { woman: 三號病房的阿伯又要自己下床了！, as: 走廊上的護理師, at: back-right }
          - { woman: 床欄拉起來，對，拉好。, as: 走廊上的護理師, at: back-right }
          - { old_woman: 他就說要去廁所嘛……, as: 家屬, at: back-right }
          - { sfx: door_close, at: back-right, dist: far, text: 碰 }
    beats:
      - narr: 予安送我到醫院門口，就回店裡了。
      - { sfx: door_open, at: back, dist: near, text: 喀 }
      - narr: 消毒水的味道。冷氣在頭頂右邊嘶嘶地吹。
      - { woman: 陳醫生，十一點四十那位到了。, as: 護理師, at: back }
      - { sfx: door_close, at: back, dist: near, text: 碰 }
      - pause: 1.5
      - boxun: ……請坐。
      - think: 他開口之前，總會先空一拍。跟上次一樣長。
      - me: 我不是來看病的。
      - boxun: 我知道。妳掛號的時候說了，妳是林知夏的妹妹。
      - pause: 1
      - boxun: 病人的事，我不能談。她已經不在了，也一樣。
      - choice:
          timeout: 15
          options:
            - text: 「你問過我：這是第幾次？」
              if: know.k_boxun_which_time
              then:
                - pause: 3
                - narr: 筆尖在紙上的沙沙聲停了。
                - boxun: ……我不記得我們見過。
                - me: 你不記得。我記得。
                - pause: 2
                - boxun: 知夏以前，也說過一模一樣的話。
                - set: c4_bx_shaken
            - text: 「她跟你說過，她記得還沒發生的事。」
              then:
                - boxun: 誰告訴妳的？
                - me: 沒有人。
                - me: 因為我現在也是。
                - pause: 2.5
                - boxun: ……我不會把推測當成事實。
                - boxun: 妳說的也一樣。
            - text: 「我只想知道，她最後幾個月在怕什麼。」
              then:
                - pause: 2
                - boxun: 怕。
                - boxun: ……我不確定那叫怕。
                - boxun: 她每次來，都在數日子。哪一天、幾點，數得很清楚。
      - pause: 2
      - { sfx: drawer, at: front-right, dist: near, text: 喀啦 }
      - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
      - boxun: 這是我自己留的影本。不在系統裡。
      - boxun: 我念。妳不要問我為什麼願意念。我也還沒想好。
      - pause: 1.5
      - boxun: 諮詢紀錄，第一次。
      - { boxun: 「個案堅稱，記得尚未發生的事件。」, mem: m_c4_insists }
      - { sfx: page_turn, at: front, dist: near, text: 沙啦 }
      - boxun: 個案的原話是：
      - { boxun: 「我記得一段，現在沒有發生過的對話。」, mem: m_c4_conversation }
      - boxun: 「我知道這次和上次不一樣。可是沒有人記得上次。」
      - pause: 2.5
      - think: 沒有人記得上次。
      - think: 姊，我現在也是這樣。
