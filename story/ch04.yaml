      - if: chloop >= 2
        then:
          - { sfx: spoon_stir, at: front, dist: near, text: 叮 }
          - yuan: 妳這五年，到底都跑去哪裡了？
          - me: 很遠的地方。
          - { yuan: 那這樣。如果真的還有明天，再跟我講。, learn: k_yuan_tomorrow }
          - think: 每一次他都問到這裡，每一次我都想答應他。
          - { sfx: cup_set, at: front, dist: near, text: 叩 }
          - narr: 他把我的碗，往我這邊推了一點。
        else:
          - { sfx: spoon_stir, at: front, dist: near, text: 叮 }
          - yuan: 妳今天一整天，派出所、醫院、圖書館，還跑上山。
          - yuan: 妳不是只回來賣房子的吧。
          - me: 也是回來賣房子的。
          - pause: 1
          - { sfx: laugh_soft_m, at: front, dist: near, text: 呵 }
          - narr: 他笑了一聲。很輕，從鼻子出氣的那種。
          - yuan: 妳這五年，到底都跑去哪裡了？
          - choice:
              timeout: 12
              options:
                - text: 「很遠的地方。」
                  then:
                    - yuan: 城市有那麼遠？
                    - me: 比城市遠。
                - text: 「說來話長。」
                  then:
                    - yuan: 我有時間。
                    - pause: 1.5
                    - me: 今天不夠長。
                - text: （摸自己的手杖）
                  then:
                    - narr: 杖身的接縫，一節一節。
                    - yuan: ……眼睛的事，也是這五年的事？
                    - me: 兩年前。
                    - yuan: 仲介只跟我說妳現在看不見，沒講是什麼時候的事。
                    - yuan: ……我應該早一點問妳的。
          - pause: 1.5
          - yuan: 那這樣。
          - { yuan: 如果真的還有明天，再跟我講妳這五年到底跑去哪裡了。, learn: k_yuan_tomorrow, mem: m_c4_tomorrow }
          - pause: 3
          - think: 明天。
          - think: 明天早上七點四十分，他會在月台說：比我想的早。
          - think: 他不會記得今天問過我這件事。
          - choice:
              timeout: 10
              options:
                - text: 「好。我答應你。」
                  then:
                    - yuan: 一言為定。
                    - think: 我答應了一件我做不到的事。
                    - think: 可是我想答應。
                - text: 「如果沒有明天呢？」
                  then:
                    - yuan: 那就今天講。
                    - pause: 2
                    - yuan: ……不講也沒關係。我在。
                - text: （點頭）
                  then:
                    - { sfx: cup_set, at: front, dist: near, text: 叩 }
                    - narr: 他把我的碗，往我這邊推了一點。
      - { cue: kitchen, at: right, text: 鏘、嘶——, sfx: glass_clink }
      - narr: 麵已經不太燙了。我們把它吃完。
      - heart: off
      - { wait: 12 }
    next: c4_bell

