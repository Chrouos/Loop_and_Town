              - think: 妳也一通一通打過電話，把每個人放到不會出事的地方。放好了，它還是照樣來。
            else:
              - think: 妳也有過這樣的一天吧。什麼都不動，只為了弄清楚為什麼，然後聽著遠處的警笛，一直坐到它停。
          - think: 然後有一天，倒在這裡的人是我。
          - pause: 2.5
          - narr: 我把那隻一直在數的手攤開，壓在鐵桌上。桌面很冰，冰到手心發痛，我還是沒有拿開。
          - think: 這五年我在外地恨妳，恨得很用力。
          - think: 妳一個人在這裡，過了多少個今天？
          - { sfx: raincoat_rustle, at: front-right, dist: near, text: 沙 }
          - narr: 庭安沒有問我在跟誰講話。一包面紙被推到我壓著桌子的那隻手旁邊。
          - heart: slow
      - pause: 2
      - tingan: 我送妳下山。
    next: c4_dinner

  # ─────────────────────────── 20:40 小餐館 ───────────────────────────
  - id: c4_dinner
    # 格局：老街小餐館（docs/scene-layouts.md）
    time: "20:40"
    place: 老街小餐館
    ambience: [restaurant]
    cast: { yuan: front, old_man: back-left, old_woman: right }
    threads:
      kitchen:
        beats:
          - { sfx: glass_clink, at: right, dist: mid, text: 鏘 }
          - { old_woman: 欸，蔥給我！, as: 老闆娘, at: right }
          - { old_man: 自己拿啦，我手上兩鍋。, as: 廚房裡的聲音, at: back-right }
          - { old_woman: 每天都這樣講。, as: 老闆娘, at: right }
          - { sfx: kettle, at: back-right, dist: mid, text: 嘶嘶—— }
    beats:
      - { sfx: door_open, at: back, dist: near, text: 吱 }
      - narr: 油鍋滋滋響，碗筷碰來碰去。角落那台電視開得太大聲。
      - if: seen.c4_alone
        then:
          - narr: 予安拉下鐵捲門，帶我走過兩段騎樓，到老街那家麵店。
          - yuan: 靠牆，第二張。妳先坐。
          - { sfx: chair_scrape, at: front, dist: near, text: 嘎 }
          - yuan: 房仲下午打來，說下禮拜再來估價。
        else:
          - narr: 下山的時候我打給予安。他說，老街那家麵店。
          - narr: 庭安送我到門口就走了。予安已經坐在裡面。
          - yuan: 這裡。靠牆，第二張。
          - { sfx: chair_scrape, at: front, dist: near, text: 嘎 }
          - yuan: 房仲剛走。說下禮拜再來估價。
      - if: know.k_c4_noodles
        then:
          - yuan: 我點了兩碗麵。妳的不加蔥。
          - think: 不加蔥。他每一次都記得，每一次都是第一次記得。
        else:
          - { yuan: 我點了兩碗麵。妳的不加蔥。, learn: k_c4_noodles }
          - think: 我沒有跟他說過我不吃蔥。
          - think: 他記得的，是五年前的我。
      - if: flag.c4_slope_fell
        then:
          - yuan: 妳的手怎麼了？
          - narr: 我把手掌翻過來。擦破的地方已經乾了，碰到桌面還會刺。
          - me: 坡上有車在倒，我閃錯邊。
          - pause: 1
          - yuan: ……下次要上山，先跟我講一聲。
      - if: "!flag.c4_dispersed"
        then:
          # 她已經聽過這則新聞：知道它會來，還是擋不住。
          - if: know.k_c4_let_it_happen
            then:
              - { sfx: cup_scrape, at: front, dist: near, text: 嘎, src: 茶杯 }
              - narr: 電視換到地方新聞的配樂，我就把茶杯推到桌子中間，推到手肘碰不到的地方。
              - { old_man: ……今晚六點半左右，灰潮鎮舊車站發生意外。, as: 電視, at: back-left, via: tv }
              - { old_man: 一名二十三歲女性，送醫後不治……, as: 電視, at: back-left, via: tv }
              - { sfx: cup_set, at: right, dist: mid, text: 叩 }
              - { old_woman: 是咖啡店的若晴啦。造孽喔。, as: 老闆娘 }
              - heart: pound
              - tension: 15
              - narr: 每一個字我都聽過。知道它會來，耳朵裡還是嗡的一聲，我的指甲摳進桌子底下那根橫木。
              - think: 二十三歲。我連她中午有沒有吃飯都沒問。
              - narr: 他接下來那兩句，我也聽過。這一次我沒有讓它們飄過去。
              - yuan: ……咖啡店那個女生。
              - yuan: 她高中的時候，常來店裡寫功課。
              - yuan: 上禮拜還來借我那面鐘牆拍。我說，等我整理好。
              - pause: 2
              - narr: 茶杯在桌子中間，一滴都沒灑。有一次茶沿著桌面流到我腿上，褲子冰了一整頓飯。
              - think: 他不會知道這一次哪裡不一樣。
              - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
              - phone: 心率 <心率>，過高，已記錄。二十點四十二分。
              - narr: 我摸到口袋裡的手機，按住側鍵，按到它不再震。
              - { sfx: chopsticks, at: front, dist: near, text: 叩 }
              - narr: 他把筷子擱在碗邊，之後就沒有再拿起來。
              - think: 我又讓它發生了一次。
            else:
              - { old_man: ……今晚六點半左右，灰潮鎮舊車站發生意外。, as: 電視, at: back-left, via: tv }
              - { old_man: 一名二十三歲女性，送醫後不治……, as: 電視, at: back-left, via: tv }
              - { sfx: cup_set, at: right, dist: mid, text: 叩 }
              - { old_woman: 是咖啡店的若晴啦。造孽喔。, as: 老闆娘 }
              - heart: pound
              - tension: 20
              - noise: heavy
              - narr: 油鍋、碗筷、隔壁桌的笑聲，一下子全部變大，大得像整間店擠到我耳朵旁邊。
              - { sfx: cup_set, at: front, dist: near, text: 喀啷, shake: light }
              - narr: 我的手肘碰翻了茶杯，茶沿著桌面流下來，滴到我腿上。
              - noise: "off"
              - daze: heavy
              - { sfx: tinnitus, at: center }
              - pause: 3
              - daze: light
              - yuan: ……咖啡店那個女生。
              - yuan: 她高中的時候，常來店裡寫功課。
              - yuan: 上禮拜還來借我那面鐘牆拍。我說，等我整理好。
              - pause: 2
              - daze: off
              - { sfx: fry_sizzle, at: right, dist: mid, text: 滋—— }
              - { old_man: 明天，十月四日，清晨起有陣雨，早晚比較涼，出門記得帶傘。, as: 電視, at: back-left, via: tv }
              - narr: 油鍋又滋滋響起來。電視已經換到下一則，在講明天的天氣。
              - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
              - phone: 心率 <心率>，過高，已記錄。二十點四十二分。
              - narr: 我摸到口袋裡的手機，按住側鍵，按到它不再震。
              - { sfx: chopsticks, at: front, dist: near, text: 叩 }
              - narr: 他把筷子擱在碗邊，之後就沒有再拿起來。
              - if: flag.c4_called_late
                then:
                  - think: 我知道會這樣。打那通電話的時候，已經太晚了。
                else:
                  - think: 我知道會這樣。手機一直在我口袋裡。
              - { think: 我知道，我還是讓它發生了。, mem: m_c4_let_it }
              - learn: k_c4_let_it_happen
              - narr: 褲子濕掉的那一塊很冰。我把手掌壓在上面，壓到它被捂熱。
          - pause: 2
          - { cue: kitchen, at: right, text: 鏘、嘶——, sfx: glass_clink }
          - yuan: 麵我叫老闆打包。
          - yuan: 我送妳回去。
          - { sfx: plastic_crinkle, at: right, dist: mid, text: 窸窣, src: 塑膠袋 }
          - narr: 他沒有問我要不要。塑膠袋提在他另一隻手，手肘伸到我右手邊，停在我抓得到的高度。
          - { sfx: step_uneven, at: right, dist: near, text: 咚、叩 }
          - narr: 一路上他都沒講話。騎樓一段一段過去，每到一個台階前面，他的手肘就往下沉一點。
          - heart: slow
          - tension: -6
        else:
          - if: seen.c4_alone
            then:
              - yuan: 六點到七點，妳也在，我真的待在店裡。
              - yuan: 修了兩只錶，妳一直坐在後面聽。
            else:
              - yuan: 六點到七點，我真的待在店裡。
              - yuan: 很無聊。修了兩只錶。
          - yuan: 所以，可以跟我說為什麼要我待著了嗎？
          - me: 因為我不想下一次聽見出事的人是你。
          - pause: 2
          - yuan: ……「下一次」？
          - { sfx: cup_scrape, at: front, dist: near, text: 嘎, src: 醋瓶 }
          - narr: 我沒有解釋。他也沒有追問，把醋瓶推到我手邊。
          - if: chloop >= 2
            then:
              - { sfx: spoon_stir, at: front, dist: near, text: 叮 }
              - yuan: 妳這五年，到底都跑去哪裡了？
              - me: 很遠的地方。
              - { yuan: 那這樣。如果真的還有明天，再跟我講。, learn: k_yuan_tomorrow }
              - think: 每一次他都問到這裡，每一次我都想答應他。
              - { sfx: cup_scrape, at: front, dist: near, text: 嘎, src: 碗 }
              - narr: 他把我的碗，往我這邊推了一點。
            else:
              - { sfx: spoon_stir, at: front, dist: near, text: 叮 }
              - if: seen.c4_alone
                then:
                  - yuan: 妳今天一整天跑來跑去，下午又在我店裡坐到關門。
                else:
                  - if: seen.c4_police && seen.c4_hospital
                    then:
                      - yuan: 妳今天一整天，派出所、醫院，晚上還從山上下來。
                    else:
                      - yuan: 妳今天一整天跑來跑去，晚上還從山上下來。
              - yuan: 妳不是只回來賣房子的吧。
              - me: 也是回來賣房子的。
              - pause: 1
              - { sfx: laugh_soft_m, at: front, dist: near, text: 呵 }
              - narr: 他笑了，很輕，跟五年前一樣。
              - yuan: 妳這五年，到底都跑去哪裡了？
              - choice:
                  timeout: 12
                  default: 2
                  options:
                    - text: 「很遠的地方。」
                      then:
                        - yuan: 城市有那麼遠？
                        - me: 比城市遠。
                    - text: 「說來話長。」
                      then:
                        - yuan: 我有時間。
                        - pause: 1.5
                        - me: 今天不夠長。
                    - text: （摸自己的手杖）
                      then:
                        - narr: 杖身的接縫，一節一節。
                        - yuan: ……眼睛的事，也是這五年的事？
                        - me: 兩年前。
                        - yuan: 仲介只跟我說妳現在看不見，沒講是什麼時候的事。
                        - yuan: ……我應該早一點問妳的。
              - pause: 1.5
              - yuan: 那這樣。
              - { yuan: 如果真的還有明天，再跟我講妳這五年到底跑去哪裡了。, learn: k_yuan_tomorrow, mem: m_c4_tomorrow }
              - pause: 3
              - think: 明天。
              - think: 明天早上七點四十分，他會在月台說：比我想的早。
              - think: 他不會記得今天問過我這件事。
              - choice:
                  timeout: 10
                  default: 2
                  options:
                    - text: 「好。我答應你。」
                      then:
                        - yuan: 一言為定。
                        - think: 我答應了一件我做不到的事。
                        - think: 可是我想答應。
                    - text: 「如果沒有明天呢？」
                      then:
                        - yuan: 那就今天講。
                        - pause: 2
                        - yuan: ……不講也沒關係。我在。
                    - text: （低頭吃麵）
                      then:
                        - { sfx: cup_scrape, at: front, dist: near, text: 嘎, src: 碗 }
                        - narr: 他沒有等我回答，把我的碗往我這邊推了一點。
          - { cue: kitchen, at: right, text: 鏘、嘶——, sfx: glass_clink }
          - narr: 麵已經不太燙了。我們把它吃完。
          - narr: 最後一口湯是溫的，順著喉嚨一路暖到胃裡。
          - tension: -12
          - heart: off
      - { wait: 12 }
    next: c4_bell

  # ─────────────────────────── 23:59 鐘聲 ───────────────────────────
  - id: c4_bell
    # 格局：林家老屋門口／面向大門（docs/scene-layouts.md）
    time: "21:30"
    place: 林家老屋門口
    ambience: [tower_square_night, night_insects]
    cast: { yuan: back-right }
    beats:
      - { sfx: step_uneven, at: back-right, dist: near, text: 咚、叩 }
      - yuan: 到了。門檻在妳腳前面。
      - if: "!flag.c4_dispersed"
        then:
          - { sfx: plastic_crinkle, at: back-right, dist: near, text: 窸窣, src: 塑膠袋 }
          - narr: 塑膠袋的提把掛上我的手腕。裡面那碗麵，隔著袋子還是溫的。
          - yuan: 早點睡。
        else:
          - yuan: 那，明天見。
      - { sfx: step_uneven, at: back-right, dist: far, text: 咚……叩…… }
      - narr: 他往巷口走了。
      - pause: 2
      - narr: 我沒有進屋，在門口的石階坐到巷子裡的電視一戶一戶關掉，才站起來，面向大門。
      - clock: "23:59"
      - narr: 我摸出手機，叫它報時。
      - phone: 二十三點五十九分。
      - { sfx: bell_toll, at: back-right, text: 噹——, vib: bell }
      - wait: 3.2
      - { sfx: bell_toll, at: back-right, text: 噹—— }
      - wait: 3.2
      - if: "!flag.c4_dispersed"
        then:
          - think: 早點睡。他一路上只講了這一句。
        else:
          - think: 明天見。
      - heart: slow
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 手杖尖一直點著同一道磚縫。
      - { sfx: bell_toll, at: back-right, text: 噹——, vib: bell }
      - wait: 3.2
      - { sfx: bell_toll, at: back-right, text: 噹—— }
      - wait: 3.2
      - { sfx: bell_toll, at: back-right, text: 噹——, vib: bell }
      - wait: 3.2
      - if: know.k_recorder_voice
        then:
          - think: 錄音裡那一下鐘，也是從這個方向來的嗎？
        else:
          - think: 鐘拆了五年，我還是每晚聽見它。
      - { sfx: bell_toll, at: back-right, text: 噹—— }
      - wait: 3.2
      - { sfx: bell_toll, at: back-right, text: 噹——, vib: bell }
      - wait: 3.2
      - { sfx: bell_toll, at: back-right, text: 噹—— }
      - wait: 3.2
      - think: 走了，就不要再回來。
      - { sfx: bell_toll, at: back-right, text: 噹——, vib: bell }
      - wait: 3.2
      - { sfx: bell_toll, at: back-right, text: 噹—— }
      - wait: 3.2
      - { sfx: bell_toll, at: back-right, text: 噹——, vib: bell }
      - wait: 3.4
      - think: 姊。
      - { sfx: bell_toll, at: back-right, dist: near, text: 噹———, vib: long }
      - pause: 2
      - { sfx: silence_drop, at: center }
      - pause: 1.5
      - { sfx: heartbeat, at: center, vib: heartbeat }
      - end: reset
