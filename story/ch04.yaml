  # ─────────────────────────── 11:40 醫院 ───────────────────────────
  - id: c4_hospital
    # 格局：灰潮鎮醫院，診間／病人椅 → 灰潮鎮醫院，診間／門口（docs/scene-layouts.md）
    time: "11:40"
    place: 灰潮鎮醫院，診間
    ambience: [hospital]
    cast: { boxun: front, woman: back-right, tingan: right }
    threads:
      ward:
        beats:
          - { sfx: step, at: back-right, dist: mid, text: 叩叩叩 }
          - { woman: 三號病房的阿伯又要自己下床了！, as: 走廊上的護理師, at: back-right }
          - { woman: 床欄拉起來，對，拉好。, as: 走廊上的護理師, at: back-right }
          - { old_woman: 他就說要去廁所嘛……, as: 家屬, at: back-right }
          - { sfx: door_close, at: back-right, dist: far, text: 碰 }
    beats:
      - narr: 予安送我到醫院門口，就回店裡了。
      - { sfx: door_open, at: back, dist: near, text: 喀 }
      - narr: 消毒水的味道。冷氣在頭頂右邊嘶嘶地吹。
      - { woman: 林小姐，妳先坐這裡。醫生馬上進來。, as: 護理師, at: back }
      - { sfx: door_close, at: back, dist: near, text: 碰 }
      - pause: 2
      - { sfx: door_open, at: back, dist: near, text: 喀 }
      - { sfx: hand_rub, at: back, dist: near, text: 噗、沙沙 }
      # 他今天本來就有自己的事：病房在縮，外地的信沒回。
      - { woman: 醫生，三樓那兩床，下個月真的要收喔？, as: 門外的護理師, at: back }
      - pause: 1.5
      - { boxun: ……我再去跟院長講一次。, at: back }
      - { woman: 還有，外縣市那家醫院又打電話來，問你信看了沒。, as: 門外的護理師, at: back }
      - { boxun: 看了。, at: back }
      - { sfx: door_close, at: back, dist: near, text: 碰 }
      - { sfx: chair_scrape, at: front, dist: near, text: 嘎 }
      - { sfx: envelope, at: front, dist: near, text: 沙 }
      - narr: 他一坐下，就把桌上一封信拿起來，翻面，塞到那疊紀錄底下。
      - narr: 信封的角掃過我的手背。郵票的齒孔刮了一下。
      - { think: 他說看了，然後把它壓到最底下。, learn: k_boxun_invitation }
      - choice:
          timeout: 7
          options:
            - text: 「陳醫生。」
              if: know.k_sig_boxun
              then:
                - pause: 2
                - boxun: ……我們見過？
                - me: 沒有。你進門先按了乾洗手，又搓了很久。
                - pause: 1.5
                - boxun: 知夏以前也是這樣。我手上的酒精還沒乾，她就叫我了。
                - set: c4_bx_named
            - text: （等他先開口）
              then:
                - pause: 1.5
                - boxun: ……林小姐，久等了。
                - pause: 1
                - boxun: 妳的手杖頭，橡膠磨平了。我在走廊就聽到它在地磚上滑。
                - boxun: 樓下復健科在換。妳就說，是我叫妳去的。
                - me: ……我以為是你們地板太滑。
                - boxun: 地板也滑。兩個都是。
                - if: know.k_c3_cane_tip || know.k_c4_cane_tip
                  then:
                    - think: 上一次他也叫我去換。我一直沒去。
                - learn: k_c4_cane_tip
      - think: 他開口之前，總會先空一拍。跟上次一樣長。
      - me: 我不是來看病的。
      - boxun: 我知道。妳掛號的時候說了，妳是林知夏的妹妹。
      - pause: 1
      - boxun: 病人的事，我不能談。她已經不在了，也一樣。
      - think: 她是他的病人。她如果跟誰講過那些事，就是他。
      - { sfx: pen_scratch, at: front, dist: near, text: 唰唰 }
      # 關口：他不收推測。「我也記得還沒發生的事」只換到她的主訴；要他念出病房那件事，得拿出他自己做過、講過的東西。
      - choice:
          options:
            - text: 「你問過我：這是第幾次？」
              if: know.k_boxun_which_time
              then:
                - pause: 3
                - narr: 筆尖在紙上的沙沙聲停了。
                - boxun: ……我不記得我們見過。
                - me: 你不記得。我記得。
                - pause: 2
                - boxun: 知夏以前，也說過一模一樣的話。
                - set: c4_bx_open
            - text: 「你等一下會問我，這是第幾次。我先回答：我數不清了。」
              if: know.lead_c4_count && !know.k_boxun_which_time
              then:
                - pause: 3
                - narr: 筆尖在紙上的沙沙聲停了。
                - boxun: ……我是想問。
                - boxun: 知夏第一次坐在這張椅子上，我也問了她一樣的話。她說，十一。
                - set: c4_bx_open
            - text: 「你私下整理過一份紀錄。她走之前十二天，有另一個人死在十八點三十一分。」
              if: know.k_record_12days
              then:
                - pause: 3
                - narr: 筆尖停在紙上，戳出一個小點。
                - boxun: 名字跟病歷號，我都塗掉了。那張紙我沒有給過任何人。
                - me: 你念給我聽過。念完，廚房的冰箱剛好停了。
                - pause: 2
                - boxun: ……我沒有去過妳家。
                - boxun: 可是那張紙，我今天確實帶在身上。
                - set: c4_bx_open
            - text: 「她跟你說過，她記得還沒發生的事。」
              then:
                - boxun: 誰告訴妳的？
                - me: 沒有人。
                - me: 因為我現在也是。
                - pause: 2.5
                - boxun: ……我不會把推測當成事實。
                - boxun: 妳說的也一樣。
                - pause: 1.5
                - boxun: 她自己講的那幾句，不牽涉別人。那個我可以念。
                - set: c4_bx_partial
            - text: 「我只想知道，她最後幾個月在怕什麼。」
              then:
                - pause: 2
                - boxun: 怕。
                - boxun: ……我不確定那叫怕。
                - boxun: 她每次來，都在數日子。哪一天、幾點，數得很清楚。
            - recall:
                accept:
                  - mem: m_c3_should_not_die
                    then:
                      - me: 你說過，有一個本來不應該死的人。
                      - pause: 3
                      - { sfx: hand_rub, at: front, dist: near, text: 噗、沙沙 }
                      - narr: 他又按了一次乾洗手，搓得比進門的時候久。
                      - boxun: ……這句話，我只在心裡講過。
                      - set: c4_bx_open
                miss:
                  - pause: 1.5
                  - boxun: ……林小姐，妳想說什麼？
                  - think: 不是這句。他要的是他自己講過、寫過的東西。
      - if: flag.c4_bx_open || flag.c4_bx_partial
        then:
          - pause: 2
          - { sfx: drawer, at: front-right, dist: near, text: 喀啦 }
          - { sfx: hand_rub, at: front, dist: near, text: 噗、沙沙 }
          - narr: 他搓乾了手，才去碰抽屜裡的紙。
          - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
          - boxun: 這是我自己留的影本。不在系統裡。
          - if: flag.c4_bx_open
            then:
              - boxun: 我念，不是因為我相信妳。
              - boxun: 是妳剛剛講的那件事，跟我五年來一直排除不掉的那件，是同一類。我想放在一起看看。
          - boxun: 我只念她自己講的話。牽涉到別的病人，我不念名字。
          - pause: 1.5
          - boxun: 諮詢紀錄，第一次。
          - { boxun: 「個案堅稱，記得尚未發生的事件。」, mem: m_c4_insists }
          - { sfx: page_turn, at: front, dist: near, text: 沙啦 }
          - boxun: 個案的原話是：
          - { boxun: 「我記得一段，現在沒有發生過的對話。」, mem: m_c4_conversation }
          - boxun: 「我知道這次和上次不一樣。可是沒有人記得上次。」
          - pause: 2.5
          - think: 沒有人記得上次。
          - daze: light
          - { sfx: page_turn, at: front, dist: near, text: 沙啦 }
          - narr: 他翻頁的聲音還在，聽起來像隔著好幾層紗布。
          - think: 姊……
          - daze: off
          - { sfx: air_flow, at: right, dist: mid, text: 嘶—— }
          - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
          - narr: 冷氣的嘶嘶聲最先回到耳朵裡，然後是他用指節把紙壓平的聲音。
          - boxun: 睡眠、壓力、神經檢查、藥物，我都排除過。
          - boxun: 結果都正常。
      # 只拿到主訴：後面那件病房的事，要一個他能放在一起看的東西。
      - if: flag.c4_bx_partial && !flag.c4_bx_open
        then:
          - pause: 1.5
          - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
          - narr: 他的手按在下一頁上，沒有翻。
          - boxun: 後面還有幾次。牽涉到病房裡另一個病人。
          - boxun: 要我念下去，妳得給我一個能跟它放在一起看的東西。不是妳的感覺。
          - choice:
              timeout: 16
              options:
                - text: 「你私下整理過一份紀錄。她走之前十二天，有另一個人死在十八點三十一分。」
                  if: know.k_record_12days
                  then:
                    - pause: 3
                    - boxun: ……那張紙，我沒有給過任何人。
                    - me: 你念給我聽過。念完，廚房的冰箱剛好停了。
                    - pause: 2
                    - boxun: 我沒有去過妳家。可是那張紙，我今天確實帶在身上。
                    - set: c4_bx_open
                - text: 「你問過我：這是第幾次？」
                  if: know.k_boxun_which_time
                  then:
                    - pause: 3
                    - boxun: ……我是會這樣問。
                    - boxun: 知夏第一次坐在這裡，我也這樣問她。
                    - set: c4_bx_open
                - text: 「我沒有別的。」
                  then:
                    - pause: 2
                    - boxun: 那就到這裡。
                - recall:
                    accept:
                      - mem: m_c3_should_not_die
                        then:
                          - me: 你說過，有一個本來不應該死的人。
                          - pause: 3
                          - narr: 壓在紙上的手指收了回去。
                          - boxun: ……這句話，我只在心裡講過。
                          - set: c4_bx_open
                    miss:
                      - boxun: 這個不算。
                      - think: 不是這句。他要的是他自己講過、寫過的東西。
              silence:
                - pause: 2
                - boxun: ……那就到這裡。
      - if: "!flag.c4_bx_open"
        then:
          - pause: 1.5
          - if: flag.c4_bx_partial
            then:
              - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
              - narr: 紙一張一張疊回去，收進抽屜。
              - think: 他只念到她自己講的話。病房裡那件事，他要我拿得出他自己做過的東西。
            else:
              - boxun: 其他的，是病人的事。家屬問，我也只能講到這裡。
          - { sfx: drawer_catch, at: front-right, dist: near, text: 喀 }
          - narr: 他把紙鎖回抽屜。
          - { sfx: chair_scrape, at: center, dist: near, text: 嘎 }
          - { sfx: cane_tap, at: front, dist: near, text: 叩 }
          - narr: 我扶著桌緣站起來。手杖碰到門框的時候，他又空了一拍。
          - move: { boxun: "back:mid" }
          - { sfx: hand_rub, at: back, dist: mid, text: 噗、沙沙 }
          - { boxun: ……林小姐。妳是第幾次來這裡？, learn: lead_c4_count }
          - heart: slow
          - narr: 手杖尖抵著門檻。冷氣正好吹在我後頸，涼得我縮了一下肩膀。
          - think: 今天以前，我沒有掛過他的號。他問的不是這間診間。
          - think: 我沒有回答。他其實在等。
          - tension: 6
      - if: flag.c4_bx_open
        then:
          - pause: 1
          - { sfx: page_turn, at: front, dist: near, text: 啪沙 }
          - boxun: 第四次。星期一。
          - boxun: 個案表示，病房裡一位病人，星期四會從床上摔下來。是哪一位，我不念。
          - boxun: 右手腕。
          - pause: 2
          - boxun: 我交代護理站留意，也加了巡房。星期四晚上，她還是自己翻過床欄，摔下來。右手腕骨折。
          - boxun: 那天值班的是我。
          - pause: 2.5
          - boxun: 我沒有寫她能預知未來。
          - { boxun: 我只寫：事後與實際情形相符。原因不明。, learn: k_medical_records }
          - pause: 1.5
          - boxun: 她是怎麼提前知道的，我後來一直在找。
          - boxun: 目前還沒有答案。
          - { cue: ward, at: back-right, text: 叩叩叩, sfx: step_run }
      - if: flag.c4_dispersed
        then:
          - me: 陳醫生。今天傍晚，請你留在醫院。
          - me: 那個紙袋要給誰，過了六點半再決定。
          - pause: 2
          - boxun: ……妳連那個也知道。
          - boxun: 三樓今天只有我一個，七點以前我本來就走不開。
          - think: 他說不是因為我。他是這樣說的。
        else:
          - think: 五點四十，他會從後門出去，手裡拿著要給若晴的紙袋。
          - think: 我什麼都沒說。
          - narr: 我按了一下側鍵。
          - phone: 十一點五十二分。
          - think: 若晴這時候在店裡，走過去不用十分鐘。
      - if: flag.c4_bx_named
        then:
          - { sfx: cane_tap, at: front, dist: near, text: 叩、嘶 }
          - narr: 我往門口走，杖尖在地磚上滑了半步。
          - boxun: 林小姐。妳的手杖頭，橡膠磨平了。在這種地磚上會滑。
          - boxun: 樓下復健科在換。妳就說，是我叫妳去的。
          - if: know.k_c3_cane_tip || know.k_c4_cane_tip
            then:
              - think: 上一次他也叫我去換。我一直沒去。
          - learn: k_c4_cane_tip
      - { sfx: door_close, at: back, dist: near, text: 碰 }
      - narr: 走出診間，我撥了一個已經背起來的號碼。
      - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
      - { tingan: 喂？哪位？, via: phone }
      - me: 葉小姐。我是林知夏的妹妹。
      - pause: 1.5
      - { tingan: ……妳怎麼會有我的號碼？, via: phone }
      - me: 妳在鐘錶店留過名片。
      - if: know.k_zhixia_saw_my_death && know.k_research_purpose
        then:
          - me: 五點半。舊研究所，備用機房。
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
          - think: 圖書館和那段坡，我都聽過了。下午我在店裡陪予安，傍晚讓他載我上山。
          - goto: c4_saw
      - me: 一點十分。圖書館，地方史室。
      - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
    next: c4_library

  # ─────────────────────────── 12:50 電話（醫院已經聽過） ───────────────────────────
  # 派出所、醫院都已經在前幾輪聽過時，直接從這裡約庭安。
  - id: c4_call_tingan
    # 格局：老街／車道在左（docs/scene-layouts.md）
    time: "12:50"
    place: 老街
    ambience: [street_afternoon]
    cast: { tingan: right, boxun: right }
    beats:
      - { sfx: car_pass, at: left, dist: mid, text: 咻—— }
      - narr: 上午我沒有去醫院。予安陪我在老街走了一圈，買了兩個肉包，一個給我，一個他邊走邊吃。
      - if: flag.c4_dispersed
        then:
          - phone: 撥號中。灰潮鎮醫院。
          - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
          - { boxun: 陳柏勳。, via: phone }
          - me: 陳醫生。今天傍晚，請你留在醫院。那個紙袋要給誰，過了六點半再決定。
          - pause: 2
          - { boxun: ……七點以前，三樓那兩床我本來就走不開。, via: phone }
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
      - phone: 撥號中。葉庭安。
      - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
      - { tingan: 喂？哪位？, via: phone }
      - me: 葉小姐。我是林知夏的妹妹。
      - pause: 1.5
      - { tingan: ……妳怎麼會有我的號碼？, via: phone }
      - me: 妳在鐘錶店留過名片。
      - if: know.k_zhixia_saw_my_death && know.k_research_purpose
        then:
          - me: 五點半。舊研究所，備用機房。
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
          - think: 圖書館和那段坡，我都聽過了。下午我在店裡陪予安，傍晚讓他載我上山。
          - goto: c4_saw
      - me: 一點十分。圖書館，地方史室。
      - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
    next: c4_library

  # ─────────────────────────── 13:10 圖書館 ───────────────────────────
  - id: c4_library
    # 格局：鎮立圖書館，地方史室／門口 → 鎮立圖書館，地方史室／桌邊（docs/scene-layouts.md）
    time: "13:10"
    place: 鎮立圖書館，地方史室
    ambience: [library]
    cast: { tingan: front-left, old_woman: back }
    threads:
      librarian:
        beats:
          - { old_woman: 葉小姐又來啦？, as: 館員, at: back }
          - { old_woman: 這位是……林家的？, as: 館員, at: back }
          - { old_woman: 妳姊以前都坐這張桌子。, as: 館員, at: back }
          - { old_woman: 關燈了才肯走。我都要趕她。, as: 館員, at: back }
          - { sfx: page_turn, at: back, dist: mid, text: 啪沙 }
    beats:
      - { sfx: door_open, at: back, dist: near, text: 吱 }
      - narr: 舊紙的霉味。冷氣開得很強，遠處的書架那邊有人在翻頁。
      - think: 知夏以前在這裡當約聘，整理鎮上的舊資料。我高中的時候常來這裡等她下班。
      - { sfx: raincoat_rustle, at: front-left, dist: mid, text: 沙、沙 }
      - narr: 左前方有人坐在那裡，一直坐不定。
      - choice:
          timeout: 8
          options:
            - text: （停在書架旁邊，先聽）
              if: know.k_sig_tingan
              then:
                - think: 是雨衣。她比我早到。
                - { sfx: raincoat_rustle, at: front-left, dist: mid, text: 沙 }
                - { tingan: ……我是記者，在做人口外流的報導。, at: front-left, dist: mid, whisper: true }
                - { tingan: 先講這個就好。研究所的事，看她問到哪裡再說。, at: front-left, dist: mid, whisper: true }
                - narr: 她講得很小聲，同一句講了兩遍，第二遍比較順。
                - { sfx: cane_tap, at: front-left, dist: near, text: 叩 }
                - narr: 等她講完第二遍，我才讓手杖碰到桌腳。雨衣一下子不響了。
                - set: c4_ta_overheard
            - text: （往左前方走過去）
              then:
                - { sfx: cane_tap, at: front-left, dist: near, text: 叩 }
                - narr: 手杖碰到桌腳。布料的聲音停了，她比我早到。
      - tingan: 妳電話裡只講時間地點就掛。妳要談什麼？談妳姊？
      - me: 坐下來再問。
      - { sfx: chair_scrape, at: front-left, dist: near, text: 嘎 }
      # 她記得、庭安不記得的那個傍晚。
      - if: mem.m_c3_tingan_waiting
        then:
          - choice:
              timeout: 8
              options:
                - text: 「我約過妳一次，沒去。妳傳了一句：妳不來了嗎？」
                  then:
                    - pause: 2
                    - { sfx: raincoat_rustle, at: front-left, dist: near, text: 沙 }
                    - tingan: ……我們約過？什麼時候？
                    - me: 妳不記得。是我欠妳。
                    - pause: 1.5
                    - tingan: 聽不懂。不過欠就是欠，妳欠我一罐。
                    - { sfx: chair_scrape, at: front-left, dist: near, text: 嘎 }
                    - { sfx: raincoat_rustle, at: front-left, dist: near, to: back:mid, text: 沙、沙 }
                    - narr: 她起身往門外走。走廊那台販賣機吃了兩枚銅板。
                    - { sfx: thud, at: back, dist: mid, text: 咚, src: 販賣機 }
                    - { sfx: raincoat_rustle, at: right, dist: near, text: 沙 }
                    - narr: 冰的鋁罐放到我右手邊，外面一層水，貼著我的手背才停。
                    - tingan: 記在妳帳上。
                    - tension: -4
                    - set: c4_ta_can
                - text: （先問正事）
                  then:
                    - think: 那一罐，我先欠著。
      - me: 研究所五年前在做什麼？
      - tingan: 我是記者。我在做人口外流的——
      # 關口：她答應過知夏不讓妹妹知道。一句「妳不只是記者」不夠，要拿得出她跟研究所綁在一起的東西。
      - choice:
          timeout: 14
          options:
            - text: 「颱風封路。醫院分流。停電備援。」
              if: know.k_research_purpose
              then:
                - pause: 2.5
                - narr: 雨衣的聲音停了。
                - tingan: ……這幾個詞，誰跟妳講的？
                - me: 妳。
                - set: c4_ta_knew
            - text: 「我姊桌上有一張照片。予安說，她旁邊站著一個短頭髮、揹大包包的女生。」
              if: know.k_photo_tingan
              then:
                - pause: 2
                - tingan: 那張照片……還在？
                - me: 在她桌上。背景是研究所的大門。
                - tingan: ……她連那張都留著。
                - set: c4_ta_proof
            - text: 「妳每次回灰潮鎮，傍晚都穿著雨衣，往研究所那條坡上走。」
              if: know.k_c1_tingan_institute
              then:
                - pause: 2
                - tingan: ……妳跟蹤我？
                - me: 鐘錶店的予安看過。鎮上就那條坡，誰往上走都很顯眼。
                - pause: 1.5
                - tingan: 我還以為我很低調。
                - set: c4_ta_proof
            - text: 「館員說，妳跟我姊借的舊地圖集，借書卡上蓋著研究所的章。」
              if: know.k_c4_loan_card
              then:
                - pause: 2
                - tingan: ……那兩本我真的一直忘記還。
                - me: 五年。
                - tingan: 好啦。章是真的。
                - set: c4_ta_proof
            - text: 「先講記者就好，研究所看我問到哪裡再說。妳剛剛練了兩遍。」
              if: flag.c4_ta_overheard
              then:
                - pause: 2
                - { sfx: raincoat_rustle, at: front-left, dist: near, text: 沙 }
                - tingan: ……妳在那邊站多久了？
                - me: 從妳的雨衣開始響。
                - tingan: 我走路明明沒什麼聲音。
                - me: 腳步沒有。雨衣有。
                - pause: 1.5
                - tingan: ……好啦，我在研究所待過。這個我認。
                - tingan: 待過的人很多。待過，不代表我要跟妳講裡面的事。
                - set: c4_ta_admitted
            - text: 「我姊死前十二天，有另一個人死在十八點三十一分。」
              if: know.k_record_12days
              then:
                - pause: 2.5
                - tingan: 妳從哪裡聽來的？陳醫生？
                - me: 他念給我聽的。
                - pause: 1.5
                - tingan: ……那是醫院的事。妳去問他。
            - text: 「妳不只是記者。」
              then:
                - tingan: 我有記者證。妳要摸摸看嗎？
                - me: 妳從剛剛到現在一直在問。問得越多，妳自己講得越少。
                - pause: 2
                - tingan: 問問題是我的工作啊。
                - tingan: 妳覺得我有別的身分，那就拿出來給我看。不然我只是一個記者。
          silence:
            - pause: 2.5
            - tingan: ……妳不講話，我反而講不下去。
            - tingan: 這是我訪問別人的招數欸。妳從哪裡學的？
      - pause: 1.5
      - if: flag.c4_ta_knew
        then:
          - tingan: ……好。那研究所在做什麼，妳也知道了。
          - me: 我知道你們想讓下一次災害，少死一點人。
          - pause: 1.5
          - tingan: 那妳還來找我幹嘛？
          - me: 我想知道她跟妳，後來怎麼了。
      - if: flag.c4_ta_proof
        then:
          - tingan: 妳早晚會自己挖到。我寧可妳從我這裡聽，不要從別人那裡聽到更難聽的版本。
          - tingan: 我以前是研究助理。在研究所。
          - tingan: 外面的人都以為，那裡在研究時間旅行。
          - tingan: 沒有。
          - pause: 1
          - tingan: 我們在做一個灰潮鎮。用資料做的。
          - tingan: 道路、電網、醫院有幾張床、車站每個鐘頭有多少人進出。
          - tingan: 颱風來了先封哪條路、醫院滿了病人往哪送、停電時備援電先給誰。
          - { tingan: 災害和城市韌性的數位孿生。不是時間旅行。, learn: k_research_purpose, mem: m_c4_twin }
          - tingan: 小地方，資源很少。我們想讓下一次災害，少死一點人。
          - pause: 2
          - think: 少死一點人。
      # 沒有證據：她只講對外的那一版，研究所的事整個收起來。
      - if: "!flag.c4_ta_knew && !flag.c4_ta_proof"
        then:
          - tingan: 我在做人口外流的報導。這十年，鎮上少了快三分之一的人。
          - tingan: 走掉的我訪，留下來的我也訪。妳姊是我以前在這裡認識的，就這樣。
          - me: 研究所呢？
          - pause: 1.5
          - if: flag.c4_ta_admitted
            then:
              - tingan: 我說了，我待過。裡面在做什麼，不是我一個人講了算。
            else:
              - tingan: 山上那棟舊建築喔？我的報導會拍到。廢掉的公共設施，很好拍。
          - { think: 她講「舊建築」的時候，雨衣一下都沒響。她在等我拿出什麼東西，拿不出來，她就不接。, learn: lead_c4_public }
          - { sfx: step, at: back, dist: near, text: 叩、叩 }
          - { old_woman: 葉小姐，妳五年前跟知夏借的那兩本舊地圖集還沒還喔。, as: 館員, at: back }
          - { old_woman: 借書卡上還蓋著妳們研究所的章咧，我每次盤點都看到。, as: 館員, at: back, learn: k_c4_loan_card }
          - pause: 1.5
          - tingan: ……阿姨，我下次拿來。
          - { sfx: step, at: back, dist: mid, text: 叩、叩 }
          - { sfx: raincoat_rustle, at: front-left, dist: near, text: 沙沙 }
          - narr: 她把椅子往後推，包包的拉鍊拉上。
          - tingan: 我下午還有一個採訪。人口外流的事，妳想講隨時打給我。
          - tingan: 其他的，沒有。
          - { sfx: chair_scrape, at: front-left, dist: near, text: 嘎 }
          - { sfx: raincoat_rustle, at: front-left, dist: near, to: back:mid, text: 沙、沙 }
          - narr: 她走到門口，停了一下，沒有回頭。
          - tension: 6
          - goto: c4_alone
      - me: 我姊不是工程師。
      - { sfx: page_turn, at: front-left, dist: near, text: 沙啦 }
      - tingan: 她是地方史的資料協力。這間房間，她最熟。
      - tingan: 舊路怎麼改的、哪幾年淹過水、車站改建過幾次，還有阿嬤們講的那些。
      - tingan: 我第一次跟她吵架，就在這張桌子。
      - tingan: 我說，這些沒有標準格式，不能直接進模型。
      - pause: 1
      - tingan: 她就說：
      - { tingan: 「不能直接餵給機器，不代表它不是資料。」, mem: m_c4_not_data }
      - narr: 庭安學她說話的時候，速度慢了下來。
      - think: 我記得這個語氣。知夏要贏的時候，都講得很慢。
      - if: know.k_desk_sister
        then:
          - narr: 我把手掌放到桌墊右手邊那一塊。那三個字的凹痕還在，我沒有再摸一次。
        else:
          - narr: 我把手掌平放在桌上。桌面鋪著一張絨布桌墊，邊緣捲起來，摸起來有點硬。
          - narr: 靠右手邊那一塊，絨毛被壓扁了一片，底下有很淺的凹痕。有人在這裡墊著紙，用力寫過字。
          - touch:
              cells: [給, 妹, 妹]
              style: groove
              prompt: 指腹貼著桌墊，從左邊慢慢滑過去
              timeout: 40
          - learn: k_desk_sister
          - narr: 我的指腹停在最後一個字上，按著不放，絨布底下的木頭被我按得有點溫。
          - think: 她坐在這張桌子，寫過一個要給我的東西。
          - think: 行李箱裡那六封信，我一封都沒拆。是在這裡寫的嗎？
          - tingan: 妳在摸什麼？
          - me: 桌墊。
      - { cue: librarian, at: back, text: 叩、叩, sfx: step }
      - pause: 2
      - tingan: 剩下的我不想在這裡講。
      - tingan: 三點半，研究所那條坡底下。我先回去拿進門要用的東西。
    next: c4_slope

  # ─────────────────────────── 14:10 鐘錶店（庭安沒有開口） ───────────────────────────
  # 圖書館拿不到研究所的事，下午就沒有坡、沒有機房。她回予安的店裡等傍晚。
  - id: c4_alone
    # 格局：周家鐘錶店／後面那張椅子（docs/scene-layouts.md）
    time: "14:10"
    place: 周家鐘錶店
    ambience: [clock_shop]
    cast: { yuan: front, ruoqing: right }
    beats:
      - { sfx: shop_bell, at: back, dist: near, text: 叮鈴 }
      - narr: 滿屋子的滴答，沒有一個對得上。
      - yuan: 後面有椅子。冰箱有茶。
      - { sfx: chair_creak, at: back, dist: near, text: 嘎 }
      - narr: 我坐在後面那張椅子上。他在櫃台修一只錶，鑷子夾住什麼，放下去，又夾起來。
      - narr: 整個下午我都坐在這裡，什麼都沒問到。
      - clock: "17:40"
      - if: flag.c4_ta_can
        then:
          - narr: 庭安請的那罐，我一直握在手裡，早就退成溫的了。
      - if: "!flag.c4_dispersed"
        then:
          - narr: 我按了一下側鍵。
          - phone: 十七點四十分。
          - think: 再過十幾分鐘，她就會從店裡出發。
          - choice:
              timeout: 12
              default: 1
              options:
                - text: （撥給若晴）
                  then:
                    - { sfx: phone_ring, at: right, dist: near, text: 嘟—— }
                    - { ruoqing: 喂？哪位？, via: phone }
                    - me: 若晴，今天傍晚……
                    - { ruoqing: 欸妳誰啊？我要出門了啦，等一下再說。, via: phone }
                    - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
                    - think: 她連我是誰都不知道。出門前接到陌生人的電話，換作是我也不會聽。
                    - tension: 6
                    - set: c4_called_late
                - text: （把手機扣在櫃台上）
                  then:
                    - { sfx: phone_on_glass, at: front, dist: near, text: 叩 }
                    - narr: 我把手機扣在玻璃櫃台上，螢幕朝下。予安的鑷子停了一下，又繼續夾。
                    - tension: 8
      - { sfx: watch_tick, at: front, dist: near, text: 滴答、滴答 }
      - narr: 我坐著等。錶一只一只在他手裡走起來。
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - phone: 十八點三十分。
      - clock: "18:31"
      - if: flag.c4_dispersed
        then:
          - { sfx: clock_chime, at: back-left, dist: mid, text: 噹 }
          - narr: 除此之外，什麼都沒有。
          - narr: 我撥了若晴的手機。
          - { sfx: phone_ring, at: right, dist: near, text: 嘟—— }
          - { ruoqing: 喂？我在家啦。……妳欠我的解釋呢？, via: phone }
          - tension: -8
          - think: 若晴在家，陳醫生在病房，予安在我前面修錶。
        else:
          - { sfx: light_buzz, at: front, dist: near, text: 滋——滋 }
          - { sfx: blackout, at: front, dist: mid, text: 啪, vib: thud }
          - narr: 電只斷了一下。滿牆的滴答一個一個冒回來。
          - pause: 3
          - { sfx: siren_far, at: back, dist: far, text: 喔咿——喔咿—— }
          - narr: 警笛一直沒停。
          - yuan: ……舊車站那邊？
          - heart: fast
          - tension: 10
          - narr: 我的指尖在大腿上點著數，數到第幾分鐘，自己也亂了。
          - think: 若晴照原本的時間到了舊車站，陳醫生也是。
      - pause: 2
      - yuan: 八點半關店。關完店，我們去吃麵。
    next: c4_dinner

  # ─────────────────────────── 15:30 坡道 ───────────────────────────
  - id: c4_slope
    # 格局：往舊研究所的坡道／上坡（docs/scene-layouts.md）
    time: "15:30"
    place: 往舊研究所的坡道
    ambience: [wind_open, sea_far]
    cast: { tingan: left }
    beats:
      - { sfx: seagull, at: right, dist: far, text: 嘎——嘎 }
      - narr: 坡很陡。柏油裂開的地方，手杖尖會卡一下。
      - narr: 海在右邊很遠的地方。風把鹽吹到嘴唇上。
      - { sfx: raincoat_rustle, at: left, dist: near, text: 沙、沙 }
      - tingan: 要不要扶？
      - choice:
          timeout: 8
          default: 2
          options:
            - text: （扶住她的手臂）
              then:
                - narr: 雨衣底下的手臂很瘦。她走得比我想的慢。
                - set: c4_held_tingan
            - text: 「我自己可以。」
              then:
                - tingan: 好。我走妳左邊。
                - { sfx: raincoat_rustle, at: left, dist: near, text: 沙、沙 }
            - text: （手杖往前探，沒有回答）
              then:
                - tingan: ……那我走妳左邊。
                - { sfx: raincoat_rustle, at: left, dist: near, text: 沙、沙 }
      - { sfx: cane_tap, at: front, dist: near, text: 叩, shake: light }
      - narr: 手杖尖卡進一道裂縫，我往前一頓，空著的那隻手在風裡抓了一把。
      - { sfx: phone_ring, at: left, dist: near, text: 嘟嚕嚕 }
      - tingan: 報社打來的。我接一下，妳站這裡不要動。
      - { sfx: raincoat_rustle, at: front-left, dist: mid, text: 沙、沙 }
      - narr: 她往坡上走了幾步，站到路肩講。風一吹，她的聲音就碎成一段一段。
      - { tingan: 明天要交？我知道，我在寫。, at: front-left, dist: mid }
      - { tingan: 照片有啦，照片很多。……好，今天晚上一定給你。, at: front-left, dist: mid }
      - { sfx: phone_hangup, at: front-left, dist: mid, text: 嘟 }
      - { tingan: ……其實一個字都還沒寫。, at: front-left, dist: mid, whisper: true }
      - { sfx: truck_reverse, at: front-left, dist: far, text: 嗶、嗶 }
      - think: 這條坡只夠一台車走。坡頂迴不了車，它是倒著退下來的。
      - { sfx: wind_gust, at: right, dist: mid, text: 颯—— }
      - { sfx: wave, at: right, dist: far, text: 嘩—— }
      - narr: 嗶聲被風吹得一下左一下右。
      - heart: slow
      - narr: 我把手杖收到胸前，兩隻腳釘在柏油上，一步都不敢亂踩。
      - locate:
          sfx: truck_reverse
          at: front-left
          interval: 1.6
          decoys:
            - { sfx: wave, at: right }
            - { sfx: wind_gust, at: back-right }
          tries: 2
          timeout: 14
          prompt: 倒車的嗶聲從哪裡來？
          success:
            - narr: 左前方，坡上。它一格一格往下退，退的是我左手邊那半條路。
            - { sfx: leaf_rustle, at: back-right, dist: near, text: 沙沙, src: 草 }
            - narr: 我往右退，手杖往後掃到路肩的草，再退一步，鞋跟陷進鬆軟的土。
            - { sfx: truck_reverse, at: left, dist: near, text: 嗶、嗶 }
            - narr: 車尾從我左手邊擦過去，柴油的熱氣噴在臉上。我往後一抓，右手的指節刮過路肩的水泥護欄。
            - { man: 歹勢喔！研究所那條線今天又要測，下去載東西啦！, as: 司機, at: left, dist: mid }
            - heart: off
            - { sfx: truck_reverse, at: left, to: back:far, dist: mid, text: 嗶、嗶 }
            - narr: 我站在草裡，等嗶聲一路退到坡底，才把手杖放回地上。
            - { sfx: raincoat_rustle, at: front-left, dist: near, text: 沙沙沙 }
            - tingan: 妳怎麼閃到這裡來？我才要叫妳。
            - me: 它一直在叫。聽得出來在哪。
            - narr: 指節那裡熱熱辣辣的，一碰風就刺。她沒有問，手指按上來，壓住破皮的那一塊。
            - narr: 她的手很冰。我們就這樣站了一下，誰都沒講話，海風把她的雨衣吹得一直響。
            - tension: -4
          fail:
            - { sfx: truck_reverse, at: front-left, dist: near, text: 嗶嗶嗶 }
            - narr: 嗶聲一下子貼到耳朵旁邊。我躲錯了邊，正好退到它倒車的路上。
            - { sfx: raincoat_rustle, at: front-left, dist: near, text: 沙沙沙沙 }
            - { tingan: 林小姐！, at: front-left, shake: light }
            - { sfx: thud, at: left, dist: near, text: 碰, shake: hard }
            - narr: 有人抓住我外套的後領往外一扯，我整個人跌坐在路肩，手掌擦過碎石。
            - heart: pound
            - { sfx: car_horn, at: left, dist: near, text: 叭——！ }
            - narr: 車尾從我剛才站的地方退過去，柴油的熱氣噴了我一臉。
            - { man: 看不到就不要站路中間啦！, as: 司機, at: left, dist: mid }
            - tension: 8
            - narr: 我兩隻手撐在碎石上，掌心一陣一陣刺痛，腿軟得一下子站不起來。
            - tingan: ……妳有沒有怎樣？我才走開十秒。
            - me: 沒事。手而已。
            - set: c4_slope_fell
            - narr: 她蹲下來，把我掌心裡的小石子一顆一顆撥掉。
