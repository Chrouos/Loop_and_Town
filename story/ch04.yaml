                    - think: 哪一邊我說不出來。可是卡兩次的那一聲，我記得。
            else:
              - locate:
                  sfx: drawer
                  at: front-right
                  replay: false
                  tries: 2
                  timeout: 15
                  prompt: 剛剛那個抽屜，在哪一邊？
                  success:
                    - { think: 右手邊，很裡面。卡了兩次才拉出來。, learn: lead_c4_drawer }
                    - think: 下一次，我要在他拉開之前先講出來。
                  fail:
                    - narr: 我換一邊耳朵貼上去，門後面已經沒有聲音了。
                    - { think: 有一個抽屜。可是在哪一邊，我沒聽清楚。, learn: lead_c4_drawer_lost }
                    - think: 下一次，耳朵要先貼上去。
          - if: know.k_medical_records
            then:
              - goto: c4_call_tingan
          - goto: c4_hospital
      - if: "!flag.c4_zy_quoted"
        then:
          - pause: 2
      - { sfx: chair_scrape, at: front, dist: near, text: 嘎—— }
      - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
      - narr: 他站起來往右走，腳步越過檔案櫃，停在更裡面的地方。
      - { sfx: key_jingle, at: front-right, dist: mid, text: 鏘 }
      - { sfx: drawer_catch, variant: 1, at: front-right, dist: mid, text: 喀 }
      - pause: 0.5
      - { sfx: drawer_catch, variant: 2, at: front-right, dist: mid, text: 喀 }
      - pause: 0.3
      - { sfx: drawer, at: front-right, dist: mid, text: 喀啦啦 }
      - narr: 那個抽屜很少被拉開。
      - { sfx: step, at: front-right, dist: mid, to: front:near, text: 叩、叩 }
      - { sfx: knuckle_knock, at: front, dist: near, text: 叩, src: 錄音機 }
      - narr: 他把一個很小的東西放在我面前的桌上。
      - zhiyuan: 這個沒有登錄。
      - zhiyuan: 五年前在現場撿到的。計時停在十八點三十一分。
