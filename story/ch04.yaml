          - { sfx: fabric_flap, at: left, dist: near, text: 啪啪, src: 雨衣 }
          - tingan: ……她以前也是這樣。我話還沒講，她就先講完了。
          - tingan: 那是我們最後一次，一起走上這個坡。
          - goto: c4_institute
      - tingan: 後來，研究從預測，走到介入。
      - tingan: 先算出哪裡會出事。再改一個變數，看結果會不會比較好。
      - tingan: 有一陣子，模擬裡的結果跟現實對不上。
      - tingan: 現實發生了一件事。可是有些紀錄，還留著另一個版本。
      - pause: 2
      - tingan: 知夏說，她記得那一個版本。
      - tingan: 一開始只是小事。她叫一個人別走某條路，那個人就沒事。
      - tingan: 後來事情變大了。救了一個，別的地方就出事。
      - pause: 1.5
      - { sfx: raincoat_rustle, at: left, dist: near, text: 沙 }
      - tingan: 等一下。換我問。
      - tingan: 妳一通電話就約到我，第一句就問五年前。妳知道的，比一個回來賣房子的人多太多了。
      - { tingan: 妳最近是不是也在做一樣的事？, mem: m_c4_same_question }
      - choice:
