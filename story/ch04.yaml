      - { sfx: page_turn, at: front, dist: near, text: 沙 }
      - boxun: 第四次。星期一。
      - boxun: 個案表示，三號病房的鄭阿姨，星期四會從床上摔下來。
      - boxun: 右手腕。
      - pause: 2
      - boxun: 星期四晚上，她摔下來了。右手腕骨折。
      - boxun: 那天值班的是我。
      - pause: 2.5
      - boxun: 我沒有寫她能預知未來。
