          options:
            - text: 「是。」
              then:
                - pause: 2
                - tingan: ……那妳應該聽完。
            - text: 「我跟她不一樣。」
              then:
                - tingan: 她當年也是這樣跟我講的。一個字都不差。
                - tension: 6
          silence:
            - pause: 2.5
            - tingan: 妳不講，我就當妳是。我訪問人都這樣。
      - me: 妳們後來為什麼鬧翻？
      - pause: 2
      - { sfx: wave, at: right, dist: far, text: 嘩—— }
      - tingan: 有一天，她要我幫她改一個人的行程。
      - tingan: 不告訴他。只是讓他那天，晚一點出門。
      - tingan: 我問她為什麼。
      - { tingan: 她說：「我已經看過如果不改會怎樣。」, mem: m_c4_seen_it }
      - pause: 1.5
