# 第四章｜五年前
# 盲眼主角版。格式見 docs/design.md §11；故事見 docs/story.md §5。
chapter: 4
title: 五年前
start: c4_train
advance:
  - if: know.k_recorder_voice && know.k_medical_records && know.k_research_purpose && know.k_zhixia_saw_my_death
    to: 5

scenes:
  # ─────────────────────────── 06:12 列車 ───────────────────────────
  - id: c4_train
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    threads:
      gossip:
        beats:
          - { old_man: 鐘樓那邊這禮拜也在拉線。, at: back-left, as: 後座的老先生 }
          - { old_woman: 鐘都拆了，還拉什麼線？, at: back-left, as: 後座的老太太 }
          - { old_man: 說是舊的線路要接回去。防災用的。, at: back-left, as: 後座的老先生 }
          - { old_woman: 五年前也說是防災用的。, at: back-left, as: 後座的老太太 }
          - pause: 1
          - { narr: 塑膠袋窸窣了一陣，老太太把橘子皮包起來，沒有再接話。 }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 鬧鐘。六點十二分。
      - if: chloop >= 2
        then:
          - narr: 後座那聲咳嗽準時響了，橘子皮的味道也是。
          - think: 我讓它們照原樣過去。
          - if: know.c4_let_it_happen
            then:
              - think: 有一次，我沒有動任何人。
              - think: 若晴的名字，是在餐館的電視裡聽見的。
              - daze: light
              - narr: 鐵軌一格一格的震動還在腳底，聲音卻退到很遠的地方。
              - pause: 1.5
              - daze: off
              - narr: 橘子皮的味道又湧上來。後座的老太太在剝第二顆。
          # 上一輪缺什麼，她就在車上想什麼。聽過的地方今天不再去。
          - if: "!know.k_recorder_voice && know.c4_lead_drawer"
            then:
              - think: 周警官把我請出門，自己回去拉開了那個抽屜。右手邊最裡面，卡兩次才拉得出來。
          - if: "!know.k_medical_records && know.c4_lead_count"
            then:
              - think: 陳醫生在我起身的時候問，這是第幾次。他其實想聽我回答。
          - if: "!know.k_zhixia_saw_my_death && know.c4_lead_promise"
            then:
              - think: 庭安答應過知夏一件事。她差一點就說了。
          - think: 已經聽過的地方，今天不用再去。剩下的那幾扇門，換一句話敲。
        else:
          - narr: 我醒來的時候，手已經在外套口袋裡了。
          - narr: 指尖壓著那一行凸點。不、要、回、來。
          - pause: 1.5
          - think: 十八點三十一分，我已經聽過不只一次。
          - think: 有人死，午夜會重來。沒有人死，午夜也照樣敲十二下。
          - think: 那我在今天裡面把誰挪到哪裡，好像都沒有差。
          - pause: 1
          - { think: 為什麼偏偏是十八點三十一分？, mem: m_c4_why_1831 }
          - think: 五年前，到底發生了什麼？
          - { sfx: cough, at: back-left, dist: mid, text: 咳 }
          - narr: 後面有人咳嗽，跟每一次是同一個時候。
          - { cue: gossip, at: back-left, text: 窸窸窣窣, sfx: huddle_rustle }
      - think: 下車之前，我得先想好今天要不要動別人。
      - choice:
          timeout: 14
          options:
            - text: （再一次，先把所有人移開）
              then:
                - set: dispersed
                - think: 若晴、陳醫生、予安。先一通一通打電話，把他們放到不會出事的地方。
                - think: 然後再去問五年前的事。
            - text: （這次，不動任何人）
              then:
                - think: 有一次我把所有人都移開，沒有人出事，午夜還是重來了。
                - think: 今天我想把時間拿去問五年前的事。這個理由，連我自己都不想多想。
                - pause: 1.5
                - think: 十八點三十一分舊車站會發生什麼，我知道。
                - think: 若晴會去。這次我不打那通電話。
                - heart: slow
                - narr: 我把手機翻過來扣在腿上，指甲沿著塑膠殼的邊一直刮。
      - { sfx: station_chime, at: front, dist: far, text: 叮咚—— }
      - { announcer: 下一站，灰潮鎮。, as: 廣播 }
      - { sfx: train_brake, at: front, dist: mid, text: 嘰—— }
    next: c4_platform

  # ─────────────────────────── 07:40 月台 ───────────────────────────
  - id: c4_platform
    time: "07:40"
    place: 灰潮鎮站
    ambience: [platform]
    cast: { yuan: front-right }
    beats:
      - { sfx: train_door, at: right, dist: near, text: 嘶——喀 }
      - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
      - yuan: 比我想的早。
      - me: 車沒誤點。
      - if: chloop >= 2
        then:
          - narr: 我握住他的左手肘，把今天要跑的地方照順序講給他聽。他只問了一句，要不要先吃早餐。
        else:
          - narr: 接下來那幾句，我讓它們從耳邊滑過去。
          - yuan: 請扶著我的左手肘。前面有階梯。
          - narr: 他袖子上有機油和黃銅的味道。
          - me: 予安。九點以後，可以帶我去派出所嗎？
          - pause: 1
          - yuan: 派出所？
          - yuan: ……妳一下車就要去報案喔？
          - me: 我想問我姊的事。
          - pause: 2
          - yuan: 好。
          - narr: 他沒有問為什麼。手肘往下沉了一點，腳步放得比剛才慢。
      - { sfx: construction_drill, at: left, dist: far, text: 噠噠噠 }
      - if: flag.dispersed
        then:
          - goto: c4_calls
      - think: 這一次，我一通電話也不打。
      - think: 今天每個人都照自己原本的行程走。
      - if: know.k_recorder_voice && know.k_medical_records
        then:
          - goto: c4_call_tingan
      - if: know.k_recorder_voice
        then:
          - goto: c4_hospital
    next: c4_police

  # ─────────────────────────── 08:30 電話（分散） ───────────────────────────
  - id: c4_calls
    time: "08:30"
    place: 林家老屋，客廳
    ambience: [old_house]
    cast: { ruoqing: right, yuan: left, old_woman: right }
    beats:
      - { sfx: door_creak, at: front, dist: near, text: 碰——吱呀 }
      - narr: 門還是卡住，他還是用肩膀頂開。灰塵落在我的手背上。
      - narr: 予安去買早餐了。客廳只剩我和手機。
      - phone: 撥號中。老街咖啡店。
      - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
      - { old_woman: 喂，咖啡店你好。, as: 店長 }
      - me: 請問若晴在嗎？
      - { old_woman: 若晴！電話！, as: 店長 }
      - heart: slow
      - narr: 話筒那頭有杯盤在碰。我把手機貼得太緊，耳廓壓得發疼。
      - pause: 1.5
      - ruoqing: 喂？請問哪位？
      - me: 妳不認識我。我是林知夏的妹妹。
      - pause: 1.5
      - { sfx: strap_click, at: right, dist: near, text: 喀 }
      - narr: 電話那頭，金屬扣響了一下。
      - me: 今天傍晚，不要去舊車站。
      - ruoqing: ……妳怎麼知道我要去？
      - me: 拜託妳。過了六點半再決定。
      - pause: 2
      - ruoqing: 欸……好啦。我跟陳醫生說改天。
      - ruoqing: 可是妳欠我一個解釋喔。
      - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
      - heart: off
      - phone: 撥號中。周予安。
      - { sfx: phone_ring, at: left, dist: mid, text: 嘟—— }
      - yuan: 我在排隊。蛋餅要不要加起司？
      - me: 今天傍晚六點到七點，你待在店裡。
      - pause: 1
      - yuan: ……好的。
      - narr: 他平常會先答應，再問為什麼。這次電話裡只有煎台滋滋響，他什麼都沒問。
      - { sfx: phone_hangup, at: left, dist: mid, text: 嘟 }
      - think: 陳醫生，中午再當面跟他說。
      - pause: 1.5
      - { think: 我又一次替所有人安排好今天。, mem: m_c4_arranged }
      - think: 像把桌上的杯子，一個一個推離桌緣。
      - if: know.k_recorder_voice && know.k_medical_records
        then:
          - goto: c4_call_tingan
      - if: know.k_recorder_voice
        then:
          - goto: c4_hospital
    next: c4_police

  # ─────────────────────────── 09:10 派出所 ───────────────────────────
  - id: c4_police
    time: "09:10"
    place: 灰潮鎮派出所
    ambience: [police_office]
    cast: { zhiyuan: front, yuan: back, man: back-right }
    threads:
      radio:
        beats:
          - { sfx: static_burst, at: back-right, dist: mid, text: 嘶嘶 }
          - { man: 北區巡邏，施工路段改道，請注意。, as: 無線電, at: back-right }
          - { man: 舊車站正門那邊還封著，行人走側邊。, as: 無線電, at: back-right }
          - { man: 收到。, as: 另一個員警, at: back-right }
    beats:
      - { sfx: door_open, at: back, dist: near, text: 吱 }
      - if: know.c4_lead_drawer
        then:
          - narr: 頭頂的電扇、沒點的菸、很慢的鍵盤，跟上一次一樣。右手邊最裡面，那個抽屜還關著。
        else:
          - narr: 電扇在頭頂轉。裡面的鍵盤聲很慢，一個鍵敲完，才輪到下一個。
          - narr: 有菸味，可是沒有打火機的聲音，也沒有人在吸。
          - think: 是他。
      - yuan: 我在外面等。
      - { sfx: door_close, at: back, dist: mid, text: 碰 }
      - { sfx: chair_scrape, at: front, dist: near, text: 嘎 }
      - zhiyuan: 小姐，什麼事？
      - me: 我姓林。林知夏是我姊。
      - me: 我想聽她的案子。
      - pause: 1.5
      - zhiyuan: ……我姓周。
      - zhiyuan: 案子結了。
      - zhiyuan: 意外。家屬當年有簽名。
      - narr: 他說完「結了」，椅背嘎一聲往後靠。
      # 關口：他只為「他自己知道的事」開抽屜。家裡的東西、沉默都打不開；被請出門的那一輪，她在門外聽見抽屜。
      - choice:
          timeout: 16
          options:
            - text: 「你等一下會往右走到最裡面，拉開一個要卡兩次才出得來的抽屜。」
              if: know.c4_lead_drawer
              then:
                - pause: 3
                - narr: 電扇轉過來，又轉過去。他一直沒有開口。
                - zhiyuan: ……妳進來過？
                - me: 沒有。我在門外聽的。
                - zhiyuan: 我今天還沒開過那個抽屜。
                - me: 我知道。
                - set: c4_zy_open
            - text: 「她的錶停在六點三十一分。筆記本背面，寫滿了同一個時間。」
              if: know.k_watch_1831 && know.k_notebook_1831
              then:
                - zhiyuan: 那是妳家的東西。妳摸得到，不代表什麼。
                - me: 那你呢？你到現場的時候，是幾點？
                - pause: 2
                - zhiyuan: ……比那更晚。
            - text: 「她的錶，停在六點三十一分。」
              if: know.k_watch_1831 && !know.k_notebook_1831
              then:
                - zhiyuan: 那是妳家的東西。妳摸得到，不代表什麼。
                - me: 那你呢？你到現場的時候，是幾點？
                - pause: 2
                - zhiyuan: ……比那更晚。
            - text: 「她的筆記本背面，寫滿了十八點三十一分。」
              if: know.k_notebook_1831 && !know.k_watch_1831
              then:
                - zhiyuan: 那是妳家的東西。妳摸得到，不代表什麼。
                - me: 那你呢？你到現場的時候，是幾點？
                - pause: 2
                - zhiyuan: ……比那更晚。
            - text: 「十八點三十一分。我已經聽過好幾次了。」
              then:
                - zhiyuan: 什麼意思？
                - if: know.k_in_station_hall
                  then:
                    - me: 有一次，停電，還有相機背帶的扣子一直響。
                  else:
                    - me: 有一次，整座鎮停了一拍。冰箱的嗡嗡聲斷掉，過一下又自己轉起來。
                - if: know.k_maintenance_passage
                  then:
                    - me: 另一次，很深的地方有東西倒下來。
                  else:
                    - me: 另一次，咖啡機斷電，然後很遠的地方有警笛。
                - me: 還有一次什麼都沒有，只有一個嗡鳴。
                - pause: 3
                - zhiyuan: 五年前那次停電，報告裡有寫。
                - zhiyuan: 沒有對外公開。
                - set: c4_zy_open
            - recall:
                accept:
                  - mem: m_zhixia_1831
                    then:
                      - me: 姓名，林知夏。地點，舊車站周邊。
                      - me: 死亡時間——十八點三十一分。
                      - narr: 我照他念的方式念，一個字一個字分開，念到「時間」先停一下。
                      - pause: 3
                      - narr: 裡面的鍵盤聲停了。他的椅背也沒有再響。
                      - zhiyuan: ……那份摘要在我抽屜裡。沒有影本。
                      - zhiyuan: 妳連我在哪裡停，都念得一樣。
                      - me: 你念給我聽過。
                      - zhiyuan: 我沒有。
                      - pause: 1.5
                      - zhiyuan: ……妳等一下。
                      - set: [c4_zy_quoted, c4_zy_open]
                  - mem: m_note
                    then:
                      - me: 「十八點三十一分，不是死亡時間。」
                      - me: 我姊的筆記裡，有這一句。
                      - pause: 3
                      - narr: 喀，一個金屬蓋子彈開，又被按回去。是打火機。他沒有點。
                      - zhiyuan: ……這句話，我心裡也講了五年。
                      - zhiyuan: 一次都沒寫下來過。
                      - pause: 1.5
                      - zhiyuan: 妳等一下。
                      - set: [c4_zy_quoted, c4_zy_open]
                miss:
                  - zhiyuan: ……什麼？
                  - think: 不是這句。他只會為他自己知道的事開抽屜。
            - text: （什麼都不說，等他）
              then:
                - pause: 4
                - narr: 他的指節在桌面敲了一下，隔了好一陣子才敲第二下。
                - zhiyuan: ……妳還不走？
                - me: 你是第一批到場的人。那份摘要，你不用翻就背得出來。
                - zhiyuan: ……誰跟妳講的？
                - me: 沒有人。
      - if: "!flag.c4_zy_open"
        then:
          - pause: 2
          - zhiyuan: 小姐，案子結了。妳請回。
          - { sfx: chair_scrape, at: front, dist: near, text: 嘎 }
          - narr: 他站起來，手掌停在我肩膀後面，沒有碰到，一路把我帶到門口。
          - { sfx: door_close, at: back, dist: near, text: 碰 }
          - narr: 門在背後關上。走廊的日光燈滋滋響，予安不在椅子上，大概出去講電話了。
          - think: 我沒有走。
          - heart: slow
          - narr: 我側身把耳朵貼上門板。門上的漆起了皮，刮著我的臉頰。
          - pause: 3
          - { sfx: step, at: back-right, dist: far, text: 叩、叩 }
          - { sfx: key_jingle, at: back-right, dist: far, text: 鏘 }
          - { sfx: drawer, at: back-right, dist: far, text: 喀啦啦 }
          - narr: 門板後面，他的腳步往右走到很裡面。一個抽屜卡了兩次才拉出來。
          - { sfx: tape_hiss, at: back-right, dist: far, gain: 0.35, text: 沙…… }
          - { sfx: wind_gust, at: back-right, dist: far, gain: 0.35, text: 嗚…… }
          - narr: 然後是很薄的沙沙聲，底下有風，在一個很高的地方繞了一圈。
          - { sfx: recorder_click, at: back-right, dist: far, text: 喀 }
          - narr: 只放了幾秒就按掉了。
          - { think: 他把我送出門，自己去聽了。, learn: c4_lead_drawer, mem: m_c4_drawer }
          - think: 右手邊最裡面，卡兩次的抽屜。下一次，我要在他拉開之前先講出來。
          - if: know.k_medical_records
            then:
              - goto: c4_call_tingan
          - goto: c4_hospital
      - if: "!flag.c4_zy_quoted"
        then:
          - pause: 2
      - { sfx: chair_scrape, at: front, dist: near, text: 嘎—— }
      - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
      - narr: 他站起來往右走，腳步越過檔案櫃，停在更裡面的地方。
      - { sfx: key_jingle, at: front-right, dist: mid, text: 鏘 }
      - { sfx: drawer, at: front-right, dist: mid, text: 喀啦啦 }
      - narr: 那個抽屜很少被拉開，卡了兩次才出來。
      - { sfx: step, at: front, dist: near, text: 叩 }
      - narr: 一個很小的東西，叩一聲放在我面前的桌上。
      - zhiyuan: 這個沒有登錄。
      - zhiyuan: 五年前在現場撿到的。計時停在十八點三十一分。
      - zhiyuan: 來源不明。時間碼可疑。
      - zhiyuan: 我跟自己說，先確認，再登錄。
      - pause: 1.5
      - zhiyuan: 然後就五年了。
      - if: flag.c4_zy_quoted
        then:
          - pause: 1.5
          - zhiyuan: 講實在的，不是在確認。
          - zhiyuan: 我自己只聽過一次。之後就不敢再按了。
      - pause: 2
      - narr: 我摸到它。塑膠殼的邊角磨圓了，按鍵有點黏。
      - zhiyuan: 妳要聽嗎？
      - me: 要。
      - { sfx: tape_rewind, at: front, dist: near, text: 嘰嘰嘰嘰—— }
      - { sfx: recorder_click, at: front, dist: near, text: 喀嚓 }
      - pause: 1
      - { sfx: tape_hiss, at: front, dist: near, text: 沙———— }
      - pause: 2.5
      - narr: 先是沙沙聲，像有人拿很細的砂紙在磨桌面。
      - { sfx: wind_gust, at: front-left, dist: far, text: 嗚—— }
      - narr: 然後是風。風從破掉的窗灌進挑高的大廳，繞一圈，又從別的地方出去。
      - if: know.k_in_station_hall
        then:
          - think: 這個回音我聽過。舊車站的大廳。
        else:
          - think: 這個風聲我聽過。在舊車站對面，從破窗灌進大廳的就是這種風。
      - { sfx: step, at: front, dist: far, text: 叩……叩…… }
      - narr: 很遠的地方有腳步，踩在碎玻璃上。
      - pause: 1.5
      - { sfx: bell_toll_far, at: front-left, dist: far, text: 噹—— }
      - pause: 2.5
      - narr: 錄音裡，有鐘聲。
      - think: 那時候，鐘樓還有鐘。
      - pause: 2
      - think: 我以為，下一個聲音會是她。
      - heart: slow
      - narr: 我兩隻手壓著桌緣，壓到木頭的紋路印進指腹。
      - pause: 2
      - { zhiyuan: ……有人嗎？聽得到嗎？, as: 錄音裡的男聲, at: front, dist: far }
      - { sfx: static_burst, at: front, dist: near, text: 嘶 }
      - pause: 1
      - narr: 聲音很低，一個字一個字分得很開。
      - me: 這是你的聲音。
      - { sfx: recorder_click, at: front, dist: near, text: 喀 }
      - pause: 3
      - { zhiyuan: ……我那時候還在路上。, learn: k_recorder_voice, mem: m_c4_on_the_way }
      - zhiyuan: 通報是六點四十幾分進來的。我到現場，又過了二十分鐘。
      - zhiyuan: 可是這台機器，停在十八點三十一分。
      - pause: 2
      - zhiyuan: 時間碼壞掉、有人剪接、機器被調包，我都想過。
      - zhiyuan: 都有可能。所以我一個都不能寫進報告。
      - choice:
          timeout: 12
          options:
            - text: 「你怕交出去以後，被查的人變成你。」
              then:
                - pause: 2
                - zhiyuan: ……對。
                - zhiyuan: 這不是什麼好理由。我知道。
            - text: 「謝謝你沒有丟掉它。」
              then:
                - pause: 1.5
                - zhiyuan: 我也沒交出去。不用謝我。
            - text: （再聽一次那陣風）
              then:
                - { sfx: recorder_click, at: front, dist: near, text: 喀嚓 }
                - { sfx: tape_hiss, at: front, dist: near, text: 沙—— }
                - { sfx: bell_toll_far, at: front-left, dist: far, text: 噹—— }
                - narr: 風聲裡夾著那一下鐘。我把它們一起記住。
                - { sfx: recorder_click, at: front, dist: near, text: 喀 }
      - zhiyuan: 這個不能讓妳帶走。
      - me: 不用帶。我已經記住了。
      - heart: off
      - { cue: radio, at: back-right, text: 嘶嘶——, sfx: static_burst }
      - { sfx: drawer, at: front-right, dist: mid, text: 喀啦 }
      - narr: 抽屜推回去的時候，又卡了兩次。
      - { wait: 10 }
      - if: know.k_medical_records
