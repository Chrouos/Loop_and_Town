      - narr: 油鍋滋滋響，碗筷碰來碰去。角落那台電視開得太大聲。
      - narr: 下山的時候我打給予安。他說，老街那家麵店。
      - narr: 庭安送我到門口就走了。予安已經坐在裡面。
      - yuan: 這裡。靠牆，第二張。
      - { sfx: chair_scrape, at: front, dist: near, text: 嘎 }
      - yuan: 房仲剛走。說下禮拜再來估價。
      - yuan: 我點了兩碗麵。妳的不加蔥。
      - think: 我沒有跟他說過我不吃蔥。
      - think: 他記得的，是五年前的我。
      - if: "!flag.dispersed"
        then:
          - { old_man: ……今晚六點半左右，灰潮鎮舊車站發生意外。, as: 電視, at: back-left }
          - { old_man: 一名二十三歲女性，送醫後不治……, as: 電視, at: back-left }
          - { sfx: cup_set, at: right, dist: mid, text: 叩 }
          - { old_woman: 是咖啡店的若晴啦。造孽喔。, as: 老闆娘 }
          - pause: 3
          - yuan: ……咖啡店那個女生。
          - yuan: 她高中的時候，常來店裡寫功課。
          - yuan: 我都跟她說，後面有椅子。冰箱有茶。
          - pause: 2
          - narr: 他把筷子擱在碗邊，叩一聲，之後就沒有再拿起來。
          - think: 我知道會這樣。
          - { think: 我知道，我還是讓它發生了。, mem: m_c4_let_it }
          - learn: c4_let_it_happen
          - pause: 2
        else:
          - yuan: 六點到七點，我真的待在店裡。
          - yuan: 很無聊。修了兩只錶。
          - yuan: 所以，可以跟我說為什麼要我待著了嗎？
          - me: 因為我不想再聽見你出事。
          - pause: 2
          - yuan: ……「再」？
          - narr: 我沒有解釋。他也沒有追問，把醋瓶推到我手邊。
      - { sfx: spoon_stir, at: front, dist: near, text: 叮 }
      - yuan: 妳今天一整天，派出所、醫院、圖書館，還跑上山。
      - yuan: 妳不是只回來賣房子的吧。
      - me: 也是回來賣房子的。
      - pause: 1
      - { sfx: laugh_soft, at: front, dist: near, text: 呵 }
      - narr: 他笑了一聲。很輕，從鼻子出氣的那種。
      - yuan: 妳這五年，到底都跑去哪裡了？
      - choice:
          timeout: 12
          options:
            - text: 「很遠的地方。」
              then:
                - yuan: 城市有那麼遠？
                - me: 比城市遠。
            - text: 「說來話長。」
              then:
                - yuan: 我有時間。
                - pause: 1.5
                - me: 今天不夠長。
            - text: （摸自己的手杖）
              then:
                - narr: 杖身的接縫，一節一節。
                - yuan: ……眼睛的事，也是這五年的事？
                - me: 兩年前。
                - yuan: 我都不知道。……應該要知道的。
      - pause: 1.5
      - yuan: 那這樣。
      - { yuan: 如果真的還有明天，再跟我講妳這五年到底跑去哪裡了。, learn: k_yuan_tomorrow, mem: m_c4_tomorrow }
      - pause: 3
      - think: 明天。
      - think: 明天早上七點四十分，他會在月台說：比我想的早。
      - think: 他不會記得今天問過我這件事。
      - choice:
          timeout: 10
          options:
            - text: 「好。我答應你。」
              then:
                - yuan: 一言為定。
                - think: 我答應了一件我做不到的事。
                - think: 可是我想答應。
            - text: 「如果沒有明天呢？」
              then:
                - yuan: 那就今天講。
                - pause: 2
                - yuan: ……不講也沒關係。我在。
            - text: （點頭）
              then:
                - { sfx: cup_set, at: front, dist: near, text: 叩 }
                - narr: 他把我的碗，往我這邊推了一點。
      - { cue: kitchen, at: right, text: 鏘、嘶——, sfx: glass_clink }
      - narr: 麵已經不太燙了。我們把它吃完。
      - { wait: 12 }
    next: c4_bell

