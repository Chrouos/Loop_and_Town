# 第四章｜五年前
# 盲眼主角版。格式見 docs/design.md §11；故事見 docs/story.md §5。
chapter: 4
title: 五年前
start: c4_train
advance:
  - if: know.k_recorder_voice && know.k_medical_records && know.k_research_purpose && know.k_zhixia_saw_my_death
    to: 5

scenes:
  # ─────────────────────────── 06:12 列車 ───────────────────────────
  - id: c4_train
    # 格局：返鄉列車／靠窗座位（docs/scene-layouts.md）
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    threads:
      gossip:
        beats:
          - { old_man: 鐘樓那邊這禮拜也在拉線。, at: back-left, as: 後座的老先生 }
          - { old_woman: 鐘都拆了，還拉什麼線？, at: back-left, as: 後座的老太太 }
          - { old_man: 說是舊的線路要接回去。防災用的。, at: back-left, as: 後座的老先生 }
          - { old_woman: 五年前也說是防災用的。, at: back-left, as: 後座的老太太 }
          - pause: 1
          - { sfx: plastic_crinkle, at: back-left, dist: mid, text: 窸窸窣窣 }
          - { narr: 老太太把橘子皮包起來，沒有再接話。 }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 鬧鐘。六點十二分。
      - if: chloop >= 2
        then:
          - if: chloop >= 3
            then:
              - narr: 鬧鐘還沒震，我就醒了。我一直在等它，等到它震，才覺得今天開始了。
          - { sfx: cough, at: back-left, dist: mid, text: 咳 }
          - narr: 後座那聲咳嗽響的時候，我在心裡也咳了一聲，跟他差不多同一刻。
          - if: know.k_c4_let_it_happen
            then:
              - think: 有一次，我沒有動任何人。
              - think: 若晴的事，是在餐館的電視裡聽見的。
              - daze: light
              - narr: 鐵軌一格一格的震動還在腳底，聲音卻退到很遠的地方。
              - pause: 1.5
              - daze: off
              - narr: 橘子皮的味道又湧上來。後座的老太太在剝第二顆。
          # 上一輪缺什麼，她就在車上想什麼。聽過的地方今天不再去。
          - if: "!know.k_recorder_voice && know.lead_c4_drawer"
            then:
              - think: 周警官把我請出門，自己回去拉開了那個抽屜。右手邊最裡面，卡兩次才拉得出來。
          - if: "!know.k_recorder_voice && !know.lead_c4_drawer && know.lead_c4_drawer_lost"
            then:
              - think: 周警官把我請出門，自己回去拉開了一個抽屜。在哪一邊，我上次沒聽清楚。
              - think: 可是那個抽屜卡了兩次才拉出來。這個我記得。
          - if: "!know.k_recorder_voice && know.lead_c4_procedure"
            then:
              - think: 我拿檢舉壓周警官，他就只剩規矩。抽屜裡的東西，要拿我在門外聽到的去換。
          - if: "!know.k_medical_records && know.lead_c4_count"
            then:
              - think: 陳醫生在我起身的時候問，這是第幾次。他其實想聽我回答。
          - if: "!know.k_research_purpose && know.lead_c4_public"
            then:
              - think: 庭安只肯講人口外流。研究所三個字，她要看到我手上有東西才肯接。
          - if: "!know.k_research_purpose && know.k_c4_loan_card"
            then:
              - think: 館員說過，她跟知夏借的那兩本舊地圖集，借書卡上蓋著研究所的章。
          - if: "!know.k_zhixia_saw_my_death && know.lead_c4_promise"
            then:
              - think: 庭安答應過知夏一件事。她差一點就說了。
          - think: 已經聽過的地方，今天不用再去。剩下的那幾扇門，換一句話敲。
        else:
          - narr: 我醒來的時候，手已經在外套口袋裡了。
          - narr: 指尖壓著那一行凸點。不、要、回、來。
          - pause: 1.5
          - think: 十八點三十一分，我已經聽過不只一次。
          - think: 有人死，午夜會重來。沒有人死，午夜也照樣敲十二下。
          - think: 那我在今天裡面把誰挪到哪裡，好像都沒有差。
          - pause: 1
          - { think: 為什麼偏偏是十八點三十一分？, mem: m_c4_why_1831 }
          - think: 五年前，到底發生了什麼？
          - { sfx: cough, at: back-left, dist: mid, text: 咳 }
          - narr: 後面有人咳嗽，跟每一次是同一個時候。
          - { cue: gossip, at: back-left, text: 窸窸窣窣, sfx: huddle_rustle, whisper: true }
      - think: 下車之前，我得先想好今天要不要動別人。
      - choice:
          timeout: 14
          default: 2
          options:
            - text: （再一次，先把所有人移開）
              then:
                - set: c4_dispersed
                - think: 若晴、陳醫生、予安。先一通一通打電話，把他們放到不會出事的地方。
                - think: 然後再去問五年前的事。
            - text: （這次，不動任何人）
              then:
                - think: 有一次我把所有人都移開，沒有人出事，午夜還是重來了。
                - think: 今天我想把時間拿去問五年前的事。這個理由，連我自己都不想多想。
                - pause: 1.5
                - think: 十八點三十一分舊車站會發生什麼，我知道。
                - think: 若晴會去。這次我不打那通電話。
                - think: 想到若晴，我先想起的是那個金屬扣，然後才是她的名字。
                - { sfx: nail_scratch, at: center, dist: near, text: 嘶、嘶 }
                - narr: 我把手機翻過來扣在腿上，指甲沿著塑膠殼的邊一直刮。
                - tension: 8
                - set: c4_still
            - text: （還沒想好）
              then:
                - think: 車要進站了，我還是決定不了。
      - { sfx: station_chime, at: front, dist: far, text: 叮咚—— }
      - { announcer: 下一站，灰潮鎮。, as: 廣播, via: speaker }
      - { sfx: train_brake, at: front, dist: mid, text: 嘰—— }
    next: c4_platform

  # ─────────────────────────── 07:40 月台 ───────────────────────────
  - id: c4_platform
    # 格局：灰潮鎮站月台／下車往出口（docs/scene-layouts.md）
    time: "07:40"
    place: 灰潮鎮站
    ambience: [platform]
    cast: { yuan: front-right }
    beats:
      - { sfx: train_door, at: left, dist: near, text: 嘶——喀 }
      - { sfx: step_uneven, at: front-right, dist: mid, text: 咚、叩 }
      - yuan: 比我想的早。
      - me: 車沒誤點。
      - if: chloop >= 2 || know.k_recorder_voice
        then:
          - move: { yuan: right }
          - narr: 我握住他的左手肘，把今天要跑的地方照順序講給他聽。他只問了一句，要不要先吃早餐。
        else:
          - narr: 接下來那幾句，他還沒講出口，我在心裡已經替他講完了。
          - move: { yuan: right }
          - yuan: 請扶著我的左手肘。前面有階梯。
          - narr: 他袖子上有機油和黃銅的味道。
          - me: 予安。九點以後，可以帶我去派出所嗎？
          - pause: 1
          - yuan: 派出所？
          - yuan: ……妳一下車就要去報案喔？
          - me: 我想問我姊的事。
          - pause: 2
          - yuan: 好。
          - { sfx: step_uneven, at: front-right, dist: near, text: 咚……叩 }
          - narr: 他沒有問為什麼。手肘往下沉了一點，腳步放得比剛才慢。
      - { sfx: construction_drill, at: left, dist: far, text: 噠噠噠 }
      - if: "!flag.c4_dispersed && !flag.c4_still"
        then:
          - think: 下了車，我還是得決定今天要不要動別人。
          - choice:
              options:
                - text: （先把所有人移開）
                  then:
                    - set: c4_dispersed
                    - think: 若晴、陳醫生、予安。一通一通打，把他們放到不會出事的地方。
                - text: （這次，不動任何人）
                  then:
                    - think: 若晴會去。這次我不打那通電話。
                    - narr: 我握著予安手肘的那隻手，指甲掐進自己的掌心。
                    - tension: 8
                    - set: c4_still
      - if: flag.c4_dispersed
        then:
          - goto: c4_calls
      - think: 這一次，我一通電話也不打。
      - think: 今天每個人都照自己原本的行程走。
      - if: know.k_recorder_voice && know.k_medical_records
        then:
          - goto: c4_call_tingan
      - if: know.k_recorder_voice
        then:
          - goto: c4_hospital
    next: c4_police

  # ─────────────────────────── 08:30 電話（分散） ───────────────────────────
  - id: c4_calls
    # 格局：林家老屋／客廳（docs/scene-layouts.md）
    time: "08:30"
    place: 林家老屋，客廳
    ambience: [old_house]
    cast: { ruoqing: right, yuan: right, old_woman: right }
    beats:
      - { sfx: door_creak, at: front, dist: near, text: 碰——吱呀 }
      - narr: 門還是卡住，他還是用肩膀頂開。灰塵落在我的手背上。
      - narr: 予安去買早餐了。客廳只剩我和手機。
      - if: chloop >= 2
        then:
          - narr: 若晴那通、予安那通，我講得很快，講完就掛。
          - think: 若晴說我欠她一個解釋。予安在煎台旁邊，什麼都沒問。
        else:
          - phone: 撥號中。老街咖啡店。
          - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
          - { old_woman: 喂，咖啡店你好。, as: 店長, via: phone }
          - me: 請問若晴在嗎？
          - { old_woman: 若晴！電話！, as: 店長, via: phone }
          - { sfx: cup_set, at: right, dist: far, text: 喀喀 }
          - narr: 我把手機貼得太緊，耳廓壓得發疼。
          - pause: 1.5
          - { ruoqing: 喂？請問哪位？, via: phone }
          - me: 妳不認識我。我是林知夏的妹妹。
          - pause: 1.5
          - { sfx: strap_click, at: right, dist: near, text: 喀 }
          - me: 今天傍晚，不要去舊車站。
          - { ruoqing: ……妳怎麼知道我要去？, via: phone }
          - me: 那份東西，是我姊留下來的吧。
          - me: 我想跟妳一起去拿。今天不行，改天我陪妳去。
          - pause: 2
          - { ruoqing: 欸……知夏姊的妹妹，一早打來，什麼都知道，又什麼都不講？, via: phone }
          - { sfx: strap_click, at: right, dist: near, text: 喀 }
          - { ruoqing: ……好啦。那是她的東西，妳要一起，我也沒立場說不要。, via: phone }
          - { ruoqing: 陳醫生那邊，我跟他說改天。, via: phone }
          - { ruoqing: 還有，妳欠我一個解釋。, via: phone }
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
          - phone: 撥號中。周予安。
          - { sfx: phone_ring, at: right, dist: near, text: 嘟—— }
          - { yuan: 我在排隊。蛋餅要不要加起司？, via: phone }
          - me: 今天傍晚六點到七點，你待在店裡。
          - pause: 1
          - { yuan: ……好的。, via: phone }
          - { sfx: fry_sizzle, at: right, dist: far, text: 滋—— }
          - narr: 他平常會先答應，再問為什麼。這次他什麼都沒問。
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
      - if: know.k_medical_records
        then:
          - think: 陳醫生，中午再打給他。
        else:
          - think: 陳醫生，中午再當面跟他說。
      - pause: 1.5
      - { think: 我又一次替所有人安排好今天。, mem: m_c4_arranged }
      - think: 像把桌上的杯子，一個一個推離桌緣。
      - if: know.k_recorder_voice && know.k_medical_records
        then:
          - goto: c4_call_tingan
      - if: know.k_recorder_voice
        then:
          - goto: c4_hospital
    next: c4_police

  # ─────────────────────────── 09:10 派出所 ───────────────────────────
  - id: c4_police
    # 格局：灰潮鎮派出所／桌前 → 灰潮鎮派出所／門外（docs/scene-layouts.md）
    time: "09:10"
    place: 灰潮鎮派出所
    ambience: [police_office]
    cast: { zhiyuan: front, yuan: back, man: back-right }
    threads:
      radio:
        beats:
          - { sfx: static_burst, at: back-right, dist: mid, text: 嘶嘶 }
          - { man: 北區巡邏，施工路段改道，請注意。, as: 無線電, at: back-right, via: radio }
          - { man: 舊車站正門那邊還封著，行人走側邊。, as: 無線電, at: back-right, via: radio }
          - { man: 收到。, as: 另一個員警, at: back-right }
    beats:
      - { sfx: door_open, at: back, dist: near, text: 吱 }
      - if: know.lead_c4_drawer
        then:
          - { sfx: typing, at: front, dist: mid, text: 噠……噠 }
          - narr: 桌角的電扇、沒點的菸、很慢的鍵盤，跟上一次一樣。右手邊最裡面那個抽屜，今天還沒有人拉過。
        else:
          - { sfx: typing, at: front, dist: mid, text: 噠……噠 }
          - { sfx: fan_hum, at: front, dist: near, text: 嗡 }
          - narr: 桌角有一台電扇正對著門口吹。打字的人不太會打字，一個鍵要找很久。
          - narr: 有菸味，可是沒有人在吸。
      - yuan: 我在外面等。
      - { sfx: step_uneven, at: back, dist: mid, text: 咚、叩 }
      - { sfx: door_close, at: back, dist: mid, text: 碰 }
      - { sfx: lighter_lid, at: front, dist: near, text: 叮、喀 }
      - narr: 後面沒有點火的聲音。
      - choice:
          timeout: 7
          options:
            - text: 「周警官。」
              if: know.k_sig_zhiyuan
              then:
                - pause: 1.5
                - { sfx: chair_creak, at: front, dist: near, text: 嘎, src: 椅背 }
                - zhiyuan: ……櫃台跟妳說的？
                - me: 沒有。你的打火機。開了又蓋，一直沒點。
                - { sfx: lighter_lid, at: front, dist: near, text: 叮、喀 }
                - zhiyuan: 在戒。手停不下來。
                - set: c4_zy_named
            - text: （等他先開口）
              then:
                - zhiyuan: 小姐稍等。這份先打完。
      # 他今天本來就有自己的事要辦。
      - { sfx: phone_ring, at: front, dist: near, text: 鈴—— }
      - zhiyuan: 派出所。……阿伯喔。
      - zhiyuan: 機車的理賠單我在打了，今天中午前一定送過去。你腳不方便，不要再跑一趟。
      - zhiyuan: 好啦，好。藥記得吃。
      - { sfx: phone_hangup, at: front, dist: near, text: 喀 }
      - { sfx: typing, at: front, dist: near, text: 噠、噠、噠 }
      - narr: 他把剩下那幾行打完，最後一個鍵按得特別用力。
      - { sfx: fan_hum, at: front, dist: near, gain: 0.5, text: 喀 }
      - narr: 他把電扇轉到最弱。我的頭髮不再一直被吹到臉上。
      - zhiyuan: 什麼事？
      - me: 我姓林。林知夏是我姊。
      - pause: 1.5
      - { sfx: pour_water, at: front-left, dist: mid, text: 嘩—— }
      - { sfx: cup_set, at: front, dist: near, text: 叩, src: 紙杯 }
      - narr: 他沒有接話。一個紙杯推到我手邊，停在指尖前面一點。
      - zhiyuan: 水。
      - me: 我想聽她的案子。
      - pause: 1.5
      - if: flag.c4_zy_named
        then:
          - zhiyuan: ……林知夏。
          - zhiyuan: 難怪妳知道我姓周。當年家屬那邊，是我去講的。
        else:
          - zhiyuan: ……我姓周。
      - zhiyuan: 案子結了。
      - zhiyuan: 意外。家屬當年有簽名。
      - { sfx: chair_creak, at: front, dist: near, text: 嘎, src: 椅背 }
      - narr: 他說完「結了」，整個人往後靠。
      # 關口：他只為「他自己知道的事」開抽屜。家裡的東西、她聽過的停電都打不開；被請出門的那一輪，她在門外聽見抽屜。
      - choice:
          timeout: 20
          options:
            - text: 「你等一下會往右走到最裡面，拉開一個要卡兩次才出得來的抽屜。」
              if: know.lead_c4_drawer
              then:
                - pause: 2
                - { sfx: fan_hum, at: front, dist: near, gain: 0.5, text: 嗡 }
                - pause: 1
                - narr: 電扇轉過來，又轉過去。他一直沒有開口。
                - zhiyuan: ……妳進來過？
                - me: 沒有。我在門外聽的。
                - zhiyuan: 我今天還沒開過那個抽屜。
                - me: 我知道。
                - pause: 1.5
                - { sfx: lighter_lid, at: front, dist: near, text: 叮、喀 }
                - zhiyuan: 妳知道我會開哪一個。那又怎樣？
                - zhiyuan: 那個抽屜放的是我的私人物品，跟這個案子沒有關係。
                - set: c4_zy_drawer
            - text: 「你等一下會去開一個抽屜。很少開的那種，要卡兩次才拉得出來。」
              if: know.lead_c4_drawer_lost && !know.lead_c4_drawer
              then:
                - pause: 2
                - { sfx: fan_hum, at: front, dist: near, gain: 0.5, text: 嗡 }
                - narr: 電扇轉過來，又轉過去。鍵盤聲停在一個字的中間。
                - zhiyuan: ……妳進來過？
                - me: 沒有。我在門外聽的。
                - zhiyuan: 我這裡抽屜十幾個。妳說哪一個？
                - me: 哪一邊我說不出來。卡兩次的那一聲，我記得。
                - pause: 1.5
                - { sfx: lighter_lid, at: front, dist: near, text: 叮、喀 }
                - zhiyuan: 我今天還沒開過那個抽屜。
                - zhiyuan: 妳知道我會開它。那又怎樣？
                - zhiyuan: 那個抽屜放的是我的私人物品，跟這個案子沒有關係。
                - set: c4_zy_drawer
            - text: 「她的錶停在十八點三十一分，筆記本背面也寫滿了。這還叫意外？」
              if: know.k_watch_1831 && know.k_notebook_1831
              then:
                - zhiyuan: 那是妳家的東西。妳摸得到，不代表什麼。
                - me: 那你呢？你到現場的時候，是幾點？
                - pause: 2
                - zhiyuan: ……比那更晚。
            - text: 「她的錶停在十八點三十一分。這還叫意外？」
              if: know.k_watch_1831 && !know.k_notebook_1831
              then:
                - zhiyuan: 那是妳家的東西。妳摸得到，不代表什麼。
                - me: 那你呢？你到現場的時候，是幾點？
                - pause: 2
                - zhiyuan: ……比那更晚。
            - text: 「她的筆記本背面寫滿了十八點三十一分。這還叫意外？」
