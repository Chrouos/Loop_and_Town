            - { sfx: knuckle_knock, at: front, dist: near, text: 叩, src: 桌面 }
            - zhiyuan: ……妳還不走？
      # 第二道：講中抽屜，他還是不給。拿檢舉壓他，他就照程序辦；講出她在門外聽到的那幾秒，他才鬆手。
      - if: flag.c4_zy_drawer
