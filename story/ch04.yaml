                - pause: 3
                - zhiyuan: 五年前那次停電，報告裡有寫。
                - zhiyuan: 沒有對外公開。
                - pause: 1.5
                - zhiyuan: 可是妳講的是妳聽到的。聽到的東西，我沒辦法拿去做什麼。
            - recall:
