# 章節依劇情進度解鎖（docs/superpowers/plans/2026-10-20-loop01-validation-gaps.md G5）
# 每次 00:00 重置時，用剛結束那一輪「玩家取得的內容」判斷下一輪進哪一章；
# 條件沒達成就重玩同一章。只讀玩家知識，不讀作者世界線歷史。
#
# revealed: 該輪交到玩家手上的紀錄或場景 id
# captured: 該輪從這個場景捕捉下來的記憶
# always:   暫定自動推進；用於劇情正典尚未定案的章節
chapters:
  - chapter: 1
    next: 2
    unlock:
      any:
        - revealed: station-bulletin-wakaharu
        - revealed: scene_1831_wakaharu

  - chapter: 2
    next: 3
    unlock:
      any:
        - revealed: station-bulletin-doctor

  - chapter: 3
    next: 4
    unlock:
      any:
        - revealed: station-bulletin-none

  - chapter: 4
    next: 5
    unlock:
      all:
        - captured: loop04_0910_detective_confrontation
        - captured: loop04_1140_seven_records
        - captured: loop04_1310_reporter_confession

  # 第 6 章信件機制、第 7 章部分內容尚未定案（docs/main-story.md），暫時自動推進。
  - chapter: 5
    next: 6
    unlock:
      any:
        - always: true

  - chapter: 6
    next: 7
    unlock:
      any:
        - always: true

  - chapter: 7
    next: final
    unlock:
      any:
        - always: true
