id: protagonist
name: 主角
identity:
  hometown: 灰潮鎮
background:
  summary: 五年前因升學理想離開灰潮鎮，離開前和姊姊林知夏大吵；知夏後來於 18:31 死亡。五年後因地方更新與老屋產權必須處理而已安排返鄉，出發前才收到知夏署名的「不要回來」警告信。
  history:
    - 在灰潮鎮長大，與周予安是高中同學。
    - 小時候非常依賴姊姊，長大後開始討厭所有人都把自己視為「知夏的妹妹」。
    - 知夏死亡前半年逐漸干涉妹妹的返鄉安排；主角去都市念大學前，姊妹因知夏突然反對她回鎮而激烈爭吵。
    - 主角先搭車離鎮去念大學，之後知夏死亡；五年間很少回來。
  current_goal: 依事先約定返鄉整理老家、處理出售與產權，同時釐清出發前收到的「不要回來」究竟是誰寄出的。
  inner_conflict: 想知道真相，但很容易把調查變成證明自己五年前沒有做錯選擇。
personality:
  traits:
    - 觀察細節
    - 對熟悉的人較柔軟
    - 面對姊姊相關話題時容易迴避
    - 一旦認定可以修正錯誤，就容易過度投入
  habits:
    - 緊張時會重複確認日期與時間
    - 習慣先把事情整理好再做判斷
  dislikes:
    - 被替自己下結論
    - 別人用姊姊的名字替她做決定
speech:
  tone: quiet
  calls:
    yuan: 予安
    zhixia: 姊姊
knowledge:
  initial:
    - fact_zhixia_dead_five_years
    - fact_yuan_runs_clock_shop
    - fact_protagonist_returned_to_sell_house
  hidden: []
secrets:
  - 她帶著五年前未能和姊姊和好的遺憾，曾懷疑離開是否讓姊姊孤立無援，但離開本身不是錯誤。
