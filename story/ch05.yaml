  # ─────────────────────────── 20:10 小餐館 ───────────────────────────
  - id: c5_dinner
    time: "20:10"
    place: 老街小餐館
    ambience: [restaurant]
    cast: { yuan: front, old_woman: right, old_man: back-left }
    beats:
      - { sfx: door_open, at: back, dist: near, text: 吱 }
      - narr: 油鍋、碗筷，角落那台電視還是開得太大聲。
      - narr: 同一家店。
      - yuan: 這裡。靠牆，第二張。
      - narr: 同一個位置。
      - { sfx: chair_scrape, at: front, dist: near, text: 嘎 }
      - yuan: 房仲剛走。說下禮拜再來估價。
      - think: 跟上一次一字不差。
      - yuan: 我點兩碗麵。妳的——
      - choice:
          timeout: 6
          default: 1
          options:
            - text: 「不加蔥。」
              then:
                - pause: 1.5
                - yuan: ……我正要說。
            - text: （讓他說完）
              then:
                - yuan: 不加蔥。對吧？
                - narr: 他記得的，還是五年前的我。
      - { old_man: ……明天天氣晴，沿海風浪稍大……, as: 電視, at: back-left }
      - { sfx: cup_set, at: right, dist: mid, text: 叩 }
      - { old_woman: 兩碗麵。小心燙喔。, as: 老闆娘 }
      - narr: 麵的熱氣撲到臉上。
      - pause: 2
      - yuan: 妳今天很怪。
      - pause: 1
      - { yuan: 可是又好像比以前更認識我。, mem: m_c5_know_me }
      - me: 也許我只是記性很好。
      - { yuan: 那妳記得就好。, mem: m_c5_remember }
      - pause: 3
      - narr: 他說得很隨便，像在說麵要趁熱吃。
      - think: 我記得。
      - think: 我記得的，比你以為的多很多。
      - if: "!flag.c5_truth"
        then:
          - choice:
              timeout: 14
              options:
                - text: 「予安。我想跟你說一件你不會信的事。」
                  then:
                    - set: c5_truth
                    - me: 今天我已經過了很多次。每到午夜，就重來一次。
                    - me: 昨天晚上，我們就坐在這裡。你說，如果真的還有明天。
                    - pause: 3
                    - yuan: 我不信。
                    - yuan: 可是妳講的時候，沒有在騙我。
                - text: （把它留在自己這裡）
                  then:
                    - think: 我記得就好。他是這樣說的。
      - if: flag.c5_truth
        then:
          - pause: 2
          - yuan: ……妳今天說的那些。很多次的今天。
          - yuan: 我還是不信。可是我聽完了。
          - yuan: 那我也講一件事。我沒跟任何人講過。
          - pause: 2
          - yuan: 知夏姊走的那天，我在跟我爸吵架。
          - yuan: 他又說，這間店以後就是你的。說得很理所當然。
          - yuan: 我第一次頂回去。我說，我從來沒說我要這間店。
          - pause: 1.5
          - { yuan: 五點五十八分，知夏姊打給我。, learn: k_yuan_1758, mem: m_c5_1758 }
          - yuan: 手機在桌上震。我看到了，沒有接。
          - yuan: 我想說，等一下再回。
          - pause: 2.5
          - yuan: 六點三十一分以後，就沒有等一下了。
          - pause: 3
          - { sfx: spoon_stir, at: front, dist: near, text: 叮 }
          - narr: 他用湯匙撥了一下麵湯，沒有喝。
          - think: 他第一次頂他爸的那天，剛好就是知夏打給他、他沒接的那天。
          - choice:
              timeout: 12
              options:
                - text: 「她打給你，不一定是要你做什麼。」
                  then:
                    - pause: 2
                    - yuan: ……我知道。
                    - yuan: 我只是一直不知道，她要說什麼。
                - text: （把手放在桌上，靠近他的手）
                  then:
                    - narr: 我沒有碰到他，只是把手放在那裡。
                    - pause: 2.5
                    - narr: 過了一會兒，他的指節碰了一下我的。很輕。
                - text: （不說話）
                  then:
                    - pause: 3
                    - narr: 油鍋還在響。電視在講明天的天氣。
      - if: know.k_yuan_went_station
        then:
          - choice:
              timeout: 12
              options:
                - text: 「五年前，你有來車站。」
                  then:
                    - pause: 4
                    - narr: 筷子擱在碗上。他好一陣子沒有出聲，電視在報明天的浪高。
                    - { yuan: ……那班車開得很準時。, mem: m_c5_on_time }
                    - pause: 2
                    - yuan: 灰潮鎮唯一還算準時的東西。
                    - pause: 2
                    - think: 這句話我在月台上聽他講過。
                    - think: 那時候，我以為他只是在開玩笑。
                - text: （把這句話留著）
                  then:
                    - think: 若晴說，他一直站著，站到車開得好遠。
                    - think: 這是他的事。等他哪天自己講。
      - pause: 1.5
      - { cue: tv, at: back-left, text: 沙沙——, sfx: static_burst }
      - yuan: 先吃。冷了就不好吃了。
      - narr: 我們把麵吃完，湯也喝完了。
    threads:
      tv:
        beats:
          - { old_man: ……舊城更新工程，下週進入第二階段……, as: 電視, at: back-left }
          - { old_man: 包括舊車站備援線路，與鐘樓周邊管線……, as: 電視, at: back-left }
          - { old_woman: 吵死了，轉台啦。, as: 老闆娘, at: right }
          - { sfx: static_burst, at: back-left, dist: mid, text: 嘶 }
    next: c5_bell

