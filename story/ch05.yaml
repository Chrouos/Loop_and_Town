              - { yuan: 五點五十八分，知夏姊打給我。, learn: k_yuan_1758, mem: m_c5_1758 }
              - yuan: 手機在桌上震。我看到了，沒有接。
              - yuan: 我想說，等一下再回。
              - pause: 2.5
              - yuan: 六點三十一分以後，就沒有等一下了。
              - heart: slow
              - daze: light
              - narr: 我在桌子底下掐住自己的大拇指，指甲陷進肉裡。
              - narr: 電視還在講，油鍋還在響，全都糊成一片，只剩我自己的心跳，在耳朵裡面咚咚地敲。
              - pause: 3
              - { sfx: spoon_stir, at: front, dist: near, text: 叮 }
              - daze: off
              - narr: 他用湯匙撥了一下麵湯，沒有喝。湯匙碰碗那一聲很清楚，店裡的聲音才跟著回來。
              - choice:
                  timeout: 12
                  options:
                    - text: 「她打給你，不一定是要你做什麼。」
                      then:
                        - pause: 2
                        - yuan: ……我知道。
                        - yuan: 我只是一直不知道，她要說什麼。
                    - text: （把手放在桌上，靠近他的手）
                      then:
                        - narr: 我沒有碰到他，只是把手放在那裡。
                        - pause: 2.5
                        - narr: 過了一會兒，他的指節碰了一下我的。很輕。
                        - tension: -10
                  silence:
                    - pause: 3
                    - { sfx: fry_sizzle, at: right, dist: mid, text: 滋啦—— }
                    - narr: 油鍋還在響。電視在講明天的天氣。
                    - { man: 明天，十月四日，灰潮鎮清晨起有陣雨。, as: 電視裡的氣象主播, at: front-left, dist: far, via: tv }
                    - think: 十月四日。我一次都還沒有過到那一天。
      - if: know.k_yuan_went_station
        then:
          - choice:
              timeout: 12
              default: 1
              options:
                - text: 「五年前，你有來車站。」
                  then:
                    - heart: slow
                    - narr: 話一出口，我的腳在桌子底下往後縮，鞋跟抵住椅子底下的橫桿。
                    - pause: 4
                    - { sfx: chopsticks, at: front, dist: near, text: 叩 }
                    - narr: 筷子擱在碗上。他好一陣子沒有出聲，電視在報明天的浪高。
                    - { yuan: ……那班車開得很準時。, mem: m_c5_on_time }
                    - pause: 2
                    - yuan: 灰潮鎮唯一還算準時的東西。
                    - pause: 2
                    - think: 這句話我在月台上聽他講過。
                - text: （把這句話留著）
                  then:
                    - think: 若晴說，他一直站著，站到車開得好遠。
                    - think: 這是他的事。等他哪天自己講。
      - pause: 1.5
      - { sfx: static_burst, at: back-left, dist: mid, text: 嘶 }
      - heart: off
      - yuan: 先吃。冷了就不好吃了。
      - narr: 我們把麵吃完，湯也喝完了。熱湯一路暖到胃裡。
      - tension: -8
    threads:
      tv:
        beats:
          - { old_man: ……舊城更新工程，下週進入第二階段……, as: 電視, at: back-left, via: tv }
          - { old_man: 包括舊車站備援線路，與鐘樓周邊管線……, as: 電視, at: back-left, via: tv }
          - { old_woman: 吵死了，轉台啦。, as: 老闆娘, at: right }
          - { sfx: static_burst, at: back-left, dist: mid, text: 嘶 }
    next: c5_bell

  # ─────────────────────────── 23:59 鐘聲 ───────────────────────────
  - id: c5_bell
    time: "23:50"
    place: 林家老屋門口
    ambience: [tower_square_night, night_insects]
    cast: { yuan: back-right }
    beats:
      - { sfx: step_uneven, at: back-right, dist: near, text: 咚、叩 }
      - yuan: 到了。門檻在妳腳前面。
      - yuan: 那，明天見。
      - pause: 1.5
      - think: 明天見。
      - { sfx: step_uneven, at: back-right, dist: far, text: 咚……叩…… }
      - narr: 他的腳步往巷口走。我坐在門口的台階上，石頭還有一點白天的溫度。
      - pause: 2.5
      - { sfx: step_uneven, at: back-right, dist: mid, text: 咚、叩 }
      - narr: 巷口那邊的腳步停了，又往回走了兩步。這麼晚，巷子裡沒有別人。
      - choice:
          timeout: 7
          options:
            - text: 「予安？忘了什麼？」
              if: know.k_sig_yuan
              then:
                - pause: 1.5
                - { yuan: ……欸，我走路有那麼好認喔？, at: back-right, dist: mid }
                - me: 你的左腳。
                - pause: 1
                - { yuan: 沒事啦。只是想講，明天早上風大，外套穿厚一點。, at: back-right, dist: mid }
                - me: 好。
                - narr: 我把外套的拉鍊拉到最上面，拉鍊頭碰到下巴，冰的。拉鍊的聲音停了，他的腳步才又往巷口去。
                - { sfx: step_uneven, at: back-right, dist: far, text: 咚……叩…… }
                - set: c5_bell_called
            - text: （握住手杖，不出聲）
              then:
                - narr: 我把手杖拉到膝蓋前面，握住中間那一節，指節壓在接縫上。
                - pause: 2
                - { sfx: step_uneven, at: back-right, dist: far, text: 咚……叩…… }
                - narr: 腳步又轉回去，往巷口走，越來越輕。
      - clock: "23:59"
      - narr: 我叫手機報時。
      - phone: 二十三點五十九分。
      - { sfx: bell_toll, at: front-left, text: 噹——, vib: bell }
      - wait: 3.2
      - { sfx: bell_toll, at: front-left, text: 噹—— }
      - wait: 3.2
      - think: 想到今天，我先想到的是那碗麵，不是六點三十一分。
      - { sfx: bell_toll, at: front-left, text: 噹——, vib: bell }
      - wait: 3.2
      - { sfx: bell_toll, at: front-left, text: 噹—— }
      - wait: 3.2
      - think: 不加蔥。他還記得那一點。
      - { sfx: bell_toll, at: front-left, text: 噹——, vib: bell }
      - wait: 3.2
      - if: know.k_yuan_went_station
        then:
          - think: 他在月台上。站到車開得好遠。
      - { sfx: bell_toll, at: front-left, text: 噹—— }
      - wait: 3.2
      - { sfx: bell_toll, at: front-left, text: 噹——, vib: bell }
      - wait: 3.2
      - think: 等一下醒來，他又會在月台上跟我說好久不見。
      - { sfx: bell_toll, at: front-left, text: 噹—— }
      - wait: 3.2
      - { sfx: bell_toll, at: front-left, text: 噹——, vib: bell }
      - wait: 3.2
      - think: 姊。妳那時候，也是一個人記著這些嗎？
      - { sfx: bell_toll, at: front-left, text: 噹—— }
      - wait: 3.2
      - { sfx: bell_toll, at: front-left, text: 噹——, vib: bell }
      - wait: 3.4
      - { sfx: bell_toll, at: front-left, dist: near, text: 噹———, vib: long }
      - pause: 2
      - { sfx: silence_drop, at: center }
      - pause: 1.5
      - { sfx: heartbeat, at: center, vib: heartbeat }
      - end: reset
