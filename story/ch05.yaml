# 第五章｜只有我記得
# 盲眼主角版。格式見 docs/design.md §11；故事見 docs/story.md §5。
chapter: 5
title: 只有我記得
start: c5_train
# 過章：中午或晚上對他說實話、而且沒有再替他安排行程，他才會講 17:58 那通電話；工具箱要不直接逼問才問得到。
advance:
  - if: know.k_yuan_1758 && know.k_tower_kit
    to: 6

scenes:
  # ─────────────────────────── 06:12 列車 ───────────────────────────
  - id: c5_train
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 鬧鐘。十月三日。六點十二分。
      - if: chloop >= 2
        then:
          - { sfx: cough, at: back-left, dist: mid, text: 咳 }
          - narr: 後座那個人又咳了，咳在同一個地方。他不知道自己咳過幾次，我知道。
          - if: "!know.k_yuan_1758 && know.lead_c5_arranged"
            then:
              - think: 上一次，我跟他說了實話，也替他排好六點到七點。晚上他有一句話到了嘴邊，又吞回去。
          - if: "!know.k_yuan_1758 && know.lead_c5_unsaid && !know.lead_c5_arranged"
            then:
              - think: 上一次吃麵，他的筷子停過一次。他有話沒講，我也是。
              - think: 我還叫他六點到七點待在店裡。他答應得太快了。
          - if: "!know.k_tower_kit && know.lead_c5_kit"
            then:
              - think: 他說那個工具箱丟了。斷掉的錶帶他都捨不得丟。
          - think: 今天，我只想好好跟他吃一頓飯。
        else:
          - narr: 我醒來的時候，手心還是熱的。
          - think: 昨晚他幫我點的麵，不加蔥。
          - think: 我們在老家門口分開。他的腳步往巷口走，左腳比右腳重一點。
          - pause: 2
          - if: know.k_yuan_tomorrow
            then:
              - think: 有一個晚上，他說，如果真的還有明天。
              - pause: 1.5
          - think: 對我來說，那是幾分鐘前的事。
          - think: 在他那邊，那碗麵根本沒有吃過。
          - { sfx: cough, at: back-left, dist: mid, text: 咳 }
          - narr: 後面有人咳嗽，跟每一次同一個時候。
          - { think: 這個鎮上，只有我記得昨天。, mem: m_c5_only_yesterday }
      - { sfx: station_chime, at: front, dist: far, text: 叮咚—— }
      - { announcer: 下一站，灰潮鎮。, as: 廣播, via: speaker }
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 我把手杖一節一節卡好。
      - { sfx: train_brake, at: front, dist: mid, text: 嘰—— }
    next: c5_platform

  # ─────────────────────────── 07:40 月台 ───────────────────────────
  - id: c5_platform
    time: "07:40"
    place: 灰潮鎮站
    ambience: [platform]
    cast: { yuan: front-right }
    beats:
      - { sfx: train_door, at: right, dist: near, text: 嘶——喀 }
      - narr: 月台的風從背後推過來。
      - { sfx: step_uneven, at: front-right, dist: mid, text: 咚、叩 }
      - if: know.k_sig_yuan
        then:
          - narr: 左腳比右腳重一點。是他。
        else:
          - narr: 有腳步聲停在我前面，一重一輕。
      - if: chloop >= 2
        then:
          - yuan: 比我想的早。
          - pause: 1.5
          - yuan: ……好久不見。
          - narr: 我握住他的手肘。機油和黃銅，跟昨晚一樣。
        else:
          - choice:
              timeout: 6
              default: 1
              options:
                - text: 「予安。」
                  if: know.k_sig_yuan
                  then:
                    - pause: 1.5
                    - narr: 腳步停住了。
                    - yuan: ……妳聽得出來喔？
                    - pause: 1.5
                    - yuan: 好久不見。
                    - set: c5_named_him
                - text: （等他先開口）
                  then:
                    - yuan: 比我想的早。
                    - pause: 2.5
                    - narr: 我沒有接「車沒誤點」。那段對話就斷在那裡。
                    - pause: 1
                    - yuan: ……好久不見。
          - pause: 2
          - think: 好久不見。
          - think: 他說得很自然。五年沒見的人，本來就該這樣說。
          - { think: 昨天晚上他送我走到門口。那段路，他自己沒走過。, mem: m_c5_only_me }
          - { sfx: rail_clack, at: back-right, dist: mid, to: back-left:far, text: 轟隆…… }
          - narr: 列車開走的轟隆聲變得好悶，像有人把我的頭按進一缸溫水裡。
          - yuan: 請扶著我的左手肘。前面有階梯。
          - narr: 我握住他的手肘，握得太緊，他的袖子在我指縫裡皺成一團。
          - narr: 機油和黃銅，跟昨晚一模一樣。
    next: c5_house

  # ─────────────────────────── 08:10 老家 ───────────────────────────
  - id: c5_house
    time: "08:10"
    place: 林家老屋
    ambience: [old_house]
    cast: { yuan: front }
    beats:
      - { sfx: key_jingle, at: front, dist: near, text: 鏘啷 }
      - { sfx: lock_turn, at: front, dist: near, text: 喀—— }
      - narr: 鑰匙轉到一半，卡住了。前幾次也是這樣，他每次都得連著門一起頂。
      - yuan: 卡住了。妳退後一點——
      - if: know.k_spare_key
        then:
          - choice:
              timeout: 8
              default: 1
              options:
                - text: （走到門口第三個花盆）
                  then:
                    - { sfx: cane_tap, at: right, dist: near, text: 叩 }
                    - narr: 一、二、三。陶土的邊緣有一個缺口。
                    - narr: 我把它抬起來一點。底下的泥土是濕的。
                    - { sfx: key_jingle, at: right, dist: near, text: 叮 }
                    - narr: 一把鑰匙，生鏽了，齒還在。
                    - { sfx: lock_turn, at: front, dist: near, text: 喀啦 }
                    - { sfx: door_creak, at: front, dist: near, text: 吱呀 }
                    - narr: 這一把轉得過去。門開了。
                    - pause: 2.5
                    - yuan: ……妳怎麼知道在那？
                    - narr: 鑰匙還插在鎖孔裡，我的手指扣著它，沒有放開。
                    - me: 猜的。
                    - pause: 1.5
                    - yuan: 那是我爸放的。我以為只有我知道。
                    - think: 你告訴過我。在老街，那台貨車擦過去之後。
                    - think: 今天的你，還沒跟我講過。
                    - set: c5_key
                - text: （讓他用肩膀頂開）
                  then:
                    - { sfx: door_creak, at: front, dist: near, text: 碰——吱呀 }
                    - narr: 門碰一聲鬆開，跟每一次一樣。
                    - think: 第三個花盆底下有鑰匙，我沒講。
                    - think: 那是另一個十月三日的他告訴我的。
        else:
          - { sfx: door_creak, at: front, dist: near, text: 碰——吱呀 }
          - narr: 他用肩膀頂了一下，門鬆開了。
          - think: 每一次，這扇門都要他這樣頂開。
      - narr: 灰塵和舊木頭的味道底下，還有一點很淡的洗髮精。
      - { sfx: phone_buzz, at: front-right, dist: near, text: 嗡、嗡 }
      - yuan: ……房仲。問我今晚八點，方不方便看店。
      - yuan: 我得回店裡一趟。妳……要一起來嗎？
      - me: 好。
    next: c5_shop

  # ─────────────────────────── 09:20 鐘錶店 ───────────────────────────
  - id: c5_shop
    time: "09:20"
    place: 周家鐘錶店
    ambience: [clock_shop]
    cast: { yuan: front }
    threads:
      oldclock:
        beats:
          - narr: 左後方那座小鐘，自己響了一下。不是整點。
          - { yuan: 那個不用管。我爸修了一輩子都修不好。, at: front }
          - { yuan: 他也不准我丟。, at: front }
          - narr: 它敲完那一下，又回去走它自己的。
    beats:
      - { sfx: shop_bell, at: back, dist: near, text: 叮鈴 }
      - narr: 滿屋子的滴答，沒有一個對得上。
      - narr: 我已經分得出幾個。左邊那座慢半拍，後面那座有點啞。
      - yuan: 後面有椅子。冰箱有茶。
      - if: know.k_tower_kit && know.k_slate_in_shop
        then:
          - { sfx: drawer, at: front, dist: mid, text: 喀啦 }
          - narr: 我坐在後面，聽他整理櫃子。鐵盒、斷掉的錶帶、十幾年前的收據，他說都要清掉，又一樣一樣放回去。
          - me: 最下層那裡，以前放一個工具箱吧。
          - pause: 1.5
          - yuan: ……妳摸得出來喔。
          - think: 箱子去了哪裡，他在另一個今天跟我講過。點字板也還在櫃台底下。今天不用再問他一次。
          - goto: c5_noon
      - think: 待過這間店的人，大概都聽過這兩句。
      - yuan: 我先整理櫃子。房仲說要拍照。
      - { sfx: drawer, at: front, dist: near, text: 喀啦 }
      - yuan: 這些都要清掉啦。我爸的東西太多了。
      - me: 我可以摸嗎？
      - yuan: ……可以。小心，有些很利。
      - { sfx: box_open, at: front, dist: near, text: 喀 }
      - narr: 一個鐵盒，裡面塞了好幾條皮錶帶，每一條都斷成兩截。
      - narr: 一個錶盤，摸起來很光滑，中間一個小孔，指針不見了。
      - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
      - narr: 一疊紙，邊角軟得像布。
      - yuan: 收據啦。十幾年前客人修錶的。
      - me: 都要清掉？
      - yuan: 都要。
      - pause: 2
      - { sfx: box_close, at: front, dist: near, text: 喀 }
      - narr: 他把盒子蓋上，放回原本的位置。
      - { think: 都要清掉。他說完，又把它們放回去了。, mem: m_c5_put_back }
      - pause: 1.5
      - narr: 櫃台底下還有一個淺抽屜。我拉開它。
      - { sfx: drawer, at: front, dist: near, text: 喀 }
      - narr: 指尖先碰到一塊扁平的板子。金屬框，框上一排一排的小方格。
      - narr: 旁邊有一支短短的筆，圓圓的木頭握把，尖端是鈍的。
      - if: know.k_slate_in_shop
        then:
          - narr: 點字板和點字筆。在另一個今天，它們也在這裡。
        else:
          - { narr: 點字板和點字筆。我包包裡那組，就是這一種。, learn: k_slate_in_shop }
      - narr: 我的指尖卡在第一排方格裡，停在那裡，有一點抖。
      - me: 這是點字板。
      - { sfx: tools_clink, at: front, dist: near, text: 叮 }
      - pause: 1.5
      - yuan: 客人寄修的。
      - think: 我摸過鉸鏈，還有定位紙張的扣子，都好好的。
      - { sfx: drawer, at: front, dist: near, text: 喀 }
      - narr: 我把筆放回板子旁邊，照原來的方向，把抽屜推回去。
      - pause: 1
      - narr: 我的手順著櫃子往下。最下層有一塊地方，灰比較薄。
      - narr: 方方正正的。像有東西在這裡放了很多年，最近才被拿走。
      - me: 這裡以前放什麼？
      - pause: 1.5
      - yuan: ……一個工具箱。
      - yuan: 可能以前整理的時候丟了。
      - think: 斷掉的錶帶、沒有指針的錶盤、十幾年前的收據，他都留著。
      - if: know.lead_c5_kit
        then:
          - think: 上一次我直接問那是什麼箱子，他就說丟了，之後一個字都不多講。
      # 關口：直接問，他就把話收回去；點破他捨不得丟，或者等他，他才會自己講。
      - choice:
          options:
            - text: 「斷掉的錶帶，你都沒丟。」
              then:
                - pause: 2
                - yuan: ……那不一樣。
                - pause: 1
                - yuan: 好啦。不是丟了。
                - set: c5_kit_open
            - text: 「丟了？什麼樣的工具箱？丟去哪裡了？」
              then:
                - yuan: 綠色的，鐵的，很重。
                - yuan: 不是修錶用的那種。
                - pause: 1.5
                - yuan: 可能以前整理的時候丟了啦。
                - { sfx: drawer, at: front, dist: near, text: 喀啦 }
                - narr: 他背過身去拉抽屜。我知道我問得太快了，手指在膝蓋上摳著褲子的縫線。
                - tension: 8
            - text: （不問，等他）
              then:
                - pause: 3.5
                - { sfx: tools_clink, at: front, dist: near, text: 叮 }
                - narr: 他把一支小螺絲起子放回去，又拿起來。
                - yuan: ……其實不是丟了。
                - set: c5_kit_open
      - if: "!flag.c5_kit_open"
        then:
          - { sfx: tools_clink, at: front, dist: near, text: 叮 }
          - narr: 一支小螺絲起子在桌上滾了半圈。他把它按住，沒有再講。
          - { think: 斷掉的錶帶他都留著。說丟了，是不想講。, learn: lead_c5_kit }
          - { cue: oldclock, at: back-left, text: 噹……, sfx: clock_chime }
          - pause: 2
          - goto: c5_noon
      - yuan: 那是我爸保養鐘樓用的。那座大鐘，以前是他在顧。
      - yuan: 上油、換齒輪、對時間，每個月爬上去一次。
      - yuan: 鐘拆了以後，那箱就一直放在這裡。
      - yuan: 今年春天，更新工程的人來借。
      - { yuan: 說要找舊線路的接頭。鐘樓以前的線。, learn: k_tower_kit, mem: m_c5_tower_kit }
      - yuan: 說用完就還，到現在也沒還。
      - pause: 2
      - think: 鐘樓的舊線路。
      - think: 午夜那十二聲，每一次都是從鐘樓那個方向來的。
      - narr: 我的手還停在那塊薄灰的方框上，沿著邊來回摸，摸到第三圈才發現自己在摸。
      - yuan: 我爸要是知道我借給人家，一定會唸我。
      - { cue: oldclock, at: back-left, text: 噹……, sfx: clock_chime }
      - yuan: 妳怎麼知道那裡少了東西？
      - me: 灰塵。
      - yuan: ……妳摸得出灰塵的形狀？
      - me: 嗯。
      - { sfx: tools_clink, at: front, dist: near, text: 叮 }
      - narr: 他沒有再問。螺絲起子在桌上滾了半圈，停住。
    next: c5_noon

  # ─────────────────────────── 12:30 後面的小房間 ───────────────────────────
  - id: c5_noon
    time: "12:30"
    place: 周家鐘錶店，後面的小房間
    ambience: [clock_shop]
    cast: { yuan: front }
    beats:
      - { sfx: cup_set, at: front, dist: near, text: 叩 }
      - yuan: 茶。冰的。
      # 重過：她記得杯子在哪、記得五點五十八分，可是他今天還沒聽過實話。要不要講，還是要她自己開口。
      - if: know.k_yuan_1758
        then:
          - { sfx: glass_clink, at: front-left, dist: near, text: 喀啷, src: 冰塊 }
          - narr: 冰塊在左前方響。我伸手過去，一次就碰到杯壁。
          - yuan: 妳知道櫃子少了一個箱子，杯子放哪也不用我講。
          - yuan: 妳到底從哪裡知道這些？
          - think: 這個問題，他每一次都會問。五點五十八分那通電話，他跟我說過了，只是他不記得。
          - choice:
              timeout: 18
              options:
                - text: 「如果我說，今天我已經過了很多次呢？」
                  then:
                    - set: [c5_truth, c5_noon_truth]
                    - me: 每一次都是十月三日，到了午夜就重來。你每次都在月台等我。
                    - pause: 2
                    - yuan: 我不信。
                    - yuan: 可是妳說。我聽。
                    - narr: 這一次我講得比較短，挑他聽得進去的講。他還是一次都沒有打斷。
                    - yuan: ……妳講的時候，沒有在騙我。這個我聽得出來。
                    - { yuan: 那妳現在跟我講話，是在跟今天的我講，還是在跟妳記得的那個我講？, mem: m_c5_which_me }
                    - think: 這個問題，我每一次都答不好。
                    - tension: -8
                - text: 「我姊以前跟我說過很多你的事。」
                  then:
                    - set: c5_evaded
                    - yuan: 知夏姊？
                    - pause: 1.5
                    - yuan: ……算了。
                    - { sfx: cup_scrape, at: front, dist: near, text: 嘎 }
                    - narr: 我把冰茶杯轉了半圈，杯底在桌上刮出一聲，刮得我自己牙酸。
                    - think: 我拿一個死掉的人來擋，還擋得很爛。
                    - tension: 8
              silence:
                - pause: 3
                - yuan: ……好。
                - yuan: 我不問。
                - { sfx: glass_clink, at: front-left, dist: near, text: 喀啷, src: 冰塊 }
                - { sfx: drawer, at: front, dist: mid, text: 喀啦 }
                - narr: 冰塊在杯子裡塌了一角。他起身去前面，抽屜拉開又關上。
          - pause: 1.5
          - yuan: 下午我要去拿零件。妳要喝咖啡的話，我帶妳過去。
          - goto: c5_cafe
      - narr: 杯子放在我前面，左邊還是右邊他沒說。我沒有伸手，先等冰塊自己響。
      - locate:
          sfx: glass_clink
          at: front-left
          decoys: [{ sfx: tools_clink, at: right }]
          tries: 1
          exact: true
          timeout: 14
          prompt: 冰塊在哪裡響？
          success:
            - narr: 指尖碰到杯壁，冰的，外面結了一層水珠。我把杯子拉到自己面前。
            - { sfx: cloth_rustle, at: front, dist: near, text: 窸 }
            - narr: 對面有一隻手縮回去，袖口擦過桌面。他本來要把杯子推過來。
            - yuan: ……妳找得到。
            - me: 冰塊會響。
          fail:
            - { sfx: glass_clink, at: front-left, dist: near, text: 匡, shake: light }
            - narr: 手背掃到杯子，杯子倒了。冰塊在桌上滾，茶沿著桌面流到我的褲子上，冷得我整個人一縮。
            - yuan: 別動、別動。
            - { sfx: cloth_rustle, at: front-left, dist: near, text: 窸窣 }
            - narr: 他拿抹布從我手邊擦過去，擦得很快，一句都沒有怪我。
            - yuan: 左前面。我應該先講的。
            - { sfx: glass_clink, at: front-left, dist: near, text: 叮 }
            - narr: 新倒的那杯，他放好以後把我的手拉過去，讓指尖碰到杯壁才放開。
      - if: know.k_yuan_no_sugar
        then:
          - me: 你自己的咖啡，也不加糖。
          - pause: 2
