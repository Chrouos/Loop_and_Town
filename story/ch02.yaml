                - { sfx: strap_click, at: front, dist: near, text: 喀！ }
                - ruoqing: 我會去。這是我自己的事。
                - tension: 10
                - set: ruoqing_goes
            - text: 「知夏一定也不希望——」
              then:
                - learn: c2_pushed
