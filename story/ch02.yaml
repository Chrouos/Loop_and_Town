chapter: 2
title: 活下來的人
start: c2_train
advance:
  - if: flag.c2_ruoqing_safe && know.k_boxun_died
    to: 3
scenes:
  # ─────────────────────────────────────────── 06:12
  - id: c2_train
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - if: chloop < 2 && !know.k_c2_ruoqing_died_again
        then:
          # 第一次在同一個早上醒來：她不知道這叫重來，只知道若晴還活著。
          - phone: 鬧鐘。十月三日；六點十二分。
          - heart: fast
          - { sfx: rail_clack, at: back, dist: near, text: 喀噠、喀噠 }
          - narr: 我整個人彈起來，背撞上椅背。手杖從膝蓋上滑下去，在地板上滾了半圈。
          - think: 十月三日？
          - narr: 我按住側鍵，按到指甲陷進指腹裡。
          - phone: 十月三日；六點十二分。
          - narr: 鐘樓敲了十二下，我坐在家門口一聲一聲數完。然後就是這班車，鐵軌的接縫一節一節敲上來，敲進鞋底。
          - { sfx: cough, at: back-left, dist: mid, text: 咳 }
          - narr: 走道另一邊有人在剝橘子，酸味飄過來。後面那個人咳了一聲，咳在我記得的那個地方。
          - think: 若晴。
          - { think: 若晴！, shake: light }
          - think: 她還活著。現在才六點多，她還沒出門，什麼事都還沒發生。
          - think: 晚上她不能去車站。不能讓她去。
          - tension: 8
          - { sfx: breath, at: center, dist: near, text: 呼、呼 }
          - narr: 我彎下去摸手杖，摸到了又抓不穩，喘得跟跑過步一樣。
          - think: 她幾點出門？五點多，六點到大廳，十八點三十一分。還有十二個小時，十二個小時夠不夠？
          - me: 打給若晴。
          - phone: 找不到聯絡人「若晴」。
          - narr: 我拿手機的邊角往自己大腿上敲，敲了兩下，骨頭都痛了才停。
          - think: 她在我面前講過那麼多話，我連一串號碼都沒有記在腦子裡。
          - pause: 1
          - think: 就算找到她，我要怎麼講？說我聽過她死在舊車站？
          - think: 她今天根本還沒見過我。一個剛下車的陌生人叫她晚上不要去車站，換成是我，我也不會信。
          - { sfx: train_horn, at: front, dist: far, text: 嗚—— }
        else:
          - phone: 鬧鐘。六點十二分。
          - { sfx: rail_clack, at: back, dist: near, text: 喀噠、喀噠 }
          - narr: 鐵軌的接縫一節一節敲上來，敲進鞋底。
          - { sfx: train_horn, at: front, dist: far, text: 嗚—— }
      - if: know.k_c2_ruoqing_died_again
        then:
          # 第二次是累，第三次以後是麻：同一個早上，身體一次比一次慢。
          - if: chloop >= 3
            then:
              - narr: 手機震到第三下，我才伸手按掉。手指很重，好像是別人的手。
            else:
              - narr: 這次我沒有彈起來。手機在口袋裡震，我先聽它震完，才把手伸進去。
          - if: know.k_c2_never_asked
            then:
              - think: 又是六點十二分。叫她不要去、跟進大廳、抓住她的手，全都試過了。
              - think: 她在大廳裡問我到底知道什麼。我知道她倒在哪一面牆下，卻不知道她為什麼非今天去不可。
            else:
              - if: know.k_c2_pushed
                then:
                  - think: 又是六點十二分。嚇她、叫她不要去，我都試過了。她還是去了。
                else:
                  - think: 又是六點十二分。我什麼都沒擋住，她還是去了。
          - pause: 1.5
          - if: know.lead_c2_notice
            then:
              - think: 她出門前，手機又震了一次。那個通知，她一直沒有回。
          - if: know.k_c2_never_asked
            then:
              - think: 每一次我開口都是叫她不要去。這次先問她。
            else:
              - think: 這次讓她把話講完。
          - { sfx: breath, at: center, dist: near, text: 呼…… }
          - if: chloop >= 3
            then:
              - narr: 我把手杖橫在腿上。吸氣、吐氣，跟後面那個人的咳嗽一樣準時，一樣不用想。
            else:
              - narr: 我把手杖橫在腿上，一口氣吐到底，再慢慢吸回來。
          - tension: -8
        else:
          - if: chloop >= 2
            then:
              - think: 又是六點十二分。後面那個人等一下會咳嗽，走道那邊有人在剝橘子。
              - narr: 我把手杖橫在腿上，等廣播。手臂沉沉的，像昨天那一整天都還壓在上面。
      - { sfx: station_chime, at: front, dist: far, text: 叮咚—— }
      - { announcer: 下一站，灰潮鎮。, as: 廣播, via: speaker }
      - if: chloop < 2 && !know.k_c2_ruoqing_died_again
        then:
          - { sfx: cane_tap, at: front, dist: near, text: 叩、叩 }
          - narr: 車還沒停，我已經擠到車門前面。手杖一節一節卡上去，卡錯一節，拔出來重卡。
          - think: 咖啡店。她在咖啡店上班，中午一定在那裡。先找到她，其他的再說。
      - narr: 外套口袋裡的信還在。我用指腹壓過那一行凸點，每一顆都在原來的位置。
      - think: 一封叫我不要回來的信，又被我帶回來了。
      - if: "!know.k_watch_1831 || !know.k_notebook_1831 || !know.k_photo_tingan"
        then:
          - think: 姊姊桌上那幾樣東西，我也還沒弄清楚。
      - if: know.k_in_station_hall && !know.k_cabinet_warm
        then:
          - think: 那天在舊站大廳，東牆那邊有個東西一直在嗡。她大概就倒在那面牆腳，那是什麼，我到最後都沒摸到。
      - { sfx: train_brake, at: front, dist: mid, text: 嘰—— }
    next: c2_arrival

  # ─────────────────────────────────────────── 07:40
  - id: c2_arrival
    time: "07:40"
    place: 灰潮鎮站
    ambience: [platform]
    cast: { yuan: front-right }
    beats:
      - { sfx: train_door, at: left, dist: near, text: 嘶——喀 }
      - narr: 月台的風從背後推過來，帶著一點鹹味。
      - { sfx: step_uneven, at: front-right, dist: mid, text: 咚、叩 }
      - { think: 左腳落地比右腳重。是予安。, learn: k_sig_yuan }
      - yuan: 比我想的早。
      - if: chloop >= 3
        then:
          - narr: 他講完，我的嘴巴自己就接上下一句。接完了，我才發現自己講過了。
      - if: chloop == 2
        then:
          - narr: 同一句話，同一個換氣的地方。我讓它從旁邊過去，像讓一班不搭的車進站。
      - if: chloop < 2
        then:
          - narr: 一個字都沒變，連「早」字後面那口氣，都換在同一個地方。我的後頸一陣發麻。
      - me: 車沒誤點。
      - yuan: 灰潮鎮唯一還算準時的東西。
      - if: chloop >= 2
        then:
          - think: 他接下來會說什麼，我都知道。我把那些話轉小聲，當成隔壁房間的收音機。
        else:
          - me: 予安，你有若晴的電話嗎？
          - yuan: 若晴？咖啡店那個若晴？
          - yuan: 妳怎麼會認識她？
          - narr: 我張開嘴，才發現這題我答不出來。對他來說，我五分鐘前才下車。
          - me: ……你有沒有？
          - yuan: 沒有欸。她今天好像有班，十一點以後去店裡找比較快。
          - think: 十一點。還要三個多小時。
      - move: { yuan: right }
      - yuan: 我的左手肘，在妳的右手邊。
      - narr: 他袖口那股機油和黃銅的味道，沾到我的手心上。
      - if: chloop < 2
        then:
          - narr: 我抓住他的手肘就往前走。走得太快，他一重一輕的腳步被我拖得亂了拍子。
          - yuan: 妳慢一點，前面有階梯。
      - { sfx: construction_drill, at: left, dist: far, text: 嗡嗡嗡 }
      - if: chloop >= 2
        then:
          - think: 八點鐘樓不會響。我不用站在廣場上等它。
    next: c2_house

  # ─────────────────────────────────────────── 08:10
  - id: c2_house
    time: "08:10"
    place: 林家老屋
    ambience: [old_house]
    cast: { yuan: front }
    beats:
      - if: chloop >= 2
        then:
          - { sfx: thud, at: front, dist: near, text: 咚, vib: tap }
          - narr: 門還是卡著，他還是用肩膀撞同一塊門框。灰塵跟舊木頭的味道先撲上來。
          - if: "!know.k_yuan_realtor"
            then:
              - { sfx: phone_notify, at: front, dist: near, text: 叮咚 }
              - { yuan: 房仲。問我今天晚上八點可不可以。, learn: k_yuan_realtor }
        else:
          - { sfx: door_creak, at: front, dist: near, text: 吱—— }
          - yuan: 卡住了。妳退後一點。
          - { sfx: thud, at: front, dist: near, text: 咚, vib: tap }
          - narr: 他用肩膀撞了一下，門框吱一聲鬆開。他撞的是跟那天同一個位置。
          - narr: 屋裡是灰塵和舊木頭的味道。
          - { sfx: phone_notify, at: front, dist: near, text: 叮咚 }
          - { yuan: 房仲。問我今天晚上八點可不可以。, learn: k_yuan_realtor }
          - think: 今晚八點，他要跟房仲談店的事。
          - { sfx: door_creak, at: right, dist: mid, text: 喀啦 }
          - { sfx: wind_gust, at: right, text: 颯 }
          - narr: 他去把窗戶一扇一扇推開，右邊先灌進來一陣風。
      - { sfx: watch_tick, at: front, dist: near, text: 滴答滴答 }
      - narr: 他外套口袋裡有一只錶在走，走得比屋裡任何東西都急。
      - if: chloop < 2
        then:
          - me: 你身上帶著錶？
          - yuan: 客人的。送來的時候秒針會卡住，我昨天晚上修好了，中午順便拿去還。
          - yuan: 它卡過好幾次。我想說先帶在身上聽一下，確定沒有別的問題，再還給客人比較保險。
          - think: 予安他爸以前也是這樣。修好的錶一定先戴在自己手上走一整天，客人來催也不肯先還。
      - if: "!know.k_watch_1831 || !know.k_photo_tingan"
        then:
          - me: 予安，你先幫我看一下我姊桌上的東西。
          - { sfx: step_uneven, at: front, dist: mid, text: 咚、叩 }
          - if: "!know.k_watch_1831"
            then:
              - me: 那只錶，現在幾點？
              - yuan: 沒在走了。
              - { yuan: 停在六點三十一分。, learn: k_watch_1831, mem: m_watch }
          - if: "!know.k_photo_tingan"
            then:
              - me: 相框裡那張，我姊旁邊站的是誰？
              - { yuan: 一個短頭髮的女生，揹著很大的包包。, learn: k_photo_tingan, mem: m_photo }
              - yuan: 我不認得她。
          - yuan: 怎麼突然要看這些？
          - me: 我沒辦法解釋。你先念給我聽。
      - if: chloop < 2
        then:
          - narr: 我在客廳裡走來走去，小腿撞到茶几兩次，第二次撞在同一個地方。
          - narr: 我按側鍵。
          - phone: 八點二十二分。
          - think: 才過十二分鐘。
      - think: 今天怎麼過，現在就得決定。
      - choice:
          options:
            - text: 「你今天可以整天陪我嗎？」
              then:
                - yuan: 整天喔？
                - me: 帶路，幫我念東西，順便跑腿。
                - yuan: 好的。我是說，好啊。
                - yuan: 店裡今天也沒什麼客人。
                - narr: 他把口袋裡那只錶拿出來，貼到耳朵旁邊聽了一下，又放回去。
                - yuan: 錶我順路拿去還就好。
                - narr: 我握手杖的手鬆開一點，指節發痠，才知道剛剛握得多緊。
                - tension: -6
                - set: c2_yuan_with_me
            - text: 「你去忙你的，我自己可以。」
              then:
                - yuan: 妳確定？
                - me: 這條路我從小走到大，它又沒有搬家。
                - yuan: 那有事打給我。號碼沒換。
                - { sfx: step_uneven, at: back, dist: mid, text: 咚、叩 }
                - { sfx: door_close, at: back, dist: far, text: 碰 }
      - think: 若晴今天在咖啡店上班。
    next: c2_cafe

  # ─────────────────────────────────────────── 11:30
  - id: c2_cafe
    time: "11:30"
    place: 老街咖啡店
    ambience: [cafe]
    cast: { ruoqing: front, yuan: right, old_woman: back-left }
    threads:
      manager:
        beats:
          - { old_woman: 對啦，下禮拜的班我再排排看……, as: 店長 }
          - { old_woman: 若晴喔？她最近在弄那個外地的什麼課。, as: 店長 }
          - { old_woman: 報名好像就這兩天啦。, as: 店長 }
          - { old_woman: 她不講，我也不好意思問。, as: 店長 }
          - { sfx: phone_hangup, at: back-left, dist: mid, text: 嘟 }
    beats:
      - { sfx: shop_bell, at: back, dist: near, text: 叮鈴 }
      - if: chloop >= 2
        then:
          - { sfx: coffee_grind, at: front-right, dist: mid, text: 嘎啦嘎啦 }
          - if: chloop >= 3
            then:
              - narr: 磨豆機、蒸汽管、水槽裡的杯子，我沒有一個一個去聽。它們的順序我閉著耳朵都知道。
            else:
              - narr: 烘豆子的焦香、右邊嘶嘶叫的蒸汽管，連水槽裡杯子撞在一起的順序都跟上次一樣。
        else:
          - { sfx: steam_hiss, at: right, dist: mid, text: 嘶—— }
          - { sfx: glass_clink, at: front-right, dist: mid, text: 叮、叮 }
          - narr: 店裡是烘豆子的焦香，右邊的蒸汽管嘶嘶叫，水槽裡的杯子互相撞來撞去。
          - { sfx: coffee_grind, at: front-right, dist: mid, text: 嘎啦嘎啦 }
      - { sfx: strap_click, at: front, dist: mid, text: 喀 }
      - if: flag.c2_yuan_with_me
        then:
          - ruoqing: 欸，予安哥？兩位喔？
          - { yuan: 兩位。兩杯黑的，不加糖。, learn: k_yuan_no_sugar }
        else:
          - ruoqing: 歡迎光臨，一位嗎？
          - me: 一位。
          - if: chloop < 2
            then:
              - ruoqing: 欸要不要我念菜單給妳聽？
          - me: 不用，黑咖啡就好。
      - if: chloop >= 2
        then:
          - { sfx: cup_set, at: front, dist: near, text: 叩 }
          - { sfx: phone_buzz, at: front-right, dist: mid, text: 嗡 }
          - { ruoqing: 媽，藥在電鍋旁邊那個袋子，紅色的是晚上的啦。……好啦，我在上班。, at: front-right }
          - move: { ruoqing: left }
          - { sfx: chair_scrape, at: left, dist: near, text: 嘎 }
          - narr: 她掛了電話，在我左手邊那張桌子坐下來，攤開那疊紙。這次我不等她發現我在聽。
          - me: 妳在整理什麼？
        else:
          - if: know.k_in_station_hall
            then:
              - think: 我最後一次聽到這個聲音，是在舊車站的大廳裡。
            else:
              - think: 我在這家店聽過這個聲音。那天晚上，她就死了。
          - daze: light
          - narr: 磨豆機和蒸汽管退到很遠，耳朵裡只剩她剛剛講的那幾個字，一直繞。
          - narr: 我用拇指去數手杖上那圈防滑紋，數到第七道，蒸汽管的嘶聲才回來。
          - daze: off
          - { sfx: steam_hiss, at: right, dist: mid, text: 嘶—— }
          - { sfx: cup_set, at: front, dist: near, text: 叩 }
          - if: know.k_ruoqing_skips_lunch
            then:
              - think: 再過一下，店長就要去送貨了。她會一個人顧到下午，一口東西都沒吃。
              - me: 中午記得先吃飯。
              - ruoqing: 蛤？
              - { sfx: laugh_soft, at: front, dist: near, text: 呵 }
              - ruoqing: 欸妳講話怎麼跟我媽一樣。
          - think: 現在就講。叫她今天晚上不要去車站。
          - think: 可是她會信嗎？我連為什麼都講不出來。
          - { sfx: phone_buzz, at: front-right, dist: mid, text: 嗡 }
          - narr: 我才吸了一口氣，她的手機就響了。她走回櫃台去接，壓低聲音講了幾句。
          - { ruoqing: 媽，藥在電鍋旁邊那個袋子，紅色的是晚上的啦。……好啦，我在上班。, at: front-right }
          - move: { ruoqing: left }
          - { sfx: chair_scrape, at: left, dist: near, text: 嘎 }
          - narr: 她掛了電話，沒有回櫃台，在我左手邊那張桌子坐下來，攤開一疊紙。
          - { sfx: paper_rustle, at: left, dist: near, text: 沙、沙 }
          - narr: 紙一張一張翻過去。翻到某幾張的時候，她的呼吸會跟著慢下來。
          - { sfx: strap_click, at: left, dist: near, text: 喀 }
          - pause: 2
          - ruoqing: 欸……那個。
          - ruoqing: 妳一直朝我這邊耶。
          - { ruoqing: 好像在聽我呼吸。, mem: m_c2_breath }
          - narr: 被抓到了。耳根一下子燒起來，我的食指在杯緣上繞了一圈又一圈。
          - choice:
              timeout: 10
              default: 2
              options:
                - text: 「抱歉。看不到，只好用聽的。」
                  then:
                    - { sfx: laugh_soft, at: left, dist: near, text: 呵 }
                    - ruoqing: 蛤？好啦，那妳聽。
                - text: 「我在聽妳翻紙。妳在整理什麼？」
                  then:
                    - ruoqing: 啊，很吵喔？
                    - me: 不會。
                - text: （把臉轉開）
                  then:
                    - ruoqing: 沒關係啦，是我自己不習慣被人家聽。
      - ruoqing: 我在整理照片啦，自己拍的。
      - choice:
          options:
            - text: 「可以說給我聽嗎？」
              then:
                - set: c2_heard_photos
                - ruoqing: 說給妳聽喔？
                - ruoqing: 好啊，我試試看。這張是早上的商店街，一家都還沒開。
