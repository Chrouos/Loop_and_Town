                - ruoqing: 她在的時候，妳也沒問過她希望什麼啊。
                - narr: 我的牙關咬住了，咬到耳朵下面那塊骨頭發痠，還是找不到一句可以回她的話。
                - ruoqing: 我要進去上班了。
                - tension: 10
                - set: ruoqing_goes
