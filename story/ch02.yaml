      - clock: "18:31"
      - { sfx: light_buzz, at: front, dist: mid, text: 滋滋—— }
      - { sfx: blackout, at: front, dist: mid, text: 啪, vib: thud }
      - { sfx: metal_crash, at: left, dist: far, text: 轟——, vib: crash }
      - { sfx: thud, at: left, dist: far, text: 咚……咚…… }
      - narr: 回聲在通道裡來回撞了好幾趟，才慢慢散掉。
      - { sfx: silence_drop }
      - me: 陳醫生？
      - pause: 2
      - { me: 陳醫生！, shake: light }
      - narr: 通道裡沒有人回答，連風都停住了。
      - tension: 15
      - { sfx: tinnitus, at: center }
      - daze: light
      - heart: pound
      - narr: 我的手指在螢幕上滑了好幾次，才按對那三個號碼。
      - phone: 撥號中。一一九。
      - daze: off
      - narr: 接線員一開口，耳朵裡那層嗡嗡聲才破開，風又從通道口灌回來。
      - me: 舊車站，側邊的維修通道，裡面有人。
      - me: 我看不到。我只聽到東西倒下來。
