chapter: 2
title: 活下來的人
start: c2_train
advance:
  - if: flag.ruoqing_safe && know.k_boxun_died
    to: 3
scenes:
  # ─────────────────────────────────────────── 06:12
  - id: c2_train
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 鬧鐘。六點十二分。
      - narr: 鐵軌的接縫一節一節敲上來，敲進鞋底。
      - { sfx: train_horn, at: front, dist: far, text: 嗚—— }
      - if: know.c2_ruoqing_died_again
        then:
          - heart: slow
          - if: know.c2_pushed
            then:
              - think: 又是六點十二分。上一次我話講得太多，她還是去了。
            else:
              - think: 又是六點十二分。上一次我什麼都沒擋住，她還是去了。
          - pause: 1.5
          - think: 這次讓她把話講完。
        else:
          - heart: fast
          - { sfx: cane_tap, at: front, dist: near, text: 叩 }
          - narr: 廣播還沒響，我已經站起來了，手杖在走道上敲了一聲。
          - think: 腿比腦子先醒。
          - { sfx: cough, at: back-left, dist: mid, text: 咳 }
          - narr: 後面那個人準時咳嗽，斜後方有人在剝橘子，橘子皮的味道慢慢飄過來。
          - think: 連咳嗽都準時。
          - narr: 我抓住前座的椅背，抓緊了，才聽見自己喘得跟跑過步一樣。
      - { sfx: station_chime, at: front, dist: far, text: 叮咚—— }
      - { announcer: 下一站，灰潮鎮。, as: 廣播 }
      - think: 這一次，若晴不能去舊車站。
      - narr: 外套口袋裡的信還在。我用指腹壓過那一行凸點，每一顆都在原來的位置。
      - think: 一封叫我不要回來的信，又被我帶回來了。
      - if: "!know.k_watch_1831 || !know.k_notebook_1831 || !know.k_photo_tingan"
        then:
          - think: 姊姊桌上那幾樣東西，這次我一定要搞清楚。
      - if: know.k_in_station_hall && !know.k_cabinet_warm
        then:
          - think: 那天在舊站大廳，東牆那邊有個東西一直在嗡。她大概就倒在那面牆腳，那是什麼，我到最後都沒摸到。
      - { sfx: train_brake, at: front, dist: mid, text: 嘰—— }
    next: c2_arrival

  # ─────────────────────────────────────────── 07:40
  - id: c2_arrival
    time: "07:40"
    place: 灰潮鎮站
    ambience: [platform]
    cast: { yuan: front-right }
    beats:
      - { sfx: train_door, at: right, dist: near, text: 嘶——喀 }
      - narr: 月台的風從背後推過來，帶著一點鹹味。
      - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
      - think: 左腳落地比右腳重。是予安。
      - yuan: 比我想的早。
      - if: chloop >= 2
        then:
          - narr: 同一句話，同一個換氣的地方。我讓它從旁邊過去，像讓一班不搭的車進站。
        else:
          - narr: 跟上一次一字不差，連「早」字後面那口氣都一樣。
      - me: 車沒誤點。
      - yuan: 灰潮鎮唯一還算準時的東西。
      - think: 他接下來會說什麼，我都知道。我把那些話轉小聲，當成隔壁房間的收音機。
      - yuan: 請扶著我的左手肘。前面有樓梯。
      - narr: 他袖口那股機油和黃銅的味道，沾到我的手心上。
      - { sfx: construction_drill, at: left, dist: far, text: 嗡嗡嗡 }
      - think: 八點鐘樓不會響。這次我不用站在廣場上等它。
    next: c2_house

  # ─────────────────────────────────────────── 08:10
  - id: c2_house
    time: "08:10"
    place: 林家老屋
    ambience: [old_house]
    cast: { yuan: front }
    beats:
      - { sfx: door_creak, at: front, dist: near, text: 吱—— }
      - yuan: 卡住了。妳退後一點。
      - { sfx: thud, at: front, dist: near, text: 咚, vib: tap }
      - narr: 他用肩膀撞了一下，門框吱一聲鬆開。他撞的是跟上一次同一個位置。
      - narr: 屋裡是灰塵和舊木頭的味道。
      - { sfx: phone_buzz, at: front, dist: near, text: 嗡、嗡 }
      - { yuan: 房仲。問我今天晚上八點可不可以。, learn: k_yuan_realtor }
      - think: 今晚八點，他要跟房仲談店的事。
      - { sfx: door_creak, at: right, dist: mid, text: 喀啦 }
      - narr: 他去把窗戶一扇一扇推開，右邊先灌進來一陣風。
      - if: "!know.k_watch_1831 || !know.k_photo_tingan"
        then:
          - me: 予安，你先幫我看一下我姊桌上的東西。
          - { sfx: step, at: front, dist: mid, text: 叩、叩 }
          - if: "!know.k_watch_1831"
            then:
              - me: 那只錶，現在幾點？
              - yuan: 沒在走了。
              - { yuan: 停在六點三十一分。, learn: k_watch_1831, mem: m_watch }
          - if: "!know.k_photo_tingan"
            then:
              - me: 相框裡那張，我姊旁邊站的是誰？
              - { yuan: 一個短頭髮的女生，揹著很大的包包。, learn: k_photo_tingan, mem: m_photo }
              - yuan: 我不認得她。
          - yuan: 怎麼突然要看這些？
          - me: 上次來沒問完。
      - think: 今天怎麼過，現在就得決定。
      - choice:
          options:
            - text: 「你今天可以整天陪我嗎？」
              then:
                - yuan: 整天喔？
                - me: 帶路，幫我念東西，順便跑腿。
                - yuan: 好的。我是說，好啊。
                - yuan: 店裡今天也沒什麼客人。
                - think: 他一緊張，講話就變得很有禮貌。
                - narr: 我握手杖的手鬆開一點，指節發痠，才知道剛剛握得多緊。
                - tension: -6
                - set: yuan_with_me
            - text: 「你去忙你的，我自己可以。」
              then:
                - yuan: 妳確定？
                - me: 這條路我從小走到大，它又沒有搬家。
                - yuan: 那有事打給我。號碼沒換。
                - { sfx: step, at: back, dist: mid, text: 叩、叩 }
                - { sfx: door_close, at: back, dist: far, text: 碰 }
      - think: 若晴今天在咖啡店上班。
    next: c2_cafe

  # ─────────────────────────────────────────── 11:30
  - id: c2_cafe
    time: "11:30"
    place: 老街咖啡店
    ambience: [cafe]
    cast: { ruoqing: front, yuan: right, old_woman: back-left }
    threads:
      manager:
        beats:
          - { old_woman: 對啦，下禮拜的班我再排排看……, as: 店長 }
          - { old_woman: 若晴喔？她最近在弄那個外地的什麼課。, as: 店長 }
          - { old_woman: 報名好像就這兩天啦。, as: 店長 }
          - { old_woman: 她不講，我也不好意思問。, as: 店長 }
          - { sfx: phone_hangup, at: back-left, dist: mid, text: 嘟 }
    beats:
      - { sfx: shop_bell, at: back, dist: near, text: 叮鈴 }
      - narr: 店裡是烘豆子的焦香，右邊的蒸汽管嘶嘶叫，水槽裡的杯子互相撞來撞去。
      - { sfx: coffee_grind, at: front-right, dist: mid, text: 嘎啦嘎啦 }
      - { sfx: step, at: front, dist: mid, text: 叩、叩 }
      - if: flag.yuan_with_me
        then:
          - ruoqing: 欸，予安哥？兩位喔？
          - { yuan: 兩位。兩杯黑的，不加糖。, learn: k_yuan_no_sugar }
        else:
          - ruoqing: 歡迎光臨，一位嗎？
          - me: 一位。
          - ruoqing: 欸要不要我念菜單給妳聽？
          - me: 不用，黑咖啡就好。
      - if: chloop >= 2
        then:
          - think: 她每一次都問要不要念菜單，我每一次都說不用。
        else:
          - if: know.k_in_station_hall
            then:
              - think: 上一次最後聽到這個聲音，是在舊車站的大廳裡。
            else:
              - think: 上一次聽到這個聲音，也是在這家店。那天晚上她就死了。
          - daze: light
          - narr: 磨豆機和蒸汽管退到很遠，耳朵裡只剩她剛剛講的那幾個字，一直繞。
          - narr: 我用拇指去數手杖上那圈防滑紋，數到第七道，蒸汽管的嘶聲才回來。
          - daze: off
      - { sfx: cup_set, at: front, dist: near, text: 叩 }
      - narr: 她沒有回櫃台，在隔壁桌坐下來，攤開一疊紙。
      - { sfx: paper_rustle, at: front, dist: near, text: 沙、沙 }
      - narr: 紙一張一張翻過去。翻到某幾張的時候，她的呼吸會跟著慢下來。
      - { sfx: strap_click, at: front, dist: near, text: 喀 }
      - pause: 2
      - ruoqing: 欸……那個。
      - ruoqing: 妳一直朝我這邊耶。
      - { ruoqing: 好像在聽我呼吸。, mem: m_c2_breath }
      - heart: slow
      - narr: 被抓到了。耳根一下子燒起來，我的食指在杯緣上繞了一圈又一圈。
      - choice:
          timeout: 10
          default: 2
          options:
            - text: 「抱歉，妳的聲音很好聽。」
              then:
                - { sfx: laugh_soft, at: front, dist: near, text: 呵 }
                - ruoqing: 蛤？第一次有人這樣講欸。
            - text: 「我在聽妳翻紙。妳在整理什麼？」
              then:
                - ruoqing: 啊，很吵喔？
                - me: 不會。
            - text: （把臉轉開）
              then:
                - ruoqing: 沒關係啦，是我自己不習慣被人家聽。
      - heart: off
      - ruoqing: 我在整理照片啦，自己拍的。
      - choice:
          options:
            - text: 「可以說給我聽嗎？」
              then:
                - set: c2_heard_photos
                - ruoqing: 說給妳聽喔？
                - ruoqing: 好啊，我試試看。這張是早上的商店街，一家都還沒開。
                - ruoqing: 鐵捲門全部拉下來，上面還有昨天晚上的雨。
                - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
                - ruoqing: 這張是車站在改建，一半是舊磁磚，一半被藍色帆布包起來。
                - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
                - ruoqing: 這張是理髮店的阿伯。他每天坐同一張椅子，坐了二十年。
                - ruoqing: 上個月他把店收了。
                - { sfx: strap_click, at: front, dist: near, text: 喀、喀 }
                - { ruoqing: 這一整組我叫它《退潮以後》。, learn: k_ruoqing_portfolio }
                # 第六章才知道她拍過東牆前後：回來重過這一天，就能先問到鐵櫃的位置。
                - if: "later.k_new_cabinet && !know.k_cabinet_spot"
                  then:
                    - me: 舊車站東牆那兩張有嗎？更新前，跟更新後。
                    - pause: 1.5
                    - ruoqing: ……妳怎麼知道我拍了兩張？
                    - me: 妳會想拍前後。
                    - ruoqing: 有是有啦，可是不在這疊裡。它不像《退潮以後》，我本來想丟掉。妳等我一下。
                    - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
                    - { sfx: drawer, at: front-right, dist: mid, text: 喀啦 }
                    - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
                    - ruoqing: 四月那張。妳背對正門的話，右手邊第二根柱子。
                    - { ruoqing: 柱子後面多了一個灰色的鐵櫃，比人高一點，門上一排小燈。, learn: k_cabinet_spot, mem: m_c2_cabinet_spot }
                    - ruoqing: 去年那張，同一個地方什麼都沒有，只有一面剝漆的牆。
                - ruoqing: 我不是要拍一個快死掉的小鎮喔。
                - { ruoqing: 我想拍的是，東西不見了以後，人還留下什麼。, mem: m_c2_after_tide }
                - think: 我還看得見的那些年，從來沒注意過理髮店門口坐著一個阿伯。
                - me: 妳講得很清楚，我好像就站在那家店門口。
                - ruoqing: 真的假的？
                - ruoqing: 欸，我從來沒有念照片給別人聽過耶。
                - narr: 我兩手捧著杯子，肩膀不知道什麼時候放下來了。
                - tension: -8
            - text: 「不吵妳了。」
              then:
                - ruoqing: 喔，好。
                - narr: 紙又開始翻。翻到哪一張，我只能從她換氣的地方猜。
      - { old_woman: 若晴，三號桌啦！, as: 店長, at: back-left }
      - ruoqing: 來了來了。
      - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
      - { cue: manager, at: back-left, text: 窸窸窣窣, sfx: huddle_rustle }
      - narr: 隔壁桌那疊紙還攤著，她沒收。
      - pause: 3
      - narr: 杯子裡的咖啡剩一半，已經不燙了。
    next: c2_oldstreet

  # ─────────────────────────────────────────── 13:30
  - id: c2_oldstreet
    time: "13:30"
    place: 老街
    ambience: [street_morning]
    cast: { yuan: right, child: front-left }
    beats:
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 老街的地磚換過了，手杖敲上去比五年前清脆。
      - { sfx: bicycle_bell, at: left, dist: mid, text: 叮叮 }
      - if: know.k_truck
        then:
          - think: 上一次差不多就是這個時間，有東西貼著我的背擦過去。
          - heart: fast
          - narr: 我把手杖收到身前，肩膀縮起來，等它從背後過來。
      - { sfx: truck_pass_quiet, at: back, dist: near, text: ——！, vib: thud }
      - narr: 一陣熱風從背後刷過去，幾乎聽不到引擎，只有輪胎壓過水溝蓋時喀了一下。
      - if: "!know.k_truck"
        then:
          - heart: fast
          - narr: 我整個人往旁邊彈開，肩膀撞上騎樓的柱子，手杖差點脫手。
          - tension: 8
      - if: flag.yuan_with_me
        then:
          - yuan: 電動貨車。我也沒聽到。
      - think: 一點半，老街，水溝蓋。我把那一聲喀記下來。
      - heart: off
      - learn: k_truck
      - { sfx: ball_bounce, at: front-left, dist: mid, text: 咚、咚、咚 }
      - { child: 我的球！, as: 小孩 }
      - narr: 球從我腳邊滾過去。等我蹲下去，它已經彈到馬路那頭了。
      - { sfx: ball_bounce, at: front, dist: far, text: 咚…… }
      - think: 我的手伸出去的時候，它早就滾遠了。
    next: c2_afternoon

  # ─────────────────────────────────────────── 14:20
  - id: c2_afternoon
    time: "14:20"
    place: 舊車站附近的路口
    ambience: [street_morning, construction_far]
    cast: { yuan: left, man: front }
    beats:
      - narr: 下午的風裡有鐵鏽和曬熱的柏油味。
      - { sfx: construction_drill, at: front, dist: mid, text: 嘰嘰嘰嘰 }
      - { sfx: hammer, at: front-left, dist: mid, text: 鏘、鏘 }
      - think: 我想先聽聽舊車站白天是什麼聲音。
      - if: flag.yuan_with_me
        then:
          - yuan: 前面拉封鎖線了。有一張公告。
          - yuan: 「舊車站正門，十月一日起封閉施工。」
          - yuan: 下面小字寫行人請改道。
        else:
          - { sfx: step, at: front, dist: near, text: 叩 }
          - { man: 小姐，前面封起來了喔。, as: 工人 }
          - me: 舊車站進不去了嗎？
          - { man: 正門這個月都封著啦，要進去要繞旁邊。, as: 工人 }
      - if: know.k_in_station_hall
        then:
          - think: 正門封著。上一次我只顧著若晴，根本沒注意到。
        else:
          - think: 正門封著。上一次，我根本沒有走到這裡。
      - { sfx: truck_reverse, at: back-right, dist: mid, text: 嗶、嗶、嗶 }
      - { man: 後面的閃一下！車要退了！, as: 工人 }
      - narr: 倒車的嗶嗶聲打到圍欄的鐵板上又彈回來，好像四面八方都在倒車。
      - heart: slow
      - narr: 我把手杖收到腳邊，先把前面的電鑽和左邊敲鐵的聲音推出耳朵外面。
      - think: 鐵板會騙人。要聽的是柴油味跟著過來的那一邊。
      - locate:
          sfx: truck_reverse
          at: back-right
          decoys:
            - { sfx: construction_drill, at: front }
            - { sfx: hammer, at: left }
          tries: 2
          timeout: 10
          prompt: 車從哪邊倒過來？
          success:
            - narr: 右後方。我往左前跨了兩步，杖尖碰到人行道的邊，才站定。
            - { sfx: truck_reverse, at: right, dist: near, text: 嗶、嗶 }
            - narr: 車尾從我剛才站的地方退過去，柴油的熱氣撲上臉。
            - { man: 小姐，妳耳朵很利喔。, as: 工人 }
            - narr: 嗶嗶聲退到圍欄盡頭就轉了彎，往舊車站側邊那頭去了。
            - think: 正門封著，側邊還有路可以進去。
            - set: c2_dodged_truck
          fail:
            - { sfx: truck_reverse, at: back-right, dist: near, text: 嗶！嗶！嗶！ }
            - heart: fast
            - narr: 我躲錯邊了。嗶嗶聲沒有變遠，整個壓到背上來，柴油味熱得嗆鼻。
            - if: flag.yuan_with_me
              then:
                - narr: 有人抓住我的手臂往前扯，是機油的味道。我撞進他胸口，手杖掉在地上。
                - { yuan: 車在妳後面！, at: left }
              else:
                - narr: 有人抓住我的手臂往前扯，我撞進一件曬得發燙的工作服，手杖掉在地上。
                - { man: 小姐！車在妳後面啦！, as: 工人 }
            - { sfx: thud, at: back-right, dist: near, text: 咚, vib: thud }
            - narr: 車尾的鐵角擦過我剛才站的地方，撞上圍欄，整排鐵板跟著晃。
            - tension: 6
            - narr: 我蹲下去摸手杖，摸了兩次才摸到，握把上全是我手心的汗。
            - set: c2_truck_grabbed
      - heart: off
