      - if: "!know.k_cabinet_warm"
        then:
          - narr: 我撐著地往右邊爬，爬到牆腳，手背撞上一塊鐵板。燙的，裡面還在低低地嗡。
          - { think: 東牆上釘著一個鐵櫃，剛才那一聲是從這裡面出來的。, learn: k_cabinet_warm, mem: m_c2_cabinet }
