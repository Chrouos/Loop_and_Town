      - clock: "18:31"
      - { sfx: blackout, at: front, dist: mid, text: 啪, vib: thud }
      - { sfx: metal_crash, at: right, dist: mid, text: 轟——, vib: crash }
      - { sfx: silence_drop }
      - pause: 2
      - me: 若晴？
      - pause: 2
      - narr: 她沒有回答，背帶扣也沒有再響。
      - tension: 22
      - { sfx: tinnitus, at: center }
      - daze: heavy
      - heart: pound
      - narr: 我想再叫她，吸進來的全是灰，嗆得我彎下腰咳個不停。
      - narr: 嘴裡有鐵鏽味，大概是剛剛咬破了舌頭，我一點都不覺得痛。
      - daze: off
      - narr: 咳到最後，耳朵裡的嗡聲先停了，接著是灰塵落回地上的沙沙聲。
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
