  - id: c2_goes_station
    time: "18:05"
    place: 舊車站
    ambience: [old_station_hall]
    cast: { ruoqing: front, boxun: front-right }
    beats:
      - narr: 我循著她的腳步跟到圍欄旁，手杖碰到圍欄的轉角。她從側邊繞進去，我等她走遠，才跟著進去。
      - heart: slow
      - narr: 我把呼吸放得很淺，淺到聽得見自己的鼻息，怕被他們聽到。
      - { sfx: step, at: front, dist: mid, text: 叩、叩 }
      - ruoqing: 陳醫生。
      - boxun: 妳來了。這是知夏留下的。
      - { sfx: paper_rustle, at: front, dist: mid, text: 沙 }
      - narr: 紙袋從一隻手換到另一隻手。
      - boxun: 我先走了，車停在外面。
      - move: { boxun: front-left }
      - { sfx: step, at: front-left, dist: far, text: 叩……叩…… }
      - narr: 消毒水的味道跟著腳步往側門去了。
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 我的手杖撞到一塊翹起來的地磚，聲音在大廳裡彈開。
      - ruoqing: 欸……妳跟過來喔？
      - ruoqing: 妳到底想怎樣啦？
      - me: 跟我出去，現在。
      - ruoqing: 我還沒看完欸。
      - { sfx: paper_rustle, at: front, dist: mid, text: 沙沙 }
      - clock: "18:30"
      - { sfx: hum_rise, at: right, dist: far, text: 嗡—— }
      - { sfx: light_buzz, at: front, dist: mid, text: 滋滋—— }
      - heart: fast
      - if: know.k_in_station_hall
        then:
          - think: 右邊，東側那面牆。跟上一次同一個地方。
        else:
          - think: 右邊，東側那面牆，有東西開始響。
      - choice:
          timeout: 4
          default: 1
          options:
            - text: （往她的聲音衝過去）
              then:
                - { sfx: step_run, at: front, dist: near, text: 噠噠 }
                - narr: 我衝了三步，第四步踩在碎玻璃上。
                - { sfx: thud, at: front, dist: near, text: 碰, shake: hard }
                - narr: 腳底一滑，我整個人摔下去，兩隻手掌壓進玻璃渣裡。
                - tension: 10
            - text: 「若晴！」
              then:
