                - narr: 我想不出一個他會相信的理由。
                - { boxun: 我上個月才走過。妳早點回去吧。, at: left }
            - text: （站在原地）
              then:
                - narr: 腳步聲往左邊去，越走越小。
            # 第四章才聽過他怎麼排除病因：回來重過這一天，可以用他自己的方法留住他。
