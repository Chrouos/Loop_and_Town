  # ─────────────────────────────────────────── 22:40
  - id: c2_night
    time: "22:40"
    place: 林家老屋，知夏的房間
    ambience: [house_night]
    cast: { yuan: back }
    beats:
      - narr: 冰箱在樓下低低地運轉，窗外的蟲叫個不停。
      - narr: 我坐在姊姊的床沿，把鞋子踢掉，腳底貼著冰涼的磨石子地。
      - tension: -10
      - if: "!know.k_notebook_1831"
        then:
          - { sfx: page_turn, at: front, dist: near, text: 沙啦 }
          - narr: 那本硬殼筆記本，第一個今天我沒有翻開。紙頁背面摸起來是凸的。
          - touch:
              cells: ["1", "8", "：", "3", "1"]
              style: groove
              prompt: 指腹順著筆畫的溝走過去
              timeout: 30
          - { think: 一、八。冒號。三、一。, learn: k_notebook_1831 }
          - narr: 下一行一樣，再下一行還是一樣。她寫到紙背都凸起來了。
      - narr: 書桌上那只錶是冷的。我把它翻過來，指腹沿著背面的刻痕走，再把手機鏡頭貼上去。
      - phone: 如果你第二次看見十八點三十一分，
      - { phone: 不要先救第一個死者。, learn: k_watch_engraving }
      - heart: slow
      - pause: 2
      # 回來重過這一天、在正門外留住了他：兩個人都活著，通道還是塌了。
      - if: flag.c2_bx_stays
        then:
          - think: 若晴活著，陳醫生也活著。回到這一天，我總算把他留在正門外。
          - think: 可是十八點三十一分，那條通道還是塌了。只是今天剛好沒有人在裡面。
          - narr: 錶躺在我手心，一點滴答也沒有。
        else:
          - if: flag.ruoqing_safe && know.k_boxun_died
            then:
              - think: 若晴活著，陳醫生死了。
              - pause: 1.5
              - think: 第一個死的人我救下來了，十八點三十一分還是照樣來。
              - think: 他走進那條通道，是因為他等的人沒來。他等的人沒來，是因為我。
              - narr: 錶躺在我手心，一點滴答也沒有。
              - if: flag.yuan_with_me
                then:
                  - { sfx: step, at: back, dist: mid, text: 叩、叩 }
                  - yuan: 我先回店裡。
                  - yuan: 那……明天見。
                  - think: 明天。
            else:
              - think: 我想救的人又死了一次。
              - if: flag.ruoqing_goes
                then:
                  - { think: 我又替她決定了一次。, mem: m_c2_decided_again }
                else:
                  - if: flag.c2_sorry
                    then:
                      - think: 我跟她說了對不起，然後讓她一個人走過去。
                    else:
                      - think: 我一句話都沒說，就讓她一個人走過去。
              - think: 她刻的是「看見」，我只聽得到。
              - think: 知夏，妳說的是這個嗎？
      - narr: 我把錶放回桌上，放得很輕，好像怕吵醒誰。
      - heart: off
    next: c2_bell

