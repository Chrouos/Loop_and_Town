                          - me: 妳說，妳想拍的是東西不見了以後，人還留下什麼。
                          - pause: 2
                          - if: flag.c2_heard_photos
                            then:
                              - ruoqing: ……欸，妳記得喔。
                            else:
                              - ruoqing: ……這句我還沒跟別人講過欸。
                          - set: c2_reached
                      - mem: m_ruoqing_portfolio
                        then:
                          - me: 妳在弄一個作品集，叫《退潮以後》。
                          - me: 我想問的是那個，不是舊車站。
                          - pause: 2
                          - if: flag.c2_heard_photos
                            then:
                              - ruoqing: ……欸，妳連名字都記得喔。
                            else:
                              - ruoqing: ……這個名字我很少跟人講欸。
                              - ruoqing: 妳從哪裡聽來的？店長喔？
                              - { sfx: strap_click, at: front, dist: near, text: 喀 }
                              - ruoqing: 算了。妳怎麼知道的，我等一下再問。
                          - set: c2_reached
                    miss:
                      - ruoqing: 蛤？那是什麼？
                      - think: 不是這句。她在等的不是這個。
                - text: 「剛剛那個通知，是攝影的事嗎？」
                  if: know.k_ruoqing_portfolio
                  then:
                    - ruoqing: 妳怎麼知道是攝影？
                    - me: 猜的。妳身上一直有相機的聲音。
                    - set: [c2_reached, c2_notice_asked]
                - text: 「我只是不想再看到一樣的事。」
                  then:
                    - set: c2_own_fear
                    - ruoqing: 一樣的事？什麼一樣的事？
                    - narr: 我張開嘴，喉嚨像被人掐住，只擠出一口氣。
                    - tension: 6
                    - ruoqing: 我要回去上班了。
              silence:
                - pause: 2
                - ruoqing: ……好吧。
                - { sfx: door_close, at: front, dist: near, text: 碰 }
                - narr: 門在我鼻尖前面關上，風把我的瀏海掀起來又放下。
                - pause: 2.5
                - { sfx: strap_click, at: front, dist: near, gain: 0.5, text: 喀 }
                - narr: 門板後面，背帶扣又喀了一聲。她沒有走開，就站在門的另一邊。
                - tension: 8
      - if: flag.c2_reached
        then:
          - if: flag.c2_asked_why
            then:
              - { sfx: sigh, at: front, dist: near }
              - ruoqing: 東西放了五年都沒跑掉，報名過了今天晚上就沒有了。
              - if: flag.c2_heard_strap
                then:
                  - ruoqing: 欸，妳連門後面的扣子都聽得到，應該也聽得出來我在拖吧。
              - ruoqing: 好啦。陳醫生那邊我自己打給他，東西改天再拿。
              - { ruoqing: 今天晚上，我先把那張報名表填完。, mem: m_c2_form_tonight }
              - set: c2_ruoqing_safe
              - heart: off
              - tension: -12
              - goto: c2_evening
          - if: "!flag.c2_notice_asked"
            then:
              - me: 剛剛那個通知，也是照片的事吧？
              - pause: 1.5
          - ruoqing: 外地一個攝影課啦，下午寄來的。
          - ruoqing: 說今天晚上以前要回，還要附作品集。
          - ruoqing: 我本來想說晚點再弄。
          - ruoqing: 反正什麼事都可以晚點再弄嘛。
          - if: flag.c2_heard_photos
            then:
              - me: 妳的照片，我還沒聽完。
            else:
              - me: 妳的照片，我還想多聽幾張。
          - { sfx: sigh, at: front, dist: near }
          - ruoqing: 可是陳醫生已經等我很久了。那是知夏姊留下來的東西耶。
          - narr: 我把手杖換到左手，沒有接她的話。排風扇一直吹，小腿被吹得一陣熱一陣涼。
          - pause: 2
          - { sfx: strap_click, at: front, dist: near, text: 喀 }
          - ruoqing: ……東西在他那邊放了五年，也沒有跑掉。
          - ruoqing: 晚一天拿，應該也沒差吧。
          - if: flag.c2_heard_strap
            then:
              - ruoqing: 欸，妳連門後面的扣子都聽得到。我在妳旁邊好像什麼都藏不住。
          - ruoqing: 好啦，陳醫生那邊我再跟他講。
          - { ruoqing: 是我今天晚上本來就有自己的事。, mem: m_c2_own_thing }
          - set: c2_ruoqing_safe
          - heart: off
          - tension: -10
          - think: 是她自己決定的。我只是沒有擋在她前面。
          - goto: c2_evening
        else:
          - goto: c2_goes

  # ─────────────────────────────────────────── 17:55 (若晴留下)
  - id: c2_evening
    time: "17:55"
    place: 老街咖啡店
    ambience: [cafe]
    cast: { ruoqing: front-left, yuan: right }
    beats:
      - { sfx: typing, at: front-left, dist: mid, text: 噠噠噠 }
      - narr: 她把筆電搬到櫃台後面，打字打一陣就停一陣。
      - { ruoqing: 陳醫生說他六點會在舊車站等我。, learn: k_ruoqing_station_plan }
      - ruoqing: 我等一下再打給他啦。
      - think: 等一下。他現在應該已經在去舊車站的路上了，而正門還封著。
      - heart: fast
      - { sfx: chair_scrape, at: center, dist: near, text: 嘎 }
      - narr: 我把椅子往後推，椅腳在地磚上刮出一聲，人卻還坐著沒起來。
      - choice:
          options:
            - text: （留在咖啡店，陪著若晴）
              goto: c2_cafe_route
            - text: （去舊車站）
              goto: c2_station

  # ─────────────────────────────────────────── 18:05 舊車站
  - id: c2_station
    time: "18:05"
    place: 舊車站正門外
    ambience: [wind_open, construction_far]
    cast: { boxun: front, yuan: back-right }
    beats:
      - if: flag.c2_yuan_with_me
        then:
          - yuan: 到了。正門圍起來，進不去。
          - { sfx: step_uneven, at: back-right, dist: near, text: 咚、叩 }
          - yuan: 我在後面。要走叫我。
        else:
          - narr: 計程車停在路口就不肯再往前開，剩下的路我自己數步數。
      - { sfx: gravel_step, at: center, dist: near, text: 沙、沙 }
      - narr: 碎石路沒有一處是平的，每一步我都先拿杖尖點過，腳底還是踩不實。
      - if: flag.c2_truck_grabbed
        then:
          - narr: 下午被人扯住的那隻手臂還在痠，我把它貼緊身體，不敢甩。
      - { sfx: wind_gust, at: front, dist: far, text: 颯—— }
      - narr: 牆後面是空掉的大廳，風從破窗鑽進去繞一圈，又鑽出來。
      - { sfx: gravel_step, at: front, dist: mid, text: 沙……沙 }
      - narr: 入口前有人來回踱步，皮鞋底磨著碎石，風裡帶著一點消毒水的味道。
      - { sfx: phone_buzz, at: front, dist: mid, text: 嗡 }
      - { boxun: 喂。……三床家屬到了的話，請他們先坐，同意書我七點前回去簽。, as: 男人的聲音 }
      - { boxun: 外面那家醫院的信？放我桌上就好，不用拆。, as: 男人的聲音 }
      - { sfx: hand_rub, at: front, dist: mid, text: 噗、沙沙 }
      - narr: 腳步停了。他按了一下什麼，噗的一聲，接著兩隻手搓了好幾下。
      - if: know.k_sig_boxun
        then:
          - think: 按一下，兩手搓開。是陳醫生。
        else:
          - if: know.k_boxun_at_station
            then:
              - think: 這個停頓我聽過。另一個今天，有個男人從舊站側門出去，也是先停一下，按一聲，再搓手。
              - think: 一樣的消毒水味。那天從側門走掉的人，是陳醫生。
            else:
              - think: 消毒水。是從醫院來的人。
      - choice:
          timeout: 6
          options:
            - text: 「陳醫生，若晴不會來了。」
              if: know.k_sig_boxun
              then:
                - pause: 1.5
                - boxun: ……請問妳是？
                - me: 林知夏的妹妹。
                - boxun: 是若晴跟妳說我在這裡？
                - me: 沒有。你剛剛按了乾洗手。
                - boxun: ……一天按六十幾次，我自己都聽不到了。
                - boxun: 若晴那邊，我正要打給她。
                - me: 她今天有自己的事。
                - boxun: 是嗎。那也好。
                - set: c2_bx_named
            - text: （先聽他要做什麼）
      - if: "!flag.c2_bx_named"
        then:
          - { sfx: phone_hangup, at: front, dist: mid, text: 嘟——嘟—— }
          - boxun: 若晴，我到了。妳方便的時候回我一下。
          - pause: 2
          - { sfx: phone_hangup, at: front, dist: mid, text: 嘟——嘟—— }
          - { sfx: sigh_m, at: front, dist: mid }
          - me: 陳醫生。
          - pause: 1.5
          - boxun: ……請問妳是？
          - me: 林知夏的妹妹。
          - boxun: 我聽說妳回來了。
          - me: 若晴不會來了。
          - boxun: 妳怎麼知道我在等她？
          - choice:
              timeout: 8
              options:
                - text: 「她今天有自己的事。」
                  then:
                    - boxun: 是嗎。那也好。
              silence:
                - pause: 2
                - boxun: 算了，這不重要。
                - boxun: 我等人等習慣了。在醫院裡，每個人都在等什麼。
      - { sfx: hand_rub, at: front, dist: near, text: 噗、沙沙 }
      - if: "!know.k_sig_boxun"
        then:
          - { think: 又是噗的一聲，兩手搓開。他要講正事之前，好像得先把手洗乾淨。, learn: k_sig_boxun }
      - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
      - if: flag.c2_bx_named
        then:
          - boxun: 這是知夏留下的東西，本來要交給若晴。
      - boxun: 那這份我先帶回去。
      - boxun: 放車上不妥，我得先拿上去研究所那邊鎖起來。
      - boxun: 知夏交給我的時候只交代一件事，不要讓它離開上鎖的地方太久。我答應過她。
      - { boxun: 正門封了，從旁邊的員工通道上去比較近。, learn: k_maintenance_passage }
      - me: 員工通道？
      - { boxun: 舊站以前的維修通道，停用很多年了。, mem: m_c2_passage }
      - if: flag.c2_dodged_truck
        then:
          - think: 下午那台車，也是往側邊退進去的。
      - boxun: 我上個月走過一次，應該還過得去。
      - boxun: 施工公告說通道要封到年底，可是現在還沒有人圍起來。我自己判斷過，風險不大。
      - clock: "18:12"
      - narr: 我按了一下手機側鍵。
      - phone: 十八點十二分。
      - move: { boxun: right }
      - { sfx: gravel_step, at: right, dist: mid, text: 沙、沙、沙 }
      - heart: fast
      - choice:
          timeout: 6
          default: 2
          options:
            - text: 「等一下，我跟你走。」
              then:
                - { sfx: cane_tap, at: right, dist: near, text: 叩、喀 }
                - narr: 地面突然往下斜，碎石在杖尖底下滑開。
                - { sfx: thud, at: right, dist: near, text: 碰, shake: hard }
                - narr: 我往前撲，膝蓋撞上一塊鐵板，痛從骨頭裡麻上來。
                - tension: 12
                - { sfx: door_creak, at: right, dist: mid, text: 嘎—— }
                - narr: 我摸到一扇鐵門，冰的，整片都是鏽。旁邊沒有扶手，右手邊是空的。
                - { boxun: 妳不要過來，這裡不好走！, at: right }
                - { me: ……我跟不上。, mem: m_c2_cant_follow }
                - if: flag.c2_yuan_with_me
                  then:
                    - { sfx: step_uneven, at: back-right, dist: near, text: 咚叩咚叩 }
                    - narr: 背後的腳步一重一輕，跑得亂了拍子。有一隻手抓住我的手肘，是機油的味道。
                    - { yuan: 妳剛剛差一點踩空。, at: back-right }
            - text: 「陳醫生，不要走那裡。」
              then:
                - { boxun: 為什麼？, at: right }
                - narr: 我想不出一個他會相信的理由。
                - { boxun: 我上個月才走過。妳早點回去吧。, at: right }
            - text: （站在原地）
              then:
                - { sfx: gravel_step, at: right, dist: mid, to: right:far, text: 沙、沙 }
                - narr: 腳步聲往右邊去，越走越小。
            # 第四章才聽過他怎麼排除病因：回來重過這一天，可以用他自己的方法留住他。
            - text: 「你排除病因的時候，不會因為上個月正常，就不檢查。那條通道也一樣。」
              if: "later.k_medical_records"
              then:
                - set: c2_bx_stays
                - pause: 2.5
                - { sfx: hand_rub, at: right, dist: mid, text: 噗、沙沙 }
                - { boxun: ……上個月正常，只能證明上個月。, at: right }
                - { sfx: gravel_step, at: right, dist: near, text: 沙、沙 }
                - narr: 腳步聲走回來，停在我前面。
                - move: { boxun: front }
                - me: 我說不出理由。你可以不信，先打給施工的人問一聲再決定。
                - pause: 2
                - boxun: 研究所那邊，也不急在今晚。
                - boxun: 我留下來，是因為這份東西不能有閃失。妳不用算在自己頭上。
                - tension: -8
              goto: c2_station_stay
      - { sfx: hand_rub, at: right, dist: far, text: 噗、沙沙 }
      - narr: 很遠的右邊，又是噗的一聲，兩手搓開。他在通道口停了一下。
      - { sfx: step, at: right, dist: far, text: 叩……叩…… }
      - narr: 腳步往下走，後來只剩下風。
      - clock: "18:24"
      - narr: 我又叫手機報了一次時間。
      - phone: 十八點二十四分。
      - { sfx: hum_rise, at: right, dist: far, text: 嗡—— }
      - narr: 通道深處有東西開始低低地響，低到我是用胸口聽到的。
      - { wait: 30, clock: "18:24", until: "18:31" }
      - clock: "18:31"
      - { sfx: light_buzz, at: front, dist: mid, text: 滋滋—— }
      - { sfx: blackout, at: front, dist: mid, text: 啪, vib: thud }
      - { sfx: metal_crash, at: right, dist: far, text: 轟——, vib: crash }
      - { sfx: thud, at: right, dist: far, text: 咚……咚…… }
      - narr: 回聲在通道裡來回撞了好幾趟，才慢慢散掉。
      - { sfx: silence_drop }
      - me: 陳醫生？
      - pause: 2
      - { me: 陳醫生！, shake: hard }
      - narr: 通道裡沒有人回答，連風都停住了。
      - tension: 15
      - { sfx: tinnitus, at: center }
      - daze: light
      - heart: pound
      - narr: 我的手指在螢幕上滑了好幾次，才按對那三個號碼。
      - phone: 撥號中。一一九。
      - daze: off
      - narr: 接線員一開口，耳朵裡那層嗡嗡聲才破開，風又從通道口灌回來。
      - { sfx: wind_gust, at: right, dist: mid, text: 颯—— }
      - me: 舊車站，側邊的維修通道，裡面有人。
      - me: 我看不到。我只聽到東西倒下來。
    next: c2_station_after

  - id: c2_station_stay
    time: "18:14"
    place: 舊車站正門外
    ambience: [wind_open, construction_far]
    cast: { boxun: front, yuan: back-right }
    beats:
      - { sfx: phone_hangup, at: front, dist: near, text: 嘟——嘟—— }
      - boxun: 施工單位沒人接，大概下班了。
      - boxun: 我在這裡等若晴回電，順便等他們回。
      - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
      - narr: 圍欄的鐵網嘎了一聲，是他靠上去了。風一吹，他的紙袋就沙沙響。
      - clock: "18:24"
      - { sfx: hum_rise, at: right, dist: far, text: 嗡—— }
      - narr: 通道深處有東西開始低低地響，低到我是用胸口聽到的。
      - boxun: 妳也聽到了？
      - me: 嗯。
      - { wait: 30, clock: "18:24", until: "18:31" }
      - clock: "18:31"
      - { sfx: light_buzz, at: front, dist: mid, text: 滋滋—— }
      - { sfx: blackout, at: front, dist: mid, text: 啪, vib: thud }
      - { sfx: metal_crash, at: right, dist: far, text: 轟——, vib: crash }
      - { sfx: thud, at: right, dist: far, text: 咚……咚…… }
      - narr: 回聲在通道裡來回撞了好幾趟，才慢慢散掉。
      - heart: pound
      - narr: 我抓住圍欄，鐵網的格子一格一格壓進掌心。剛剛他要走的，就是那裡。
      - tension: 8
      - pause: 3
      - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
      - narr: 他沒有講話。紙袋掉在碎石上，紙角在石子上刮了兩下，他才撿起來。
      - { sfx: hand_rub, at: front, dist: near, text: 噗、沙沙 }
      - narr: 噗的一聲，他搓手搓了很久，久到乾洗手應該早就乾了，才拿出筆。
      - { sfx: pen_scratch, at: front, dist: near, text: 唰唰 }
      - { boxun: 十月三日，十八點三十一分，維修通道塌落。裡面沒有人。, mem: m_c2_no_one_inside }
      - boxun: 我習慣先把看到的寫下來。原因，之後再一項一項排除。
      - boxun: ……今天我不走那裡了。
      - tension: -8
      - if: flag.c2_yuan_with_me
        then:
          - { yuan: 我們先走。, at: back-right }
          - narr: 予安的手臂伸過來。我抓著它走，碎石的聲音才一步一步回到腳底下。
          - { sfx: gravel_step, at: center, dist: near, text: 沙、沙 }
      - heart: off
    next: c2_night

  - id: c2_station_after
    time: "18:50"
    place: 舊車站側邊
    ambience: [wind_open]
    cast: { man: left, yuan: back-right }
    beats:
      - heart: fast
      - { sfx: siren_far, at: back, dist: far, text: 喔咿——喔咿—— }
      - { sfx: gravel_step, at: back, dist: mid, text: 沙沙沙 }
      - narr: 警笛從鎮上一路靠過來，好幾雙鞋踩過碎石。
      - noise: heavy
        with:
          - { say: 救護車到了沒？, voice: man, at: [back, back-left], dist: far }
          - { say: 讓開讓開，不要站在這裡！, voice: man, at: [right, front-right], dist: mid }
          - { say: 是誰？裡面是誰？, voice: woman, at: [back, right], dist: far }
          - { text: 噠噠噠, sfx: step_run, src: 有人在跑, at: [back, right, front-right], dist: mid }
