          - if: flag.c3_failed_before
            then:
              - heart: fast
              - narr: 大拇指按到第六下，我發現自己在等它按錯。按錯了，好像就有理由再數一次。
              - narr: 我把指甲壓進手杖的橡膠裡，壓到指尖發麻，數字還是一個都沒有少。
            else:
              - heart: pound
              - narr: 我握著拳頭往胸口捶，捶到骨頭發疼，裡面那顆東西還是跳得那麼快。
      - wait: 3
      - { sfx: bell_toll, at: front-left, text: 噹——, vib: bell }
      - if: "!flag.c3_boxun_stays || flag.c3_r_dies"
        then:
          - if: flag.c3_failed_before
            then:
              - { sfx: cloth_rustle, at: center, dist: near, text: 窸 }
              - narr: 我把額頭抵在手杖上，彎下去，一直彎到膝蓋頂住胸口。這樣比較不會聽到自己的心跳。
              - think: 遛狗的人走遠了。這一次，連我自己都沒有站起來。
            else:
              - { sfx: cane_tap, at: front, dist: near, text: 喀 }
              - { sfx: thud, at: front, dist: mid, text: 匡啷——, src: 手杖, vib: crash, shake: hard }
              - narr: 手杖從手裡滑掉，順著門口的石階一路敲下去，在最底下撞出好大一聲。
              - think: 遛狗的人還是沒有回頭。我也沒有去撿。
      - wait: 3
      - { sfx: bell_toll, at: front-left, text: 噹——, vib: bell }
      - wait: 3
      - { sfx: bell_toll, at: front-left, text: 噹——, vib: bell }
      - if: flag.c3_boxun_stays && !flag.c3_r_dies
        then:
          - { think: 如果沒有人死，為什麼還是重來？, mem: m_c3_why_reset }
      - wait: 3
      - { sfx: bell_toll, at: front-left, text: 噹——, vib: bell }
      - wait: 3
      - { sfx: bell_toll, at: front-left, text: 噹——, vib: bell }
      - if: flag.c3_failed_before && (!flag.c3_boxun_stays || flag.c3_r_dies)
        then:
          - narr: 我坐在石階上，聽完最後一聲。
        else:
          - narr: 我站在馬路中間，聽完最後一聲。
      - wait: 3
      - { sfx: bell_toll, at: front-left, text: 噹——, vib: bell }
      - { sfx: silence_drop }
      - pause: 1.5
      - { sfx: heartbeat, vib: heartbeat }
      - end: reset
