chapter: 3
title: 沒有已知死者
start: c3_train
advance:
  - if: know.k_no_known_death
    to: 4
scenes:
  # ─────────────────────────────────────────── 06:12
  - id: c3_train
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 鬧鐘。六點十二分。
      - if: know.k_c3_boxun_died_again
        then:
          - think: 上一次我把所有人都移開了，只漏掉陳醫生。
          - think: 他還是走進了那條通道。
          - narr: 我把額頭靠上車窗，玻璃跟著鐵軌震，涼意從眉心往裡滲。
          - pause: 1.5
          - think: 這次先從醫院後門想起。
        else:
          - narr: 這一次我沒有站起來。我坐在位子上，把今天從頭到尾在腦子裡走一遍。
          - if: know.k_maintenance_passage
            then:
              - think: 若晴傍晚到舊車站。她不來的那一次，陳醫生傍晚六點十二分走進通道。
            else:
              - think: 若晴傍晚會去舊車站。她不去的話，死在那裡的就換成陳醫生。
          - think: 庭安、予安、周警官，今天也都在鎮上的某個地方。
          - pause: 1.5
          - { think: 如果讓所有人都不要靠近那裡呢？, mem: m_c3_everyone }
          - pause: 2
          - think: 我想這件事的口氣太冷靜了，冷靜到我自己有點怕。
      - { sfx: cough, at: back-left, dist: mid, text: 咳 }
      - narr: 後面的人準時咳嗽，斜後方有人在剝橘子。我拿它們來對時間，一聲一聲對過去。
      - { sfx: station_chime, at: front, dist: far, text: 叮咚—— }
      - { announcer: 下一站，灰潮鎮。, as: 廣播, via: speaker }
      - narr: 口袋裡那行點字還在原來的地方。
      - { sfx: train_brake, at: front, dist: mid, text: 嘰—— }
    next: c3_platform

  # ─────────────────────────────────────────── 07:40
  - id: c3_platform
    time: "07:40"
    place: 灰潮鎮站
    ambience: [platform]
    cast: { yuan: front-right }
    beats:
      - { sfx: train_door, at: right, dist: near, text: 嘶——喀 }
      - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
      - narr: 他還沒開口，我已經先轉向右前方。
      - yuan: 比我想的早。
      - me: 車沒誤點。
      - yuan: 灰潮鎮唯一還算準時的東西。
      - if: chloop >= 2
        then:
          - think: 這段我連他在哪裡換氣都背得出來。
        else:
          - think: 像兩個人在對台詞，只是只有我手上拿著劇本。
      - yuan: 請扶著我的左手肘。前面有樓梯。
      - me: 予安，你今天傍晚可以待在店裡嗎？
      - yuan: 店裡？我晚上八點本來就——
      - me: 不用到八點。六點到七點，不要出門就好。
      - yuan: 為什麼？
      - choice:
          timeout: 8
          default: 2
          options:
            - text: 「拜託。」
              then:
                - pause: 1.5
                - yuan: 好。我待在店裡。
            - text: 「會有人去店裡找你。」
              then:
                - yuan: 誰？
                - me: 你待著就知道。
                - yuan: 喔……好。
                - think: 六點到七點，根本不會有人去。
            - text: （不解釋）
              then:
                - yuan: 好。我不問。
    next: c3_calls_morning

  # ─────────────────────────────────────────── 08:40
  - id: c3_calls_morning
    time: "08:40"
    place: 林家老屋，客廳
    ambience: [old_house]
    cast: { yuan: front, tingan: right, zhiyuan: right }
    beats:
      - { sfx: door_creak, at: front, dist: near, text: 吱—— }
      - narr: 門還是卡住，他還是用肩膀撞開。我讓這段照原樣過去。
      - if: chloop >= 2
        then:
          - { sfx: door_close, at: front, dist: mid, text: 碰 }
          - narr: 他回店裡以後，我照上一次的順序撥了兩通電話。
          - think: 庭安六點在咖啡店等我，周警官六點半在派出所等我。
          - think: 兩個人答應的話，跟上一次一個字都沒差。
        else:
          - if: know.k_tingan_card
            then:
              - { sfx: door_close, at: front, dist: mid, text: 碰 }
              - narr: 他回店裡以後，屋子只剩下木頭熱脹冷縮的聲音。
              - think: 名片沒有跟著我回來，手機念過的那串號碼倒是還在。
              - think: 看不見以後，我記號碼記得特別快。
            else:
              - think: 庭安。我知道她叫什麼，不知道去哪裡找她。
              - me: 予安，鎮上是不是有一個記者？講話很快，問題一大堆。
              - me: 你知道怎麼找到她嗎？
              - yuan: 那個記者喔。她前幾天來店裡問過一些以前的事。
              - yuan: 有留名片。我回店裡拍給妳。
              - yuan: 妳怎麼會知道她？
              - me: 聽說的。
              - { sfx: door_close, at: front, dist: mid, text: 碰 }
              - narr: 他回店裡以後，屋子只剩下木頭熱脹冷縮的聲音。
              - { sfx: phone_notify, at: right, dist: near, text: 叮 }
              - phone: 周予安傳送了一張圖片。
              - phone: 偵測到文字。葉庭安，記者。
              - phone: 以下為電話號碼。
          - phone: 撥號中。
          - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
          - tingan: 喂？請問哪位？
          - me: 葉小姐嗎？我姓林。聽說妳在找人受訪。
          - tingan: 等一下，妳怎麼會有我的電話？誰給妳的？
          - narr: 我把手機換到左耳，空出來的右手拇指在桌緣上來回磨。
          - if: know.k_tingan_card
            then:
              - me: 妳的名片。
              - tingan: 我給過妳名片？我們見過面嗎？
              - me: 鎮上有人轉給我的。
              - think: 對她來說，那張名片還好好地躺在她自己的包包裡。
            else:
              - me: 鐘錶店的周予安。
          - tingan: 所以妳願意受訪？什麼時候可以？在哪裡？
          - think: 她問問題的速度，像雨打在雨衣上。
          - me: 今天傍晚六點，老街那家咖啡店。
          - tingan: 六點。好，六點，我記下來了。
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
          - { think: 我不會去。, mem: m_c3_wont_go }
          - phone: 撥號中。灰潮鎮派出所。
          - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
          - zhiyuan: 派出所。
          - me: 周警官嗎？我想查一件舊案，不是我姊姊的。
          - zhiyuan: 哪一件。
          - me: 九年前港口倉庫那場火。
          - zhiyuan: 那個要調檔，傍晚才會有。
          - me: 我六點半過去拿，麻煩你等我。
          - zhiyuan: 好，六點半。
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
          - think: 隨便挑一件舊案。我只要他六點半坐在派出所裡。
          - think: 一通電話擺好一個人。我在腦子裡把他們一個一個放上去。
    next: c3_street

  # ─────────────────────────────────────────── 13:30
  - id: c3_street
    time: "13:30"
    place: 老街
    ambience: [street_morning]
    cast: { yuan: right, child: front-left }
    threads:
      radio:
        beats:
          - { sfx: radio_noise, at: left, dist: mid, text: 沙沙—— }
          - { old_man: ……今天傍晚，北部沿海有短暫陣雨……, as: 收音機, at: left, via: radio }
          - { old_man: 舊城更新工程，本週持續進行……, as: 收音機, at: left, via: radio }
          - { old_man: 請用路人注意改道標示。, as: 收音機, at: left, via: radio }
    beats:
      - yuan: 這邊人多，扶著我。
      - narr: 中午我請予安陪我去老街。他說送完這段就得回店裡，客人下午要來拿錶。
      - narr: 騎樓底下飄出炸雞排的油味，腳底是新換的地磚，遠一點有人按腳踏車鈴。
      - { cue: radio, at: left, text: 沙沙——, sfx: static_burst }
      - narr: 有台收音機在店門口唱老歌，唱到一半變成新聞。
      - if: chloop >= 2
        then:
          - think: 一點半，老街。那台貨車又要從背後過來了。
        else:
          - think: 一點半，老街。上一次它從我背後擦過去，我只來得及感覺到那陣風。
      - think: 那台貨車幾乎沒有引擎聲，只有輪胎壓過水溝蓋的時候會喀一下。
      - heart: slow
      - narr: 我把油味和鈴聲往耳朵外面推，只留下背後那一塊路面的聲音。
      - pause: 1.5
      - { sfx: tools_clink, at: back-right, dist: mid, text: 喀 }
      - locate:
          sfx: truck_pass_quiet
          at: back
          decoys: [{ sfx: bicycle_bell, at: front-left }]
          tries: 2
          timeout: 7
          prompt: 它從哪邊來？
          success:
            - narr: 我拉住予安的手肘，把他往騎樓裡帶了一步。
            - { sfx: truck_pass_quiet, at: right, dist: near, text: 嘶——, vib: thud }
            - yuan: 哇。
            - narr: 一陣冷風從我們旁邊刷過去。
            - yuan: 那台車完全沒聲音欸。
            - set: c3_pulled
          fail:
            - { sfx: truck_pass_quiet, at: right, dist: near, text: 嘶——, vib: thud }
            - narr: 我的手伸出去的時候，車身已經貼著予安擦過去，他的袖子被風掀起來，打在我手背上。
            - yuan: ……欸。
            - narr: 我抓住他的手肘，自己的手在抖，過了好一陣子才停。
            - yuan: 沒事啦，沒擦到。
            - think: 又慢了一步。
            - set: c3_truck_late
      - { sfx: ball_bounce, at: front-left, dist: mid, text: 咚、咚、咚 }
      - { child: 我的球！, as: 小孩 }
      - choice:
          timeout: 3
          default: 1
          options:
            - text: （蹲下，伸手）
              then:
                - narr: 我蹲下去，球剛好撞進手心，橡膠涼涼的。
                - { child: 謝謝姊姊！, as: 小孩 }
                - set: c3_ball
            - text: （不動）
              then:
                - { sfx: ball_bounce, at: front, dist: far, text: 咚…… }
                - { sfx: car_pass, at: front, dist: mid, text: 咻—— }
                - yuan: 我去撿。
      - heart: off
      - { sfx: fry_sizzle, at: front-right, dist: mid, text: 滋—— }
      - narr: 雞排攤的油鍋又滋了一聲，我這才發現自己一直踮著腳，腳跟慢慢放回地磚上。
      - pause: 1.5
      - if: chloop >= 2
        then:
          - think: 他要說那句話了。
      - yuan: 妳今天怪怪的。
      - me: 沒事。
      - yuan: 我不是說妳心情不好。
      - if: flag.c3_pulled
        then:
          - yuan: 車還沒來，妳就先拉我。
      - if: flag.c3_truck_late
        then:
          - yuan: 剛剛那台車，我根本沒聽到。妳比我先轉頭。
      - if: flag.c3_ball
        then:
          - yuan: 球也是。它還沒滾過來，妳就蹲下去了。
      - yuan: 早上在月台也是，我還沒開口，妳就先轉過來。
      - { yuan: 妳像是已經來過這裡很多次了。, learn: k_yuan_many_times, mem: m_c3_many_times }
      - pause: 2.5
      - if: chloop >= 2
        then:
          - think: 一個字都沒變。對他來說，每一次都是第一次這樣講。
      - narr: 我沒有回答，他也就沒有再問。
      - yuan: 對了。
      - yuan: 老家那把鑰匙有一齒磨平了，不太好轉。下次不好開就換備用那把。
      - { yuan: 備用鑰匙在門口第三個花盆底下。我爸以前放的。, learn: k_spare_key, mem: m_c3_spare_key }
      - think: 第三個花盆。我把這件事收好。
      - yuan: 那我回店裡。六點到七點不出門。
      - yuan: 答應妳的我會做到。
    next: c3_ruoqing

  # ─────────────────────────────────────────── 15:40
  - id: c3_ruoqing
    time: "15:40"
    place: 老街咖啡店
    ambience: [cafe]
    cast: { ruoqing: front, old_woman: back-left, woman: back-left }
    threads:
      talk:
        beats:
          - { old_woman: 欸，那個拿手杖的小姐，妳認識喔？, as: 店長 }
          - { woman: 沒看過啦，不是鎮上的吧。, as: 客人 }
          - { old_woman: 那她怎麼一進來就叫得出若晴的名字？, as: 店長 }
          - { woman: 現在的人喔，什麼都查得到啦。, as: 客人 }
          - { sfx: spoon_stir, at: back-left, dist: mid, text: 叮叮 }
    beats:
      - { sfx: shop_bell, at: back, dist: near, text: 叮鈴 }
      - narr: 店裡是咖啡豆的焦香，蒸汽管在叫，她的腳步在我前面停住。
      - ruoqing: 歡迎光臨，一位嗎？
      - if: chloop >= 2
        then:
          - think: 上一次我是怎麼開口的？不管怎麼開口，她都會問同一個問題。
        else:
          - think: 這一次沒時間慢慢認識她了。
      - me: 若晴。
      - ruoqing: 欸？我們認識嗎？
      - { sfx: strap_click, at: front, dist: near, text: 喀、喀 }
      - me: 妳今天傍晚不要去舊車站。
      - narr: 背帶扣的聲音停了。
      - heart: slow
      - pause: 2
      - ruoqing: ……妳怎麼知道我要去？
      - ruoqing: 妳看不見，也從來沒來過店裡。
      - { ruoqing: 妳怎麼知道我今天要去哪？, mem: m_c3_how_know }
      - think: 對她來說，我們今天才第一次見面。
      - choice:
          timeout: 12
          options:
            - text: 「陳醫生跟我說的。」
              then:
                - ruoqing: 陳醫生才不會跟別人講這種事。
                - ruoqing: 他連我媽吃什麼藥都不跟別人講欸。
                - think: 我說謊了。她的聲音一下子退得比較遠。
                - narr: 我的舌頭抵著上排牙齒，抵得發酸，等她把下一句講完。
                - tension: 8
                - set: c3_lied
            - text: 「我沒辦法解釋。可是我知道傍晚會發生什麼事。」
              then:
                - ruoqing: 會發生什麼？
                - me: 會有人受傷。
                - { sfx: strap_click, at: front, dist: near, text: 喀、喀、喀 }
                - ruoqing: 欸……妳現在是在威脅我嗎？
                - me: 不是。
                - narr: 沒拿手杖的那隻手握成拳，指甲掐進掌心。
                - tension: 6
                - set: c3_pressed
            - text: 「如果我說，今天這一天我已經過好幾次了呢？」
              then:
                - pause: 2.5
                - narr: 我以為她會笑，結果她沒有。
                - ruoqing: 妳講得好像真的一樣。
                - set: c3_truth
          silence:
            - pause: 3
            - ruoqing: 妳不講，我也不知道要怎麼回妳啊。
            - { sfx: strap_click, at: front, dist: near, text: 喀 }
            - ruoqing: 妳這樣好像我阿嬤喔。她有事要講，都要先不講話瞪我三分鐘。
            - set: c3_pressed
      - if: flag.c3_truth
        then:
          - ruoqing: 好啦，我今天不去。
          - ruoqing: 不是因為我相信妳喔。
          - { ruoqing: 是因為妳聽起來很怕。, mem: m_c3_sound_afraid }
          - narr: 我這才發現自己的肩膀一直聳著，聳到脖子發酸，慢慢放下來。
          - tension: -8
        else:
          - if: flag.c3_lied
            then:
              - ruoqing: 好，我不去。
              - ruoqing: 可是妳不要再來店裡了。
            else:
              - ruoqing: 陳醫生那邊，我晚一點再跟他說。
              - ruoqing: 這樣可以了吧？我還在上班欸。
      - heart: off
      - me: 傍晚我打給妳，確認妳在家。過了六點半，再跟妳報平安。
      - if: flag.c3_lied
        then:
          - ruoqing: ……報完平安就不要再打來了。
        else:
          - ruoqing: 喔……好啦。
      - narr: 她很快地念了一串號碼，只念一次。
      - think: 我記住了。
      - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
      - narr: 她答應了，可是走開的腳步比走過來的時候快。
      - { cue: talk, at: back-left, text: 窸窸窣窣, sfx: huddle_rustle }
      - think: 我帶過午夜的那些事，在她那邊什麼都不算。
    next: c3_hospital

  # ─────────────────────────────────────────── 17:20
  - id: c3_hospital
    time: "17:20"
    place: 醫院後門
    ambience: [hospital, wind_open]
    cast: { boxun: front }
    beats:
      - narr: 我在醫院後門等。冷氣的排風口嗡嗡吹，推車的輪子在走廊另一頭滾。
      - narr: 廣播在叫某個人的名字，叫了兩次都沒有人應。
      - if: know.k_c3_boxun_died_again
        then:
          - think: 上一次他從這扇門出去，就沒有回來。
          - daze: light
          - { sfx: tinnitus, at: center }
          - narr: 排風口的嗡嗡聲一下子退到牆後面，耳朵裡換成一條細細的高音，拉著不放。
          - narr: 手臂上起了一層雞皮疙瘩，從手腕一路爬到肩膀。
          - daze: off
          - { sfx: cart_roll, at: front-left, dist: far, text: 喀啦喀啦 }
          - narr: 推車的輪子又在走廊那頭滾起來，排風口的聲音跟著回到原來的地方。
          - think: 我那時候只想著怎麼讓他停下來，一句真話都沒有給他。
        else:
          - think: 他傍晚要去舊車站，總要從這扇門出來。幾點出來我不知道，只能早一點來等。
      - { wait: 15, clock: "17:20", until: "17:38" }
      - clock: "17:38"
      - { sfx: door_open, at: front, dist: far, text: 喀 }
      - narr: 前面很遠的地方，鐵門推開了。風先把消毒水的味道送過來。
