      - wait: 3.2
      - { sfx: bell_toll, at: front-left, text: 噹——— }
      - wait: 3.2
      - { sfx: bell_toll, at: front-left, text: 噹———, vib: bell }
      - wait: 3
      - narr: 指尖下的凸點沒有跟著鐘聲動。中間那一格還是歪的。
      - { sfx: bell_toll, at: front-left, text: 噹——— }
      - wait: 3.2
      - { sfx: bell_toll, at: front-left, text: 噹———, vib: bell }
      - wait: 3.2
      - { sfx: bell_toll, at: front-left, text: 噹——— }
      - wait: 3.2
      - { sfx: bell_toll, at: front-left, text: 噹———, vib: bell }
      - wait: 3.4
      - think: 不要回來。
      - { sfx: bell_toll, at: front-left, text: 噹——— }
      - wait: 3.2
      - { sfx: bell_toll, at: front-left, text: 噹———, vib: bell }
      - wait: 3.2
      - { sfx: bell_toll, at: front-left, text: 噹——— }
      - wait: 3.4
      - think: 我已經回來了。
      - { sfx: bell_toll, at: front-left, text: 噹———, vib: bell }
