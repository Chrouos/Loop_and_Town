# 第六章｜第七封信
# 盲眼主角版。格式見 docs/design.md §11；故事見 docs/story.md §2、§5。
# 白天是一個有時間成本的調查 hub：09:30、11:00、12:30、14:00、15:30 五個時段。
# 鎮上的地方花一個時段；派出所與研究所花兩個。不夠全部去。17:40 的桌子一定會到。
# 媒介的異常（擦掉的一行、18:03、燒掉的備份、東牆機櫃）是改寫的謎，留給後面；信不是。
# 揭曉看這一輪她做了什麼：拿到圖書館或若晴的線索 → 20:40 她去鐘錶店當面問他；
# 沒有證據、早上也沒替他排六點到七點（只問他今天要做什麼），白天又出門問過人 → 21:30 予安自己來老家；
# 沒有證據、又替他排了行程 → 他照做，晚上只傳來「我也有一件事」，就吞回去（lead_c6_he_waited），這一天重來。
# 沒有證據、沒排行程，可是一整天沒去問任何人 → 他也不來，只傳訊息問她找到了沒（lead_c6_not_asked），這一天重來。
chapter: 6
title: 第七封信
start: c6_train
advance:
  - if: know.k_yuan_sent_letter
    to: 7

scenes:
  # ─────────────────────────── 06:12 列車 ───────────────────────────
  - id: c6_train
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front, child: back-right, woman: back-right }
    threads:
      kid:
        beats:
          - { child: 媽媽，那個姊姊為什麼一直閉著眼睛？, at: back-right, as: 小孩 }
          - { woman: 噓。, at: back-right, as: 小孩的媽媽 }
          - { child: 她在睡覺喔？, at: back-right, as: 小孩 }
          - pause: 1
          - { woman: ……她在聽啦。, at: back-right, as: 小孩的媽媽 }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 鬧鐘。六點十二分。
      - narr: 醒來的時候，我的指尖已經停在那一行凸點上，好像睡著前就一直放在那裡。
      - think: 不、要、回、來。
      - narr: 同樣的高度，同樣的間隔。每一次醒來，它都在同一個地方等我。
      - pause: 2
      - { think: 知夏死的時候，我還看得見。, mem: m_c6_could_see }
      - think: 那這封信是寫給誰的？她從來沒見過現在的我。
      - { cue: kid, at: back-right, text: 嘻嘻, sfx: kid_laugh }
      - pause: 1.5
      - think: 誰知道我現在看不見？
      - think: 仲介、房東、學校資源教室的老師，復健中心那個每次都遲到的教練。
      - think: 予安，仲介跟他說的。然後就是整個鎮，鎮上就這麼小。
      - narr: 我一個一個數過去。名字數得出來，數不出哪一個會打點字。
      - if: know.lead_c6_form && !know.k_c6_two_records
        then:
          - think: 上一次，陳醫生把病歷收回抽屜，又多講了一句：她初診填過一張單子。
      - { wait: 14, clock: "06:12" }
      - { sfx: thud, at: front-left, dist: near, gain: 0.18, text: 叩 }
      - narr: 頭上的行李架，我的行李箱跟著車廂輕輕撞了一下。最底層是那六封信，橡皮筋還綁著。
      - { sfx: station_chime, at: front, dist: far, text: 叮——咚—— }
      - { announcer: 下一站，灰潮鎮。, as: 廣播, via: speaker }
      - think: 十八點三十一分，我已經知道今天要怎麼過。
      - think: 我要的是剩下的時間。
      - { sfx: train_brake, at: front, dist: mid, text: 嘰—— }
    next: c6_arrival

  # ─────────────────────────── 07:40 月台 ───────────────────────────
  - id: c6_arrival
    time: "07:40"
    place: 灰潮鎮站
    ambience: [platform]
    cast: { yuan: front-right }
    beats:
      - { sfx: train_door, at: left, dist: near, text: 噗嘶 }
      - { sfx: step_uneven, at: front-right, dist: mid, text: 咚、叩 }
      - yuan: 比我想的早。
      - narr: 後面那幾句我都知道，就讓它們照原樣過去。
      - narr: 他的左手肘停在我右手邊，高度剛好。機油味裡混著一點黃銅。
      - think: 第一次在這個月台，他就把手肘放在對的位置。像練過。
      - if: know.lead_c6_he_waited
        then:
          - think: 上一次我叫他傍晚待在店裡。他待了一整個傍晚，晚上傳來一句「我也有一件事」，又說明天再講。
      - if: know.lead_c6_not_asked
        then:
          - think: 有一次我一整天沒去問誰。晚上他傳來一句「我也有一件事」，問我找到了沒有，又說明天再講。
      - choice:
          options:
            - text: 「予安，今天傍晚六點到七點，你待在店裡好不好？」
              then:
                - pause: 1
                - yuan: ……可以啊。怎麼了？
                - me: 晚一點再跟你說。
                - yuan: 好。
                - think: 晚一點，我不會說。
                - set: c6_arranged
            - text: 「你今天本來要做什麼？」
              then:
                - pause: 1
                - yuan: ……下午阿伯要來拿他太太那支錶。
                - yuan: 我答應他今天修好，本來就在店裡。
                - yuan: 錶帶是他太太自己換過的，扣環歪一邊。我不敢幫他扳正。
                - pause: 1.5
                - yuan: 妳呢？回來要做什麼？
                - me: 我收到一封信，沒有寄件地址。我想知道是誰寄的。
                - { sfx: suitcase_roll, src: 行李箱, at: front-right, dist: near, text: 喀 }
                - narr: 輪子卡進下一道縫，他沒有馬上拉出來。
                - yuan: ……喔。
                - pause: 1.5
                - yuan: 找到了，跟我講一聲。
                - narr: 他把輪子拉出來。手肘回到我右手邊，高度一點都沒變。
      - { sfx: construction_drill, at: left, dist: far, text: 噠噠噠 }
    next: c6_calls

  # ─────────────────────────── 08:20 電話 ───────────────────────────
  - id: c6_calls
    time: "08:20"
    place: 林家老屋，客廳
    ambience: [old_house]
    cast: { ruoqing: right, boxun: right, tingan: right, yuan: front }
    beats:
      - if: know.k_spare_key
        then:
          - narr: 門口第三個花盆。我蹲下去，手指伸進盆底那道泥巴縫。
          - { sfx: key_jingle, at: front, dist: near, text: 鏘 }
          - yuan: ……妳怎麼知道在那裡？
          - me: 你跟我講過。
          - pause: 1
          - me: ……你不記得也沒關係。
        else:
          - { sfx: door_creak, at: front, dist: near, text: 碰——吱呀 }
          - narr: 門又卡住了。他用肩膀頂了兩下，灰塵落在我手背上。
      - narr: 予安回店裡以後，我坐在客廳，手機放在膝蓋上。
      - think: 每個人都有一句會讓他留下來的話。那些話我全都聽過了。
      - if: know.k_c6_they_check
        then:
          - think: 上一次我讓他們各自以為是對方取消的。若晴一掛電話，就打去問陳醫生了。
      - narr: 拇指停在若晴的名字上。要講的話，我在列車上就排好了。
      - choice:
          options:
            - text: （照排好的說法，說是陳醫生要改天）
              then: [{ set: c6_call_lie }]
            - text: （直接說：我很怕傍晚那邊，要不要改，妳自己決定）
      - if: "!flag.c6_call_lie"
        then:
          - phone: 撥號中。許若晴。
          - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
          - { ruoqing: 喂？哪位？, via: phone }
          - me: 我是林家的。陳醫生今天傍晚要給妳的東西，可不可以改天再拿？
          - { ruoqing: ……妳怎麼知道這件事？, via: phone }
          - me: 我說不出理由，只是很怕傍晚那邊。要不要改，妳自己決定。
          - { sfx: strap_click, at: right, dist: near, text: 喀、喀 }
          - { ruoqing: 我問一下陳醫生。他要是也覺得怪，就改明天。, via: phone }
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
          - narr: 我把手機放在膝蓋上等。冰箱轉了一陣，停了，又開始轉。
          - { sfx: phone_notify, at: right, dist: near, text: 叮 }
          - phone: 許若晴：陳醫生說改明天早上，在醫院。他說他今天留在醫院。
          - think: 改到明天早上，是他們兩個在電話裡講好的。我只是先打了第一通。
          - set: c6_calls_honest
        else:
          - phone: 撥號中。許若晴。
          - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
          - narr: 我的拇指在手機殼的邊上來回刮，刮到一道舊裂痕，就停在那裡。
          - { ruoqing: 喂？哪位？, via: phone }
          - me: 我是林家的。陳醫生要我跟妳說，今天傍晚的事改天。
          - { ruoqing: 改天？欸他怎麼不自己——, via: phone }
          - me: 他說會再找妳。
          - { sfx: strap_click, at: right, dist: near, text: 喀 }
          - narr: 背帶扣響了一聲，就沒有再響。
          - { ruoqing: ……喔。好啦，那我自己打給他確認一下。, via: phone }
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
          - think: 她要打給他。我得比她快。
          - phone: 撥號中。灰潮鎮醫院。
          - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
          - { boxun: 陳柏勳。, via: phone }
          - me: 陳醫生，若晴今天傍晚不去舊車站了。她要我轉告你。
          - { sfx: phone_notify, at: right, dist: near, text: 嘟、嘟 }
          - { boxun: ……妳稍等。她剛好打進來。, via: phone }
          - narr: 電話那頭變成一段很薄的等待音。我把手機貼在耳朵上，貼到耳廓發燙。
          - pause: 4
          - { boxun: 她說，是我叫她改天的。, via: phone }
          - { boxun: 我沒有說過這句話。, via: phone }
          - pause: 1.5
          - { boxun: 妳讓我們各自以為，是對方取消的。, via: phone, learn: k_c6_they_check }
          - heart: fast
          - narr: 我的拇指停在那道舊裂痕上，按下去，按到殼子喀了一聲。
          - choice:
              timeout: 12
              options:
                - text: 「因為我怕你們兩個，傍晚都在那裡。」
                  then:
                    - pause: 2
                    - { boxun: ……那妳一開始就應該這樣講。, via: phone }
                    - { boxun: 我跟若晴說好了，改明天早上，在醫院。, via: phone }
                - text: 「我記錯了。」
                  then:
                    - { boxun: 妳沒有記錯。妳講得太順了，順得像練過。, via: phone }
                    - { boxun: 東西我們自己改到明天。這種電話，請妳不要再打。, via: phone }
                    - tension: 8
              silence:
                - pause: 2.5
                - { boxun: ……我們自己改到明天。這是我跟她的事。, via: phone }
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
          - set: c6_caught
          - think: 我聽過他們太多次了。可是他們兩個之間，還有一通我不在線上的電話。
      - phone: 撥號中。葉庭安。
      - { sfx: phone_ring, at: right, dist: near, text: 嘟—— }
      - { tingan: 喂？哪位？……妳怎麼會有這支號碼？, via: phone }
      - me: 林家的。妳想採訪的那一家。
      - me: 傍晚五點四十來我家，我知道的都告訴妳。
      - pause: 1.5
      - { tingan: 五點四十。林家老屋對吧？好。, via: phone }
      - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
      - if: flag.c6_caught
        then:
          - think: 三通電話，十一分鐘。第一次的時候，我花了一整天。
          - { think: 我以為我越來越會了。他們只是沒有我，也會自己商量。, mem: m_c6_good_at_it }
        else:
          - think: 兩通電話，比我排的多花了幾分鐘。多出來的，是等若晴回訊息的那一段。
    next: c6_h0930

  # ─────────────────────────── 白天：時段 ───────────────────────────
  - id: c6_h0930
    time: "09:30"
    place: 林家老屋門口
    ambience: [street_morning]
    beats:
      - { sfx: door_close, at: back, dist: near, text: 碰 }
      - { sfx: bicycle_bell, at: left, dist: mid, text: 叮叮 }
      - narr: 巷口的早餐店在收攤，鐵盤一個疊上一個，鏘、鏘。
      - think: 九點半到五點半，八個小時。
      - think: 圖書館、醫院、咖啡店都在鎮上，去一趟一個多小時。
      - think: 派出所要等人，研究所在北邊的坡上。那兩個地方，去一趟就是半天。
      - think: 不夠全部去。
      - choice:
          options:
            - text: （回知夏的房間，再摸一次筆記本）
              if: "!flag.c6_d_note"
              then: [{ set: c6_r1100 }, { goto: c6_note }]
            - text: （去圖書館）
              if: "!flag.c6_d_library"
              then: [{ set: c6_r1100 }, { goto: c6_library }]
            - text: （去醫院，找陳醫生）
              if: "!flag.c6_d_hospital"
              then: [{ set: c6_r1100 }, { goto: c6_hospital }]
            - text: （去咖啡店，找若晴）
              if: "!flag.c6_d_cafe"
              then: [{ set: c6_r1100 }, { goto: c6_cafe }]
            - text: （去派出所找周警官，要花半天）
              if: "!flag.c6_d_police"
              then: [{ set: c6_r1230 }, { goto: c6_police }]
            - text: （上北邊的坡，去研究所找庭安，要花半天）
              if: "!flag.c6_d_institute"
              then: [{ set: c6_r1230 }, { goto: c6_institute }]
            - text: （去鐘樓廣場坐一下）
              disabled_if: flag.c6_square_done
              then: [{ set: c6_r1100 }, { goto: c6_square }]
            - text: （結束調查，慢慢走回家）
              goto: c6_dusk

