  # ─────────────────────────── 私人紙本：擦掉的一行 ───────────────────────────
  - id: c6_note
    place: 林家老屋，知夏的房間
    ambience: [room_tone]
    life:
      - { text: 沙啦, sfx: page_turn, at: [front, front-left, front-right], dist: near }
      - { text: 沙…… 沙……, sfx: paper_rustle, src: 紙頁, at: [front], dist: near }
      - { text: 喀, sfx: house_tick, src: 木桌, at: [front-left, front-right], dist: mid }
      - { text: 唰, sfx: paper_rustle, at: [front], dist: near }
    beats:
      - set: c6_d_note
      - { sfx: door_creak, at: front, dist: near, text: 吱—— }
      - narr: 書桌左邊缺了一個角，我的手先碰到它。筆記本在老地方。
      - { sfx: page_turn, at: front, dist: near, text: 沙啦 }
      - if: know.k_notebook_1831
        then:
          - narr: 十八點三十一分，一行接一行。這幾頁我已經摸到會背了。
        else:
          - narr: 前面幾頁的紙背是凸的。我一行一行摸過去，一、八，冒號，三、一，每一行都一樣。
      - think: 這一次，我不找數字。
      - narr: 我一頁一頁翻，先用整個手掌壓平，再用指腹慢慢走過去。
      - { wait: 14 }
      - narr: 有一頁摸起來不一樣。紙面起毛，像被橡皮擦來回擦了很多次，擦到起了細屑。
      - phone: 未偵測到文字。
      - think: 字擦掉了。可是她寫字很用力。
      - pause: 1.5
      - narr: 我把指腹放上去。凹痕很淺，被擦過的地方軟軟的，走快了就會滑掉。
      - touch:
          cells: [不, 要, 回, 來]
          style: groove
          prompt: 指腹順著擦掉的筆痕，慢慢走過去
      - think: 不。
      - pause: 1
      - think: 要。
      - pause: 1
      - think: 回。
      - pause: 1.2
      - { think: 來。, learn: k_erased_line, mem: m_c6_erased }
      - tension: 6
      - daze: light
      - pause: 2
      - narr: 胸口憋得發疼，我才發現自己從第一個字開始就沒有換氣。
      - daze: off
      - { sfx: cough_w, at: center, dist: near, text: 咳、咳 }
      - narr: 我吸進第一口氣，吸得太急，嗆了一下。
      - pause: 1
      - { sfx: envelope, at: center, dist: near, text: 沙 }
      - narr: 我把信拿出來，放在那一頁旁邊。左手下面的字是凸的，右手下面的字是凹的。
      - { think: 像同一句話的正面和背面。, mem: m_c6_two_sides }
      - pause: 2
      - think: 五年前她就寫過這一句。寫完，又擦掉了。
      - narr: 我記得她的字，那時候我還看得見。每一筆的尾巴都往右上翹，好像急著要去哪裡。
      - choice:
          timeout: 12
          default: 1
          options:
            - text: （把那一頁小心撕下來，帶走）
              then:
                - { sfx: paper_rustle, at: front, dist: near, text: 嘶—— }
                - narr: 紙撕開的聲音拉得很長。我撕得很慢，沒有撕到那幾個字。
                - set: c6_page_taken
            - text: （把筆記本闔上，留在原處）
              then:
                - { sfx: page_turn, at: front, dist: near, text: 啪 }
                - think: 她擦掉它，大概就是不想讓它被帶走。
      - think: 她擦掉的時候，是改變主意了，還是只是不想讓我讀到？
    next: c6_walk

  # ─────────────────────────── 公共紀錄：圖書館 ───────────────────────────
  - id: c6_library
    place: 鎮立圖書館
    ambience: [library]
    cast: { old_woman: front }
    threads:
      reader:
        beats:
          - { old_man: ……這一版的地圖，鐘樓還畫在上面。, at: back-left, as: 看報的老先生 }
          - { old_man: 新的那一版，連舊車站都沒畫了。, at: back-left, as: 看報的老先生 }
          - { sfx: page_turn, at: back-left, dist: mid, text: 沙啦 }
          - { old_man: 拆掉的東西，就不算了喔。, at: back-left, as: 看報的老先生 }
    beats:
      - set: c6_d_library
      - { sfx: door_open, at: back, dist: near, text: 吱 }
      - narr: 冷氣開得很強。紙的味道比老家的乾，還混著一點樟腦。
      - { cue: reader, at: back-left, text: 沙……, sfx: page_turn }
      - think: 知夏以前在這裡打工。
      - { old_woman: 妹妹，要找書喔？, as: 館員 }
      - me: 我想查一個人的借閱紀錄。林知夏。
      - pause: 1.5
      - { old_woman: ……妳是知夏的妹妹？, as: 館員 }
      - { old_woman: 五年了，第一次有人來問她的名字。, as: 館員 }
      - { sfx: typing, at: front, dist: near, text: 喀噠喀噠 }
      - { old_woman: 照規定是不行啦。可是她人都不在了……, as: 館員 }
      - { old_woman: 她帳號還在。有一本，《灰潮鎮志》下冊。, as: 館員 }
      - { old_woman: 五年前九月二十號借的。, as: 館員 }
      - { old_woman: 歸還日期……昨天。, as: 館員 }
      - me: 昨天？
      - { old_woman: 系統寫昨天啦。其實是前天傍晚拿來的。, as: 館員 }
      - { old_woman: 那時候快關門，我電腦關了，隔天早上才刷。, as: 館員 }
      - me: 誰拿來的？
      - { old_woman: 鐘錶店的周先生啊。, as: 館員, learn: k_library_return, mem: m_c6_returned }
      - narr: 我扶在櫃台上的手往裡一縮，碰到一枝用繩子綁住的原子筆，繩子被我扯得喀喀響。
      - { old_woman: 就周家那個兒子，予安。, as: 館員 }
      - { old_woman: 他說這本在他店裡放了五年，知夏放的，一直沒拿來還。, as: 館員 }
      - { old_woman: 逾期的錢我說不用了啦。五年耶，要算到什麼時候。, as: 館員 }
      - { old_woman: 他放下書就走了，說要去郵局門口丟一封信。, as: 館員 }
      - if: know.k_postmark_yesterday
        then:
          - think: 郵戳是昨天。
      - pause: 1.5
      - me: 他最近常來嗎？
      - { old_woman: 這禮拜來好幾次。還跟我們借了點字板。, as: 館員 }
      - { old_woman: 樓下無障礙那邊有一塊，鎮公所補助的，從來沒人借過。, as: 館員 }
      - { old_woman: 他說要幫一個客人弄東西。到現在還沒拿回來，我也不好意思催。, as: 館員 }
      - heart: fast
      - tension: 8
      - { sfx: breath, at: center, dist: near }
      - narr: 閱覽室太安靜了，我聽得見自己的呼吸，一口比一口粗。
      - if: know.k_slate_in_shop
        then:
          - narr: 我的手指記得那個形狀。鋁框，一排一排的小格子，木頭柄的點字筆。
          - think: 在他的抽屜裡。他說，是客人寄修的。
        else:
          - narr: 我的手指記得那個形狀。鋁框，一排一排的小格子，筆要從背面一格一格壓下去。
          - think: 我包包裡就有一塊，出門都帶著。
      - me: 那本書還在嗎？
      - { sfx: step, at: front-right, dist: far, text: 叩、叩 }
      - narr: 她走開，又走回來。一本很重的書放進我手裡，布面精裝，書脊裂了一道。
      - narr: 封底內頁貼著一個紙袋，裡面插著一張硬卡，邊角都磨圓了。
      - { old_woman: 舊的借書卡。還沒有電腦的時候在用的。, as: 館員 }
      - { old_woman: 最後一個章是五年前，十月三號到期。, as: 館員 }
      - narr: 我用拇指去摸那個章。印泥沒有凹痕，只有紙吃進墨的那一點粗。
      - heart: off
      - choice:
          timeout: 14
          options:
            - text: 「他來還書的時候，有說什麼嗎？」
              then:
                - { old_woman: 沒說什麼啊。他那個人本來就不太講話。, as: 館員 }
                - { old_woman: 喔，他有問我，點字板可不可以再借幾天。, as: 館員 }
                - { old_woman: 我說好啊，反正也沒人用。, as: 館員 }
            - text: （摸借書卡上的簽名欄）
              then:
                - narr: 卡片下半部是簽名欄。最後一格的凹痕很深，最後一筆的尾巴往右上翹。
                - think: 林知夏。她連簽名都壓得這麼用力。
            - text: （把書抱在懷裡）
              then:
                - narr: 很重。比她以前每天揹回家的書包還重。
                - { old_woman: ……要借喔？用妳的名字？, as: 館員 }
                - me: 嗯。
                - { old_woman: 這次要記得還喔。……啊，歹勢，我不是那個意思。, as: 館員 }
                - set: c6_book_borrowed
          silence:
            - narr: 我的手放在布面上，沒有動。冷氣從頭頂一直吹下來。
            - pause: 2.5
            - { old_woman: 這本五年都沒有人借。我每年清一次灰，每次都會翻到這張卡。, as: 館員 }
            - { old_woman: 翻到了，就再插回去。, as: 館員 }
    next: c6_walk

  # ─────────────────────────── 聲音與時間戳：派出所 ───────────────────────────
  - id: c6_police
    place: 灰潮鎮派出所
    ambience: [police_office]
    cast: { zhiyuan: front-right }
    threads:
      radio:
        beats:
          - { man: ……北區更新工地，下午測試供電，請巡邏留意。, at: back-left, as: 無線電, via: radio }
          - { sfx: static_burst, at: back-left, dist: mid, text: 嘶 }
          - { man: 舊站東側，重複，舊站東側。, at: back-left, as: 無線電, via: radio }
    beats:
      - set: c6_d_police
      - { sfx: door_open, at: back, dist: near, text: 吱 }
      - narr: 電扇在轉，遠處有電話在響。那股留在衣服上的菸味，又從桌子對面靠過來。
      - { cue: radio, at: back-left, text: 嘶——, sfx: static_burst }
      - { sfx: lighter_lid, at: front-right, dist: near, text: 叮、喀 }
      - narr: 桌子對面，一個金屬蓋子掀開又蓋上。沒有擦火石的聲音，也沒有人吸那一口。
      - choice:
          timeout: 7
          options:
            - text: 「周警官，我姓林。林知夏是我姊。」
              if: know.k_sig_zhiyuan
              then:
                - pause: 1.5
                - zhiyuan: ……誰跟妳說我坐這張桌子？
                - me: 你開了打火機的蓋子，沒有點。
                - { sfx: lighter_lid, at: front-right, dist: near, text: 叮 }
                - narr: 蓋子掀到一半就停住，沒有再蓋回去。
                - zhiyuan: 戒菸啦。手閒不下來。
                - set: c6_named_zhiyuan
            - text: （等他先開口）
              then:
                - zhiyuan: 小姐，什麼事？
                - me: 周警官，我姓林。林知夏是我姊。
      - pause: 2
      - if: flag.c6_named_zhiyuan
        then:
          - zhiyuan: ……案子結了。不過妳要講什麼，我聽。
        else:
          - zhiyuan: ……案子結了。
      - narr: 我把手杖立在兩腳中間，手指順著往下摸，摸過一節，又摸到下一節的接縫。
      - me: 你辦公桌右邊最裡面那個抽屜，要卡兩次才拉得開。
      - me: 裡面有一台沒有登錄的錄音機。
      - narr: 電扇轉過來又轉過去，他還沒開口。
      - zhiyuan: 誰跟妳講的。
      - choice:
          timeout: 10
          options:
            - text: 「你。只是你不記得。」
              then:
                - zhiyuan: 我不記得的事，就是沒發生。
                - think: 對你來說是這樣。
            - text: 「我不會說出去。我只想再聽一次。」
              then:
                - zhiyuan: 再？妳聽過？
                - me: 聽過。你放給我聽的。
                - zhiyuan: ……妳聽了也不會比較好過。
          silence:
            - pause: 3
            - { sfx: knuckle_knock, at: front-right, dist: near, text: 叩, src: 手指 }
            - narr: 他的手指在桌上敲了一下，隔了好幾秒，才敲第二下。
            - { sfx: knuckle_knock, at: front-right, dist: near, text: 叩, src: 手指 }
            - think: 第二下，隔得比第一下久。
      - { sfx: key_jingle, at: front-right, dist: mid, text: 鏘 }
      - { sfx: drawer_catch, variant: 1, at: front-right, dist: mid, text: 喀 }
      - { sfx: drawer_catch, variant: 2, at: front-right, dist: mid, text: 喀 }
      - { sfx: drawer, at: front-right, dist: mid, text: 喀啦—— }
      - narr: 卡了兩次，跟我記得的一樣。
      - { sfx: recorder_click, at: front, dist: near, text: 喀嚓 }
      - { sfx: tape_hiss, at: front, dist: near, text: 沙———— }
      - narr: 五年前的風，舊站大廳的回聲。
      - think: 這一段我聽過。這一次我不聽他說什麼，我聽時間。
      - { sfx: bell_toll_far, at: front-left, dist: far, text: 噹…… }
      - { zhiyuan: ……有人嗎？聽得到嗎？, as: 錄音裡的男聲, at: front, dist: far, via: tape }
      - { sfx: recorder_click, at: front, dist: near, text: 喀 }
      - me: 那天，她的手機有通聯紀錄嗎？
      - pause: 2
      - zhiyuan: ……有。
      - { sfx: paper_rustle, at: front-right, dist: near, text: 沙沙 }
      - narr: 他念的時候一個字一個字，像在念別人的口供。
      - zhiyuan: 十月三日，十八點零三分。
      - zhiyuan: 林知夏的門號，撥出。通話一分十二秒。
      - me: 打給誰？
      - zhiyuan: 報告上沒寫。我那時候也沒查。
      - pause: 1.5
      - zhiyuan: 還有一樣。她身上的隨身筆記本，最後一頁。
      - zhiyuan: 證物照片。我念給妳聽。
      - pause: 1.5
      - { zhiyuan: 「十八點零三分。收到。」, learn: k_tape_1803, mem: m_c6_1803 }
      - pause: 2.5
      - me: 撥出去的人，寫自己收到。
      - zhiyuan: 這兩行我當年也念了很多遍。
      - zhiyuan: 念到後來，就不念了。
      - think: 收到什麼，誰給的。我沒有問，他也不會知道。
      - choice:
          timeout: 12
          options:
            - text: 「你為什麼一直留著它？」
              then:
                - zhiyuan: 交出去就要解釋。我解釋不了。
                - pause: 1.5
                - zhiyuan: 留著，至少我還記得我解釋不了。
            - text: （把手放在錄音機上）
              then:
                - narr: 塑膠殼是溫的。他剛剛一直握著它。
            - text: 「謝謝你。」
              then:
                - zhiyuan: 不用謝啦。
                - zhiyuan: 我只是念給妳聽而已。
          silence:
            - { sfx: drawer_catch, variant: 1, at: front-right, dist: mid, text: 喀 }
            - { sfx: drawer_catch, variant: 2, at: front-right, dist: mid, text: 喀 }
            - narr: 電扇轉過來又轉過去。他把錄音機收回抽屜，卡了兩次才推進去。
            - zhiyuan: ……這個抽屜，我報修三年了。
    next: c6_walk

  # ─────────────────────────── 別人記錄的知夏：醫院 ───────────────────────────
  - id: c6_hospital
    place: 灰潮鎮醫院
    ambience: [hospital]
    cast: { boxun: front, woman: back-right }
    threads:
      nurses:
        beats:
          - { woman: 陳醫生今天怎麼一直待在辦公室？, at: back-right, as: 護理師 }
          - { woman: 他不是說傍晚要出去一趟？, at: back-right, as: 另一個護理師 }
          - { woman: 早上接了一通電話，就說不去了。, at: back-right, as: 護理師 }
    beats:
      - set: c6_d_hospital
      - { sfx: cart_roll, at: back-left, dist: far, text: 咿咿 }
      - narr: 消毒水，空調。推車的輪子在走廊另一頭咿咿地響。
      - { cue: nurses, at: back-right, text: 窸窸窣窣, sfx: huddle_rustle, whisper: true }
      - { sfx: hand_rub, at: front, dist: mid, text: 噗、沙沙 }
      - narr: 辦公桌那邊按了一下乾洗手，兩隻手搓開，搓了很久。
      - { woman: 陳醫生，三床的家屬在問抽血報告。, at: back-right, as: 護理師 }
      - boxun: 四點才出來。請他們先去吃飯，阿嬤吃完飯再抽一次血糖。
      - { sfx: step, at: back-right, dist: mid, to: back:far, text: 叩、叩 }
      - pause: 1
      - me: 陳醫生。我是林知夏的妹妹。
      - narr: 他開口之前會先停一下，這一次也是。
      - boxun: ……林小姐。
      - boxun: 早上那通電話，是妳打的。
      - me: 嗯。
      - boxun: 妳怎麼知道若晴今天要跟我拿東西？
      - me: 我想聽知夏的病歷。
      - pause: 2
      - boxun: 那不是可以隨便給家屬的東西。
      # 關口：跟第四章一樣，他只念給「跟她一樣的人」聽。家屬來要，他用病人隱私擋掉；她起身時，他會漏講出一張自填單。
      - choice:
          options:
            - text: 「你問過我：這是第幾次？」
              if: know.k_boxun_which_time
              then:
                - pause: 3
                - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
                - narr: 他手上那疊紙，沙的一聲停住了。
                - boxun: ……我不記得問過妳。
                - me: 你不記得。我記得。
                - pause: 2
                - boxun: 這句話，我只問過一個人。
                - set: c6_bx_open
            - text: 「她初診的時候，自己填過一張單子。」
              if: know.lead_c6_form
              then:
                - pause: 2.5
                - boxun: ……那張單子沒有進系統。
                - boxun: 妳不應該知道有那張。
                - me: 我知道。所以我才來。
                - set: c6_bx_open
            - text: 「給我我也讀不了。你念給我聽就好。」
              then:
                - pause: 2.5
                - boxun: 念給家屬聽，也是給。
      - if: "!flag.c6_bx_open"
        then:
          - boxun: 主訴、處置，妳去櫃台申請，醫院會給。其他的，家屬問，我也只能講到這裡。
          - { sfx: drawer, at: front, dist: near, text: 喀 }
          - { sfx: chair_scrape, at: center, dist: near, text: 嘎 }
          - narr: 紙收回抽屜，抽屜推緊。我扶著椅背站起來，椅腳在地磚上刮了一聲。
          - { boxun: ……她初診的時候，自己填過一張單子。我到現在還不知道要歸在哪裡。, learn: lead_c6_form }
          - heart: slow
          - { sfx: pen_scratch, at: front, dist: mid, text: 唰唰 }
          - narr: 我的手停在門把上，金屬很冰。他沒有再說下去，筆又開始在紙上走。
          - think: 一張她自己填的單子。他不是要給我，是自己多講了一句。
          - heart: off
          - goto: c6_walk
      - boxun: ……我念一段。
      - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
      - boxun: 主訴：失眠，頭痛。
      - boxun: 評估：個案堅稱記得尚未發生之事件。
      - boxun: 處置：觀察。排除睡眠障礙、壓力反應。
      - narr: 他念得很平，像在念別人寫的東西。
      - me: 是你寫的？
      - boxun: 是我寫的。
      - me: 她自己有寫過什麼嗎？
      - pause: 2
      - boxun: 初診的時候，有一張自填單。
      - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
      - narr: 兩張紙放進我手裡。一張是印表機印的，碳粉平平的，摸起來什麼都沒有。
      - narr: 另一張有凹痕，很深。
      - think: 她的字。
      - phone: 偵測到手寫文字。
      - { phone: 這件事，已經發生過。, learn: k_c6_two_records, mem: m_c6_already }
      - pause: 2.5
      - narr: 我的拇指壓在那幾道凹痕上，壓到指甲邊發疼。走廊那頭的推車還在咿咿地響。
      - think: 同一個人，同一個星期。一張說她記得還沒發生的事，一張說那件事已經發生過了。
      - { sfx: cough, at: front, dist: near, text: 咳 }
      - narr: 他清了一下喉嚨。
      - boxun: 我那時候以為那是一句症狀。
      - boxun: 後來……我不習慣把推測說成事實。
      - choice:
          timeout: 14
          options:
            - text: 「我收到一封點字信。署名是知夏。」
              then:
                - pause: 2.5
                - boxun: 知夏走的時候，妳看得見嗎？
                - me: 看得見。我是兩年前才看不見的。
                - pause: 2
                - boxun: 那寫那封信的人，知道現在的妳。
                - boxun: 目前我能說的只有這樣。
                - think: 知道現在的我。名單上那幾個名字，我又在心裡念了一遍。
            - text: （把兩張紙疊在一起）
              then:
                - narr: 平的那張在上面，凹的那張在下面。隔著一張紙，那幾道深痕還有一點起伏，字卻摸不清了。
            - text: 「謝謝你留著它。」
              then:
                - boxun: 我留著，不是為了誰。
                - pause: 1.5
                - boxun: ……也許是。
            - text: 「那封信還沒回？」
              if: know.k_boxun_invitation
              then:
                - pause: 2.5
                - { sfx: hand_rub, at: front, dist: near, text: 噗、沙沙 }
                - narr: 他又按了一次乾洗手，搓得比剛才還久。
                - boxun: 五年了。
                - boxun: 那是我的事。
                - { sfx: drawer, at: front, dist: near, text: 喀 }
                - narr: 抽屜拉開又推回去。推到底的時候，裡面有一張紙沙地滑了一下，聽起來比病歷厚。
          silence:
            - narr: 兩張紙還在我手上。他沒有伸手拿回去，我也沒有遞回去。
    next: c6_walk

  # ─────────────────────────── 被毀掉仍存在：研究所 ───────────────────────────
  - id: c6_institute
    place: 舊研究所
    ambience: [wind_open, sea_far]
    cast: { tingan: front-left, man: back-right }
    threads:
      workers:
        beats:
          - { man: 東邊那個新櫃子，下午又要測一次。, at: back-right, as: 坡下的工人 }
          - { man: 測什麼？上次也是什麼都沒發生。, at: back-right, as: 另一個工人 }
          - { man: 沒發生就好啦。, at: back-right, as: 坡下的工人 }
    beats:
      - set: c6_d_institute
      - narr: 往北的坡很陡。計程車停在半路，司機說上面不好迴車。
      - { sfx: gravel_step, at: center, dist: near, text: 沙、沙 }
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 剩下的路我自己走。碎石，接著是柏油，最後手杖敲到一道鐵網。
      - heart: slow
      - narr: 這條岔路我沒走過，之前都是從圖書館那邊跟庭安上來。碎石在鞋底下滾，數的步數早就亂了。
      - { cue: workers, at: back-right, text: 鏗、鏗, sfx: hammer }
      - { sfx: metal_rattle, at: front, dist: near, text: 嘩啦, src: 鐵網 }
      - narr: 風從坡下灌上來，鐵網被吹得一直晃。網子另一邊有東西在窸窣，聽不出是人還是塑膠袋。
      - think: 庭安穿雨衣。雨衣是那種會黏在一起又撕開的聲音。
      - locate:
          sfx: raincoat_rustle
          at: front-left
          decoys:
            - { sfx: wind_gust, at: right }
            - { sfx: hammer, at: back-right }
          tries: 2
          timeout: 14
          prompt: 鐵網另一邊，雨衣在哪裡響？
          success:
            - narr: 左前方。我手指扣著網眼往那邊走，一格一格數。第六格，網子斷了，是一道沒鎖的鐵門。
            - narr: 雨衣的聲音，就停在門的另一邊。
            - tingan: ……林家的？妳一個人上來？妳不是約我五點四十？
          fail:
            - me: 葉小姐？
            - narr: 風把我的聲音吹回臉上。坡下敲東西的聲音停了，網子另一邊什麼都沒回。
            - { man: 小姐，妳找誰？, at: back-right, as: 坡下的工人 }
            - { sfx: metal_rattle, at: front, dist: near, text: 嘩嘩, src: 鐵網 }
            - narr: 我抓住鐵網，鐵絲勒進指節，網子被我抓得嘩嘩響。手心全是汗。
            - { sfx: raincoat_rustle, at: front-left, dist: near, text: 沙、沙 }
            - tingan: 這邊啦，門在這邊。……林家的？妳一個人上來？
            - tingan: 妳不是約我五點四十？
      - me: 我等不到五點四十。
      - pause: 1
      - if: know.k_burned_copy
        then:
          - me: 五年前，妳燒過一份東西。
          - narr: 風還在吹，雨衣的沙沙聲停了。
          - tingan: 誰告訴妳的？
        else:
          - me: 我姊走了以後，她桌上那些紙，後來去哪裡了？
          - narr: 風還在吹，雨衣的沙沙聲停了。
          - tingan: ……誰叫妳來問這個的？
      - choice:
          timeout: 10
          default: 2
          options:
            - text: 「我姊。」
              then:
                - tingan: 她已經死了。
                - me: 我知道。
                - tingan: ……那妳不可能知道。
                - me: 對。
            - text: 「沒有人。我猜妳知道。」
              then:
                - tingan: 妳猜得也太準了吧。
            - text: （等她說下去）
              then:
                - pause: 4
                - tingan: ……妳很會等欸。我最怕這種受訪者。
      - tingan: 進來。外面風大。
      - { sfx: door_creak, at: front-left, dist: near, text: 嘎——吱 }
      - amb: [research_facility]
      - heart: off
      - narr: 門後很冷。一排機器在低低地轉，像一整排冰箱。
      - tingan: 她走了以後，桌上留了一疊紙。
      - tingan: 我把它燒了，在後面那塊空地。
      - tingan: 我記得火，記得紙捲起來的聲音。
      - pause: 2
      - tingan: 這個夏天，我在研究所的備份裡又找到一份。
      - { tingan: 內容差不多。可是不是那一份。, learn: k_burned_copy, mem: m_c6_burned }
      - me: 哪裡不一樣？
      - tingan: 檔名格式不一樣，存檔路徑不一樣。
      - tingan: 有幾段的順序換了。有一頁多了一個日期。
      - tingan: 像同一個人，換了一天，又寫了一次。
      - me: 誰存的？
      - tingan: 不知道。可能是她自己，可能是系統自動備份。
      - tingan: 也可能是我自己存了，然後忘了。
      - pause: 1.5
      - tingan: 我是記者欸。我最討厭「可能」。
      - { sfx: relay_click, at: left, dist: mid, text: 喀 }
      - tingan: 有些東西，我現在還不能給妳。
      - choice:
          timeout: 14
          options:
            - text: 「那封點字信，是妳寄的嗎？」
              then:
                - tingan: 什麼信？
                - me: 點字的，只有一行。署名是我姊。
                - pause: 2.5
                - tingan: 不是我。
                - tingan: 如果是我，我會署我自己的名字。
                - think: 她的聲音沒有往後退，也沒有往前湊。
            - text: （聽那排機器）
              then:
                - { sfx: relay_click, at: left, dist: mid, text: 喀、喀 }
                - narr: 低低的運轉聲，一直在同一個高度。
                - think: 不是那個聲音。
            - text: 「好。我不拿。」
              then:
                - pause: 1.5
                - tingan: ……妳不問為什麼？
                - me: 妳有妳的理由。
          silence:
            - { sfx: raincoat_rustle, at: front-left, dist: near, text: 沙 }
            - narr: 機器的運轉聲一直沒變。她的雨衣沙了一下，就不動了。
    next: c6_walk

  # ─────────────────────────── 若晴的照片，和對著光的信 ───────────────────────────
  - id: c6_cafe
    place: 老街咖啡店
    ambience: [cafe]
    cast: { ruoqing: front, old_woman: back-left }
    threads:
      counter:
        beats:
          - { old_woman: 若晴，豆子那包先不要開喔。, at: back-left, as: 店長 }
          - { sfx: coffee_grind, at: back-left, dist: mid, text: 嗡嘰嘰嘰 }
          - { old_woman: 那個外地課程的報名資料，妳弄了沒？, at: back-left, as: 店長 }
    beats:
      - set: c6_d_cafe
      - { sfx: shop_bell, at: back, dist: near, text: 叮鈴 }
      - ruoqing: 歡迎光——欸，妳是早上打電話來的那個？
      - ruoqing: 坐窗邊那張啦，有扶手。
      - { sfx: chair_scrape, at: front-left, dist: near, text: 嘎 }
      - if: flag.c6_call_lie
        then:
          - ruoqing: 陳醫生怎麼會叫妳傳話？你們認識喔？
          - me: 算認識。
          - think: 這句不算謊話，也算不上真話。
        else:
          - ruoqing: 欸，早上打來說很怕傍晚的就是妳喔？妳到底在怕什麼？
          - me: 我也還在找。
      - { cue: counter, at: back-left, text: 嗡嘰嘰, sfx: coffee_grind }
      - { sfx: strap_click, at: front, dist: near, text: 喀 }
      - me: 聽說妳都拍快要沒有的東西。舊車站東邊那面牆，妳拍過嗎？
      - if: know.k_hum_1831
        then:
          - think: 東側。那個聲音，是從那邊升起來的。
        else:
          - think: 為什麼是那面牆，我自己也說不上來。
      - ruoqing: ……有欸。兩張。妳等我一下。
      - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
      - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
      - ruoqing: 可是我不知道要怎麼……念一張照片耶。
      - me: 妳看到什麼就說什麼。
      - ruoqing: 喔，好。第一張，去年冬天。
      - ruoqing: 東牆，磁磚掉了一半。有一大片水漬，形狀很像台灣。
      - ruoqing: 牆角有一株草從裂縫長出來。我其實是要拍那個。
      - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
      - ruoqing: 第二張，今年春天，同一個位置。
      - ruoqing: 水漬被刷掉了，草也沒了。
      - { ruoqing: 牆上多了一個灰色的鐵櫃，比人高一點。, learn: k_new_cabinet, mem: m_c6_cabinet }
      - if: know.k_cabinet_warm
        then:
          - think: 有一個十月三日，我在那面牆腳摸過它。燙的，裡面一直在嗡。
      - ruoqing: 門上有一排小燈。下面拉出新的黑線，一路鑽進地下。
      - ruoqing: 側邊貼一張黃色貼紙，寫「備援」，後面一串編號。
      - ruoqing: 這是我唯一一張拍到「多出來」的東西。本來想丟掉，它不像《退潮以後》。
      - choice:
          timeout: 14
          options:
            - text: 「不要丟。」
              then:
                - ruoqing: ……為什麼？
                - me: 它有一天也會沒有。
                - { sfx: laugh_soft, at: front, dist: near, text: 呵 }
                - ruoqing: 欸，妳很奇怪耶。
            - text: 「妳為什麼都拍快要沒有的東西？」
              then:
                - { sfx: strap_click, at: front, dist: near, text: 喀、喀 }
                - ruoqing: ……以前也有人這樣問過我。
                - ruoqing: 我一直沒回答她。
                - think: 她說的是「她」。
            - text: （把手放在照片上）
              then:
                - narr: 相紙很滑，什麼都摸不到。一面牆被收進一張平平的紙裡。
                - think: 我有她的聲音就夠了。
          silence:
            - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
            - narr: 她把照片收回去，紙在桌上滑了一下。
            - pause: 2
            - ruoqing: ……好啦，不丟。我放進「不像的」那個資料夾。
            - ruoqing: 裡面已經有三張了。
      - { sfx: phone_buzz, at: front, dist: near, text: 嗡 }
      - narr: 她的手機在桌上震了一下。她拿起來，指甲在螢幕上敲得很快，敲一敲又停。
      - ruoqing: 欸妳幫我聽，我自介寫「我拍快要沒有的東西」，會不會很假？
      - me: 妳寫了拍什麼，沒寫為什麼拍。
      - { sfx: strap_click, at: front, dist: near, text: 喀、喀 }
      - ruoqing: ……欸，妳很會戳人耶。那個我再想想啦。
      - ruoqing: 今晚就截止了，店長一直問。我先存草稿。
      - if: know.k_erased_line
        then:
          - think: 筆記本上那一行擦掉了，凹痕還在。這張紙底下，會不會也壓著什麼。
        else:
          - think: 我摸得到的只有點。點底下有什麼，要有人替我看。
      - { sfx: envelope, at: front, dist: near, text: 沙 }
      - me: 還有一樣，想請妳幫我看。
      - narr: 我把信從外套內側拿出來，放在桌上推過去。
      - ruoqing: 這是……點字？欸，我看不懂點字喔。
      - me: 不用看點字。看紙。
      - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
      - ruoqing: 紙就……白的啊。有點皺。
      - me: 對著光呢？
      - ruoqing: 等一下，窗邊比較亮。
      - { sfx: chair_scrape, at: front-left, dist: near, text: 嘎 }
      - move: { ruoqing: front-left }
      - { sfx: car_pass, at: front-left, dist: mid, text: 嗚—— }
      - narr: 她站起來，靠到窗邊。外面的車聲一下子近了。
      - ruoqing: 我舉高一點喔。這樣比較透。
      - { sfx: strap_click, at: front-left, dist: near, text: 喀 }
      - narr: 背帶扣只響了一聲。
      - ruoqing: ……欸。底下有字。
      - ruoqing: 鉛筆，很淡。被那些點點壓得坑坑洞洞的。
      - me: 寫什麼？
      - pause: 1.5
      - { ruoqing: 不、要、回、來。……跟上面那個，是同一句嗎？, learn: k_pencil_under_braille, mem: m_c6_pencil }
      - me: 嗯。
      - { sfx: envelope, at: front-left, dist: near, text: 沙 }
      - ruoqing: 還有信封。
      - ruoqing: 「林知夏」這三個字是知夏姊寫的。我很確定，她「夏」的最後一筆都拖很長。
      - ruoqing: 角落還有三個小字，也是鉛筆。「給妹妹」。
      - if: know.k_desk_sister
        then:
          - think: 圖書館地方史室那張桌墊上，我用指腹摸過這三個字。原來是寫在這個信封上。
      - ruoqing: 可是地址不是她的字。
      - ruoqing: 地址是另一個人寫的。很方，一筆一畫，像在寫收據。
      - heart: fast
      - tension: 10
      - narr: 我的手在桌子底下抓住椅墊的邊，布面被我抓出一團皺摺。
      - daze: light
      - ruoqing: 郵票也是新的欸。今年那款，有鳥的。
      - narr: 她在講郵票，講鳥。聲音像是從窗玻璃外面傳進來的。
      - pause: 2
      - daze: off
      - { sfx: paper_rustle, at: front, dist: near, text: 沙, src: 信紙 }
      - { sfx: cup_set, at: back-left, dist: mid, text: 喀 }
      - narr: 她把信紙放回桌上，紙角刮過木頭。櫃台那邊的杯盤聲才又回來。
      - ruoqing: ……妳早就知道了喔？才叫我看。
      - me: 我剛剛才知道。
      - ruoqing: 喔。
      - move: { ruoqing: front }
      - heart: off
    next: c6_walk

  # ─────────────────────────── 廣場：三次停留後耗盡 ───────────────────────────
  - id: c6_square
    place: 鐘樓廣場
    ambience: [town_square]
    beats:
      - if: "!flag.c6_square_1"
        then:
          - narr: 我在長椅上坐下。木頭被太陽曬得溫溫的。
          - { sfx: wind_gust, at: front-left, dist: far, text: 嗚—— }
          - narr: 鐘樓在左前方。風在空掉的那一塊裡面繞。
        else:
          - if: "!flag.c6_square_2"
            then:
              - narr: 我摸著長椅邊緣，找到上次坐過的位置。木頭底下有一顆凸出來的螺絲。
              - { sfx: bicycle_bell, at: back-right, dist: mid, text: 叮叮 }
              - narr: 一台腳踏車按了兩下鈴，從身後過去。鏈條很鬆，每踩一圈就喀啦響一下。
            else:
              - narr: 我又坐回長椅上。這次沒有把手杖收起來，杖尖還抵著地面。
              - { sfx: wind_gust, at: front-left, dist: far, text: 嗚—— }
      - { wait: 20 }
      - tension: -6
      - if: "!flag.c6_square_1"
        then:
          - set: c6_square_1
          - { sfx: ball_bounce, at: right, dist: mid, text: 咚、咚 }
          - { sfx: wing_flutter, at: front-right, dist: mid, text: 啪啪啪 }
          - narr: 有小孩在拍球。鴿子被嚇得飛起來，翅膀拍得很亂，又一隻一隻落回來。
          - think: 一個多小時，我可以拿去查一件事。我拿來坐在這裡。
          - think: 知夏，妳有沒有這樣浪費過一個下午？
        else:
          - if: "!flag.c6_square_2"
            then:
              - set: c6_square_2
              - narr: 我的拇指一直壓著那顆螺絲。放開時，指腹留了一個小小的凹痕。
              - think: 如果知夏還在，我大概會跟她說，這張椅子該修了。
            else:
              - set: c6_square_done
              - narr: 風把衣角吹起來，又放下。我把兩隻腳收回長椅底下，手掌撐住椅面。
              - think: ……該起來了。
              - narr: 站起來的時候，膝蓋有點僵。我扶著手杖，等那一陣麻過去。
    next: c6_walk

  # ─────────────────────────── 17:10 回家的路 ───────────────────────────
  - id: c6_dusk
    time: "17:10"
    place: 老街
    ambience: [street_evening]
    cast: { ruoqing: right, man: front-left }
    beats:
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      # 中午以前就不查了：補上那幾個小時去了哪裡。
      - if: "!seen.c6_h1400 && !seen.c6_h1530"
        then:
          - narr: 後來我沒有再去哪裡，就在鎮上慢慢走。港邊走到老街，老街又走回港邊，鞋底都走熱了。
      - narr: 回家的路經過老街。咖啡的味道從右邊的門縫飄出來。
      - { sfx: car_pass, at: back-left, dist: far, text: 噗噗噗 }
      - narr: 老街很窄，這一段沒有騎樓。一台機車的引擎聲在兩邊的牆之間彈來彈去。
      - { sfx: coffee_grind, at: right, dist: mid, text: 嗡嘰嘰嘰 }
      - { sfx: dog_bark, at: front, dist: mid, text: 汪、汪 }
      - narr: 我把手杖收到身前，停在路中間。右邊磨豆機在轉，前面有狗在叫。
      - think: 它從哪一頭過來？我要往另一邊讓。
      - locate:
          sfx: car_pass
          at: back-left
          interval: 2.2
          decoys:
            - { sfx: coffee_grind, at: right }
            - { sfx: dog_bark, at: front }
          tries: 2
          timeout: 12
          prompt: 機車從哪裡過來？
          success:
            - narr: 左後方。我往右跨兩步，背貼上咖啡店門口的電線桿，手杖豎在胸前。
            - { sfx: car_pass, at: left, dist: near, text: 噗噗噗—— }
            - narr: 機車從我左手邊擦過去，風掀起我的衣角，排氣管的熱氣撲在小腿上。
            - narr: 電線桿上的鐵皮冰冰的。我貼著它，等引擎聲在巷口轉彎才離開。
          fail:
            - narr: 我往左邊讓。第二步還沒踩穩，引擎聲已經到了耳朵後面。
            - { sfx: car_horn, at: back-left, dist: near, text: 叭——, shake: hard }
            - heart: pound
            - tension: 10
            - { sfx: cane_tap, at: front-left, dist: mid, text: 喀、喀 }
            - narr: 照後鏡撞上我的左手肘。手杖飛出去，在柏油上彈了兩下。
            - { man: 看路啦！, as: 騎車的人 }
            - { sfx: car_pass, at: front, dist: far, text: 噗噗噗 }
            - narr: 我蹲下去，兩隻手在地上摸，摸過水溝蓋的鐵條，才摸到手杖的尖。
            - heart: slow
            - narr: 手肘一陣一陣地麻，袖子底下熱熱的，應該是破皮了。
            - set: c6_dusk_hit
      - if: "!flag.c6_d_cafe"
        then:
          - { sfx: camera_shutter, at: right, dist: mid, text: 喀嚓 }
          - narr: 一聲快門。我停下來。
          - think: 只有十分鐘。
          - { sfx: shop_bell, at: right, dist: near, text: 叮鈴 }
          - ruoqing: 欸……妳是早上打電話來的那個？
          - me: 我只問一件事。妳有沒有拍過舊車站的東牆？
          - pause: 1.5
          - ruoqing: 有啊。去年冬天一張，今年春天一張。
          - ruoqing: 冬天的時候，牆上只有一片水漬。
          - { ruoqing: 春天再去，牆上多了一個灰色的鐵櫃，接了新的線。, learn: k_new_cabinet, mem: m_c6_cabinet }
          - if: know.k_cabinet_warm
            then:
              - think: 新的線。我摸過，比手指還粗，一路鑽進牆裡。
          - ruoqing: 妳問這個要幹嘛？
          - me: 我也不知道。
          - think: 這是真話。
        else:
          - { sfx: laugh_soft, at: right, dist: mid, text: 呵呵 }
          - { sfx: cough_w, at: right, dist: mid, text: 咳、咳 }
          - narr: 我沒有進去。若晴在裡面跟店長說笑，笑到一半咳了兩聲。
          - think: 東牆，灰色的櫃子，點字底下的鉛筆字。我把它們都帶回家。
      - narr: 天在變涼。我知道，是因為手杖的握把冷了。
    next: c6_table

  # ─────────────────────────── 17:40 桌子 ───────────────────────────
  - id: c6_table
    time: "17:40"
    place: 林家老屋，客廳
    ambience: [old_house]
    cast: { tingan: front-right }
    beats:
      - narr: 我把桌上的東西都推到一邊，空出一整片桌面。
      - if: flag.c6_dusk_hit
        then:
          - narr: 左手肘碰到桌緣，刺了一下。袖子黏在破皮的地方，我把它輕輕拉開。
      - { sfx: braille_stylus, at: front, dist: near, text: 喀、喀、喀 }
      - narr: 每一樣東西，我都用包包裡那塊點字板打了一張小卡，從左到右排成一列。
      - { sfx: envelope, at: front-left, dist: near, text: 沙 }
      - narr: 最左邊是信。不要回來，凸的。
      - if: know.k_erased_line
        then:
          - if: flag.c6_page_taken
            then:
              - narr: 旁邊是筆記本撕下來的那一頁。不要回來，凹的。
            else:
              - narr: 旁邊一張卡：筆記本，擦掉的一行。不要回來，凹的。
      - if: know.k_watch_engraving
        then:
          - { sfx: tools_clink, at: front, dist: near, text: 叮, src: 手錶 }
          - if: know.k_watch_1831
            then:
              - narr: 手錶，停在十八點三十一分。背面刻著：不要先救第一個死者。
            else:
              - narr: 手錶。背面刻著：不要先救第一個死者。
      - { sfx: braille_stylus, at: front, dist: near, text: 喀 }
      - if: know.k_postmark_yesterday
        then:
          - narr: 一張卡：郵戳，昨天。
      - if: know.k_library_return
        then:
          - narr: 一張卡：鎮志下冊，前天傍晚還回去。周予安。
          - narr: 下一張：圖書館的點字板，借走了，還沒還。
          - if: flag.c6_book_borrowed
            then:
              - narr: 那本鎮志也在桌上，壓著這兩張卡。
      - if: know.k_pencil_under_braille
        then:
          - narr: 一張卡：點字底下的鉛筆字。地址，另一個人的字。
      - { sfx: braille_stylus, at: front, dist: near, text: 喀、喀 }
      - if: know.k_recorder_voice
        then:
          - narr: 一張卡：錄音裡的男聲，那時候還在路上。
      - if: know.k_tape_1803
        then:
          - narr: 一張卡：十八點零三分撥出，十八點零三分收到。
      - if: know.k_c6_two_records
        then:
          - narr: 一張卡：個案堅稱。這件事已經發生過。
      - { sfx: braille_stylus, at: front, dist: near, text: 喀 }
      - if: know.k_burned_copy
        then:
          - narr: 一張卡：燒掉的，又找到了，不是同一份。
      - if: know.k_new_cabinet
        then:
          - narr: 最右邊一張卡：東牆，多出來的灰色櫃子。
      - pause: 1.5
      - narr: 我的手從左邊滑到右邊，再滑回來，像在讀一行很長的點字。
      - think: 如果它們說的是同一件事……
      - { sfx: knuckle_knock, at: back, dist: mid, text: 叩、叩、叩, src: 敲門, shake: light }
      - narr: 我手一抖，最右邊那張卡被掃到桌緣，差一點掉下去。
      - { sfx: door_open, at: back, dist: near, text: 吱 }
      - { sfx: raincoat_rustle, at: back, dist: near, text: 沙、沙 }
      - { sfx: raincoat_rustle, at: front-right, dist: near, text: 沙、沙 }
      - narr: 門口沒有腳步聲。只有布料一路沙沙響，從我背後繞到桌子右前方，停住了。
      - choice:
          timeout: 7
          options:
            - text: 「葉小姐，椅子在妳左手邊。」
              if: know.k_sig_tingan
              then:
                - pause: 1
                - tingan: ……左手邊。好。
                - { sfx: chair_scrape, at: front-right, dist: near, text: 嘎 }
                - tingan: 等一下，妳怎麼知道是我？
                - me: 妳的雨衣，從門口一路響到這裡。
                - { sfx: raincoat_rustle, at: front-right, dist: near, text: 沙 }
                - narr: 布料被拉了一下，雨衣又沙了一聲。
                - tingan: 我走路很輕欸。通常都是我先認出別人。
                - set: c6_named_tingan
            - text: （等她先開口）
              then:
                - if: seen.c6_institute
                  then:
                    - tingan: 我來了。……妳比我早下山欸。
                  else:
                    - tingan: 林小姐？我葉庭安。妳約我五點四十。
      - tingan: 這些是什麼？
      - me: 我姊留下來的東西。還有一些不是她留的。
      - if: flag.c6_named_tingan
        then:
          - { sfx: raincoat_rustle, at: front-right, dist: near, text: 沙啦 }
          - narr: 她把雨衣脫下來，掛上椅背。脫掉以後，她坐在那裡就幾乎沒有聲音了。
          - narr: 我一張一張講給她聽，她沒有打斷我。
        else:
          - narr: 我一張一張講給她聽。她沒有打斷我，雨衣也一直沒脫。
      - me: 我覺得它們是同一件事。有什麼東西，一直想把同一句話送到我手上。
      - { sfx: drawer, at: front, dist: near, text: 喀啦 }
      - narr: 我從抽屜摸出一捲棉線，想把這些卡一張一張綁在一起。
      - tingan: 等一下。
      - pause: 1.5
      - { tingan: 妳有證據證明，它們是同一件事嗎？, mem: m_c6_evidence }
      - narr: 棉線還纏在我的食指上，繞了兩圈。
      - choice:
          timeout: 15
          options:
            - text: 「有兩樣，說的是同一句話。」
              if: know.k_erased_line || know.k_pencil_under_braille
              then:
                - if: know.k_erased_line
                  then:
                    - tingan: 一個凸的，一個凹的。好。
                  else:
                    - tingan: 上面是點，底下是鉛筆，同一張紙。好。
                - if: know.k_tape_1803
                  then:
                    - tingan: 那其他的呢？郵戳、通話、櫃子，它們說了什麼？
                    - me: ……昨天。十八點零三分。
                  else:
                    - tingan: 那其他的呢？桌上其他這些，它們說了什麼？
                    - me: ……十八點三十一分。
                - tingan: 那是時間，不是一句話。
            - text: 「沒有。」
              then:
                - tingan: 那就先不要綁。
                - tingan: 綁起來是很好看。可是我還沒看到證據。
          silence:
            - narr: 棉線還纏在食指上。我沒有拉緊，也沒有放開。
      - tingan: 我做這一行學到一件事。
      - { tingan: 一個圖案越完整，越要問是誰在畫。, mem: m_c6_who_draws }
      - pause: 2
      - if: know.k_library_return || know.k_pencil_under_braille
        then:
          - tingan: 而且妳這一排，大部分在講時間跟機器。
          - if: know.k_library_return
            then:
              - tingan: 只有這張卡寫了一個人的名字。周予安是誰？
              - me: 鐘錶店。每天早上來車站接我的人。
              - tingan: 每天？
              - me: ……今天早上。
            else:
              - tingan: 鉛筆、筆跡、郵票，這些是有人親手弄的。
              - tingan: 親手弄的東西，通常找得到那隻手。
          - pause: 1.5
          - { sfx: envelope, at: front, dist: near, text: 沙 }
          - narr: 我把信從最左邊拿起來，放到桌子的另一頭。那一列短了一截。
          - think: 它從來就不在這一列裡。
        else:
          - think: 誰在畫。是我。
      - pause: 1.5
      - narr: 我把兩隻手平放在桌面上，木頭的紋路一條一條壓進掌心。
      - me: 葉小姐，在今天以前，妳就知道我看不見嗎？
      - tingan: ……知道。我採訪之前都會先查。
      - pause: 1
      - tingan: 妳在懷疑我。
      - me: 我懷疑每一個知道的人。
      - tingan: 那妳要懷疑的人會很多喔。
      - if: flag.c6_named_tingan
        then:
          - tingan: 先跟妳講一件，妳自己去查。我不會點字，一格都不會。
          - tingan: 名單上要不要劃掉我，查完再說。
          - { sfx: raincoat_rustle, at: front-right, dist: near, text: 沙啦 }
          - narr: 她從椅背上把雨衣抓起來，一邊穿一邊往門口走。
      - tingan: 我先走了。妳找到證據再打給我。不是圖案，是證據。
      - { sfx: door_close, at: back, dist: near, text: 碰 }
      - { sfx: raincoat_rustle, at: back, dist: far, text: 沙、沙…… }
      - narr: 雨衣的沙沙聲在巷子裡越走越遠，我的手才從桌上拿起來。
    next: c6_1831

  # ─────────────────────────── 18:31 信 ───────────────────────────
  - id: c6_1831
    time: "18:20"
    place: 林家老屋，客廳
    ambience: [house_night]
    cast: { ruoqing: right, boxun: right }
    beats:
      - narr: 屋子裡剩下冰箱的聲音。桌上那些卡，我一張都沒收。
      - { sfx: envelope, at: center, dist: near, text: 沙 }
      - narr: 我把信攤在掌心，指尖放在第一個凸點上。
      - if: know.k_library_return || know.k_pencil_under_braille
        then:
          - think: 我大概知道是誰的手打的。
        else:
          - think: 如果它真的是從哪裡被送過來的，十八點三十一分，它也許會多說一點什麼。
      - narr: 我把鬧鐘設在那一分鐘，手機面朝下放在信旁邊。
      - heart: slow
      - { wait: 30, clock: "18:20", until: "18:30" }
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - phone: 十八點三十分。
      - { sfx: car_pass, at: left, dist: far, text: 嗚—— }
      - narr: 冰箱在響。窗外一台機車騎過去，排氣管有點破。
      - { wait: 12, clock: "18:30", until: "18:31" }
      - clock: "18:31"
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 鬧鐘。十八點三十一分。
      - narr: 冰箱沒有停。我把指尖貼在第一個凸點上，等紙自己動。
      - hold:
          seconds: 5
          timeout: 22
          sfx: paper_rustle
          at: front
          prompt: 按住，慢慢吐氣，聽那張紙
          success:
            - narr: 心跳退到很後面，冰箱也退下去。手底下只有很小的一聲沙，是我自己的指腹在紙上挪了一點。
            - think: 是我的手在動。
          fail:
            - heart: fast
            - narr: 我一吐氣，心跳就撞回耳朵。一下比一下大，蓋過冰箱，也蓋過手底下那張紙。
            - think: 就算它真的響了，我也聽不到。
      - narr: 我的指尖從左邊慢慢滑過去。
      - think: 不、要、回、來。
      - narr: 凸點一顆都沒有多，也一顆都沒有少。
      - heart: off
      - pause: 3
      - { think: 知夏已經死了。, mem: m_c6_she_is_dead }
      - tension: 10
      - { sfx: tinnitus, at: center }
      - daze: light
      - narr: 耳朵裡嗡的一聲，冰箱的聲音一下子退到牆的另一邊去了。
      - pause: 2.5
      - think: 她沒有在紙的另一面回答我。
      - daze: off
      - { sfx: dog_bark, at: front-left, dist: far, text: 汪、汪 }
      - narr: 冰箱先回來，接著是巷口不知道誰家的狗，叫了兩聲。
      - { sfx: paper_rustle, at: center, dist: near, text: 嘶 }
      - narr: 信紙被手汗黏在皮膚上，掀起來的時候嘶了一聲。
      - touch:
          cells: [深, 深, 歪, 平]
          style: engrave
          prompt: 翻過來，摸背面
          timeout: 30
      - narr: 背面是一格一格的小凹洞。點字板是從這一面壓的，左右要反過來打。
      - narr: 有兩格壓得特別深，有一格歪了。還有一格摸起來毛毛的，像打錯了，又用指甲把它推平。
      - think: 歪掉的格子、被推平的錯點。至少這一行，像是有人用手慢慢打出來的。
      - if: know.k_pencil_under_braille
        then:
          - think: 底下還有她的鉛筆字。那個人是照著她的字打的。
      - phone: 撥號中。許若晴。
      - { sfx: phone_ring, at: right, dist: near, text: 嘟—— }
      - { ruoqing: 喂？我在店裡啦。……妳還好嗎？, via: phone }
      - phone: 撥號中。灰潮鎮醫院。
      - { sfx: phone_ring, at: right, dist: near, text: 嘟—— }
      - { boxun: ……我在醫院。出了什麼事嗎？, via: phone }
      - if: flag.c6_arranged
        then:
          - { sfx: phone_notify, at: front, dist: near, text: 叮 }
          - phone: 周予安：店裡沒事。可以下班了嗎？
          - if: flag.c6_caught
            then:
              - think: 我又想把所有人放回安全的格子。結果是他們自己商量好，待在原地的。
            else:
              - think: 若晴在店裡，陳醫生在醫院，是他們自己講好的。只有予安，是我叫他待著的。
        else:
          - if: flag.c6_caught
            then:
              - think: 若晴跟陳醫生自己改了時間。我早上那兩通電話，他們一通都沒有照我的意思。
            else:
              - think: 若晴在店裡，陳醫生在醫院，是他們自己講好的。
          - think: 予安在店裡修阿伯那支錶。那是他自己本來就要做的事。
      - if: know.k_library_return || know.k_pencil_under_braille
        then:
          - think: 八點，他店裡有人要看房子。等那個人走。
          - goto: c6_shop
      # 沒替他排行程，也要她今天真的出門問過，他才會聽說她在找、自己走過來。
      - if: "flag.c6_arranged || !(flag.c6_d_library || flag.c6_d_hospital || flag.c6_d_cafe || flag.c6_d_police || flag.c6_d_institute)"
        then:
          - goto: c6_alone
      - goto: c6_wait

  # ─────────────────────────── 20:30 等（兩條線索都沒拿到） ───────────────────────────
  - id: c6_wait
    time: "20:30"
    place: 林家老屋，客廳
    ambience: [house_night, night_insects]
    beats:
      - narr: 我沒有開燈，反正開了也一樣。冰箱嗡嗡地轉，轉一轉又歇下來。
      - think: 知道我看不見的人，會打點字的人，昨天寄過信的人。
      - think: 我一直在找一個三樣都對得上的名字。
      - { sfx: wind_gust, at: front-left, dist: far, text: 嗚—— }
      - { sfx: house_tick, at: front-left, dist: mid, text: 喀, src: 窗框 }
      - narr: 牆上那座老掛鐘很多年前就不走了。屋子裡沒有秒針聲，只有窗框被風推了一下。
      - narr: 蟲叫從窗縫擠進來。我把信收回口袋，手一直沒有拿出來。
    next: c6_visit

  # ─────────────────────────── 21:30 他沒有來（沒有證據，又替他排了傍晚） ───────────────────────────
  # 他照她說的待在店裡，想講的話也一起留在店裡。留下線頭：下一輪她知道他有話要講。
  - id: c6_alone
    time: "21:30"
    place: 林家老屋，客廳
    ambience: [house_night, night_insects]
    cast: { yuan: right }
    beats:
      - set: c6_left_alone
      - narr: 我沒有開燈。桌上那一排卡還在，我的手放在最左邊那封信上，一直沒有拿開。
      - { sfx: house_tick, at: front-left, dist: mid, text: 喀, src: 窗框 }
      - narr: 窗框被風推了一下。我以為是敲門，背已經離開椅背，又慢慢靠回去。
      - think: 知道我看不見的人，會打點字的人，昨天寄過信的人。三樣都對得上的名字，我一個都沒找到。
      - { wait: 8 }
      - { sfx: phone_notify, at: right, dist: near, text: 叮 }
      - if: flag.c6_arranged
        then:
          - phone: 周予安：妳早上說晚一點要跟我講。
          - pause: 3
          - { sfx: phone_notify, at: right, dist: near, text: 叮 }
          - { phone: 周予安：我也有一件事。, learn: lead_c6_he_waited }
        else:
          - phone: 周予安：妳早上說在找寄信的人。有找到嗎？
          - pause: 3
          - { sfx: phone_notify, at: right, dist: near, text: 叮 }
          - { phone: 周予安：我也有一件事。, learn: lead_c6_not_asked }
      - heart: slow
      - narr: 我把手機拿起來，等下一則。冰箱轉了一陣，停了。
      - { wait: 10 }
      - { sfx: phone_notify, at: right, dist: near, text: 叮 }
      - phone: 周予安：沒事。明天再說。妳早點睡。
      - tension: 8
      - choice:
          timeout: 14
          options:
            - text: （打給他）
              then:
                - phone: 撥號中。周予安。
                - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
                - { yuan: ……喂。, via: phone }
                - me: 你說你也有一件事。
                - { sfx: tools_clink, at: right, dist: near, gain: 0.5, text: 叮 }
                - narr: 電話那頭，鑷子放到玻璃上。他還在店裡。
                - { yuan: ……那個不急。, via: phone }
                - if: flag.c6_arranged
                  then:
                    - { yuan: 妳早上說六點到七點，我就一直在。阿伯的錶也修好了。, via: phone }
                    - { yuan: 妳早點睡。, via: phone }
                    - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
                    - think: 我叫他待著，他就一直待著。
                  else:
                    - { yuan: 阿伯的錶修好了。他貼在耳朵旁邊聽了很久。, via: phone }
                    - { yuan: 妳不是還在找嗎。等妳找到，再說。, via: phone }
                    - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
                    - think: 他在等我先去問。今天鎮上的人，我一個都沒去問。
            - text: （回他：好，晚安）
              then:
                - phone: 已傳送。好，晚安。
                - narr: 我把手機扣在桌上，扣在那一排卡旁邊。
          silence:
            - narr: 我沒有回。手機在桌上，沒有再響。
      - heart: off
      - think: 明天早上他會在月台，什麼都不記得。這幾則訊息，也不會寄出來過。
    next: c6_night

  # ─────────────────────────── 21:30 他自己來了 ───────────────────────────
  - id: c6_visit
    time: "21:30"
    place: 林家老屋，客廳
    ambience: [house_night, night_insects]
    cast: { yuan: front }
    beats:
      - set: c6_at_home
      - { sfx: knuckle_knock, at: back, dist: near, text: 叩叩, src: 敲門, shake: light }
      - { sfx: door_open, at: back, dist: near, text: 吱 }
      - tension: 8
      - { sfx: step_uneven, at: back, dist: mid, text: 咚、叩 }
      - narr: 屋裡沒開燈。門口的腳步踩進來一步，停在那裡。
      - choice:
          timeout: 6
          options:
            - text: 「予安？」
              if: know.k_sig_yuan
              then:
                - { yuan: ……嗯，是我。, at: back }
                - narr: 一重一輕，是他。我抓著椅子扶手的手指，一根一根鬆開。
                - tension: -8
                - set: c6_named_yuan
            - text: （不出聲，等他開口）
              then:
                - { yuan: 是我。, at: back }
                - { sfx: chair_creak, at: center, dist: near, text: 吱, src: 椅背 }
                - narr: 我的背已經貼上椅背。聽出是他，才一點一點離開。
      - { sfx: step_uneven, at: front, dist: mid, text: 咚、叩 }
      - yuan: 妳早上說，妳在找那封信是誰寄的。
      - yuan: 鎮上很小。妳今天去了哪裡、問了誰，傍晚就有人講給我聽了。
      - yuan: 我想說，不要讓妳找太久。
      - me: 阿伯的錶呢？
      - yuan: 下午拿走了。他戴上去，貼在耳朵旁邊聽了很久，說走得跟他太太在的時候一樣。
      - me: 房仲也走了？
      - yuan: 走了。他說櫃子要清空才好拍照。
      - narr: 他沒有坐下。我聽見他站在桌子另一邊，外套的拉鍊碰到桌緣。
      - yuan: 我清抽屜的時候……
      - { sfx: tools_clink, at: front, dist: near, text: 叩, src: 鋁框 }
      - narr: 有東西放到桌上。很輕的一聲，金屬碰到木頭。
      - yuan: 這個，我想說應該要讓妳知道。
      - narr: 我伸手過去。鋁框，比手掌長一點，一排一排的小格子。
      - narr: 旁邊一支短短的筆，木頭柄，尖端是磨鈍的鐵。
      - think: 點字板。我用的就是這種。
      - if: know.k_slate_in_shop
        then:
          - think: 我在他的抽屜裡摸過它。在另一個今天，他說是客人寄修的。
      - narr: 有一格裡卡著一點紙屑。我用指甲去挑，挑了兩次才挑出來，手指不太聽話。
    next: c6_confess

  # ─────────────────────────── 20:40 鐘錶店 ───────────────────────────
  - id: c6_shop
    time: "20:40"
    place: 周家鐘錶店
    ambience: [clock_shop]
    cast: { yuan: front, man: back }
    beats:
      - set: c6_at_shop
      - { sfx: step, at: back, dist: mid, text: 叩、叩 }
      - { man: 那就下禮拜再來估。櫃子記得清喔。, at: back, as: 房仲 }
      - { sfx: shop_bell, at: back, dist: near, text: 叮鈴 }
      - narr: 門口跟我擦身而過的人噴了古龍水。門鈴還在晃，滿屋子的滴答就湧上來。
      - yuan: ……林家的？這麼晚了。
      - narr: 我把手杖換到另一隻手，指節按在握把的橡膠紋上。
      - yuan: 請、請坐。椅子在妳左手邊。
      - { sfx: chair_scrape, at: front-left, dist: near, text: 嘎 }
      - yuan: 我在清抽屜。有點亂。
      - narr: 我沿著櫃台摸過去，碰到鐵盒，還有一疊邊角軟得像布的收據。
      - if: know.k_slate_in_shop
        then:
          - narr: 我的手順著櫃台往前，碰到一個鋁框，一排一排的小格子。
          - think: 客人寄修的。他是這樣說的，在另一個今天。
      - choice:
          timeout: 20
          default: 2
          options:
            - text: 「圖書館的阿姨說，你去還了知夏的書。」
              if: know.k_library_return
              then:
                - { sfx: tools_clink, at: front, dist: near, text: 叮 }
                - narr: 他手上的鑷子放到玻璃上，叮的一聲。
                - { sfx: envelope, at: front, dist: near, text: 沙 }
                - narr: 我把信從口袋拿出來，放在櫃台上。
            - text: 「若晴說，點字底下有鉛筆字。」
              if: know.k_pencil_under_braille
              then:
                - narr: 他翻收據的手停了，紙還捏在指尖。
                - { sfx: envelope, at: front, dist: near, text: 沙 }
                - narr: 我把信從口袋拿出來，放在櫃台上。
            - text: （把信放在櫃台上，什麼都不說）
              then:
                - { sfx: envelope, at: front, dist: near, text: 沙 }
                - narr: 我把信放在櫃台上，用兩根手指推到他那邊。
            - recall:
                accept:
                  - mem: m_postmark
                    then:
                      - { sfx: envelope, at: front, dist: near, text: 沙 }
                      - narr: 我把信放在櫃台上。
                      - me: 郵戳是昨天。你念給我聽的。
                      - me: 你念完「昨天」，又念了一次「郵戳是昨天」。第二次比較小聲。
                      - pause: 2
                      - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
                      - narr: 一張收據從他手裡滑下去，落在玻璃上。
                      - yuan: ……我沒有念給妳聽過。
                      - me: 念過。你那時候在倒水。水聲停了，你才念。
                      - pause: 1.5
                      - yuan: 念兩次……
                      - yuan: 那我那時候，大概是在講給自己聽。
                      - set: c6_direct
                  - mem: m_c6_returned
                    then:
                      - { sfx: envelope, at: front, dist: near, text: 沙 }
                      - narr: 我把信放在櫃台上。
                      - me: 「鐘錶店的周先生啊。」
                      - narr: 我學圖書館阿姨的口氣，尾音拖得長長的。
                      - me: 她說你放下書，就說要去郵局門口丟一封信。
                      - { sfx: tools_clink, at: front, dist: near, text: 叮 }
                      - narr: 他手上的鑷子掉在玻璃上。
                      - yuan: ……阿姨講話就是那樣。
                      - yuan: 妳學得很像。
                      - set: c6_direct
                  - mem: m_c6_pencil
                    then:
                      - { sfx: envelope, at: front, dist: near, text: 沙 }
                      - narr: 我把信放在櫃台上。
                      - me: 若晴把它舉到窗邊，對著光看了很久。
                      - me: 她問我：「跟上面那個，是同一句嗎？」
                      - me: 我說是。可是我想聽你說。
                      - pause: 2.5
                      - yuan: ……是同一句。
                      - set: c6_direct
                miss:
                  - pause: 1
                  - yuan: ……嗯？
                  - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
                  - think: 不是這句。他手上的收據又翻了一張。
    next: c6_confess

  # ─────────────────────────── 他承認（兩條路線共用） ───────────────────────────
  - id: c6_confess
    cast: { yuan: front }
    beats:
      - heart: slow
      - if: flag.c6_at_shop
        then:
          - { sfx: breath_m, at: front, dist: near, text: 呼…… }
          - narr: 滴答聲裡，我聽得出他在哪裡。他的呼吸放得很慢，像怕吵到什麼。
        else:
          - { amb: [night_insects], fade: 0.8 }
          - narr: 冰箱的馬達剛好停了。屋子裡只剩他的呼吸，跟窗外的蟲。
      - if: flag.c6_direct
        then:
          - pause: 1
          - yuan: 是我寄的。
          - yuan: 我本來想，妳不問，我就一輩子不講。
      - { wait: 8 }
      - if: "!flag.c6_direct"
        then:
          - yuan: ……嗯。
          - yuan: 是我寄的。
      - learn: k_yuan_sent_letter
      - if: flag.c6_at_home
        then:
          - yuan: 妳沒有來問我。妳只說妳在找。
          - yuan: 我不想等妳哪天，自己在哪裡摸到。
          - think: 他可以一輩子不講。他自己走過來，把板子放在我的桌上。
          - set: c6_told_me
        else:
          - think: 每一個今天，他都在月台上等我，陪我開門、搬行李。每一個今天，他都知道。
          - narr: 我的指甲掐進手杖握把的橡膠紋裡，一道一道掐下去。
          - set: c6_found_out
      - tension: 8
      - heart: fast
      - narr: 我想開口，喉嚨先緊了。兩隻手在膝蓋上握起來，越握越緊。
      - pause: 2.5
      - yuan: 不是我寫的。是知夏姊寫的。
      - yuan: 她走前兩個禮拜拿來店裡。那陣子她一直在寫信。
      - yuan: 九月十幾號吧。她那天還去圖書館借了一本鎮志。
      - yuan: 她說，如果妳有一天要回來，就寄給妳。
      - me: 就這樣？
      - yuan: 就這樣。信封上只有「給妹妹」，跟她的名字。
      - pause: 1.5
      - yuan: 我放在抽屜裡，收據下面。
      - yuan: 每年整理一次店，就拿出來一次，又放回去。
      - think: 五年，壓在一疊收據底下。
      - me: 你拆開了。
      - yuan: ……嗯。
      - if: flag.c6_at_shop
        then:
          - { sfx: box_close, at: front, dist: near, text: 喀 }
          - { sfx: box_open, at: front, dist: near, text: 喀 }
          - narr: 鐵盒的蓋子被他扣上，又打開。
        else:
          - narr: 他的手指在點字板的鋁框上來回摸，摸到邊角就停。
      - yuan: 那是她給妳的。我不應該拆。
      - yuan: 仲介跟我說妳要回來。又說妳……看不見了。
      - yuan: 原封不動寄，妳還要找人念。裡面寫什麼，妳想不想讓別人聽到，我都不知道。
      - yuan: ……所以我拆了。拆了，我也就看到了。這件事，我一直不知道怎麼跟妳講。
      - pause: 1.5
      - yuan: 所以我去圖書館借了那塊板子。樓下有一張對照表，我照著打。
      - yuan: 要從背面打，左右要反過來。我一開始不知道，自己買的紙打壞了三張。
      - narr: 我的食指在膝蓋上，跟著他說的，從右往左一格一格點過去。
      - yuan: 她那張，我只打了一次。
      - yuan: 就打在她的鉛筆字上面。我不想換紙。
      - if: know.k_pencil_under_braille
        then:
          - think: 若晴對著光看見的那一行。點和字疊在同一個地方。
        else:
          - think: 背面那一格歪的，那一格被指甲推平的。是他。
      - yuan: 地址是我寫的，仲介給我的。郵票也是我貼的。
      - yuan: 前天傍晚，丟郵局門口那個郵筒。
      - if: know.k_postmark_yesterday
        then:
          - think: 郵戳是昨天。是他親口念給我聽的。
      - think: 第一個今天，他捏著這張紙問我：知夏姊會點字嗎？
      - think: 他的手指，就停在他自己打的點上。
      - pause: 2
      - if: know.k_yuan_1758
        then:
          - set: c6_knew_1758
      - yuan: 那天，五點五十八分。
      - { yuan: 她打給我，我沒接。, learn: k_yuan_1758 }
      - yuan: 我在跟我爸吵架。想說晚一點再回。
      - if: flag.c6_knew_1758
        then:
          - think: 這一段我聽過，在小餐館，他撥著麵湯、一口都沒喝的那個晚上。他不記得他講過。
      - yuan: 五年來我一直在想。
      - yuan: 她是不是要叫我不要寄了。
      - { wait: 10 }
      - if: flag.c6_at_shop
        then:
          - { sfx: clock_chime, at: back-left, dist: mid, text: 噹 }
          - narr: 滿屋子的鐘各走各的。左後方有一座小鐘，不是整點，自己響了一聲。
        else:
          - narr: 窗外的蟲叫了一陣，停了，又開始。
      - yuan: 如果是，我就是做了她不要我做的事。
      - pause: 2
      - yuan: 如果不是……
      - { sfx: breath_m, at: front, dist: near }
    next: c6_answer

  # ─────────────────────────── 她怎麼回他 ───────────────────────────
  - id: c6_answer
    cast: { yuan: front }
    beats:
      - choice:
          timeout: 20
          options:
            - text: 「你拆了她的信。」
              then:
                - yuan: 嗯。
                - { sfx: thud, at: front, dist: near, gain: 0.4, text: 碰, shake: light }
                - narr: 我一掌拍下去，整隻手麻到手腕。
                - tension: 8
                - me: 那是她寫給我的。五年，你一個字都沒跟我說。
                - yuan: 妳那時候誰的電話都不接。
                - pause: 1
                - yuan: ……這不是理由。對不起。
                - narr: 他沒有再解釋。我等他解釋，他就是沒有。
            - text: 「你可以不講的。」
              if: flag.c6_told_me
              then:
                - pause: 2
                - yuan: ……我想過。想了一整個晚上。
                - yuan: 房仲在店裡拍照的時候，我一直在想，這張紙還要在抽屜裡放多久。
                - tension: -8
            - text: 「謝謝你沒有找別人念。」
              then:
                - pause: 2
                - yuan: ……這個我不知道要不要被謝。
                - yuan: 我拆了她的信。
                - me: 我知道。
                - tension: -6
          silence:
            - pause: 4
            - if: flag.c6_at_shop
              then:
                - { sfx: tools_clink, at: front, dist: near, text: 叮 }
                - narr: 他把一樣東西推到我手邊。鋁框，一排一排的小格子。
              else:
                - { sfx: tools_clink, at: front, dist: near, text: 叩, src: 鋁框 }
                - narr: 他把點字板推到我手邊，鋁框碰到我的指尖。
            - yuan: 明天要拿去還。……妳要的話，先放妳這裡。
            - narr: 我沒有拿，也沒有推回去。
      - pause: 2
      - me: 予安。
      - yuan: 嗯。
      - me: 那你呢？你想要我回來嗎？
      - { wait: 7 }
      - yuan: ……寄出去以後，今天早上，我還是去車站了。
      - yuan: 七點多就到了。車還沒來。
      - pause: 2
      - yuan: 我不知道妳會不會下車。
      - pause: 2
      - yuan: 妳下來了。
      - heart: off
      - tension: -10
      - narr: 我的手不知道什麼時候又握起來了。鬆開的時候，掌心有幾道自己握出來的凹痕。
      - pause: 3
      - think: 每一個今天，這封信都已經在我口袋裡。每一個今天，他都還是站在出口。
      - think: 第一個晚上他說，他不會信。但他會去接我。
      - if: flag.c6_at_shop
        then:
          - yuan: 很晚了。我送妳回去。
          - narr: 他把手肘放到我右手邊，高度剛好。
          - { sfx: shop_bell, at: back, dist: near, text: 叮鈴 }
        else:
          - yuan: 我回去了。板子……我明天拿去還。
          - { sfx: step_uneven, at: back, dist: mid, text: 咚、叩 }
          - { sfx: door_close, at: back, dist: near, text: 碰 }
    next: c6_night

  # ─────────────────────────── 22:40 ───────────────────────────
  - id: c6_night
    time: "22:40"
    place: 林家老屋，知夏的房間
    ambience: [house_night, night_insects]
    beats:
      - narr: 窗外的蟲一直叫。我把客廳那些卡收進抽屜，信沒有收，放在枕頭旁邊。
      - { sfx: drawer, at: front, dist: near, text: 喀 }
      - narr: 那捲棉線還在抽屜裡，我沒有拿出來。
      - if: flag.c6_left_alone
        then:
          - think: 一整排卡，沒有一張寫著誰的名字。
          - think: 他說他也有一件事。他說明天。
        else:
          - think: 字是她的，點是他打的。
      - pause: 2
      - if: flag.c6_caught
        then:
          - if: flag.c6_arranged
            then:
              - think: 三通電話，十一分鐘，再加上月台上那一句。早上的我，想替四個人決定他們的傍晚。
            else:
              - think: 三通電話，十一分鐘。早上的我，想替三個人決定他們的傍晚。
          - think: 若晴打了一通電話去確認，我排好的格子就全散了。
        else:
          - think: 早上我只說了我怕什麼。若晴跟陳醫生，是自己商量好的。
          - if: flag.c6_arranged
            then:
              - think: 只有月台上那一句，我還是叫予安待著。
      - if: flag.c6_found_out
        then:
          - think: 我以為我已經很懂他了。他的腳步、他不加糖、他五點五十八分沒接的電話。
          - think: 這張紙，他放了五年，我一次都沒有摸到。
      - if: flag.c6_told_me
        then:
          - think: 他可以不講。他還是自己走過來，把板子放在桌上。
      - think: 我是從哪一天開始這樣的？
    next: c6_bell

