insights:
  - id: insight_yuan_keeps_fathers_things
    character_id: yuan
    title: 予安不會主動丟掉父親留下的東西
    category: value
    source_loop: loop_03_no_death
    learned_from: 與予安談到房仲與整理鐘錶店時，主角注意到他連壞掉的舊零件都留著。
    retained_by: protagonist
    reset_rule: 予安不記得上一輪談話；只有主角保留這份理解。
    clue_use: 如果父親留下的物品突然不在原位，不能直接假設是予安自己丟掉；要查誰移動過它。
    presentation: 他嘴上說想把店賣掉，卻連父親留下的壞零件都沒有丟。

  - id: insight_yuan_formal_when_nervous
    character_id: yuan
    title: 予安緊張時反而會突然說得很正式
    category: tell
    source_loop: loop_02_doctor_dies
    learned_from: 多次讓予安捲入調查後，主角發現他越緊張越會使用不自然的正式語氣。
    retained_by: protagonist
    reset_rule: 行為傾向會重現，但予安不記得主角曾觀察過。
    clue_use: 能幫主角分辨他是真的冷靜，還是在壓住害怕與後悔。
    presentation: 他越客氣，通常越不安。

  - id: insight_wakaharu_camera_strap_lie
    character_id: wakaharu
    title: 若晴說真正的謊時會反覆整理相機背帶
    category: tell
    source_loop: loop_02_doctor_dies
    learned_from: 主角陪若晴整理作品集與談離鎮計畫時，見過她在不同壓力下的反應。
    retained_by: protagonist
    reset_rule: 若晴不記得那些上一輪的談話；只有她穩定的習慣會再次出現。
    clue_use: 當若晴否認知夏曾留下東西時，可作為追問方向，但不能單獨當成證明。
    presentation: 她不是忘記。她在迴避。

  - id: insight_doctor_never_states_unverified_guess
    character_id: doctor
    title: 柏勳不會把沒有證據的推測說成事實
    category: value
    source_loop: loop_04_five_years_ago
    learned_from: 主角比對柏勳五年前病歷與現在說法後，確認他寧可隱瞞，也不會把猜測寫進正式紀錄。
    retained_by: protagonist
    reset_rule: 柏勳不保留其他 Loop 的互動，但他的程序導向人格保持一致。
    clue_use: 如果柏勳明確說「我看過不同結果」，代表他手上一定有比口頭推測更硬的證據。
    presentation: 他最麻煩的地方，也是最好用的地方：沒有證據的話，他不說。
