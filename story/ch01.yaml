          - narr: 他的手一直沒有離開我的手臂。我靠著那隻手，把氣一口一口吐出來。
          - tension: -6
        else:
          - narr: 予安在電話那頭叫我的名字。叫到第三聲，我才聽見，冰箱也還在嗡嗡地轉。
      - think: 她扣背帶那個喀、喀的聲音，我幾個小時前才聽過。
      - if: flag.c1_ruoqing_number
        then:
          - narr: 我摸出手機，找到她那則訊息，讓它再念一次。
          - phone: 妳還是過來比較好。
