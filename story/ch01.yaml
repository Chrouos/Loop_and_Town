    next: c1_police

  # ─────────────────────────── 20:30 周警官 ───────────────────────────
  - id: c1_police
    # 格局：灰潮鎮派出所／桌前（docs/scene-layouts.md）
    time: "20:30"
    place: 灰潮鎮派出所
    ambience: [police_office]
    cast: { zhiyuan: front, yuan: right }
    beats:
      - { sfx: door_open, at: back, text: 吱 }
      - narr: 派出所的電扇轉得很吵，有人在遠處講電話。
      - if: "seen.c1_station && !flag.c1_yuan_with_me"
        then:
          - narr: 員警幫我打給予安。他趕到的時候一直在喘，外套的拉鍊都沒拉。
      - narr: 醫院已經確認，若晴沒有救回來。予安陪我坐在這裡，等警官把電話講完。
      - learn: k_ruoqing_died
      - if: seen.c1_locate_success
        then:
          - narr: 膝蓋上貼了紗布，是救護車上的人幫我貼的。
          - narr: 褲管那一大片還沒乾透，電扇一吹過來，就冰冰地貼在腿上。
      - { sfx: lighter_lid, at: front, dist: near, text: 叮、喀 }
      - narr: 他還沒開口，菸味先從桌子那頭靠過來。
      - { sfx: plastic_crinkle, at: front, dist: near, text: 啵 }
      - narr: 他摳了一顆什麼丟進嘴裡嚼，薄荷味很衝，蓋不掉他衣服上的舊菸味。
      - if: seen.c1_station
        then:
          - { zhiyuan: 妳是現場那位小姐。, as: 低沉的男聲 }
          - zhiyuan: 我姓周。麻煩妳再講一次經過。
          - zhiyuan: 妳剛才說，六點三十一分。
          - zhiyuan: 妳說妳看不見。
          - zhiyuan: 那妳怎麼確定，她倒下的時間？
          - me: 我手機會報時。
          - me: 而且我聽得到。
          - pause: 1.5
          - zhiyuan: ……好。
        else:
