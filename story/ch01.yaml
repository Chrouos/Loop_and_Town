  # ─────────────────────────── 22:40 手錶 ───────────────────────────
  - id: c1_watch
    # 格局：林家老屋／知夏的房間（docs/scene-layouts.md）
    time: "22:40"
    place: 林家老屋，知夏的房間
    ambience: [house_night]
    beats:
      - narr: 予安送我回到家門口。他說他去買點吃的，等一下再過來。
      - narr: 我一個人走進知夏的房間。
      - narr: 我沒有開燈，也不需要開燈。
      - if: flag.c1_watch
        then:
          - narr: 手錶還在桌上，在我早上放下的那個地方。
          - pause: 1.5
          - narr: 錶背的刻痕，我又摸了一次。還是摸不出來。
        else:
          - narr: 桌上那只錶，早上我沒有碰，我把它拿起來，皮錶帶的扣環那裡磨得很薄。
          - pause: 1
          - narr: 翻過來，錶背有一些很細的刻痕。
          - pause: 1.5
          - narr: 讀不出來。
      - narr: 我把手機鏡頭對準錶背，一點一點轉，試了好幾個角度。手一直在晃。
      # 第一次屏息：撐住或撐不住都讀得到（第二章要用 k_watch_engraving），只差她的手。
      - hold:
          seconds: 3
          timeout: 20
          sfx: phone_buzz
          at: front
          prompt: 按住，讓手停下來
          success:
            - narr: 我把手肘撐在桌上，氣吐到底。鏡頭終於停住了。
          fail:
            - narr: 怎麼樣都停不住。最後我把錶平放在桌上，手機貼著桌面一點一點挪，挪到它自己對上焦。
            - pause: 2
      - { phone: 如果你第二次看見十八點三十一分，, loud: true }
      - { phone: 還會有下一個。, learn: k_watch_engraving, mem: m_engraving, loud: true }
      - pause: 3
      - think: 第二次看見十八點三十一分？
      - think: 下一個……什麼？
      - narr: 我把那兩行在嘴裡又念了一次，念到「下一個」就念不下去。
      - narr: 我把手錶握在手裡，錶殼還有一點我手心的溫度。
      - narr: 我坐到她的床邊，聽自己的呼吸，一口比一口長。
      - pause: 5
    next: c1_night_yuan

