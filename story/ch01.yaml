                - { sfx: car_pass, at: front-left, dist: mid, to: front-right:mid, text: 噗噗—— }
                - narr: 走到巷口，風從大馬路那邊灌進來。
                - { sfx: car_pass, at: front-right, dist: mid, to: front-left:far, text: 噗—— }
                - narr: 我在那裡站了一下，想不到還能往哪裡走，就沿著牆走回去了。
                - goto: c1_1831_home
            - text: （回知夏的房間坐一下）
              then:
