  # ─────────────────────────── 22:40 手錶 ───────────────────────────
  - id: c1_watch
    time: "22:40"
    place: 林家老屋，知夏的房間
    ambience: [house_night]
    beats:
      - narr: 予安送我回到家門口。他說他去買點吃的，等一下再過來。
      - narr: 我一個人走進知夏的房間。
      - narr: 我沒有開燈，也不需要開燈。
      - if: know.k_watch_1831
        then:
          - narr: 手錶還在桌上，在我早上放下的那個地方。
          - pause: 1.5
          - narr: 錶背的刻痕，我又摸了一次。還是摸不出來。
        else:
          - narr: 桌上那只錶，早上我沒有碰，我把它拿起來，皮錶帶的扣環那裡磨得很薄。
          - pause: 1
          - narr: 翻過來，錶背有一些很細的刻痕。
          - pause: 1.5
          - narr: 讀不出來。
      - { sfx: phone_buzz, at: front, dist: near, text: 嗡 }
      - narr: 我把手機鏡頭對準，嘗試轉了好幾個角度。
      - pause: 2
      - phone: 如果你第二次看見十八點三十一分，
      - { phone: 不要先救第一個死者。, learn: k_watch_engraving, mem: m_engraving }
      - pause: 3
      - think: 第二次看見十八點三十一分？
      - think: 什麼意思？第一個死者又是什麼意思？
      - narr: 我把那兩行在嘴裡又念了一次，念到「第一個死者」就念不下去。
      - narr: 我把手錶握在手裡，錶殼還有一點我手心的溫度。
      - narr: 我坐到她的床邊，聽自己的呼吸，一口比一口長。
      - pause: 5
    next: c1_night_yuan

  # ─────────────────────────── 23:20 ───────────────────────────
  - id: c1_night_yuan
    time: "23:20"
    place: 林家老屋
    ambience: [house_night, night_insects]
    cast: { yuan: right }
    beats:
      - { sfx: door_open, at: back, text: 叩叩——吱 }
      - yuan: 是我。
      - yuan: 我買了熱的，放在妳右手邊。
      - { sfx: cup_set, at: right, dist: near, text: 叩 }
      - narr: 我們安靜地吃著東西，窗外的蟲一直叫。
      - { wait: 10 }
      - yuan: 下午妳拿給我看的那封信，收到的時候，沒想過先打給我？
      - { sfx: envelope, at: center, dist: near, text: 沙 }
      - narr: 我把信拿出來，放在兩個人中間。
      - me: 打給你，說我姊寄信來了，叫我不要回去？
      - yuan: 至少讓我知道。
      - me: 你會信是她寄的？
      - yuan: ……
      - pause: 1
      - yuan: ……不會。
      - { yuan: 但我會去接妳。, learn: c1_yuan_pickup, mem: m_yuan_pickup }
      - pause: 3
      - narr: 我摸到杯子，捧在手裡，半天才說了一聲好。
      - tension: -10
      - pause: 2
      - { sfx: door_close, at: back, dist: mid, text: 喀 }
      - narr: 他把空的便當盒收走，門帶上的時候很輕。屋子裡剩下蟲叫，杯子在我手心裡一點一點涼掉。
      - if: flag.tingan_pressed
        then:
          - think: 那個記者說她只見過我姊幾次，她回答之前，慢了兩秒。
        else:
          - if: know.k_tingan_card
            then:
              - narr: 外套口袋裡那張名片的硬角，一直頂著我的手腕。
              - think: 葉庭安。
              - think: 她問起我姊的時候，我應該多問幾句的。
            else:
              - if: flag.c1_tingan_asked
                then:
                  - think: 那個記者問林家有沒有人在研究所做過事，我說不知道，她好像鬆了一口氣。
                  - think: 為什麼？
                else:
                  - think: 那個記者在街上叫住我，我一句話都沒回。她想問什麼，我到現在也不知道。
      - if: flag.ruoqing_closed
        then:
          - think: 下午我問若晴跟我姊是什麼關係，她就走開了。
          - think: 要是我沒問那一句，她會不會也跑回來，跟我說她晚上要去哪裡。
          - narr: 我把桌上那封信翻過來又翻回去，紙角被我揉得起毛。
          - tension: 6
        else:
          - if: seen.c1_station
            then:
              - think: 她跟我說她要去舊車站，我也跟去了，就站在離她幾步的地方。
            else:
              - think: 她跑回來跟我說她要去舊車站，我聽見了，然後自己回家。
      - pause: 1.5
      - think: 如果她今天晚上沒有去那裡呢？
    next: c1_bell

