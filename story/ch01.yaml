      - think: 半點的報時才響過，前後不到一分鐘。
      - { sfx: siren_far, at: front, dist: far, text: 喔咿——喔咿—— }
      - narr: 北邊，很遠。警笛一直沒有停。
      - if: know.k_ruoqing_station_plan
