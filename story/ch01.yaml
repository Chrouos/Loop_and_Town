  # ─────────────────────────── 18:18 舊車站 ───────────────────────────
  - id: c1_station
    # 格局：舊車站／大廳（從缺口進來）（docs/scene-layouts.md）
    time: "18:18"
    place: 舊車站
    ambience: [old_station_hall]
    cast: { ruoqing: front, yuan: back }
    beats:
      - learn: k_in_station_hall
      - if: flag.c1_yuan_with_me
        then:
          - yuan: 裡面地不平，我陪妳——
          - me: 你在門口等。裡面太空，兩個人的腳步我會聽亂。
          - yuan: ……好。我在門口。
        else:
          - { sfx: car_pass, at: back, dist: far, text: 嗚—— }
          - narr: 計程車開走了。
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 我沿著施工圍欄走，從側邊的缺口進去。手杖敲下去，聲音飛得很遠，又從很遠的地方回來。
      - narr: 屋頂很高，大到我抓不到牆在哪裡。有風從破掉的窗戶進來。
      - heart: slow
      - narr: 地上有碎石子，鞋底踩下去都踩不實。我每走一步，先用腳尖探一下。
      - { sfx: gravel_step, variant: 1, at: center, dist: near, text: 沙 }
      - pause: 0.4
      - { sfx: gravel_step, variant: 2, at: center, dist: near, text: 沙 }
      - pause: 0.4
      - { sfx: gravel_step, variant: 3, at: center, dist: near, text: 沙 }
      - pause: 0.4
      - { sfx: gravel_step, variant: 4, at: center, dist: near, text: 沙 }
      - narr: 前面有人在講話。是女生，壓得很小聲，可是這裡太空了，一點點聲音都被放得很大。
      - { ruoqing: 嗯，拿到了。……沒有啦，就幾張紙。, at: front-left, dist: far }
      - { ruoqing: 我等一下就回去，妳們先吃，不用等我。, at: front-left, dist: far }
      - think: 是咖啡店那個女生。她在講電話，好像還沒注意到我。
      - narr: 她的聲音撞到牆上，碎成好幾個。前面有一個，右邊的牆又彈回來一個。
      - { sfx: strap_click, at: front-left, dist: mid, text: 喀 }
      - locate:
          sfx: strap_click
          times: 2
          at: front-left
          decoys:
            - { sfx: murmur_w, at: right }
            - { sfx: pigeon_coo, at: back-right }
          tries: 2
          timeout: 15
          interval: 4.5
          prompt: 她在哪裡講電話？
          success:
            - narr: 左前方。我跟著扣子的聲音走過去。
            - { sfx: gravel_step, variant: 1, at: center, dist: near, text: 沙 }
            - pause: 0.4
            - { sfx: gravel_step, variant: 2, at: center, dist: near, text: 沙 }
            - narr: 才走兩步，她那邊就安靜了。地上都是碎石，誰走過來都藏不住。
            - { ruoqing: 媽，我先掛了，等一下打給妳。, at: front-left, dist: near }
          fail:
            - narr: 我往那個聲音走了好幾步，手伸出去，摸到的是又冷又粗的磚牆。
            - narr: 她的聲音還貼在牆上，人不在這裡。
            - heart: fast
            - { narr: 我轉回身，整個大廳都在回音。我連剛才是從哪個缺口進來的都分不出來。, shake: light }
            - { ruoqing: 媽，我先掛了！, at: left, dist: mid }
            - { sfx: step_run, at: left, dist: near, text: 噠噠 }
            - { ruoqing: 妳不要再往那邊走，地上都是碎玻璃。, at: left, dist: near }
            - narr: 她抓住我的袖子，把我帶回去。她的手很暖，我的手心全是冷汗。
            - heart: slow
      - if: flag.c1_ruoqing_closed
        then:
          - ruoqing: ……妳怎麼會跑來這裡？
        else:
          - ruoqing: ……妳真的來了。
      - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
      - if: flag.c1_ruoqing_closed
        then:
          - me: 妳手上拿的是什麼？
        else:
          - me: 為什麼陳醫生要給妳？
      - { cue: leaving, at: front-left, dist: far, text: 叩……叩…… , sfx: step }
      - ruoqing: 這些是知夏姊當年留下來的。
      - ruoqing: 陳醫生一直收著，沒給別人看過。
      - ruoqing: 她沒有說一定要交給妳。
      - ruoqing: 是我覺得……
      - ruoqing: 妳既然真的回來了，至少應該由妳自己決定要不要看。
      - pause: 1
      - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
      - ruoqing: 這裡有一行字。是知夏姊的字。
      - { ruoqing: 「十八點三十一分，不是死亡時間。」, learn: k_zhixia_note_1831, mem: m_note }
      - pause: 1.5
      - me: 什麼意思？
      - ruoqing: 我不知道。
      - { sfx: strap_click, at: front, dist: near, text: 喀、喀 }
      - ruoqing: 我真的不知道。
    threads:
      leaving:
        beats:
          - narr: 是男人的皮鞋，不急，往側門那邊去了。
          - { sfx: hand_rub, at: front-left, dist: far, text: 噗、沙沙 }
          - narr: 他在門口停了一下。
          - { sfx: cough, at: front-left, dist: far, text: 咳 }
          - { narr: 風吹過來的時候，帶著一點消毒水的味道。, learn: k_boxun_at_station }
          - { sfx: car_door, at: front-left, dist: far, text: 碰 }
          - { sfx: car_pass, at: front-left, dist: far, text: 嗚—— }
          - narr: 車子往鎮上的方向開走了。
    next: c1_1831

