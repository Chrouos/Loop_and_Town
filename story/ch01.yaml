      - heart: slow
      - { sfx: nail_scratch, at: front, dist: near, text: 嘶、嘶 }
      - narr: 我的指甲一直在桌面上刮，刮到自己聽見那個聲音，才把手收回來。
      - tension: 5
      - pause: 3
      - clock: "19:05"
      - if: flag.c1_yuan_with_me
        then:
          - { sfx: phone_ring, at: right, dist: near, text: 鈴——, vib: buzz }
          - narr: 予安接起手機。他只嗯了幾聲就掛了。
          - { sfx: chair_scrape, at: right, dist: near, text: 嘎 }
        else:
          - { sfx: phone_ring, at: right, dist: near, text: 鈴——, vib: buzz }
          - narr: 我接起手機。
          - { yuan: 是我。, at: right, dist: near, via: phone }
      - if: flag.c1_yuan_with_me
        then:
          - { yuan: 舊車站那邊出事了。停電，有人…… }
        else:
          - { yuan: 舊車站那邊出事了。停電，有人……, at: right, dist: near, via: phone }
      - pause: 1.5
      - if: flag.c1_yuan_with_me
        then:
          - { yuan: 是若晴。咖啡店那個女生。, learn: k_ruoqing_died, mem: m_1831_heard }
        else:
          - { yuan: 是若晴。咖啡店那個女生。, at: right, dist: near, learn: k_ruoqing_died, mem: m_1831_heard, via: phone }
      - heart: pound
      - tension: 20
      - narr: 我想問他是不是聽錯了，喉嚨卻緊到只擠得出一口氣。
      - if: flag.c1_yuan_with_me
        then:
          - { yuan: 六點半左右。他們說，大概六點三十一分。 }
        else:
          - { yuan: 六點半左右。他們說，大概六點三十一分。, at: right, dist: near, via: phone }
      - daze: heavy
      - { sfx: tinnitus, at: center }
      - if: flag.c1_yuan_with_me
        then:
          - narr: 我從椅子上滑下去。予安伸手扶住我的手臂，我還是坐到了地上。
        else:
          - narr: 我從椅子上滑下去，背抵著桌腳，一直坐到地上，手機還壓在耳朵上。
      - pause: 2
      - daze: off
      - if: flag.c1_yuan_with_me
        then:
