# 第一章｜第一個今天
# 盲眼主角版。格式見 docs/design.md §11；故事見 docs/story.md。
chapter: 1
title: 第一個今天
start: c1_prologue
restart: c1_train
advance:
  - if: know.k_ruoqing_died
    to: 2

scenes:
  # ─────────────────────────── 序章 ───────────────────────────
  - id: c1_prologue
    # 格局：城市，租屋處／床邊（docs/scene-layouts.md）
    time: "10月2日 22:40"
    place: 城市，租屋處
    ambience: [room_tone, rain_on_window]
    beats:
      - pause: 1.5
      # 教學：第一次玩，這句停著等玩家點一下畫面才往下走（只教一次）。
      - { narr: 雨打在窗外冷氣機的鐵殼上，一陣密，一陣疏。, teach: tap }
      - { sfx: cloth_rustle, at: front, dist: near, text: 窸窣 }
      - narr: 行李箱攤在床上。我把摺好的衣服一疊一疊放進去，每放一疊，就用手掌壓平，好多塞一點。
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - pause: 1
      - { sfx: envelope, at: front, dist: near, text: 沙—— }
      - narr: 信封是下午從管理員那邊收到的。
      - narr: 拿上來的時候還說，現在很少看到手寫的信了。
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡、嗡, vib: buzz }
      - narr: 我把手機鏡頭對著信封。
      - phone: 收件人，林——。
      - phone: 寄件人，林知夏。
      - heart: slow
      - pause: 2
      - think: 這不可能。
      - narr: 我的拇指一直壓在封口上，壓到紙都軟了，才想到要拆。
      - pause: 1.5
      - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
      - narr: 信紙抽出來，我的指尖先碰到一排凸點。
      - narr: 是一行點字。
      - narr: 我把指尖放在最左邊那一格，紙很薄，凸點一壓就會塌，只能輕輕地滑。
      - touch:
          cells: [不, 要, 回, 來]
          style: braille
          prompt: 指尖從左邊慢慢滑過去
      # 教學：第一次玩，這句會停在這裡等玩家長按記住（只教一次）。第一章予安問信上寫什麼，就用得到它。
      - { think: 不、要、回、來。, mem: m_letter, teach: keep }
      - pause: 2.5
      - think: 我兩年前才開始學點字，知夏死的時候，我還沒失明。
      - think: 她不會點字。也不可能知道我現在會需要。
      - pause: 1.5
      - narr: 指尖在那四格上來回摸了好幾遍。
      - think: 大概是誰在惡作劇，借了她的名字。還是某個知道我要回去的人。
      - think: 到底是誰。
      - heart: off
      - think: 車票上個月就買好了，仲介也約好了，文件都排好了。
      - pause: 1
      - think: 這次回去，就是為了以後不用再回去。
      - pause: 1
      - { sfx: drawer, at: front-right, dist: near, text: 喀啦 }
      - narr: 我拉開抽屜，摸到那疊用橡皮筋綁著的信。
      - narr: 一共六封。
      - { narr: 五年前那個秋天，知夏一封一封寄來的。而我一封都沒拆。, mem: m_six_letters }
      - pause: 1
      - narr: 後來我看不見了。
      - narr: 墨水寫的字，我再也讀不到，我也沒打算讓任何人念給我聽。
      - think: 這次一起帶回去，放回她的房間。跟房子一起處理掉。
      - { sfx: cloth_rustle, at: front, dist: near, text: 窸 }
      - narr: 我把六封信放進行李箱最底層。那封點字的，則放進外套內側的口袋。
      - think: 該睡了。明天早上的車。
      - pause: 3
    next: c1_train

  # ─────────────────────────── 06:12 列車 ───────────────────────────
  - id: c1_train
    # 格局：返鄉列車／靠窗座位（docs/scene-layouts.md）
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    beats:
      - pause: 1.5
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 鬧鐘。十月三日。六點十二分。
      - narr: 我醒來的時候，手機還在外套口袋裡震，車廂正在微微搖晃。
      - { sfx: rail_clack, at: back, dist: near, text: 喀噠、喀噠 }
      - narr: 我把腳底貼平，讓鐵軌接縫一下一下往上傳。
      - think: 不小心睡著了。
      - narr: 摸了一下外套口袋裡，信還在。
      - pause: 1
      - { cue: gossip, at: back-left, text: 窸窸窣窣, sfx: huddle_rustle, whisper: true }
      - think: 後面有人壓低聲音在說話。
      # 教學：第一次玩，這句停著等玩家點「窸窸窣窣」轉過去聽（只教一次）。八卦講完前沒轉，就自己往下走。
      - { think: 鎮上的事。五年沒聽人講了。, teach: turn }
      - pause: 2
      - narr: 折起來的手杖橫在腿上。我用拇指一節一節摸它的接頭，摸到最後一節，再從頭摸回來。
      - { wait: 8, clock: "06:14" }
      - narr: 窗外大概開始亮了。我只感覺得到臉頰那側比較暖。
      - narr: 走道另一邊有人在剝橘子，酸酸的味道一路飄過來。
      - { sfx: cough, at: back-left, dist: mid, text: 咳 }
      - { sfx: cough, at: back-right, dist: near, text: 咳咳 }
      - pause: 2
      - { sfx: train_horn, at: front, dist: far, text: 嗚—— }
      - narr: 車廂跟著慢下來。
      - pause: 1.5
      - { sfx: station_chime, at: front, text: 叮——咚—— }
      - announcer: 下一站，灰潮鎮。
      - announcer: 要下車的旅客，請準備。
      - think: 五年了。上一次坐這班車，是往反方向。
      - think: 那天我跟知夏吵完架就走了，沒有人來送我。
      - think: 她的告別式，我也沒有回來。要簽的文件，都是寄到我住的地方。
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 我把手杖展開，一節一節卡好。
    threads:
      # 主線約 35 秒報站；這條要在那之前講完，講完注意力自動轉回主線。
      # 前三句是閒聊，晚轉頭的人錯過也沒關係；重點從「重新接電」開始。
      gossip:
        beats:
          - { woman: 鎮公所寄來那張，你家也收到了喔？, at: back-left }
          - { man: 舊城更新那個？寫得落落長，看一半就睡著。, at: back-left }
          - { man: 反正先換電線啦，從老街一路做到車站。, at: back-left }
          - { woman: ……連舊車站那邊也要重新接電？, at: back-left }
          - { man: 說是防災的什麼備援系統。, at: back-left }
          - { man: 鎮公所說更新完，車站以後就不會再停電了。, at: back-left }
          - { woman: 那邊不是五年前出過事。, at: back-left }
          - { man: 噓——小聲點。, at: back-left }
          - pause: 1
          - { woman: 我只是說，那裡有點——, at: back-left }
          # 男人用一聲咳嗽把她的話截掉。這條講完，注意力自己回到主線。
          - { sfx: cough, at: back-left, dist: near, text: 咳！ }
          - { sfx: cloth_rustle, at: back-left, text: 窸 }
    next: c1_arrival

  # ─────────────────────────── 07:40 抵達 ───────────────────────────
  - id: c1_arrival
    # 格局：灰潮鎮站月台／下車往出口（docs/scene-layouts.md）
    time: "07:40"
    place: 灰潮鎮車站
    ambience: [platform]
    cast: { yuan: front-right }
    beats:
      - { sfx: train_brake, at: front, text: 嘰———— }
      - { sfx: train_door, at: left, dist: near, text: 噗嘶 }
      - narr: 月台的風從背後推過來。
      - narr: 比記憶裡的風鹹一點。
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - think: 月台邊緣的導盲磚在左邊。出口應該在前面，往右。
      - { sfx: step_uneven, at: front-right, dist: near, text: 咚、叩 }
      - narr: 那個人停在我右前方，很近，又不敢再近一點。
      - pause: 1.2
      - { yuan: ……林家的？, as: 男人的聲音 }
      - think: 這個聲音。比五年前低了一點。
      - me: 予安？
      - yuan: 嗯。
      - yuan: 比我想的早。
      - me: 車沒誤點。
      - yuan: 灰潮鎮唯一還算準時的東西。
      - { sfx: laugh_soft, variant: 1, at: center, dist: near }
      - narr: 我笑出來，連我自己都意外。
      - pause: 1
      - yuan: 那個……
      - yuan: 請問，妳需要……我的意思是。
      - yuan: 我的左手肘，在妳的右手邊。
      - think: 還是這樣。一緊張，講話就像在念公文。
      - choice:
          options:
            - text: （握住他的手肘）
              then:
                - move: { yuan: right }
                - narr: 他的外套袖子有機油和黃銅的味道。
                - narr: 他走得很慢，慢到我知道他在算我的步伐。
                - set: c1_took_elbow
            - text: 「我自己可以。」
              then:
                - yuan: 好。
                - { sfx: step_uneven, at: front-right, dist: near, text: 咚、叩 }
                - narr: 他沒有走開，一直站在我右前方半步，像一個不說話的路標。
      - think: 他知道我看不見。
      - me: 誰告訴你的？
      - yuan: 仲介。他說妳電話裡交代，要有人來接。
      - yuan: 鎮上就這麼小。
      - me: 所以你就來了。
      - yuan: ……嗯。
      - if: flag.c1_took_elbow
        then:
          - { sfx: cloth_rustle, at: right, dist: near, text: 窸 }
        else:
          - { sfx: cloth_rustle, at: front-right, dist: near, text: 窸 }
      - narr: 他吸了一口氣，像要再說什麼，最後只是把我的行李箱拉過去。
      - yuan: 這麼重。裝石頭喔？
      - pause: 0.8
      - me: 裝衣服。
      - { sfx: suitcase_roll, at: front-right, dist: near, text: 喀啦喀啦 }
    next: c1_walk

  # ─────────────────────────── 07:55 鎮上 ───────────────────────────
  - id: c1_walk
    # 格局：灰潮鎮／往老家的路（docs/scene-layouts.md）
    time: "07:55"
    place: 灰潮鎮，往老家的路
    ambience: [street_morning, construction_far]
    cast: { yuan: front-right, man: left }
    beats:
      - if: flag.c1_took_elbow
        then:
          - { sfx: step_uneven, at: front-right, dist: near, text: 咚、叩 }
          - narr: 他的手肘夾得很穩。走了一段，我們的腳步慢慢對上，踩在同一拍。
        else:
          - { sfx: cane_tap, at: front, dist: near, text: 叩 }
          - { sfx: step_uneven, at: front-right, dist: near, text: 咚、叩 }
          - { sfx: cane_tap, at: front, dist: near, text: 叩 }
          - narr: 我的手杖總是慢他的腳步半拍。他每走幾步就停一下，等那半拍跟上來。
      - { think: 他的左腳落地比右腳重，一重一輕。以後聽到這個，就是他。, learn: k_sig_yuan }
      - { sfx: construction_drill, at: right, dist: far, text: 噠噠噠噠 }
      - yuan: 舊城更新，最近到處都在挖。
      - { sfx: car_pass, at: left, dist: far, to: back:far, text: 嗚—— }
      - { man: 灰潮鎮舊城更新說明會，今晚七點，鎮公所三樓——, as: 宣傳車的喇叭, at: left, to: back:far, via: speaker }
      - { cue: workers, at: back-right, text: 鏗、鏗, sfx: hammer }
      - yuan: 你們家那條巷子也在名單上。所以才會叫妳回來吧。
      - me: 嗯。估價、產權。一堆要簽名的東西。
      - yuan: 要我幫妳的話，說一聲。
      - me: 嗯，謝謝。
      - { sfx: fry_sizzle, at: left, dist: mid, text: 滋—— }
      - { woman: 予安！今天沒來買蛋餅喔？, as: 早餐店老闆娘, at: left, dist: mid }
      - yuan: 等一下再過來。
      - { woman: 好，幫你留一份。……旁邊這個是？, as: 早餐店老闆娘, at: left, dist: mid }
      - yuan: 林家的。回來辦事。
      - { woman: 喔……林家的喔。今天回來喔。, as: 早餐店老闆娘, at: left, dist: mid }
      - narr: 她的聲音一下子低下去，鐵板上的蛋還在滋滋響，她就沒有再問了。
      - pause: 1.5
      - { sfx: coffee_grind, at: left, dist: mid, text: 嘎啦嘎啦 }
      - narr: 經過一家還沒開門的店，咖啡的味道沾到我外套的袖子上。
      - me: 以前這個時間，市場那邊不是很吵？
      - yuan: 收掉好幾攤了。孩子去外地，老人家做不動，就收了。
      - narr: 我記得那幾家攤子，買一袋菜能聊到下一班火車進站。
      - narr: 現在磨豆子的聲音停了，就只剩行李箱的輪子在響。
      - { sfx: suitcase_roll, at: front-right, dist: near, text: 喀啦喀啦 }
      - { amb: [town_square, construction_far] }
      - narr: 我們走到鎮中央的時候，風一下子變大了。這裡很空。
      - think: 鐘樓廣場。
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - phone: 八點。
      - narr: 我停下來。
      - pause: 1.5
      - { sfx: pigeon_coo, at: front-left, dist: mid, text: 咕咕 }
      - pause: 0.8
      - { sfx: shutter_roll, at: back-right, dist: far, text: 嘩啦啦 }
      - pause: 1.2
      - narr: 沒有別的了。
      - think: 小時候，鐘樓每到整點都會響，響到窗戶都在抖。
      - me: 鐘呢？
      - yuan: ……拆了。
      - me: 什麼時候？
      - pause: 1
      - yuan: 妳姊出事那年。
      - narr: 胃往下沉了一截。我把手杖的尖端抵在地磚縫裡，抵到它不會晃。
      - me: 為什麼拆？
      - yuan: 說是結構有問題。後來也沒裝新的。
      - narr: 風從鐘樓那邊吹過來。上面空了一塊，風在裡面繞了一圈。
      - { sfx: wind_gust, at: front-left, dist: far, text: 嗚—— }
      - { sfx: suitcase_roll, at: front-right, dist: mid, text: 喀啦喀啦 }
      - narr: 予安拉著行李箱先走了。我跟上那個聲音。
    threads:
      workers:
        beats:
          - { man: 東邊那條舊線，下午要接回去測。, at: back-right, as: 工人的聲音 }
          - { old_man: 舊車站那條？那不是停用很久了。, at: back-right, as: 另一個工人 }
          - { man: 圖上就寫「備援」兩個字，誰知道是幹嘛的。, at: back-right, as: 工人的聲音 }
          - { old_man: 反正接上去有錢拿就好。, at: back-right, as: 另一個工人 }
          - { sfx: hammer, at: back-right, text: 鏗 }
    next: c1_house

  # ─────────────────────────── 08:05 老家 ───────────────────────────
  - id: c1_house
    # 格局：林家老屋／客廳／剛進門（docs/scene-layouts.md）
    time: "08:05"
    place: 林家老屋
    ambience: [old_house]
    cast: { yuan: front }
    beats:
      - { sfx: key_jingle, at: front, dist: near, text: 鏘啷 }
      - { sfx: lock_turn, at: front, dist: near, text: 喀 }
      - narr: 鑰匙轉到一半就卡住，他扭了兩下才轉過去，門還是推不動。
      - yuan: 卡住了。妳退後一點。
      - { sfx: door_creak, at: front, dist: near, text: 碰——吱呀 }
      - narr: 他用肩膀頂了一下。門鬆開的聲音，跟我記得的一模一樣。
      - narr: 屋裡是灰塵跟舊木頭的味道。底下還有一點很淡的香味，很像知夏以前用的洗髮精。
      - think: 五年了，不可能還在。
      - pause: 1
      - yuan: 我去開窗。
      - { sfx: wind_gust, at: left, text: 颯 }
      - { sfx: wind_gust, at: front-left, text: 颯 }
      - { sfx: wind_gust, at: front-right, text: 颯 }
      - { sfx: wind_gust, at: right, text: 颯 }
      - narr: 窗戶一扇一扇打開。房間從左邊開始，慢慢有了形狀。
      - move: { yuan: front-right }
      - { sfx: phone_buzz, at: front-right, text: 嗡、嗡, vib: buzz }
      - narr: 是他的手機。他沒有馬上接，好像在看訊息。
      - me: 誰？
      - yuan: ……房仲。
      - { yuan: 問我今晚八點，方不方便看店。, learn: k_yuan_realtor }
      - me: 你要賣店？
      - yuan: 還沒決定。
      - narr: 他說得很快，像那是一句早就準備好的話。
      - pause: 1
      - move: { yuan: front }
      - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
      - yuan: 桌上有一疊文件。估價單，更新區域的通知。
      - yuan: 還有一個牛皮紙袋，寫著妳的名字。仲介留的吧。
      - yuan: 要簽名的地方都貼了黃色標籤。他說，妳摸到就簽。
      - me: 上面寫什麼？
      - yuan: ……他沒講。
      - choice:
          timeout: 12
          options:
            - text: 「先去她的房間。」
              then:
                - yuan: ……好。
                - { sfx: step_uneven, at: right, dist: mid, text: 咚、叩 }
                - narr: 他停在走廊盡頭那扇門前，沒有進去。
            - text: 「幫我念一下估價單。」
              then:
                - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
                - yuan: 建物……屋齡四十二年。更新後預估……
                - yuan: 這個數字，大概夠妳在城市付三年房租。
                - think: 三年。這棟房子換三年。
                - narr: 我走向走廊。他跟在後面，停在知夏的房門口。
          silence:
            - pause: 1.5
            - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
            - yuan: 封口那邊，有人用鉛筆畫了一個笑臉。
            - yuan: ……仲介還滿閒的。
            - yuan: ……那我先放著。
            - narr: 紙袋被放回桌上。我摸著牆往走廊走，他跟在後面，停在知夏的房門口。
    next: c1_room

  # ─────────────────────────── 08:25 知夏的房間 ───────────────────────────
  - id: c1_room
    # 格局：林家老屋／知夏的房間（docs/scene-layouts.md）
    time: "08:25"
    place: 林家老屋，知夏的房間
    ambience: [room_tone]
    cast: { yuan: back }
    beats:
      - { sfx: door_creak, at: front, dist: near, text: 吱—— }
      - narr: 房間比客廳安靜。安靜得像有人特地維持著。
      - narr: 我的手先碰到書桌的邊緣。木頭，有一道我小時候撞出來的缺口。
      - think: 都還在。
      - yuan: 我在門口。要什麼跟我說。
      - narr: 桌上有三樣東西。我的手掃過去一遍：一個相框，一只錶，一本筆記本。
      - think: 桌上沒有香，也沒有花。
    next: c1_room_touch

  - id: c1_room_touch
    # 格局：林家老屋／知夏的房間（docs/scene-layouts.md）
    cast: { yuan: back }
    beats:
      - choice:
          options:
            - text: （摸相框）
              if: "!flag.c1_photo"
              then:
                - set: c1_photo
                - { sfx: glass_clink, at: front-left, dist: near, text: 叮 }
                - narr: 玻璃很冷。木框邊緣有一點翹起來。
                - think: 照片。我摸得到它，摸不到上面的任何東西。
                - me: 予安。這張照片裡是誰？
                - { sfx: step_uneven, at: back, dist: near, text: 咚、叩 }
                - yuan: 妳姊。站在中間，在笑。
                - { yuan: 旁邊是一個短頭髮的女生，揹著很大的包包。, learn: k_photo_tingan, mem: m_photo }
                - yuan: 後面幾個穿白色背心的人。背景是舊研究所的大門。
                - yuan: 我不認得那個女生。
            - text: （拿起手錶）
              if: "!flag.c1_watch"
              then:
                - set: c1_watch
                - narr: 一只女錶。錶帶是皮的，扣環那裡磨得很薄。
                - narr: 我把它拿到耳邊。
                - pause: 2
                - think: 沒有聲音。
                - me: 它停了。
                - { sfx: step_uneven, at: back, dist: near, text: 咚、叩 }
                - yuan: 嗯。
                - { yuan: 停在六點三十一分。, learn: k_watch_1831, mem: m_watch }
                - narr: 翻過來，錶背上有一些刻痕。很細，很淺，指甲摸過去像在摸一條結了冰的河。
                - touch:
                    cells: ["？", "？", 你, "？", 二, "？", "？"]
                    style: engrave
                    prompt: 用指甲順著刻痕刮過去
                    timeout: 30
                - think: ……「你」？還有一個「二」。其他的太細了，摸不清楚。
            - text: （打開筆記本）
              if: "!flag.c1_notebook"
              then:
                - set: c1_notebook
                - { sfx: page_turn, at: front-right, dist: near, text: 沙啦 }
                - narr: 一本硬殼筆記本。中間有好幾頁被撕掉了，撕口很不整齊。
                - narr: 剩下的紙頁背面，摸起來是凸的。
                - narr: 知夏寫字一直很用力。用力到字從背面透出來，變成可以摸的東西。
                - narr: 我翻回正面。筆尖壓下去的地方是一道一道的溝，指腹放進去剛好。
                - touch:
                    cells: ["1", "8", "：", "3", "1"]
                    style: groove
                    prompt: 指腹順著筆畫的溝走過去
                    timeout: 30
                - { think: 一、八。冒號。三、一。, learn: k_notebook_1831 }
                - narr: 下一行。一樣。
                - narr: 再下一行。還是一樣。
                - think: 十八點三十一分。她寫了很多次，紙背都凸起來了。
            - text: （把那六封信放進她的抽屜）
              if: "!flag.c1_letters_left"
              then:
                - set: c1_letters_left
                - { sfx: drawer, at: front, dist: near, text: 喀啦 }
                - narr: 我從行李箱底層拿出那疊信，橡皮筋還是緊的。
                - narr: 抽屜裡是空的。我把信放進去，推回去。
                - yuan: 那是什麼？
                - me: 她以前寄給我的。我沒拆。
                - pause: 2.5
                - yuan: ……要我念嗎？
                - me: 不用。
                - { sfx: wood_creak, at: back, dist: near, text: 嘰 }
                - narr: 他沒有再問。門口的地板響了一聲，他換了一隻腳站。
            - text: （離開房間）
              if: flag.c1_photo || flag.c1_watch || flag.c1_notebook
              goto: c1_day
            - text: （站在原地，聽這個房間）
              disabled_if: flag.c1_room_listen_done
              then:
                - if: "!flag.c1_room_listen_1"
                  then:
                    - set: c1_room_listen_1
                    - pause: 2
                    - { sfx: fabric_flap, at: front-left, dist: mid, text: 啪 }
                    - pause: 1
                    - narr: 窗簾被風吹得很輕地碰了一下窗框。
                    - if: flag.c1_watch || flag.c1_notebook || know.k_watch_1831 || know.k_notebook_1831
                      then:
                        - think: 姊，妳到底在算什麼。
                      else:
                        - think: 椅子沒有推進去。好像她只是起來倒杯水，等一下就回來。
                  else:
                    - if: "!flag.c1_room_listen_2"
                      then:
                        - set: c1_room_listen_2
                        - pause: 2
                        - { sfx: wood_creak, at: back, dist: near, text: 嘰 }
                        - narr: 門口的地板輕輕響了一聲。予安還站在那裡。
                        - yuan: 不急。
                      else:
                        - set: c1_room_listen_done
                        - pause: 2
                        - { sfx: fabric_flap, at: front-left, dist: mid, text: 啪 }
                        - pause: 1
                        - narr: 我又等了一會兒。只有窗簾偶爾碰著窗框。
                        - think: ……先到這裡吧。
      - goto: c1_room_touch

  # ─────────────────────────── 白天 ───────────────────────────
  - id: c1_day
    # 格局：林家老屋／客廳（docs/scene-layouts.md）
    time: "11:20"
    place: 林家老屋
    ambience: [old_house]
    cast: { yuan: front-right }
    beats:
      - narr: 從她房間出來的時候，客廳的窗都開著，灰塵味淡了很多。
      - { sfx: pour_water, at: front-right, dist: mid, text: 嘩—— }
      - narr: 我在裡面待了多久，自己也不知道。予安在廚房那邊，水龍頭開了又關。
      - yuan: 水有點黃。我先讓它流一下。
      - me: 五年沒人用了。
      - yuan: 嗯。再一下就清了。
      - { sfx: phone_notify, at: front-right, dist: mid, text: 叮咚 }
      - narr: 他的手機響了一聲。他沒有馬上回，過了一下才走到我前面。
      - move: { yuan: front }
      - yuan: 我得回店裡一趟。下午有客人要來拿錶。
      - yuan: 妳呢？
      - choice:
          options:
            - text: 「我留下來整理。」
              goto: c1_day_house
            - text: 「我跟你去店裡。」
              goto: c1_day_shop
            - text: 「我想自己走走。」
              goto: c1_day_street

  - id: c1_day_house
    # 格局：林家老屋／客廳／沙發（docs/scene-layouts.md）
    time: "12:40"
    place: 林家老屋
    ambience: [old_house]
    cast: { old_woman: right }
    beats:
      - narr: 我把客廳的東西一樣一樣摸過去。
      - narr: 沙發。電視。茶几上的遙控器，電池早就漏了，黏黏的。
      - { sfx: scooter_start, at: right, dist: mid, text: 噗、噗噗……嗡嗡 }
      - narr: 我停下來聽外面。巷子裡的人一個一個出門了。
      - { wait: 6 }
      - narr: 窗外有拖鞋的聲音，從巷子那頭慢慢拖過來。一步，停一下，再一步。
      - think: 隔壁的阿婆。以前她每天這個時間，都會從我們家窗外走過去。
      # 教學：第一個聽距離。走到窗邊才叫，她聽得到；叫太早她沒聽見，還是會停；叫太晚，她就走過去了。
      - approach:
          sfx: step
          at: right
          past: back-right
          steps: 6
          interval: 0.95
          text: 啪噠
          prompt: 等她走到窗邊，再跟她打招呼
          hit:
            - me: 阿婆好。
            - { sfx: step, at: right, dist: near, text: 啪噠 }
            - { old_woman: 林家的？是林家的小妹回來了喔？, as: 窗外的老太太 }
            - set: c1_ama_talked
          early:
            - me: 阿婆好！
            - narr: 拖鞋聲沒有停。她還在巷子那頭，耳朵也不比以前了。
            - { sfx: step, at: right, dist: near, text: 啪噠 }
            - me: 阿婆。
            - { old_woman: 哎唷，嚇我一跳。林家的？是林家的小妹回來了喔？, as: 窗外的老太太 }
            - set: c1_ama_talked
          late:
            - { sfx: step, at: back-right, dist: mid, text: 啪噠 }
            - me: 阿婆！
            - { old_woman: 嗯？……林家的喔？回來就好，回來就好。, as: 窗外的老太太, at: back-right, dist: far }
            - { sfx: step, at: back-right, dist: far, text: 啪噠…… }
            - think: 她以前每次碰到知夏，都要拉著講很久。
      - if: flag.c1_ama_talked
        then:
          - me: 阿婆好久不見。
          - { old_woman: 哎呀，長這麼大了。, as: 窗外的老太太 }
          - { old_woman: 妳姊以前喔，每天都弄到很晚才回來。圖書館關門了還不走。, as: 窗外的老太太 }
          - { old_woman: 好好的一個人……, as: 窗外的老太太 }
          - narr: 她嘆了一口氣。
          - { sfx: step, at: right, dist: mid, to: back-right:far, text: 啪噠……啪噠…… }
          - think: 每天都很晚。她在做什麼？
      - pause: 2
      - narr: 我在沙發上坐下來，就沒有再起來。
      - narr: 窗口的太陽原本曬在我手背上，後來移到膝蓋，再後來，只剩地板那邊還有一點溫溫的。
      - { wait: 12 }
      - { sfx: door_open, at: front-right, text: 喀、吱 }
      - { sfx: step_uneven, at: front-right, dist: mid, text: 咚、叩 }
      - narr: 門口有人進來，好像怕吵醒誰。
      - { sfx: step_uneven, at: front-right, dist: mid, to: front:near, text: 咚、叩 }
      - move: { yuan: front }
      - choice:
          timeout: 6
          options:
            - text: 「予安。」
              if: know.k_sig_yuan
              then:
                - pause: 0.8
                - { yuan: ……門沒鎖，我就自己進來了。, at: front }
                - me: 我聽到了。你左腳比較重。
                - { yuan: 有嗎。, at: front }
                - { sfx: step_uneven, at: front, dist: near, text: 咚、叩 }
                - narr: 他往前走了兩步，走得很慢，好像在聽自己的腳。
                - set: c1_named_yuan
            - text: （等他先開口）
              then:
                - { yuan: 是我。, at: front }
      - me: 客人呢？
      - { yuan: 拿走了。, at: front }
      - { sfx: plastic_crinkle, at: front, dist: near, text: 窸窸窣窣 }
      - narr: 塑膠袋放到茶几上。
      - { yuan: 想說妳一定還沒吃。, at: front }
      - { yuan: 熱的在左邊，湯在右邊。蓋子我先幫妳打開了。, at: front }
      - narr: 我伸手碰了一下左邊，紙盒燙得我縮了一下。這才想起來，從早上到現在，我什麼都沒吃。
      - narr: 吃到一半，我摸到外套內側的口袋。信還在。
    next: c1_letter

  - id: c1_day_shop
    # 格局：周家鐘錶店／後面那張椅子（docs/scene-layouts.md）
    time: "12:10"
    place: 周家鐘錶店
    ambience: [clock_shop]
    cast: { yuan: front, man: back-right }
    beats:
      - { sfx: shop_bell, at: back, dist: near, text: 叮鈴 }
      - narr: 一推開門，滿屋子的滴答聲就把我包住了。
      - narr: 沒有一個是同步的。像一群人同時在小聲數數。
      - yuan: 後面有椅子。
      - yuan: 冰箱有茶。
      - narr: 他說完就沒有再說話了。我聽見他坐下，打開工具盒。
      - { sfx: tools_clink, at: front, dist: near, text: 叮 }
      - { cue: oldclock, at: back-left, text: 噹……, sfx: clock_chime }
      - { wait: 30 }
      - me: 你爸呢？
      - pause: 1.5
      - yuan: 前年走的。
      - me: ……對不起。
      - yuan: 不會。
      - { sfx: clock_wind, at: front, dist: near, text: 嘰嘰嘰 }
      - narr: 他在替一只錶上發條，一格一格，上得很慢。
      - yuan: 他走之前一直說，這間店以後就是我的。
      - yuan: 說得很理所當然。
      - narr: 他好像還有話，最後只是把錶放回桌上。
      - pause: 2
      - narr: 之後我們都沒有再說話。冰箱拿出來的茶，在我手裡慢慢退冰。
      - { sfx: shop_bell, at: back-right, dist: near, text: 叮鈴 }
      - { man: 少年仔，我的錶好了沒？, as: 來拿錶的阿伯, at: back-right, dist: near }
      - { sfx: step, at: back-right, dist: near, to: front-right:near, text: 叩、叩 }
      - move: { man: front-right:near }
      - { yuan: 阿伯，好了。走得很準，你戴回去看看。, at: front }
      - { man: 這支是我太太的啦，她以前最在意它準不準。, as: 來拿錶的阿伯 }
      - narr: 阿伯在櫃台前試了很久，說了好幾次謝謝才走。
      - { sfx: step, at: front-right, dist: near, to: back-right:near, text: 叩、叩 }
      - { sfx: shop_bell, at: back-right, dist: near, text: 叮鈴 }
      - { sfx: tools_clink, at: front, dist: near, text: 喀 }
      - narr: 予安把工具盒蓋上。
      - { yuan: 久等了，我送妳回去。, at: front }
    threads:
      oldclock:
        beats:
          - narr: 不是整點。
          - { yuan: 那個不用管。, at: front }
          - { yuan: 那是我爸修了一輩子都修不好的一座。每天亂響。, at: front }
          - { yuan: 他也不准我丟。, at: front }
          - { sfx: clock_chime, at: back-left, text: 噹 }
    next: c1_letter

  - id: c1_day_street
    # 格局：老街／車道在右（docs/scene-layouts.md）
    time: "13:30"
    place: 老街
    ambience: [street_afternoon]
    cast: { child: front-left, ruoqing: right }
    beats:
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 老街的地磚換過了。手杖敲上去的聲音，比我記得的清脆。
      - { sfx: bicycle_bell, at: left, dist: far, text: 叮叮 }
      - narr: 我先往旁邊讓了一步。
      - pause: 1
      - { sfx: truck_pass_quiet, at: back, dist: near, text: ——！, vib: thud }
      - heart: fast
      - narr: 有什麼東西貼著我的背擦過去。
      - narr: 等我反應過來，背上只剩一陣熱風。
      - { man: 電動貨車也開那麼快！沒看到有人喔！, as: 路邊的店家, at: left }
      - think: 我完全沒聽見它過來。
      - tension: 12
      - { learn: k_truck }
      - narr: 我把手杖收回來抱在胸前，站在原地，等心跳慢下來。
      - heart: off
      - { sfx: ball_bounce, at: front-left, text: 咚、咚、咚 }
      - { child: 啊，球！ }
      - narr: 一顆球彈過來，擦過我的鞋子，滾到後面去了。
      - { sfx: ball_bounce, at: back-right, dist: mid, gain: 0.6, text: 咚 }
      - narr: 它撞上誰家的鐵捲門，停住了。風一吹，又輕輕撞一下。
      # 練習：第一個聽聲辨位，代價很小（找不到時小孩安慰她，抵掉大半緊張）。小孩在左前方笑，球在右後方。
      - locate:
          sfx: ball_bounce
          at: back-right
          gain: 0.55
          decoys:
            - { sfx: kid_laugh, at: front-left }
          tries: 2
          timeout: 20
          interval: 3
          prompt: 球滾到哪裡了？
          success:
            - narr: 右後方。我轉過身，順著鐵捲門往下摸，手指碰到它。塑膠的，有一點洩氣。
            - { sfx: step_run, at: front-left, dist: mid, to: back-right:near, text: 噠噠 }
            - move: { child: back-right }
            - { child: 姊姊，那是我的！, at: back-right, dist: near }
            - me: 給你。
            - { child: 謝謝姊姊！ }
            - tension: -6
          fail:
            - narr: 我往那邊摸了半天，只摸到地磚的縫。
            - { sfx: step_run, at: front-left, dist: mid, to: back-right:near, text: 噠噠 }
            - move: { child: back-right }
            - { child: 在這裡啦，姊姊妳後面！, at: back-right, dist: near }
            - narr: 小孩自己跑過來，把球撿走了。我手掌上沾了一層灰。
            - { child: 沒關係啦，我們也常常找不到。, at: back-right, dist: near }
            - narr: 他講得那麼理所當然，我忍不住笑了一下，肩膀也跟著鬆下來。
            - tension: -4
      - pause: 1.5
      - { sfx: camera_shutter, at: right, text: 喀嚓 }
      - narr: 右邊有一家店開著門，咖啡的味道飄出來。
      - think: 早上經過、還沒開門的那家。
      - narr: 我往門口走了兩步，又停下來。
      - narr: 背上被那台貨車擦過的地方，到現在還是麻的。
      - narr: 我退到店家的屋簷底下，背貼著鐵捲門，打給予安，請他來接我。
      - narr: 掛掉電話，我把手杖收短，抱在胸前。
      - { sfx: car_pass, at: front, dist: mid, text: 嗚—— }
      - narr: 每有一台車經過，我的肩膀就自己縮一下。
      - think: 好累。
    next: c1_letter

  # ─────────────────────────── 15:30 信 ───────────────────────────
  - id: c1_letter
    # 格局：林家老屋／客廳（docs/scene-layouts.md）
    time: "15:30"
    place: 林家老屋
    ambience: [old_house]
    cast: { yuan: front }
    beats:
      - { sfx: kettle, at: front-right, dist: mid, text: 咕嘟咕嘟, src: 爐子上的水壺 }
      - { sfx: envelope, at: center, dist: near, text: 沙 }
      - narr: 我把信拿出來的時候，予安正好在倒水。
      - { sfx: pour_water, at: front, dist: near, text: 嘩—— }
      - pause: 1
      - narr: 倒水的聲音停了。
      - yuan: 那是什麼？
      - me: 出發前收到的。
      - me: 你幫我看一下信封。
      - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
