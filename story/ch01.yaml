        then:
          - narr: 我按了一下手機側鍵。
          - phone: 十七點五十二分。
          - think: 再過六分鐘。
          - choice:
              options:
                - text: （叫他先坐一下，晚點再走）
                  then:
                    - me: 你先坐一下。我想等一下再出門。
                    - yuan: ……好。
                    - { sfx: chair_scrape, at: right, dist: near, text: 嘎 }
