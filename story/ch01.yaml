      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - phone: 十八點三十分。
      - clock: "18:31"
      - { sfx: blackout, at: front, dist: far, text: ——, vib: thud }
      - { amb: [night_insects], fade: 0.1 }
      - narr: 廚房那台冰箱一直在的低低嗡聲，斷了。屋子安靜得像被抽掉一層。
      - { sfx: light_buzz, at: front, dist: near, text: 滋 }
      - { sfx: dog_bark, at: back-right, dist: far, text: 汪、汪 }
      - pause: 2
      - { sfx: power_up, at: back, text: 嗡 }
      - { sfx: fridge_click, at: front-right, dist: mid, text: 喀 }
