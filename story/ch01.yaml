      - narr: 電扇的風又吹到我臉上。我摸到桌沿，順著它慢慢坐回椅子上，牙關咬到下巴發痠。
      - if: flag.yuan_postoffice
        then:
          - pause: 1
          - yuan: 郵局那邊，我問了。
          - yuan: 系統裡沒有這封信的收寄紀錄。
          - { yuan: 可是郵戳是真的。櫃台的人說，那個章就是他們的章。, learn: c1_postoffice }
      - if: "!flag.yuan_postoffice && !flag.yuan_with_me"
        then:
          - pause: 1
          - yuan: 我下午去舊車站那邊幫人收一個鐘，經過車站外面。
          - { yuan: 有一個穿雨衣的女人，往研究所那邊走。, learn: c1_tingan_institute }
          - yuan: 那時候我沒想太多。
      - if: flag.yuan_with_me
        then:
          - { sfx: phone_buzz, at: right, text: 嗡、嗡 }
          - narr: 予安的手機一直在震。
          - me: 你八點不是有約？
          - yuan: ……改天吧。
          - narr: 他把手機按掉了。
    next: c1_watch

  # ─────────────────────────── 22:40 手錶 ───────────────────────────
  - id: c1_watch
    time: "22:40"
    place: 林家老屋，知夏的房間
    ambience: [house_night]
    beats:
      - narr: 我回到知夏的房間。
      - narr: 我沒有開燈，也不需要開燈。
      - if: flag.c1_watch
        then:
          - narr: 手錶還在桌上，在我早上放下的那個地方。
          - pause: 1.5
          - narr: 錶背的刻痕，我又摸了一次。還是摸不出來。
        else:
          - narr: 桌上那只錶，早上我沒有碰，我把它拿起來，皮錶帶的扣環那裡磨得很薄。
          - pause: 1
          - narr: 翻過來，錶背有一些很細的刻痕。
          - pause: 1.5
          - narr: 讀不出來
      - { sfx: phone_buzz, at: front, dist: near, text: 嗡 }
      - narr: 我把手機鏡頭對準，嘗試轉了好幾個角度。
      - pause: 2
      - phone: 如果你是第二次，
      - { phone: 不要救第一個死者。, learn: k_watch_engraving, mem: m_engraving }
      - heart: slow
      - pause: 3
      - think: 「第二次」？
      - think: 什麼意思？第一個死者又是什麼意思？
      - think: 太多疑惑，腦子一片混亂。
      - narr: 我把手錶握在手裡，錶殼還有一點我手心的溫度。
      - heart: off
      - narr: 我坐到她的床邊，聽自己的呼吸，一口比一口長。
      - pause: 5
    next: c1_night_yuan

  # ─────────────────────────── 23:20 ───────────────────────────
  - id: c1_night_yuan
    time: "23:20"
    place: 林家老屋
    ambience: [house_night, night_insects]
    cast: { yuan: right }
    beats:
      - { sfx: door_open, at: back, text: 叩叩——吱 }
      - yuan: 是我。
      - yuan: 我買了熱的，放在妳右手邊。
      - { sfx: cup_set, at: right, dist: near, text: 叩 }
      - narr: 我們安靜的吃著東西，窗外的蟲一直叫。
      - { wait: 10 }
      - yuan: 妳這次真的只是回來賣房子？
      - { sfx: envelope, at: center, dist: near, text: 沙 }
      - narr: 我把那封信推到他那邊。他沒有伸手拿。
      - yuan: 妳收到這個，還是照原本的行程回來？
      - me: 房子本來就要處理。
      - yuan: 妳可以先跟我說。
      - me: 你會信？
      - pause: 2
      - yuan: ……不會。
      - pause: 1.5
      - { yuan: 但我會去接妳。, learn: c1_yuan_pickup, mem: m_yuan_pickup }
      - pause: 3
      - narr: 我摸到杯子，捧在手裡，半天才說了一聲好。
      - pause: 2
      - { sfx: door_close, at: back, dist: mid, text: 喀 }
      - narr: 他把空的便當盒收走，門帶上的時候很輕。屋子裡剩下蟲叫，杯子在我手心裡一點一點涼掉。
      - if: flag.tingan_pressed
        then:
          - think: 那個記者說她只見過我姊幾次，她回答之前，慢了兩秒。
        else:
          - if: know.k_tingan_card
            then:
              - narr: 外套口袋裡那張名片的硬角，一直頂著我的手腕。
              - think: 葉庭安。
              - think: 她問起我姊的時候，我應該多問幾句的。
            else:
              - think: 那個記者問林家有沒有人在研究所做過事，我說不知道，她好像鬆了一口氣。
              - think: 為什麼？
      - if: flag.ruoqing_closed
        then:
          - think: 下午我問若晴跟我姊是什麼關係，她就走開了。
          - think: 要是我沒問那一句，她會不會也跑回來，跟我說她晚上要去哪裡。
        else:
          - if: seen.c1_station
            then:
              - think: 她跟我說她要去舊車站，我也跟去了，就站在離她幾步的地方。
            else:
              - think: 她跑回來跟我說她要去舊車站，我聽見了，然後自己回家。
      - pause: 1.5
      - think: 如果她今天晚上沒有去那裡呢？
    next: c1_bell

