# 第一章｜第一個今天
# 盲眼主角版。格式見 docs/design.md §11；故事見 docs/story.md。
chapter: 1
title: 第一個今天
start: c1_prologue
restart: c1_train
advance:
  - if: know.k_ruoqing_died
    to: 2

scenes:
  # ─────────────────────────── 序章 ───────────────────────────
  - id: c1_prologue
    time: "10月2日 22:40"
    place: 城市，租屋處
    ambience: [room_tone, rain_on_window]
    beats:
      - pause: 1.5
      - narr: 雨打在窗外冷氣機的鐵殼上，一陣密，一陣疏。
      - { sfx: cloth_rustle, at: front, dist: near, text: 窸窣 }
      - narr: 行李箱攤在床上。我把摺好的衣服一疊一疊放進去，每放一疊，就用手掌壓平，好多塞一點。
      - { sfx: phone_buzz, at: front-right, dist: near, text: 嗡 }
      - pause: 1
      - { sfx: envelope, at: front, dist: near, text: 沙—— }
      - narr: 信封是下午從管理員那邊收到的。
      - narr: 拿上來的時候還說，現在很少看到手寫的信了。
      - { sfx: phone_buzz, at: front-right, dist: near, text: 嗡、嗡, vib: buzz }
      - narr: 我把手機鏡頭對著信封。
      - phone: 收件人，林——。
      - phone: 寄件人，林知夏。
      - heart: slow
      - pause: 2
      - think: 這不可能。
      - narr: 我的拇指一直壓在封口上，壓到紙都軟了，才想到要拆。
      - pause: 1.5
      - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
      - narr: 信紙抽出來，我的指尖先碰到一排凸點。
      - narr: 是一行點字。
      - narr: 我把指尖放在最左邊那一格，紙很薄，凸點一壓就會塌，只能輕輕地滑。
      - touch:
          cells: [不, 要, 回, 來]
          style: braille
          prompt: 指尖從左邊慢慢滑過去
      - { think: 不、要、回、來。, learn: k_letter, mem: m_letter }
      - pause: 2.5
      - think: 我兩年前才開始學點字，知夏死的時候，我還沒失明。
      - think: 她不會點字。也不可能知道我現在會需要。
      - pause: 1.5
      - narr: 指尖在那四格上來回摸了好幾遍。
      - narr: 大概是誰在惡作劇，借了她的名字。或是某個知道我要回去的人。
      - think: 到底是誰。
      - heart: off
      - think: 車票上個月就買好了，仲介也約好了，文件都排好了。
      - pause: 1
      - think: 這次回去，就是為了以後不用再回去。
      - pause: 1
      - { sfx: drawer, at: front-right, dist: near, text: 喀啦 }
      - narr: 我拉開抽屜，摸到那疊用橡皮筋綁著的信。
      - narr: 一共六封。
      - { narr: 五年前那個秋天，知夏一封一封寄來的。而我一封都沒拆。, learn: k_six_unopened, mem: m_six_letters }
      - pause: 1
      - narr: 後來我看不見了。
      - narr: 墨水寫的字，我再也讀不到，我也沒打算讓任何人念給我聽。
      - think: 這次一起帶回去，放回她的房間。跟房子一起處理掉。
      - { sfx: cloth_rustle, at: front, dist: near, text: 窸 }
      - narr: 我把六封信放進行李箱最底層。那封點字的，則放進外套內側的口袋。
      - think: 該睡了。明天早上的車。
      - pause: 3
    next: c1_train

  # ─────────────────────────── 06:12 列車 ───────────────────────────
  - id: c1_train
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    beats:
      - pause: 1.5
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 鬧鐘。十月三日；六點十二分。
      - narr: 我醒來的時候，手環還貼著手腕在震，車廂正在微微搖晃。
      - narr: 鐵軌接縫一下一下從腳底傳上來。喀噠、喀噠。
      - think: 不小心睡著了。
      - narr: 摸了一下外套口袋裡，信還在。
      - pause: 1
      - { cue: gossip, at: back-left, text: 窸窸窣窣, sfx: huddle_rustle }
      - think: 後面有人壓低聲音在說話。
      - think: 想聽的話，轉過去就好。
      - pause: 2
      - narr: 折起來的手杖橫在腿上。我用拇指一節一節摸它的接頭，摸到最後一節，再從頭摸回來。
      - { wait: 6, clock: "06:12" }
      - narr: 窗外大概開始亮了。我只感覺得到臉頰那側比較暖。
      - { sfx: cough, at: back-left, dist: mid, text: 咳 }
      - { sfx: cough, at: back-right, dist: near, text: 咳咳 }
      - pause: 2
      - think: 五年了。上一次坐這班車，是往反方向。
      - think: 那天我跟知夏吵完架就走了，沒有人來送我。
      - pause: 1.5
      - { sfx: station_chime, at: front, text: 叮——咚—— }
      - announcer: 下一站，灰潮鎮。
      - announcer: 要下車的旅客，請準備。
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 我把手杖展開，一節一節卡好。
    threads:
      gossip:
        beats:
          - { woman: ……所以舊車站那邊也要重新接電？, at: back-left }
          - { man: 說是防災的什麼備援系統。, at: back-left }
          - { man: 鎮公所說更新完，車站以後就不會再停電了。, at: back-left }
          - { woman: 那邊不是五年前出過事。, at: back-left }
          - { man: 噓——小聲點。, at: back-left }
          - pause: 1
          - { woman: 我只是說，那裡有點……, at: back-left }
          - { narr: 她沒有說完。 }
    next: c1_arrival

  # ─────────────────────────── 07:40 抵達 ───────────────────────────
  - id: c1_arrival
    time: "07:40"
    place: 灰潮鎮車站
    ambience: [platform]
    cast: { yuan: front-right }
    beats:
      - { sfx: train_brake, at: front, text: 嘰———— }
      - { sfx: train_door, at: left, dist: near, text: 噗嘶 }
      - narr: 月台的風從背後推過來。
      - narr: 比記憶裡的風鹹一點。
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - think: 月台邊緣的導盲磚在左邊。出口應該在前面，往右。
      - { sfx: step, at: front-right, text: 叩、叩 }
      - narr: 有腳步聲停在我前面。很近，又不敢再近一點。
      - pause: 1.2
      - { yuan: ……林家的？, as: 男人的聲音 }
      - think: 這個聲音。比五年前低了一點。
      - me: 予安？
      - yuan: 嗯。
      - yuan: 比我想的早。
      - me: 車沒誤點。
      - yuan: 灰潮鎮唯一還算準時的東西。
      - { sfx: laugh_soft, variant: 1, at: center, dist: near }
      - narr: 我笑出來，連我自己都意外。
      - pause: 1
      - yuan: 那個……
      - yuan: 請問，妳需要……我的意思是。
      - yuan: 我的左手肘，在妳的右手邊。
      - think: 他緊張的時候，講話會變得很正式。這點沒變。
      - choice:
          options:
            - text: （握住他的手肘）
              then:
                - narr: 他的外套袖子有機油和黃銅的味道。
                - narr: 他走得很慢，慢到我知道他在算我的步伐。
                - set: c1_took_elbow
            - text: 「我自己可以。」
              then:
                - yuan: 好。
                - narr: 他沒有走開。腳步聲一直停在我右前方半步，像一個不說話的路標。
      - think: 他知道我看不見。
      - me: 誰告訴你的？
      - yuan: 仲介。他說妳電話裡交代，要有人來接。
      - yuan: 鎮上就這麼小。
      - me: 所以你就來了。
      - yuan: ……嗯。
      - { sfx: cloth_rustle, at: front-right, dist: near, text: 窸 }
      - narr: 他吸了一口氣，像要再說什麼，最後只是把我的行李箱拉過去。
    next: c1_walk

  # ─────────────────────────── 07:55 鎮上 ───────────────────────────
  - id: c1_walk
    time: "07:55"
    place: 灰潮鎮，往老家的路
    ambience: [street_morning, construction_far]
    cast: { yuan: front-right, man: left }
    beats:
      - { sfx: construction_drill, at: right, dist: far, text: 噠噠噠噠 }
      - yuan: 最近到處在施工，因為舊城更新。
      - { sfx: car_pass, at: left, dist: far, to: back:far, text: 嗚—— }
      - { man: 灰潮鎮舊城更新說明會，今晚七點，鎮公所三樓——, as: 宣傳車的喇叭, at: left, to: back:far }
      - narr: 宣傳車的聲音從左邊慢慢滑到背後，變成一團聽不清的回音。
      - { cue: workers, at: back-right, text: 鏗、鏗, sfx: hammer }
      - yuan: 你們家那條巷子也在名單上。所以才會叫妳回來吧。
      - me: 嗯。估價、產權。一堆要簽名的東西。
      - yuan: 要我幫妳的話，說一聲。
      - me: 嗯，謝謝。
      - pause: 1.5
      - narr: 經過一家還沒開門的店，裡面有人在磨豆子。咖啡的味道沾到我外套的袖子上。
      - me: 以前這個時間，市場那邊不是很吵？
      - yuan: 收掉好幾攤了。孩子去外地，老人家做不動，就收了。
      - narr: 我記得那幾家攤子，買一袋菜能聊到下一班火車進站。現在磨豆子的聲音停了，就只剩行李箱的輪子在響。
      - narr: 我們走到鎮中央的時候，風一下子變大了。這裡很空。
      - think: 鐘樓廣場。
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - phone: 八點。
      - narr: 我停下來。
      - pause: 3.5
      - narr: 鴿子拍翅膀。遠處有人拉起鐵門。
      - narr: 沒有別的了。
      - think: 小時候，鐘樓每到整點都會響，響到窗戶都在抖。
      - me: 鐘呢？
      - yuan: ……拆了。
      - me: 什麼時候？
      - pause: 1
      - yuan: 妳姊出事那年。
      - narr: 胃往下沉了一截。我把手杖的尖端抵在地磚縫裡，抵到它不會晃。
      - me: 為什麼拆？
      - yuan: 說是結構有問題。後來也沒裝新的。
      - narr: 風從鐘樓那邊吹過來。上面空了一塊，風在裡面繞了一圈。
      - { sfx: wind_gust, at: front-left, dist: far, text: 嗚—— }
      - narr: 予安拉著行李箱往前走，輪子在磚上喀啦喀啦響。我跟上那個聲音。
    threads:
      workers:
        beats:
          - { man: 東邊那條舊線，下午要接回去測。, at: back-right, as: 工人的聲音 }
          - { old_man: 舊車站那條？那不是停用很久了。, at: back-right, as: 另一個工人 }
          - { man: 圖上就寫「備援」兩個字，誰知道是幹嘛的。, at: back-right, as: 工人的聲音 }
          - { old_man: 反正接上去有錢拿就好。, at: back-right, as: 另一個工人 }
          - { sfx: hammer, at: back-right, text: 鏗 }
    next: c1_house

  # ─────────────────────────── 08:05 老家 ───────────────────────────
  - id: c1_house
    time: "08:05"
    place: 林家老屋
    ambience: [old_house]
    cast: { yuan: front }
    beats:
      - { sfx: key_jingle, at: front, dist: near, text: 鏘啷 }
      - { sfx: lock_turn, at: front, dist: near, text: 喀 }
      - narr: 鑰匙轉得動，門卻推不動。
      - yuan: 卡住了。妳退後一點。
      - { sfx: door_creak, at: front, dist: near, text: 碰——吱呀 }
      - narr: 他用肩膀頂了一下。門鬆開的聲音，跟我記得的一模一樣。
      - narr: 屋裡是灰塵跟舊木頭的味道。底下還有一點很淡的香味，很像知夏以前用的洗髮精。
      - think: 五年了，不可能還在。
      - pause: 1
      - yuan: 我去開窗。
      - { sfx: wind_gust, at: left, text: 颯 }
      - { sfx: wind_gust, at: front-left, text: 颯 }
      - { sfx: wind_gust, at: front-right, text: 颯 }
      - { sfx: wind_gust, at: right, text: 颯 }
      - narr: 窗戶一扇一扇打開。房間從左邊開始，慢慢有了形狀。
      - { sfx: phone_buzz, at: front-right, text: 嗡、嗡, vib: buzz }
      - narr: 是他的手機。他沒有馬上接，好像在看訊息。
      - me: 誰？
      - yuan: ……房仲。
      - { yuan: 問我今晚八點，方不方便看店。, learn: k_yuan_realtor }
      - me: 你要賣店？
      - yuan: 還沒決定。
      - narr: 他說得很快，像那是一句早就準備好的話。
      - pause: 1
      - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
      - yuan: 桌上有一疊文件。估價單，更新區域的通知。
      - yuan: 還有一個牛皮紙袋，寫著妳的名字。仲介留的吧。
      - choice:
          timeout: 12
          default: 2
          options:
            - text: 「先去她的房間。」
              then:
                - yuan: ……好。
                - narr: 他的腳步聲停在走廊盡頭那扇門前，沒有進去。
            - text: 「幫我念一下估價單。」
              then:
                - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
                - yuan: 建物……屋齡四十二年。更新後預估……
                - yuan: 這個數字，大概夠妳在城市付三年房租。
                - think: 三年。這棟房子換三年。
                - narr: 我走向走廊。他跟在後面，停在知夏的房門口。
            - text: （什麼都不說）
              then:
                - yuan: ……那我先放著。
                - narr: 紙袋被放回桌上。我摸著牆往走廊走，他跟在後面，停在知夏的房門口。
    next: c1_room

  # ─────────────────────────── 08:25 知夏的房間 ───────────────────────────
  - id: c1_room
    time: "08:25"
    place: 林家老屋，知夏的房間
    ambience: [room_tone]
    cast: { yuan: back }
    beats:
      - { sfx: door_creak, at: front, dist: near, text: 吱—— }
      - narr: 房間比客廳安靜。安靜得像有人特地維持著。
      - narr: 我的手先碰到書桌的邊緣。木頭，有一道我小時候撞出來的缺口。
      - think: 都還在。
      - yuan: 我在門口。要什麼跟我說。
      - narr: 桌上有三樣東西。我的手掃過去一遍：一個相框，一只錶，一本筆記本。
    next: c1_room_touch

  - id: c1_room_touch
    cast: { yuan: back }
    beats:
      - choice:
          options:
            - text: （摸相框）
              if: "!flag.c1_photo"
              then:
                - set: c1_photo
                - { sfx: glass_clink, at: front-left, dist: near, text: 叮 }
                - narr: 玻璃很冷。木框邊緣有一點翹起來。
                - think: 照片。我摸得到它，摸不到上面的任何東西。
                - me: 予安。這張照片裡是誰？
                - { sfx: step, at: back, dist: near, text: 叩 }
                - yuan: 妳姊。站在中間，在笑。
                - { yuan: 旁邊是一個短頭髮的女生，揹著很大的包包。, learn: k_photo_tingan, mem: m_photo }
                - yuan: 後面幾個穿白色背心的人。背景是舊研究所的大門。
                - yuan: 我不認得那個女生。
            - text: （拿起手錶）
              if: "!flag.c1_watch"
              then:
                - set: c1_watch
                - narr: 一只女錶。錶帶是皮的，扣環那裡磨得很薄。
                - narr: 我把它拿到耳邊。
                - pause: 2
                - think: 沒有聲音。
                - me: 它停了。
                - { sfx: step, at: back, dist: near, text: 叩 }
                - yuan: 嗯。
                - { yuan: 停在六點三十一分。, learn: k_watch_1831, mem: m_watch }
                - narr: 翻過來，錶背上有一些刻痕。很細，很淺，指甲摸過去像在摸一條結了冰的河。
                - touch:
                    cells: ["？", "？", 你, "？", "？", 二, "？"]
                    style: engrave
                    prompt: 用指甲順著刻痕刮過去
                    timeout: 30
                - think: ……「你」？還有一個「二」。其他的太細了，摸不清楚。
            - text: （打開筆記本）
              if: "!flag.c1_notebook"
              then:
                - set: c1_notebook
                - { sfx: page_turn, at: front-right, dist: near, text: 沙啦 }
                - narr: 一本硬殼筆記本。中間有好幾頁被撕掉了，撕口很不整齊。
                - narr: 剩下的紙頁背面，摸起來是凸的。
                - narr: 知夏寫字一直很用力。用力到字從背面透出來，變成可以摸的東西。
                - narr: 我翻回正面。筆尖壓下去的地方是一道一道的溝，指腹放進去剛好。
                - touch:
                    cells: ["1", "8", "：", "3", "1"]
                    style: groove
                    prompt: 指腹順著筆畫的溝走過去
                    timeout: 30
                - { think: 一、八。冒號。三、一。, learn: k_notebook_1831 }
                - narr: 下一行。一樣。
                - narr: 再下一行。還是一樣。
                - think: 十八點三十一分。她寫了很多次，紙背都凸起來了。
            - text: （把那六封信放進她的抽屜）
              if: "!flag.c1_letters_left"
              then:
                - set: c1_letters_left
                - { sfx: drawer, at: front, dist: near, text: 喀啦 }
                - narr: 我從行李箱底層拿出那疊信，橡皮筋還是緊的。
                - narr: 抽屜裡是空的。我把信放進去，推回去。
                - yuan: 那是什麼？
                - me: 她以前寄給我的。我沒拆。
                - pause: 2.5
                - yuan: ……要我念嗎？
                - me: 不用。
                - narr: 他沒有再問。門口的地板響了一聲，他換了一隻腳站。
            - text: （離開房間）
              if: flag.c1_photo || flag.c1_watch || flag.c1_notebook
              goto: c1_day
            - text: （站在原地，聽這個房間）
              disabled_if: flag.c1_room_listen_done
              then:
                - if: "!flag.c1_room_listen_1"
                  then:
                    - set: c1_room_listen_1
                    - pause: 3
                    - narr: 窗簾被風吹得很輕地碰了一下窗框。
                    - if: flag.c1_watch || flag.c1_notebook || know.k_watch_1831 || know.k_notebook_1831
                      then:
