          - { yuan: 好。有事打給我。, at: right, dist: near, via: phone }
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
          - narr: 電話掛掉以後，屋子又安靜下來，只剩木頭偶爾響一聲。
