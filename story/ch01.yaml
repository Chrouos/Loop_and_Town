                - { sfx: strap_click, at: right, dist: near, text: 喀 }
                - narr: 她沿著右邊的牆跑過來，從我旁邊擦過去，往出口那邊。
                - { sfx: step_run, at: back-right, dist: mid, text: 噠噠 }
                - { sfx: strap_click, at: back-right, dist: mid, text: 喀 }
            - text: （往她那邊走）
              then:
                - narr: 我朝她那邊跨出一步，手杖碰到什麼硬硬的東西。
                - ruoqing: 小心！
                - tension: 6
            - text: （站著沒動）
              then:
                - narr: 我的腳像釘在地上，手杖握在胸前，一步都沒動。
      - clock: "18:31"
      - { sfx: blackout, at: front, dist: near, text: ——, vib: thud }
      - { sfx: silence_drop, at: center }
      - pause: 0.8
      - { sfx: metal_crash, at: right, dist: mid, text: 轟——, vib: crash }
      - if: flag.c1_1831_called_out
        then:
          - { sfx: thud, at: back-right, dist: mid, text: 咚 }
          - { sfx: strap_click, at: back-right, dist: mid, text: 喀啦啦 }
        else:
          - { sfx: thud, at: front-right, dist: mid, text: 咚 }
          - { sfx: strap_click, at: front-right, dist: mid, text: 喀啦啦 }
      - { sfx: glass_break, at: front-left, text: 啪嚓 }
      - tension: 12
      - { sfx: tinnitus, at: center }
      - pause: 2
      - me: 若晴？
      - pause: 2.5
      - { me: 若晴！, shake: hard }
      - { sfx: gasp_crowd, at: back-left, dist: far, text: 啊—— }
      - { man: 停電了！看不到——什麼都看不到！, as: 外面有人在喊 }
      - think: 外面的人都停住了。
      - if: flag.c1_1831_called_out
        then:
          - think: 她剛剛還在跑。腳步停在哪裡了？
        else:
          - think: 我前面還有東西擋著。她的聲音呢？
      - think: 那個金屬扣還在響。若晴的背帶。
      - if: flag.c1_1831_called_out
        then:
          - locate:
              sfx: strap_click
              at: back-right
              interval: 1.8
              gain: 0.75
              exact: true
              decoys:
                - { sfx: glass_break, at: front-left }
                - { sfx: gasp_crowd, at: back-left }
              tries: 1
              timeout: 15
              prompt: 背帶的扣在哪裡響？
              success:
                - goto: c1_locate_success
              fail:
                - goto: c1_locate_fail
        else:
          - locate:
              sfx: strap_click
              at: front-right
              interval: 1.8
              gain: 0.75
              exact: true
              decoys:
                - { sfx: glass_break, at: front-left }
                - { sfx: gasp_crowd, at: back-left }
              tries: 1
              timeout: 15
              prompt: 背帶的扣在哪裡響？
              success:
                - goto: c1_locate_success
              fail:
                - goto: c1_locate_fail
    next: c1_police

  - id: c1_locate_success
    # 格局：舊車站／東牆牆腳（docs/scene-layouts.md）
    cast: { ruoqing: front, yuan: back, man: back-left }
    beats:
      # 鐵櫃在東牆（她原本站的地方的右邊）。若晴被叫過來時跑過了它，倒在右後方；沒叫她時倒在右前方的窗邊。兩邊都在那面牆的牆腳。
      - if: flag.c1_1831_called_out
        then:
          - narr: 右後方，不遠。我轉過身，沿著聲音走過去。第四步，鞋尖勾到一條拖在地上的粗電線。
          - { sfx: hum_fall, at: left, dist: near, text: 嗡…… }
          - narr: 電線被我一勾，往左手邊繃緊。嗡聲就從那個方向漏出來。我伸出去的手停在半空中。
        else:
          - narr: 右前方，不遠。我數著步子走過去。第四步，鞋尖碰到一個硬的東西。
          - { sfx: hum_fall, at: front, dist: near, text: 嗡…… }
          - narr: 嗡聲從牆裡面漏出來。我伸出去的手停在半空中。
      - think: 都停電了，那個聲音為什麼還在？
      - pause: 2
      - narr: 嗡聲掉下去了，四周只剩門口的人在喊。
      - narr: 我跪下來。定向行動課教過，不認識的東西先用手背碰，碰到不對還縮得回來。
      - narr: 手背掃開地上的碎玻璃，碰到相機。背帶的扣還是溫的。
      - set: c1_found_ruoqing
      - pause: 1.5
      - narr: 然後是她的手。
      - heart: pound
      - tension: 12
      - pause: 2
      - narr: 她倒在牆腳。我伸手去托她的頭，手背先撞到一塊鐵板。
      - narr: 燙的。裡面已經不嗡了，熱氣還一陣一陣透出來。
      - if: flag.c1_1831_called_out
        then:
          - narr: 她另一隻手壓在剛剛勾到我鞋尖的那條電線上。外皮滑滑的，是新的。
        else:
          - narr: 她另一隻手壓在一條電線上。電線比我的手指還粗，外皮滑滑的，是新的，一路鑽進牆裡。
      - narr: 我把袖口拉下來包住手指，隔著布，把她的手從那條線上撥開。
      - { think: 剛才那個嗡聲，是從這個鐵櫃裡出來的。, learn: k_cabinet_warm, mem: m_c1_cabinet }
      - pause: 1.5
      - narr: 我把她的手指包在掌心裡，等它們握回來。它們沒有動。
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - { phone: 心率 <心率>，過高，已記錄。十八點三十一分。, mem: m_1831 }
      - pause: 2
      - daze: heavy
      - { sfx: tinnitus, at: center }
      - narr: 我還握著她的手，握到自己的手指也沒有感覺了，分不出哪一隻比較冷。
      - daze: light
      - { sfx: power_up, at: back, text: 嗡——喀、喀 }
      - narr: 燈管重新滋滋響起，外面有人喊「有電了」，接著是一聲尖叫。
      - narr: 我抓著她的手往自己這邊拉，離那面牆遠一點，再遠一點。
      - narr: 門口那些人現在都看得到她了，看得到她的臉是什麼顏色，眼睛有沒有閉上。
      - narr: 整個大廳，只有跪在她旁邊的我不知道。
      - if: know.k_zhixia_note_1831
        then:
          - think: 十八點三十一分，不是死亡時間。那她為什麼不動？
        else:
          - think: 她剛剛還在講話。
      - narr: 我想把手抽出來去摸她的臉，又怕一放開，就再也找不到她在哪裡。
      - { sfx: siren_far, at: back, dist: far, text: 喔咿——喔咿—— }
      - { sfx: step_run, at: back, dist: far, text: 噠噠噠噠 }
      - { sfx: crowd_walla, at: back, dist: far, text: 吵吵鬧鬧 }
      - narr: 地板在震，很多雙鞋往這邊跑，跑到門口又停住，沒有人敢進來。
      - pause: 2
      - daze: off
      - { sfx: siren_far, at: back, dist: mid, text: 喔咿——喔咿—— }
      - narr: 警笛一聲一聲變清楚，我這才發現自己還跪在碎玻璃上。
      - narr: 膝蓋一抽一抽地刺。我伸手去摸，褲管濕了一大片，黏在腿上，指尖滑滑的，有鐵鏽味。
      - if: flag.c1_yuan_with_me
        then:
          - { sfx: step_run, at: back, text: 噠噠噠噠 }
          - yuan: 妳在哪？！
          - yuan: ……妳有沒有怎樣？妳有沒有受傷？
          - me: 予安。
          - me: 她不動了。
        else:
          - { sfx: step_run, at: back, text: 噠噠噠 }
          - { man: 小姐，妳先放手，讓我們來。, as: 員警, at: back, dist: near }
          - narr: 有人從後面扶住我的手肘，把我的手指一根一根從她手上拿開。我沒有用力，他還是拿得很慢。
          - { man: 妳膝蓋在流血欸。先跟我出去，好不好？, as: 員警, at: back, dist: near }
          - me: 她剛剛還在講話。
    next: c1_police

  - id: c1_locate_fail
    # 格局：舊車站／大廳（從缺口進來）（docs/scene-layouts.md）
    cast: { ruoqing: front, yuan: back, man: back-left }
    beats:
      - narr: 我朝自己以為的方向走過去。手杖掃出去，碰到的只有碎玻璃跟空空的地板。
      - narr: 背帶的扣還在響，可是我越走，它越像在我背後。
      - { sfx: strap_click, at: back, dist: mid, text: 喀 }
      - narr: 我不敢再用走的，跪下來，兩隻手撐著地往前爬。
      - { narr: 有一片玻璃扎進掌心。我換另一隻手撐，繼續爬。, shake: light }
      - pause: 1.5
      - narr: 然後那個扣子不響了。
      - heart: pound
      - tension: 10
      - noise: heavy
        with:
          - { say: 裡面有人嗎？, voice: man, at: [back, back-left], dist: far }
          - { say: 手電筒！誰有手電筒？, voice: woman, at: [back, back-right], dist: far }
          - { say: 不要進去啦，玻璃都碎了！, voice: old_woman, at: [back-left], dist: far }
