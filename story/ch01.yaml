                    - narr: 鄰居在收衣服了。他把手機擱上桌以後，它就一直沒有震。
                    - pause: 3
                    - { yuan: ……這個時間，我都不太想一個人待著。, mem: m_c1_not_alone }
                    - think: 他不知道我知道。我也沒有講。
                    - narr: 又過了一陣子，是他先站起來的。
                    - tension: -8
                - text: （不提）
                  then:
                    - narr: 話到了嘴邊，我又嚥回去。
                    - think: 那一分鐘是他的。
                    - narr: 我把手機扣回腿上，拇指停在側鍵上，沒有按下去。
      - if: know.k_ruoqing_station_plan
        then:
