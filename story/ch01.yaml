          - { text: 吵吵鬧鬧, sfx: crowd_walla, src: 門口的人, at: [back, back-left, back-right], dist: far }
          - { text: 噠噠噠, sfx: step_run, at: [back-left, back-right], dist: far }
          - { text: 啪啪, sfx: wing_flutter, src: 鴿子, at: [front, front-left], dist: far }
          - { text: 嘩啦, sfx: metal_rattle, src: 鐵皮, at: [right], dist: mid }
      - narr: 門口的人在喊，鐵皮在響，鴿子在頭頂拍翅膀。
      - narr: 每一個聲音都大得像貼在我耳朵旁邊，我分不出哪一個是她。
      - me: 若晴，妳說話。
      - pause: 2.5
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - { phone: 心率 <心率>，過高，已記錄。十八點三十一分。, mem: m_1831 }
      - noise: "off"
      - daze: heavy
      - { sfx: tinnitus, at: center }
      - narr: 我跪在原地，兩隻手往四周摸，摸到的全是玻璃。我不敢再動，怕多爬一步，就離她更遠。
      - daze: light
      - { sfx: power_up, at: back, text: 嗡——喀、喀 }
      - narr: 燈管重新滋滋響起，外面有人喊「有電了」。接著是一聲尖叫，從我剛才沒有去的那一邊傳來。
      - narr: 門口那些人現在都看得到了，看得到她倒在哪裡，也看得到我爬錯了邊。
      - think: 我明明記得她站在哪裡。
      - if: know.k_zhixia_note_1831
        then:
          - think: 十八點三十一分，不是死亡時間。那她為什麼不回答？
      - { sfx: siren_far, at: back, dist: far, text: 喔咿——喔咿—— }
      - { sfx: step_run, at: back, dist: far, to: right:mid, text: 噠噠噠 }
      - narr: 地板在震，很多雙鞋往這邊跑，經過我，停在那一邊。
      - pause: 2
      - daze: off
      - { sfx: step_run, at: back, text: 噠噠噠 }
      - { man: 小姐！妳不要動！, as: 員警, at: back, dist: near }
      - narr: 有人蹲到我旁邊，抓住我的手腕，把我的手翻過來。他把掌心那片玻璃捏出來的時候，我才覺得痛。
      - { man: 妳是跟她一起來的？, as: 員警, at: back, dist: near }
      - me: 她在哪裡？
      - { man: 這個……沒有呼吸了。, as: 另一個員警, at: right, dist: mid, learn: k_ruoqing_died }
      - { narr: 我撐著地想站起來，往那個聲音過去。扶著我的那隻手沒有放。, shake: light }
      - { man: 妳先跟我出去，這邊讓我們處理。, as: 員警, at: back, dist: near }
      - if: flag.c1_yuan_with_me
        then:
