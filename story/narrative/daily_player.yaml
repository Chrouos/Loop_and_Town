# 灰潮鎮的日常：每一輪都照常發生的生活片段（11:30～16:30）。
# NPC 不記得上一輪，所以這些片段每天都一樣；只有主角能記住。
# memorable：玩家可以從敘事裡捕捉的字詞，捕捉後成為跨輪的持久記憶。
# requiresMemory / replaces：主角記得上一輪的細節時，當天的同一段會換成她帶著記憶的版本。
scenes:
  - id: daily_clock_1140_black_coffee
    title: 予安的黑咖啡
    at: { day: 0, time: "11:40" }
    availableUntil: { day: 0, time: "12:40" }
    kind: dialogue
    participants: [protagonist, yuan]
    requiresLocation: clock_shop
    blocks:
      - type: narration
        text: 鐘錶店的門鈴是一只走慢了的舊鐘。予安從工作台後面抬頭，像早就料到我會來。
      - type: dialogue
        speaker: yuan
        text: 來得正好，我剛煮了一壺。
      - type: narration
        text: 他替我加了糖和奶，自己那杯什麼都沒加，一口就喝掉半杯。
        memorable: 自己那杯什麼都沒加
      - type: narration
        text: 櫃台玻璃下壓著一張房仲的名片。他順手拿一只錶擋住。
        memorable: 房仲的名片
      - type: monologue
        text: 我沒有問。他也沒有說。

  - id: daily_clock_1330_father_toolbox
    title: 工具箱的夾層
    at: { day: 0, time: "13:30" }
    availableUntil: { day: 0, time: "14:20" }
    kind: dialogue
    participants: [protagonist, yuan]
    requiresLocation: clock_shop
    blocks:
      - type: narration
        text: 予安在修一只別人送來的懷錶。工作台最下面那格抽屜一直沒關好。
      - type: dialogue
        speaker: yuan
        text: 那是我爸的工具箱。他怕我弄丟備用鑰匙，乾脆藏在底板的夾層裡。
        memorable: 藏在底板的夾層裡
      - type: dialogue
        speaker: yuan
        text: 結果是他自己忘了，找了整整一個下午。
      - type: narration
        text: 他說得像笑話，手卻把抽屜輕輕推回去，沒有發出聲音。
      - type: monologue
        text: 嘴上說要清掉的東西，他一樣都沒丟。

  - id: daily_clock_1430_borrowed_recorder
    title: 借走的錄音機
    at: { day: 0, time: "14:30" }
    availableUntil: { day: 0, time: "15:20" }
    kind: dialogue
    participants: [protagonist, yuan]
    requiresLocation: clock_shop
    blocks:
      - type: narration
        text: 牆角疊著幾個紙箱，最上面寫著「待清」。予安蹲下去翻了翻，又把蓋子闔上。
      - type: dialogue
        speaker: yuan
        text: 妳姊以前常來。什麼壞掉的東西都捨不得丟，拿來叫我爸修。
      - type: dialogue
        speaker: yuan
        text: 最後一次是借一台舊錄音機，說要錄某個時間的聲音。我爸沒多問就借了。
        memorable: 借一台舊錄音機
      - type: monologue
        text: 某個時間。我想問是幾點，話到嘴邊又吞了回去。

  - id: daily_cafe_1140_low_tide_prints
    title: 退潮以後
    at: { day: 0, time: "11:40" }
    availableUntil: { day: 0, time: "12:50" }
    kind: narration
    participants: [protagonist, wakaharu]
    requiresLocation: cafe
    blocks:
      - type: narration
        text: 咖啡店午前人不多。我在最角落的位子坐下，若晴在吧台後面，沒有注意到我。
      - type: narration
        text: 她把一疊照片攤在檯面上，每一張都印成了紙本。最上面那張寫著《退潮以後》。
        memorable: 每一張都印成了紙本
      - type: narration
        text: 熟客問她手機裡不是都有了嗎。她只是笑，說手機裡的不算。
      - type: monologue
        text: 我記得這種固執，一時卻想不起是在誰身上見過。

  - id: daily_cafe_1220_workers_detour
    title: 工人的冰咖啡
    at: { day: 0, time: "12:20" }
    availableUntil: { day: 0, time: "13:10" }
    kind: narration
    participants: [protagonist]
    requiresLocation: cafe
    blocks:
      - type: narration
        text: 三個穿反光背心的工人進來買冰咖啡，安全帽擱在我隔壁桌上。
      - type: narration
        text: 「舊站正門那段要封到晚上，」其中一個抱怨，「車跟人都得繞後面那條員工通道。」
        memorable: 舊站正門那段要封到晚上
      - type: narration
        text: 另一個說那條通道十幾年沒人走了，燈壞了一半。他們笑了笑，拿了咖啡就走。

  - id: daily_cafe_1400_course_notice
    title: 被按掉的通知
    at: { day: 0, time: "14:00" }
    availableUntil: { day: 0, time: "14:40" }
    kind: narration
    participants: [protagonist, wakaharu]
    requiresLocation: cafe
    blocks:
      - type: narration
        text: 若晴的手機在吧台上亮了一下。她停下擦杯子的手，看了很久。
      - type: narration
        text: 我只看得到一行字：外地攝影課程，報名截止。
        memorable: 外地攝影課程
      - type: narration
        text: 她把相機背帶拉平，又折回去，再拉平。然後把手機翻過來蓋住。
        memorable: 把相機背帶拉平，又折回去
      - type: monologue
        text: 她什麼都沒說。店裡的音樂剛好換到下一首。

  - id: daily_hospital_1200_no_lunch
    title: 沒吃的午餐
    at: { day: 0, time: "12:00" }
    availableUntil: { day: 0, time: "13:00" }
    kind: narration
    participants: [protagonist, doctor]
    requiresLocation: hospital
    blocks:
      - type: narration
        text: 午休的走廊很安靜。護理站的便當疊成一排，有一個始終沒人拿。
      - type: narration
        text: 「陳醫生又沒吃，」護理師把那個便當推到旁邊，「外地醫院又寄信來了，他還是沒回。」
        memorable: 外地醫院又寄信來了
      - type: narration
        text: 另一個護理師壓低聲音：「他到底在等什麼啊，都五年了。」
      - type: monologue
        text: 五年。我裝作在看候診的號碼。

  - id: daily_hospital_1330_paper_copy
    title: 印出來的那一份
    at: { day: 0, time: "13:30" }
    availableUntil: { day: 0, time: "14:20" }
    kind: dialogue
    participants: [protagonist, doctor]
    requiresLocation: hospital
    blocks:
      - type: narration
        text: 陳醫生從診間出來，把一份病歷交給護理師。
      - type: dialogue
        speaker: doctor
        text: 電子檔歸電子檔，紙本也要印一份，照舊收進後面的櫃子。
        memorable: 紙本也要印一份
      - type: narration
        text: 護理師說系統早就不用紙了。他沒有解釋，只是等她把印表機打開。
      - type: monologue
        text: 他的視線掃過候診區，沒有停在任何人身上。

  - id: daily_hospital_1450_old_records
    title: 五年前的病歷
    at: { day: 0, time: "14:50" }
    availableUntil: { day: 0, time: "15:30" }
    kind: narration
    participants: [protagonist, doctor]
    requiresLocation: hospital
    blocks:
      - type: narration
        text: 掛號櫃台前站著一個女人，背包上掛著採訪證，問的卻不是今天的事。
      - type: narration
        text: 「五年前的舊病歷，」她說，「家屬以外的人能不能調閱？」
        memorable: 五年前的舊病歷
      - type: narration
        text: 陳醫生剛好經過，停下來回了一句：「那些紀錄不在這裡。」說完就走了。
      - type: narration
        text: 女人看著他的背影，把一張便條紙收回口袋。離開時，她看了我一眼。

  # 主角記得上一輪：同一天的同一段，換成她帶著記憶的版本。
  - id: daily_clock_1140_remembered_coffee
    title: 不加糖
    at: { day: 0, time: "11:40" }
    availableUntil: { day: 0, time: "12:40" }
    kind: dialogue
    participants: [protagonist, yuan]
    requiresLocation: clock_shop
    requiresMemory: [daily_clock_1140_black_coffee]
    replaces: daily_clock_1140_black_coffee
    blocks:
      - type: narration
        text: 我在巷口買了兩杯咖啡，把什麼都沒加的那一杯放到予安的工作台上。
      - type: dialogue
        speaker: yuan
        text: ……妳怎麼知道我不加糖？
      - type: narration
        text: 他接過去時停了半秒，又把那半秒用笑蓋掉。
      - type: monologue
        text: 上一輪，是他親手倒給我看的。這一輪的他，從來沒有倒過。

  - id: daily_cafe_1220_remembered_detour
    title: 同一條封路
    at: { day: 0, time: "12:20" }
    availableUntil: { day: 0, time: "13:10" }
    kind: narration
    participants: [protagonist]
    requiresLocation: cafe
    requiresMemory: [daily_cafe_1220_workers_detour]
    replaces: daily_cafe_1220_workers_detour
    blocks:
      - type: narration
        text: 穿反光背心的工人又進來買冰咖啡，安全帽擱在同一張桌子上。
      - type: monologue
        text: 不用等他們抱怨，我已經知道：舊站正門那段要封到晚上。
      - type: monologue
        text: 傍晚從舊站出來的人，只剩後面那條燈壞了一半的員工通道。
        memorable: 只剩後面那條燈壞了一半的員工通道
      - type: monologue
        text: 我不知道這代表什麼。我只是不想再假裝沒聽見。
