scenes:
  - id: final_1742_full_truth
    title: 全部攤在桌上
    at: { day: 0, time: "17:42" }
    kind: dialogue
    participants: [protagonist, yuan, wakaharu, doctor, reporter, detective]
    blocks:
      - type: narration
        text: 17:42，舊研究所的備用會議室第一次坐滿了人。不是因為我把他們叫到同一個位置，而是因為我把知道的事情完整攤在桌上，讓每個人自己決定要不要留下。
      - type: dialogue
        speaker: protagonist
        text: 我不能再替你們選。
      - type: dialogue
        speaker: protagonist
        text: 我只能把我知道的風險說清楚。剩下的，是你們自己的今天。
      - type: narration
        text: 沒有人立刻回答。這一次，沉默不是等待主角下指令，而是在各自衡量自己願意承擔的東西。

  - id: final_1750_everyone_chooses
    title: 各自的選擇
    at: { day: 0, time: "17:50" }
    kind: narration
    participants: [protagonist, yuan, wakaharu, doctor, reporter, detective]
    blocks:
      - type: narration
        text: 若晴決定自己要不要留下拍攝；柏勳決定原始病歷要不要進同步區；庭安決定公開到什麼程度；志遠決定何時承認五年前的隱瞞；予安決定要站在我身邊，還是留在外面守著正常的時間。
      - type: monologue
        text: 我以前把這些叫作行程。現在我才知道，那些其實都是別人的選擇。
      - type: narration
        text: 有人留下，也可能有人離開。重要的不是把所有人排到同一個最佳位置，而是每個人都知道風險後，仍能說出自己的答案。

  - id: final_1803_handoff_open
    title: 18:03 的兩個方向
    at: { day: 0, time: "18:03" }
    kind: narration
    participants: [protagonist, zhixia]
    blocks:
      - type: narration
        text: "18:03，我們比對當年通聯紀錄與同步資料。紀錄方向仍有矛盾，但沒有信紙即時回覆，也沒有已證明的跨線交接。"
      - type: narration
        text: "研究檔案指出現實控制層曾接上 Reality Write-back。要怎麼安全、永久停用，仍需要驗證實體隔離程序。"
      - type: monologue
        text: "知夏不在另一端。現在能選擇的，是今天在場的人。"
  - id: final_1831_convergence
    title: 18:31，所有人都在
    at: { day: 0, time: "18:31" }
    kind: narration
    participants: [protagonist, yuan, wakaharu, doctor, reporter, detective, zhixia]
    blocks:
      - type: narration
        text: "18:31，電力與交通系統短暫不同步，這不是固定有人必須死亡的時間。"
      - type: narration
        text: "所有人依當輪選擇留下、提供紀錄或撤離，主角不再把他們排列成最佳人員配置。"
      - type: monologue
        text: "問題是如何解除系統改寫現實的權限，而不是選誰來付出生命。"
  - id: final_a_tomorrow
    title: 接受這個今天
    at: { day: 0, time: "23:59" }
    kind: narration
    participants: [protagonist]
    blocks:
      - type: monologue
        text: "我不再要求這條世界線變成沒有遺憾的版本。我接受今天的每個人自己做出的決定。"
      - type: narration
        text: "光是接受並不能讓 00:00 停止 Reset；只有另行確認 Reality Write-back 已被隔離，才可能真正進入明天。"
      - type: narration
        text: "必須完成一次性 Forward Seal，這個今天才可能向前。我接受它的不完美，但 Writer 仍可能在未來再次改寫現實。"
  - id: final_b_once_more
    title: 再試一次
    at: { day: 1, time: "06:12" }
    kind: narration
    participants: [protagonist, yuan]
    blocks:
      - type: monologue
        text: "我還不能停。我總覺得再試一次，結果會有所不同。"
      - type: narration
        text: "沒有關閉 Write-back，00:00 Correction 仍進入 Recovery Retry。"
      - type: narration
        text: "06:12，我再次在返鄉列車醒來。外套口袋裡仍是原本的「不要回來」，沒有新增文字。"
      - type: dialogue
        speaker: protagonist
        text: "每一次只有我記得我們真正一起經歷過的事。"
  - id: final_c_forget_me
    title: 切斷改寫
    at: { day: 0, time: "23:59" }
    kind: narration
    participants: [protagonist, yuan]
    blocks:
      - type: monologue
        text: "我不能再把所有人的人生交給一套反覆改寫現實的系統。"
      - type: narration
        text: "真正要切斷的是自主 Reality Write-back 的執行權，保留 Prediction / Simulation，不是刪除我的記憶。"
      - type: narration
        text: "我們必須辨識主橋與備援橋、撤銷雙路改寫權限、Fence 舊 Epoch，並以獨立證據驗證隔離有效。最後 Forward Seal 才能讓 00:00 真正向前；現場怎麼做到，仍需要完整驗證。"
      - type: monologue
        text: "我依然記得那些不再存在的昨天，但我不再用它們替眼前的人做選擇。"