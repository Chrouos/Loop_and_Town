scenes:
  - id: loop05_0612_reset_alone
    at: { day: 0, time: "06:12" }
    kind: narration
    participants: [protagonist]
    blocks:
      - type: narration
        text: 06:12。我又在返鄉列車上醒來。手機、座位、窗外的山線，全都回到原位。
      - type: narration
        text: 昨天我和予安在鐘錶店待到很晚。他說如果真的還有明天，再問我這五年到底去了哪裡。
      - type: monologue
        text: 可是那個「昨天」現在只剩我一個人有。
      - type: monologue
        text: 只有我記得。

  - id: loop05_0810_yuan_stranger_again
    at: { day: 0, time: "08:10" }
    kind: dialogue
    participants: [protagonist, yuan]
    blocks:
      - type: narration
        text: 鐘錶店剛拉開鐵門。予安抬頭看見我，停了半秒。
      - type: dialogue
        speaker: yuan
        text: 好久不見。妳不是下午才會到嗎？
      - type: narration
        text: 昨晚他坐在我對面吃麵，知道我已經被困在同一天很多次。現在他只是五年沒見的老同學。
      - type: monologue
        text: 他沒有忘記我。他只是從來沒有經歷過那些只有我記得的今天。

  - id: loop05_0840_key_from_lost_day
    at: { day: 0, time: "08:40" }
    kind: dialogue
    participants: [protagonist, yuan]
    blocks:
      - type: narration
        text: 我想確認五年前那支舊手機，直接蹲到工作桌旁，拉開最下面的工具箱，伸手摸向底板夾層。
      - type: narration
        text: 備用鑰匙還在。上一輪，是予安自己告訴我父親以前把它藏在這裡。
      - type: dialogue
        speaker: yuan
        text: ……妳怎麼知道備用鑰匙在那？
      - type: dialogue
        speaker: protagonist
        text: 猜的。
      - type: narration
        text: 他沒有相信，但也沒有追問。我卻突然很清楚，知道一個人的祕密和被允許知道，是兩件不同的事。

  - id: loop05_0920_insight_yuan_father
    at: { day: 0, time: "09:20" }
    kind: narration
    participants: [protagonist, yuan]
    blocks:
      - type: narration
        text: 我們整理父親留下的舊器材。壞掉的錶帶、沒有指針的錶盤、十幾年前的收據，予安全都留著。
      - type: narration
        text: 我忽然想起另一輪他談賣店時說過的話。嘴上說「反正都要清掉」，手卻把父親留下的每一個小零件重新分類。
      - type: monologue
        text: 這不是物證。是我在一個已經不存在的今天裡，真的認識過他。
      - type: narration
        text: Character Insight unlocked：予安不會主動丟掉父親留下的東西。

  - id: loop05_1010_missing_case
    at: { day: 0, time: "10:10" }
    kind: dialogue
    participants: [protagonist, yuan]
    blocks:
      - type: narration
        text: 父親留下的錄音器外盒不在原位。予安第一反應是自己以前整理時可能丟掉了。
      - type: dialogue
        speaker: protagonist
        text: 不會是你丟的。
      - type: dialogue
        speaker: yuan
        text: 妳怎麼比我還確定？
      - type: narration
        text: 我沒有辦法回答「因為另一個你告訴過我」。只能重新問誰曾經借過工具、誰有後門鑰匙、誰知道這個櫃子。
      - type: narration
        text: 最後一張舊維修單把方向指向林知夏。五年前，她曾借走同型錄音設備，歸還日期就在死亡前一天。
      - type: monologue
        text: 人物理解不是答案，但它能讓我知道哪個假設不對。

  - id: loop05_1230_yuan_questions_knowledge
    at: { day: 0, time: "12:30" }
    kind: dialogue
    participants: [protagonist, yuan]
    blocks:
      - type: dialogue
        speaker: yuan
        text: 妳知道鑰匙在哪、知道我不會丟我爸的東西，還知道我喝咖啡不加糖。
      - type: dialogue
        speaker: yuan
        text: 我們五年沒見。妳到底從哪裡知道這些？
      - type: narration
        text: 我差點把所有 Loop 都說出來。最後只說，我查案查得比他想像中久。
      - type: monologue
        text: 對我來說，我們已經一起查過很多次。對他來說，今天才是第一次。

  - id: loop05_1540_wakaharu_insight
    at: { day: 0, time: "15:40" }
    kind: dialogue
    participants: [protagonist, wakaharu]
    blocks:
      - type: dialogue
        speaker: protagonist
        text: 我姊是不是還留了別的東西給妳？
      - type: dialogue
        speaker: wakaharu
        text: 沒有。
      - type: narration
        text: 若晴一邊回答，一邊把相機背帶拉平，又折回去，再拉平。
      - type: narration
        text: 我在另一輪陪她整理作品集時看過這個動作。她緊張不一定會這樣，但真正想把話藏起來時會。
      - type: monologue
        text: 她不是忘記。她在迴避。
      - type: narration
        text: Character Insight 不是證明，所以我沒有拆穿她，只把問題換成「知夏有沒有叫妳替她保管東西」。

  - id: loop05_2010_friendship_only_one_remembers
    at: { day: 0, time: "20:10" }
    kind: dialogue
    participants: [protagonist, yuan]
    blocks:
      - type: narration
        text: 晚上，予安把店門拉下一半，問我要不要一起吃東西。和某一輪一樣的位置，同一家店，連他把筷子袋折兩次的習慣都一樣。
      - type: dialogue
        speaker: yuan
        text: 妳今天很怪。可是又好像比以前更認識我。
      - type: dialogue
        speaker: protagonist
        text: 也許我只是記性很好。
      - type: dialogue
        speaker: yuan
        text: 那妳記得就好。
      - type: narration
        text: 他只是隨口一句。我卻知道自己已經聽過很多個版本的他說不同的話。
      - type: monologue
        text: 每次 Reset，他都沒有失去我們建立的友誼。因為對這一個他來說，那些友誼從來沒有發生過。真正失去它的人只有我。

  - id: loop05_2359_bell
    at: { day: 0, time: "23:59" }
    kind: narration
    participants: [protagonist]
    blocks:
      - type: narration
        text: 23:59，沒有鐘的鐘樓再次響起。
      - type: monologue
        text: 我開始明白知夏為什麼會把所有人的習慣、路線和選擇寫得那麼詳細。
      - type: monologue
        text: 記住一個人，可以讓我更理解他。也可以讓我更容易替他決定。
