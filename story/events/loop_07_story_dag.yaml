  - id: L7_N12_collective_1831
    title: 18:31 所有人共同面對 Convergence
    time: "18:31"
    actor_ids: [protagonist, yuan, wakaharu, doctor, reporter, detective]
    visibility: public
    detail:
      before: [過去幾輪多由主角單方面安排每個人的「安全位置」。]
      after: [所有主要角色知道 18:31 正在發生什麼，並共同留在決策現場。]
      reason: 主角不再把 NPC 分散成待保護目標，而是把風險資訊公開。]
      affected_characters: [protagonist, yuan, wakaharu, doctor, reporter, detective]
      delayed_effects: [Final 的問題從「誰應該被救」轉成「大家願意一起承擔什麼」。]
      knowledge_changes: [18:31 並非固定死亡交換，而是因果收束與共同選擇的關鍵窗口。]
      relationship_changes: []
      narrative_refs: [loop07_1831_collective_convergence]

