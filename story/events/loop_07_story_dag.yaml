    time: "17:58"
    actor_ids: [protagonist, yuan]
    visibility: public
    detail:
      before: ["予安自行延後與仲介討論"]
      after: ["可以拒絕在今天做出出售決定"]
      reason: "主角接受自己的不確定性"
      affected_characters: [protagonist, yuan]
      delayed_effects: ["延續調查或相關人物自主選擇，不自動授予玩家真相"]
