id: evt_1805_envelope_handoff
title: 舊車站的信封
at: { day: 0, time: "18:06" } # evaluates after 18:05 scheduled arrivals
visibility: observable
variants:
  - id: envelope_handoff
    priority: 100
    when:
      all:
        - { path: characters.wakaharu.location, op: eq, value: old_station }
        - { path: characters.doctor.location, op: eq, value: old_station }
    effects:
      - add_flag: world.station_handoff_completed
  - id: doctor_no_recipient
    priority: 80
    when:
      all:
        - { path: characters.wakaharu.route, op: eq, value: home }
        - { path: characters.doctor.location, op: eq, value: old_station }
    effects: []
  - id: wakaharu_unattended_exposed
    priority: 70
    when:
      all:
        - { path: characters.wakaharu.location, op: eq, value: old_station }
        - { path: characters.doctor.route, op: eq, value: stay_hospital }
    effects:
      - add_flag: world.station_handoff_completed
  - id: no_handoff
    priority: 0
    fallback: true
    visibility: hidden
    effects: []
