# 最終章｜18:31
# 盲眼主角版。格式見 docs/design.md §11；故事見 docs/story.md §5。
# 機制：docs/story-canon-mechanism.md（G1–G5、Ending A/B/C）。
# 信：她已經知道第七封是知夏寫、予安打成點字寄出的（k_yuan_sent_letter），也聽過那六封（k_six_letters）。予安不記得他說過。
#
# 本輪旗標
#   v_*            今天已經去找過這個人（hub 隱藏選項）
#   f_slot1..f_slot5   白天剛好五段時間
#   ev_*           對方在知情之下，自己決定給出完整的東西
#   ev_*_partial   被輪迴知識施壓後，只給了一部分（不足以通過 Gate）
#   g1..g5         Ending C 的五個 Gate
#   f_pick_a/b/c   23:40 的選擇
#   f_y_thanks     在鐘錶店跟予安道謝（不影響任何 Gate）
chapter: final
title: "18:31"
start: f_train
advance:
  - if: "true"
    to: final

scenes:
  # ─────────────────────────── 06:12 列車 ───────────────────────────
  - id: f_train
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    beats:
      - pause: 1
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 鬧鐘。十月三日。六點十二分。
      - if: "know.k_f_again"
        then:
          - think: 我在機房說過「再一次」。
          - think: 那一次醒來，也是六點十二分。
          - if: know.lead_f_tingan
            then:
              - think: 有一次，我拿庭安不知道的事去敲她的門。門從裡面鎖了兩圈。
          - if: know.lead_f_yuan_pushed
            then:
              - think: 有一次，我拿五點五十八分去撬予安。他背對著我，說：「請妳先回去。」
          - if: know.lead_f_yuan_quiet
            then:
              - think: 有一次，予安說了「好」，可是他自己想要什麼，一個字都沒講。
          - if: know.lead_f_ruoqing
            then:
              - think: 有一次，我跟若晴講她會死。她一路走回吧檯，背帶扣一直響。
          - if: know.lead_f_boxun
            then:
              - think: 有一次，我拿陳醫生自己的死去壓他。他只給我一份影本。
          - if: know.lead_f_zhiyuan
            then:
              - think: 有一次，我替周警官決定他什麼時候該講。抽屜就沒有拉開。
          - if: know.lead_f_cabinet
            then:
              - think: 有一次，我聽出嗡鳴在右邊，卻摸不到是哪一個櫃子。
          - pause: 1.5
      - narr: 鐵軌的接縫從腳底一節一節傳上來，喀噠、喀噠。
      - narr: 我沒有站起來，也沒有在腦子裡把今天再排一遍。
      - if: know.k_maintenance_passage
        then:
          - think: 若晴傍晚會走進舊站大廳。她不來的那一次，陳醫生傍晚六點十二分走進側邊的通道。
        else:
          - think: 若晴傍晚會走進舊站大廳。她不去的話，陳醫生會一個人從側邊下去。
      - think: 幾條走過的路，我都背得出來。可是他們今天還沒選。
      - pause: 1.5
      - think: 知夏以前也背得出來。
      - pause: 1
      - { think: 這一次，我不安排任何人。, mem: m_f_no_arranging }
      - pause: 2
      - { cue: gossip, at: back-left, text: 窸窸窣窣, sfx: huddle_rustle, whisper: true }
      - if: "know.k_yuan_sent_letter"
        then:
          - narr: 我隔著外套按了一下內側的口袋。信還在，點字的凸點頂著手指。
          - think: 字是知夏用鉛筆寫的。予安借了點字板，從背面一格一格把它打出來。
          - think: 他打得很用力，怕我摸不到。
        else:
          - narr: 口袋裡，點字還是那一行，指尖下是同樣的凸點。
      - think: 不要回來。
      - think: 我還是回來了。第幾次，我已經不數了。
      - if: "know.k_six_letters"
        then:
          - narr: 行李箱靠在我腳邊。夾層裡那六封信，橡皮筋還綁著，跟每一次一樣。
      - { sfx: station_chime, at: front, dist: far, text: 叮——咚—— }
      - { announcer: 下一站，灰潮鎮。, as: 廣播, via: speaker }
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 我把手杖一節一節卡好。最後那一節卡進去的聲音，每次都比前面響。
    threads:
      gossip:
        beats:
          - { woman: 舊車站那個備援，今天傍晚又要測了。, at: back-left }
          - { man: 測什麼啦？, at: back-left }
          - { woman: 說是以後颱風來，醫院就不會斷電。, at: back-left }
          - { man: 那是好事啊。, at: back-left }
          - narr: 是好事啊。我在心裡也跟著講了一遍。
    next: f_arrival

  # ─────────────────────────── 07:40 抵達 ───────────────────────────
  - id: f_arrival
    time: "07:40"
    place: 灰潮鎮車站
    ambience: [platform]
    cast: { yuan: front-right }
    beats:
      - { sfx: train_door, at: left, dist: near, text: 噗嘶 }
      - { sfx: step, at: front-right, text: 叩、叩 }
      - yuan: 比我想的早。
      - me: 車沒誤點。
      - narr: 這兩句我聽過太多次，就讓它們照原樣過去。
      - yuan: 我的左手肘，在妳的右手邊。
      - narr: 機油和黃銅的味道。他走得很慢，配合我的步子。
      - if: "know.k_yuan_sent_letter"
        then:
          - think: 前天傍晚，他才把那封信投進郵筒，然後照樣來接我。
          - think: 這件事，他一個字都不會提。
        else:
          - think: 他不記得。每一次都不記得。
      - me: 予安，我今天會去找幾個人，你也是其中一個。
      - me: 到時候我會拜託你一件事。你可以說不。
      - pause: 1.5
      - yuan: ……妳講得好像很嚴重。
      - me: 有多嚴重，我也還不知道。這個到時候也會跟你講。
      - yuan: 喔。好。我在店裡。
    next: f_hub

  # ─────────────────────────── 白天：五段時間 ───────────────────────────
  - id: f_hub
    beats:
      - if: "flag.f_v_tingan && flag.f_v_yuan && flag.f_v_ruoqing && flag.f_v_boxun && flag.f_v_zhiyuan"
        then:
          - clock: "17:30"
          - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
          - phone: 十七點三十分。
          - think: 五個人都找過了。手杖的握把被風吹得有點涼。
          - narr: 我把五點四十二分、研究所備用會議室的時間和地址，傳給願意來的人。
          - if: flag.ev_boxun_partial
            then:
              - phone: 陳柏勳：我帶那一份影本過去。其他的，當面再說。
          - goto: f_meeting
      - if: "!flag.f_slot1"
        then:
          - set: f_slot1
          - clock: "08:40"
          - if: "know.k_spare_key"
            then:
              - narr: 門口第三個花盆。我蹲下去，手指伸進盆底那道泥巴縫。
              - { sfx: key_jingle, at: front, dist: near, text: 鏘啷 }
              - { yuan: ……妳怎麼知道在那？, at: back }
              - me: 猜的。
              - pause: 1.5
              - narr: 他沒有再問，可是走回店裡的腳步，比來的時候慢。
            else:
              - { sfx: door_creak, at: front, dist: near, text: 碰——吱呀 }
              - narr: 老家的門還是卡住。予安用肩膀頂開，就回店裡去了。
          - narr: 我摸出手機按了一下。
          - phone: 八點四十分。
          - think: 時間剛好夠找五個人，多一個都不行。
        else:
          - if: "!flag.f_slot2"
            then:
              - set: f_slot2
              - clock: "10:30"
              - { sfx: bicycle_bell, at: left, dist: mid, text: 叮叮 }
              - phone: 十點三十分。
              - think: 還有四個人。
            else:
              - if: "!flag.f_slot3"
                then:
                  - set: f_slot3
                  - clock: "12:20"
                  - { sfx: construction_drill, at: back-right, dist: far, text: 噠噠噠噠 }
                  - narr: 我按了一下側鍵。
                  - phone: 十二點二十分。
                  - think: 施工停了一陣子，大概是去買便當，現在又開始了。
                else:
                  - if: "!flag.f_slot4"
                    then:
                      - set: f_slot4
                      - clock: "14:10"
                      - { sfx: seagull, at: front-left, dist: far, text: 啊——啊—— }
                      - narr: 我又叫手機報了一次時間。
                      - phone: 十四點十分。
                      - think: 風轉了，開始從海那邊吹過來。
                    else:
                      - set: f_slot5
                      - clock: "15:50"
                      - { sfx: car_pass, at: right, dist: far, text: 嗚—— }
                      - narr: 我壓了一下手機側邊。
                      - phone: 十五點五十分。
                      - think: 最後一個人。
    next: f_hub_pick

  - id: f_hub_pick
    cast: { tingan: right }
    beats:
      - if: "!flag.f_tingan_address"
        then:
          - set: f_tingan_address
          - narr: 我打到她留在報社網站上的聯絡號碼。她問我是誰，我說是林家的，想談研究所。
          - tingan: 港邊民宿，二樓。先講好，我只留一個鐘頭。
      - think: 下一個，去找誰？
      - choice:
          options:
            - text: （去港邊的民宿，找庭安）
              if: "!flag.f_v_tingan"
              goto: f_tingan
            - text: （去鐘錶店，找予安）
              if: "!flag.f_v_yuan"
              goto: f_yuan
            - text: （去咖啡店，找若晴）
              if: "!flag.f_v_ruoqing"
              goto: f_ruoqing
            - text: （去醫院，找陳醫生）
              if: "!flag.f_v_boxun"
              goto: f_boxun
            - text: （去派出所，找周警官）
              if: "!flag.f_v_zhiyuan"
              goto: f_zhiyuan
            - text: （先站一下，聽這座鎮）
              disabled_if: flag.f_town_listen_done
              then:
                - if: "!flag.f_town_listen_1"
                  then:
                    - set: f_town_listen_1
                    - pause: 2
                    - { sfx: shutter_roll, at: front, dist: mid, text: 嘩啦啦—— }
                    - narr: 對面的鐵捲門拉上去，嘩啦啦一路響到頂。遠一點有阿伯在喊今天剛到的白帶魚。
                    - narr: 一張紙被風捲過來，貼著我的腳踝停住，又被吹走。
                    - think: 這些都會自己發生，不用我去動。
                  else:
                    - if: "!flag.f_town_listen_2"
                      then:
                        - set: f_town_listen_2
                        - pause: 2
                        - { sfx: step, at: back-right, to: front-right, dist: mid, text: 叩、叩 }
                        - narr: 腳步聲從身後過來，在我旁邊慢了一下，又往前走。
                        - { sfx: key_jingle, at: front-left, dist: mid, text: 鏘、鏘 }
                        - narr: 鑰匙碰在一起，響了兩聲。有人推開路邊的門，裡頭的人應了一聲。
                        - think: 我把手杖往自己這邊收了一點。
                      else:
                        - set: f_town_listen_done
                        - pause: 2
                        - { sfx: wind_gust, at: front, dist: mid, text: 呼—— }
                        - narr: 風把遠處的人聲送過來。我握穩手杖，杖尖重新落到路面上。
                        - { sfx: cane_tap, at: front, dist: near, text: 叩 }
                        - think: ……該走了。
      - goto: f_hub_pick

  # ─────────────────────────── 庭安 ───────────────────────────
  - id: f_tingan
    place: 港邊的民宿，二樓
    ambience: [room_tone, sea_far]
    cast: { tingan: front }
    beats:
      - set: f_v_tingan
      - { sfx: hammer, at: front, dist: near, text: 叩、叩、叩 }
      - { sfx: door_open, at: front, dist: near, text: 吱 }
      - { sfx: cloth_rustle, at: front, dist: near, text: 窸窣 }
      - narr: 雨衣沙沙響。她在屋子裡也沒脫。
      - tingan: ……請問妳找誰？
      - think: 門只開了一條縫，鍊條還扣著。她的聲音從縫裡出來，我還是認得。
      - me: 葉庭安。
      - tingan: 林家的妹妹？電話裡怎麼沒說清楚。妳要問研究所什麼事？
      - narr: 她背後的鍵盤聲停了。再過去一點，是海。
      - choice:
          options:
            - text: （把手杖收起來，問她能不能進去坐）
              then:
                - set: f_t_resp
                - me: 我會講很久。妳想叫我走，隨時都可以。
                - pause: 1
                - tingan: ……妳是林知夏的妹妹？
                - me: 嗯。我不是來問妳為什麼騙我。
            - text: 「妳們做的，本來是讓颱風夜少死幾個人的東西。」
              if: "know.k_research_purpose"
              then:
                - set: f_t_resp
                - pause: 2
                - tingan: ……妳到底是誰？
                - me: 林知夏的妹妹。我不是來找妳算帳的。
            - text: 「『看過結果，不代表那個選擇就是妳的。』」
              if: "know.k_zhixia_voice"
              then:
                - set: f_t_resp
                - narr: 她身上的雨衣不響了。
                - tingan: 這句話……妳從哪裡聽來的？
                - me: 一卷錄音。錄的是妳跟我姊。
                - me: 妳那時候是對的。我今天不是來跟妳吵這個。
            - text: 「妳花了半年才混進研究所。妳以為沒有人知道？」
              then:
                - pause: 1.5
                - tingan: ……妳跟蹤我？
                - tingan: 誰叫妳來的？研究所？還是鎮公所？
                - heart: slow
                - narr: 我的腳趾在鞋子裡縮起來，好像這樣就能站得比較穩。
                - me: 沒有人。我就是知道。
                - think: 我講得太快了，像把一張她不可能贏的牌直接甩到桌上。
                - tension: 8
            - recall:
                accept:
                  - mem: m_c7_seen_results
                    then:
                      - me: 我姊以前很常講一句話。
                      - me: 「我看過結果。」
                      - pause: 2
                      - narr: 門後的雨衣不響了，只剩她背後的海。
                      - tingan: ……她每次講完這句，就不准別人再問。
                      - me: 我也看過結果，好幾個。
                      - me: 所以今天，我不想照我看過的去做。
                      - set: [f_t_resp, f_t_recall]
                  - mem: m_c4_this_round
                    then:
                      - me: 妳問過我姊一句話。
                      - me: 「可是這一輪的他知道嗎？」
                      - pause: 2.5
                      - tingan: ……那是我跟她吵架的時候講的。那間房間只有我們兩個。
                      - me: 今天要找的每一個人，我都會先讓他知道。從妳開始。
                      - set: [f_t_resp, f_t_recall]
                  - mem: m_c1_worked_there
                    then:
                      - me: 妳跟我講過一句話。「我以前在那裡做過事。就這樣。」
                      - pause: 2
                      - tingan: ……這種話，我不會跟不認識的人講。
                      - me: 那天我們也不認識。妳講完就走了，我沒有追。
                      - me: 今天也一樣。妳不想說的，我不問。
                      - set: [f_t_resp, f_t_recall]
                  - mem: m_c4_not_data
                    then:
                      - me: 「不能直接餵給機器，不代表它不是資料。」
                      - pause: 2
                      - tingan: ……連講這句的速度都一樣。她要贏的時候，就會講這麼慢。
                      - me: 我不是來贏的。我手上的東西，也進不了任何模型。
                      - me: 可是我想請妳聽完。
                      - set: [f_t_resp, f_t_recall]
                miss:
                  - think: ……不對。這句講出來，她只會把門關得更緊。
      - if: "flag.f_t_resp"
        then:
          - { sfx: chair_scrape, at: front, dist: near, text: 嘎 }
          - tingan: ……進來講吧。門口風很大。
          - me: 舊車站東邊有個東西，會在十八點三十一分醒過來。
          - me: 那附近的人會受傷，有時候會死。每一次都不太一樣。
          - me: 到了午夜，今天會重來一次。記得的只有我。
          - if: "flag.f_t_recall"
            then:
              - tingan: 重來。……好，這個我不問了。
              - tingan: 她以前也跟我講過差不多的事。我那時候問了她一整個晚上，什麼也沒問到。
              - tingan: 妳要我給妳什麼？
            else:
              - tingan: 等一下。重來，是什麼意思？
              - me: 就是字面上的意思。妳不信也沒關係。
              - pause: 2
              - tingan: 好，先假設我信。那妳要我給妳什麼？
          - me: 研究的目標、權限怎麼流，還有舊的備援紀錄。
          - tingan: 拿去幹嘛？給誰看？
          - me: 傍晚全部攤在桌上，給每一個會被它影響的人看。妳也是其中一個。
          - me: 妳不想給，我現在就走。
          - pause: 2.5
          - { sfx: typing, at: front, dist: near, text: 噠、噠 }
          - tingan: 五年前，妳姊要我答應她一件事。
          - tingan: 如果妳哪天回來，不要讓妳知道她做過什麼。
          - tingan: 我守了五年。替一個已經不在的人守，很蠢吧？
          - narr: 我用舌尖頂住上排的牙齒，頂到發痠。窗外的浪打上堤防，一下，退回去。
          - if: "know.k_dont_become_me"
            then:
              - think: 庭安轉述過知夏的另一句話。不要讓她變成我。
              - think: 我沒有講出來。那句話不該拿來說服人。
          - tingan: 可是妳看起來，不太像是來要答案的。
          - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
          - tingan: 研究的目標，是災害的時候怎麼分流。颱風、封路、醫院。一開始跟時間完全沒關係。
          - tingan: 權限的圖我念給妳。回寫的主路徑在研究所。
          - tingan: 今年春天，舊站那邊多接了一條備援。
          - { tingan: 主路徑斷了，備援會接手。備援斷了，主路徑也會接回去。, mem: m_f_two_paths }
          - tingan: 所以只關一條，等於沒關。
          - me: 可是那次我知道的人都活著，為什麼到了午夜還是重來？
          - tingan: 它要核對的是，改過的結果跟紀錄有沒有一致。對不上，它就一直留著「還沒完成」。
          - tingan: 午夜還沒結案，就退回最後一個它認為沒問題的狀態，再跑一次。
          - { sfx: wave, at: front, dist: far, text: 嘩—— }
          - me: 六點十二分。
          - tingan: 日誌上也是這個時間。傷亡是它出錯造成的，結案從來沒在數死了幾個人。
          - me: 五年前也是每天回到早上？
          - tingan: 不是。她記得的是被改掉的日子，有些隔了好幾天。整天退回早上的，舊日誌裡沒有。
          - { sfx: typing, at: front, dist: near, text: 噠、噠 }
          - tingan: 她最後隔離過主路徑，這裡才安靜了五年。今年更新接回備援，又繞過了那個隔離。
          - me: 可是妳還沒看過今天的紀錄。
          - tingan: 舊日誌能解釋到哪裡，我先說到哪裡。今天的，要到研究所再比。
          - tingan: 線路是施工接回去的。妳收到那封信、決定回來，都不是開關。
          - tingan: 我去。這件事我幫人瞞太久了。
          - set: ev_tingan
        else:
          - narr: 鍵盤又響了，打得很快，像在一個一個關視窗。
          - tingan: 研究目標我可以給妳。公開的版本，網路上就查得到。
          - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
          - tingan: 其他的，我不知道妳在講什麼。
          - { sfx: door_slam, at: front, dist: near, text: 碰！, shake: light }
          - narr: 我手裡多了一張紙。門甩上帶起的風撲到我臉上，鎖從裡面轉了兩圈。
          - think: 換成是我，我也會鎖門。
          - heart: off
          - narr: 我把那張紙對摺再對摺，塞進口袋。下樓的扶手被海風吹得濕濕的，我一階一階踩穩了才走。
          - set: ev_tingan_partial
          - learn: lead_f_tingan
      - goto: f_hub

  # ─────────────────────────── 予安 ───────────────────────────
  - id: f_yuan
