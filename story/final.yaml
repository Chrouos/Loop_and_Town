      - pause: 2
      - { me: 我不能再替你們選。, mem: m_f_cannot_choose }
      - me: 我只能把我知道的風險講清楚。
      - { me: 剩下的，是你們自己的今天。, mem: m_f_your_today }
      - pause: 3
      - narr: 沒有人先開口。牆後面的伺服器，忽然聽起來很大聲。
      - if: "know.k_not_best_day"
        then:
