          - { boxun: 醫院的分流預測還在跑，現在是唯讀。它說今晚不會下雨。, at: right, dist: near, as: 電話裡的陳醫生, via: phone }
          - { boxun: 十八點三十一分到現在，急診沒有異常。我查了三次。, at: right, dist: near, as: 電話裡的陳醫生, via: phone }
      - if: "flag.ev_zhiyuan"
        then:
          - narr: 周警官收起筆，退到我身後。接下來換我確認聲音。
        else:
          - narr: 東牆前面只有我一個人。能拿來確認的，只剩我的耳朵。
      - if: flag.ev_boxun
        then:
          - me: 陳醫生，我先掛電話。聽完再跟你說。
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
      - heart: fast
      - narr: 我把耳朵貼上鐵皮。
      - if: "flag.ev_zhiyuan"
        then:
          - narr: 周警官往後又退了一步，衣料的聲音停了。
      - narr: 結果最吵的是我自己的心跳，一下一下撞著耳膜，蓋過鐵皮裡的任何聲音。
      - narr: 我慢慢吐氣，再吸進來，等心跳自己慢下來。
      - tension: -8
      - pause: 3
      - heart: off
      - if: "flag.g2"
        then:
          - narr: 鐵皮裡面，沒有東西在往上爬。
          - clock: "22:30"
          - amb: [research_facility]
          - narr: 二十二點三十分，研究所，主路徑的機櫃前。
          - narr: 伺服器還在轉。那是預測，它在算明天的風。
          - narr: 那個跟著時間往上爬的聲音，這裡也沒有了。
          - think: 兩邊都安靜了。
          - tingan: 我再念一次查核結果。主路徑、備援，回寫權限都已撤銷。兩邊都沒有再送出，也沒有接受新的改寫確認。
          - if: flag.ev_zhiyuan
            then:
              - zhiyuan: 我從兩台設備各取一份原始紀錄。編號分開，跟剛剛念的核對過了。
        else:
          - { sfx: hum_rise, at: right, dist: far, text: 嗡—— }
          - narr: 很淡，可是還在。
          - think: 它還在等。
      - if: "flag.g2 && flag.ev_zhiyuan && flag.ev_boxun"
        then:
          - zhiyuan: 三個來源。紀錄、醫院，還有妳的耳朵。
          - { zhiyuan: 妳的耳朵我也照記。證人，林小姐。, mem: m_f_witness }
          - set: g4
        else:
          - if: "!flag.ev_zhiyuan"
            then:
              - think: 沒有人能證明今晚的紀錄沒被改過。我記得的不算數。
          - if: "!flag.ev_boxun"
            then:
              - think: 醫院那邊到底有沒有照常在走，沒有人講得出來。
          - if: "!flag.g2"
            then:
              - think: 而且它根本還沒停。
          - think: 光是我說「它停了」不夠，要別人也查得到才行。
    next: f_gate5

  # ─────────────────────────── G5 Forward Seal ───────────────────────────
  - id: f_gate5
    time: "23:30"
    place: 舊研究所，機房
    ambience: [research_facility]
    cast: { tingan: front, yuan: right, ruoqing: left, zhiyuan: back-left, boxun: back-right }
    beats:
      - if: flag.ev_ruoqing
        then:
          - { sfx: step, at: back-left, dist: mid, text: 叩、叩 }
          - ruoqing: 店裡收好了。我回來看看，再待一會兒。
      - if: "flag.ev_yuan"
        then:
          - { sfx: step, at: right, dist: mid, text: 叩、叩 }
          - yuan: 我回來了。我跟房仲說，我還要再想。
          - yuan: ……這次是真的在想。
      - if: "flag.g2 && flag.g3 && flag.g4"
        then:
          - tingan: 最後一步，封存。
          - tingan: 封存的意思是，它正式放棄重算今天。
          - tingan: 已經發生的就是唯一的版本，只能往前走。
          - tingan: 送法有兩種。
          - tingan: 一種只封今天。權限沒有寫死，明天它還會在。
          - tingan: 另一種，先把撤銷寫死，再封。
          - tingan: 寫死以後，誰都沒辦法再叫它改一次今天。我們不行，妳也不行。
          - pause: 2
          # 第七章她讀過那一頁，才問得出口要不要一起封；沒讀過，那張紙就一直夾在筆記最後面。
          - if: know.k_my_death_page
            then:
              - tingan: 還有一樣。知夏寫妳的那一頁，我一直夾在筆記最後面。
              - tingan: 要跟今天一起封進去嗎？封進去就調不出來了，連我都不行。
              - choice:
                  timeout: 15
                  options:
                    - text: 「封進去。」
                      then:
                        - me: 那一頁上的我，不要再被任何東西算出來。
                        - set: f_page_sealed
                    - text: 「給我。我自己留著。」
                      then:
                        - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
                        - narr: 紙遞到我手上，摺痕還是兩道。我把它放進外套內側，跟那封信貼在一起。
                        - set: f_page_kept
                  silence:
                    - pause: 2
                    - tingan: ……那我先夾回筆記後面。
              - pause: 1.5
            else:
              - think: 庭安的筆記最後面，還夾著那張我沒打開的紙。它要不要跟今天一起封起來，我沒有問。
          - tingan: 大家那一欄都簽了。最後一欄是觀測者。
          - tingan: 今晚辨認機櫃、複核聲音的人，我填了妳。妳願意替自己聽到的部分簽名嗎？
          - set: g5
        else:
          - if: "flag.ev_tingan"
            then:
              - tingan: 現在只剩一種送法。
              - tingan: 我可以把今天封起來，一次。這個權限我有。
              - if: "!flag.g2"
                then:
                  - tingan: 可是兩條路的權限，沒有一起撤掉。
                else:
                  - tingan: 可是沒有人能證明，它真的停了。
              - tingan: 一個不確定有沒有停的東西，寫死了也只是在騙自己。
              - tingan: 明天它還會在。我只能讓它今天不能再重算。
            else:
              - narr: 機房的門鎖著。
              - think: 怎麼把今天封起來，沒有人知道。
              - think: 很多事我都知道，偏偏這件不知道。
    next: f_choice

  # ─────────────────────────── 23:40 ───────────────────────────
  - id: f_choice
    time: "23:40"
    place: 舊研究所，機房
    ambience: [research_facility]
    cast: { tingan: front, yuan: right, ruoqing: left }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - phone: 鬧鐘。二十三點四十分。
      - heart: slow
      - think: 我可以重來。
      - think: 我知道下一次，怎麼讓每個人都不用靠近那面牆。
      - think: 再來一次，每個人都可以排得更好。
      - if: "know.k_zhixia_voice"
        then:
          - think: 「我看過結果。」知夏這樣講過。我也看過，看過好多個。
      - if: "know.k_dont_become_me"
        then:
          - think: 不要讓她變成我。
      - pause: 2
      - choice:
          options:
            - text: 「撤銷所有改寫，然後封存今天。」
              if: "flag.g1 && flag.g2 && flag.g3 && flag.g4 && flag.g5"
              then:
                - set: f_pick_c
                - pause: 1.5
                - tingan: ……好。
                - { sfx: typing, at: front, dist: near, text: 噠、噠、噠 }
                - tingan: 撤銷，寫死。
                - { sfx: relay_click, at: front, dist: mid, text: 喀噠 }
                - tingan: 封存。觀測者那一欄——
                - narr: 我的喉嚨乾得發痛，第一個字卡了一下才出來。
                - me: 林。知夏的妹妹。
                - tension: -15
                - { sfx: relay_click, at: front, dist: far, text: 喀 }
                - narr: 伺服器還在轉。現在它只能算，不能再動手了。
                - heart: off
            - text: 「只封存這一個今天。」
              if: "flag.ev_tingan"
              then:
                - set: f_pick_a
                - if: "flag.g5"
                  then:
                    - tingan: 不寫死？
                    - me: 我不敢。寫死以後，要是哪天發現少算了誰，就再也沒辦法改了。
                    - pause: 2
                    - tingan: ……那一欄是妳的。
                - { sfx: typing, at: front, dist: near, text: 噠、噠 }
                - if: flag.g2
                  then:
                    - tingan: 那我撤回今晚的暫時停用，讓主路徑恢復權限。備援那個接頭還留在外面。
                    - tingan: 這樣才是保留以後再用的可能。妳確定？
                    - me: 嗯。
                - tingan: 只封今天。送出。
                - { sfx: relay_click, at: front, dist: mid, text: 喀 }
                - tension: -6
            - text: 「……再一次。」
              then:
                - set: f_pick_b
                - learn: k_f_again
                - pause: 3
                - narr: 機房裡只剩伺服器在轉。
                - if: "flag.ev_tingan"
                  then:
                    - if: flag.g2
                      then:
                        - me: 先不要封存。今晚的停用，可以撤回嗎？
                        - tingan: 主路徑可以恢復權限。可是日誌對不上，午夜它可能又會重試。
                        - me: ……我知道。
                        - { sfx: typing, at: front, dist: near, text: 噠噠噠 }
                        - narr: 鍵盤響了一陣。她念出恢復的權限，我聽著，一句也沒有攔。
                      else:
                        - tingan: 再一次……什麼再一次？
                    - narr: 我沒有再說話。他們不會記得今晚這段對話。
                - if: flag.ev_tingan
                  then:
                    - if: know.k_my_death_page
                      then:
                        - think: 那一頁上寫的是我。再一次，它也可能再被寫一次，寫的是我，或者別人。
                    - tension: 20
                    - heart: pound
                    - narr: 我把指甲掐進掌心，一直掐，掐到整個手掌發燙。
                    - { sfx: tinnitus, at: center }
                    - daze: light
                    - narr: 伺服器的聲音退到很遠，耳朵裡只剩一條細細的嗡鳴，跟我的心跳。
                    - think: 我又替所有人選了一次。
                    - daze: off
                    - { sfx: door_open, at: back, dist: mid, text: 吱 }
                    - narr: 有人推開機房的門，夜風灌進來，蟲叫聲才一樣一樣回到耳朵裡。
                    - { sfx: cricket_chirp, at: back, dist: far, text: 唧——唧—— }
                  else:
                    - think: 封不起來。會封的人，今天沒有來。
                    - think: 今天會再來一次。這一次，不是我選的。
                    - tension: 8
                    - narr: 我把手杖橫放在膝蓋上，隔著鎖住的門，聽伺服器一直轉。
    next: f_midnight

  # ─────────────────────────── 等待午夜 ───────────────────────────
  - id: f_midnight
    time: "23:50"
    place: 舊研究所外的台階
    ambience: [wind_open, night_insects]
    cast: { yuan: right, ruoqing: left, tingan: back, zhiyuan: back-left, boxun: back-right }
    life:
      - { text: 呼……, sfx: breath, at: [left, right], dist: near }
      - { text: 沙, sfx: cloth_rustle, at: [right, back, back-left, back-right], dist: mid }
      - { text: 叩, sfx: step, src: 腳步, at: [back, back-left, back-right], dist: mid }
    beats:
      - if: "flag.ev_yuan || flag.ev_ruoqing || flag.ev_tingan || flag.ev_zhiyuan"
        then:
          - narr: 我們走到外面。水泥台階還留著一點白天的溫度。
        else:
          - narr: 我一個人走到外面。水泥台階還留著一點白天的溫度。
      - narr: 鎮在坡下面。鐘樓在正前方，很遠。
      - if: "flag.ev_yuan"
        then:
          - { sfx: cloth_rustle, at: right, dist: near, text: 窸 }
          - narr: 予安在我右邊坐下，外套的袖子擦過我的手臂。
      - if: "flag.ev_ruoqing"
        then:
          - { sfx: strap_click, at: left, dist: near, text: 喀 }
          - narr: 若晴在左邊。背帶扣響了一聲，就沒再響。
      - if: "flag.f_pick_b && (flag.ev_yuan || flag.ev_ruoqing || flag.ev_tingan || flag.ev_zhiyuan)"
        then:
          - narr: 沒有人問我為什麼。他們以為明天會來。
      - if: flag.ev_yuan
        then:
          - { sfx: breath_m, at: right, dist: near }
      - { wait: 40, clock: "23:50", until: "23:55" }
      - { sfx: wind_gust, at: front, dist: far, text: 颯—— }
      - narr: 風從鎮上吹上來，帶著海的鹹味。
      - if: flag.ev_ruoqing
        then:
          - { sfx: breath, at: left, dist: near }
      - if: flag.ev_yuan && flag.ev_ruoqing
        then:
          - narr: 左右兩邊的呼吸，快慢不一樣。
        else:
          - narr: 我把手杖橫放在膝蓋上，聽風從欄杆縫裡穿過去。
      - narr: 握把被我握到發熱，手心整個濕了，還是放不開。
      - heart: slow
      - { wait: 30, clock: "23:55", until: "23:59" }
      - if: "flag.f_pick_c"
        then:
          - goto: f_end_c
      - if: "flag.f_pick_a"
        then:
          - goto: f_end_a
      - goto: f_end_b

  # ─────────────────────────── Ending C ───────────────────────────
  - id: f_end_c
    cast: { yuan: right, ruoqing: left, tingan: back }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - phone: 鬧鐘。二十三點五十九分。
      - heart: fast
      - wait: 3
      - narr: 我在等第一聲。
      - wait: 5
      - narr: 風，很遠的車，右邊有人在呼吸。
      - wait: 5
      - narr: 鐘沒有響。
      - tension: -25
      - heart: off
      - pause: 3
      - narr: 看得見的人，大概只會覺得這是一個普通的晚上。
      - narr: 對我來說，這片安靜就是全部了。
      - wait: 4
      - { sfx: heartbeat, at: center, dist: near, vib: heartbeat }
      - narr: 我數自己的心跳，數到十二，再數到十三。
      - pause: 3
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - { phone: 十月四日，零點零分。, mem: m_f_oct4 }
      - narr: 我沒有放開側鍵，叫它再念一次心率。
      - phone: 心率 <心率>。
      - pause: 4
      - yuan: ……妳在哭嗎？
      - me: 沒有。
      - me: 我在聽。
      - if: flag.ev_ruoqing
        then:
          - { sfx: camera_shutter, at: left, dist: near, text: 喀嚓 }
          - ruoqing: 啊，歹勢，手自己按下去的。
          - ruoqing: 十月四日的第一張。
    next: f_epilogue_c

  - id: f_epilogue_c
    time: "10月4日 07:10"
    place: 林家老屋
    ambience: [old_house, rain_on_window]
    beats:
      - pause: 2
      - { sfx: rain_burst, at: front, dist: mid, text: 嘩—— }
      - narr: 我在灰潮鎮醒來的時候，外面在下雨。
      - think: 十月三日的早上，從來沒有下過雨。
      - tension: -12
      - narr: 我摸到枕頭邊的手機，叫它報日期。
      - phone: 十月四日。七點十分。
      - { sfx: car_pass, at: left, dist: far, text: 噗、噗噗—— }
      - narr: 巷口有台機車發不動，踩了三次，旁邊有人在笑它。
      - narr: 這些聲音我一個都不認得，全部都是第一次聽到。
      - think: 下一分鐘會發生什麼，我不知道。
      - think: 我都快忘了，原來是這種感覺。
      - if: "know.k_dont_become_me"
        then:
          - think: 知夏託庭安帶一句話給我，不要變成她。她最後那幾年，大概沒有過這種早上。
      - pause: 2
      # 若晴在咖啡店沒有答應幫忙（ev_ruoqing），隔天就沒有理由傳訊息給她
      - if: flag.ev_ruoqing
        then:
          - { sfx: phone_notify, at: right, dist: near, text: 叮咚 }
          - phone: 許若晴。
          - phone: 外地那個課我報名了！我媽說她早就叫我去了，講得好像是她的功勞。
          - phone: 週末我會回來。這是我自己排的喔。
          - if: "mem.m_c2_can_wait"
            then:
              - think: 有一個她不記得的今天，她說陳醫生好像什麼事都可以等她。這次她沒有等誰點頭。
        else:
          - think: 若晴那個課報了沒有，我不知道。要不要去，是她自己的事。
      - { sfx: phone_notify, at: right, dist: near, text: 叮咚 }
      - phone: 葉庭安。
      - phone: 稿子寫好了。署名在最上面，我做過的事也寫在裡面。
      - phone: 灰潮鎮這一套關掉了。別的地方，還有類似的東西。
      - phone: 要不要讀，大家自己決定。
      - if: flag.f_page_sealed
        then:
          - phone: 那一頁跟紀錄一起封了。上面那個妳，不會再被算出來。
      - { sfx: phone_notify, at: right, dist: near, text: 叮咚 }
      - phone: 周志遠。
      - phone: 錄音機登錄了。下午督察找我。該講的，我會講。
      - { sfx: phone_notify, at: right, dist: near, text: 叮咚 }
      - phone: 陳柏勳。
      - phone: 今天去見五年前那位死者的家屬，就是知夏走前十二天那位。那些紀錄，他們也有權知道。
      - phone: 要不要知道，由他們決定。
      - pause: 2
      - narr: 我打給仲介，請他把估價單寄成讀屏能念的檔案。簽名的事，等我把每一頁讀完再約。
      - { sfx: envelope, at: center, dist: near, text: 沙 }
      - narr: 我把信拿出來。那一行凸點，每一格都壓得很深。
      - if: "know.k_yuan_sent_letter"
        then:
          - narr: 知夏的鉛筆字跟那些凸點疊在一起。翻到背面，那幾道筆痕還在小凹洞之間。
          - narr: 我摸得到的，是予安照著她的字，一格一格打出來的那一行。
      - think: 不要回來。
      - if: "know.k_six_letters"
        then:
          - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
          - narr: 行李箱的夾層裡，六封信還用橡皮筋綁著。
          - narr: 我把橡皮筋拆下來，把這一封放在最後面，七封疊成一疊。
          - narr: 它們本來要放回她房間，跟房子一起處理掉。我把它們放回行李箱。
        else:
          - narr: 我把它摺好，放回外套內側的口袋。
      - if: flag.f_page_kept
        then:
          - narr: 外套內側還有一張紙，摺痕兩道。上面寫什麼我都記得，不用再打開。
          - think: 那是知夏看過的一個我。今天醒來的這一個，她沒有看過。
      - if: "!know.k_my_death_page"
        then:
          - think: 庭安筆記最後面那張紙，我一直沒有打開。現在它只是知夏寫下的、沒有發生的一頁。
    next: f_epilogue_station

  - id: f_epilogue_station
    time: "10月4日 15:20"
    place: 灰潮鎮車站
    ambience: [platform, rain]
    cast: { yuan: right, announcer: front }
    beats:
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 月台的導盲磚在右邊。這一次，我往反方向走。
      - { sfx: step_wet, at: right, dist: near, text: 啪、啪 }
      - narr: 他的腳步停在我右邊，比昨天早上近了半步。
      - yuan: 我的左手肘，在妳的右手邊。
      - narr: 其實不用講。他話還沒講完，我的手已經搭上去了。
      - yuan: 早上我想好了。
      - yuan: 店不賣。可是也不要照以前那樣開。
      - yuan: 我想重新申請學校。以前一直說明年再去，結果就過了這麼多年。
      - yuan: 店先關三個月。我去問問課，順便整理一下。
      - { yuan: 要不要回來開，到時候我自己決定。, mem: m_f_yuan_decides }
      - if: "know.k_tower_kit"
        then:
          - me: 你爸那箱工具，要拿回來嗎？
          - yuan: 嗯。我想自己去看，他們借去接了什麼。
      - think: 他講了「我想」。我沒有特地去數，可是我聽到了。
      - if: "know.k_yuan_went_station"
        then:
          - me: 五年前，你也在這裡。
          - pause: 2
          - yuan: ……那班車開得很準時。
          - yuan: 這次我站得比較近。
      - if: "flag.f_y_thanks"
        then:
          - yuan: 昨天在店裡，妳講的那句話。
          - yuan: 我想了一個晚上，還是想不通妳怎麼會知道。
          - me: 等我回來再跟你講。很長。
          - yuan: ……嗯。
      - if: "mem.m_yuan_pickup"
        then:
          - think: 「但我會去接妳。」第一個今天，他坐在老屋的椅子上講的。
          - think: 他不記得。我記得就好。
      - if: "know.k_yuan_1758"
        then:
          - { sfx: phone_ring, at: right, dist: near, text: 鈴—— }
          - narr: 他口袋裡的手機響了。響第二聲，他就接起來。
          - yuan: 喂？……對，我在車站。等一下回你。
          - think: 五年前那一通，他沒有接。
      - { sfx: station_chime, at: front, dist: far, text: 叮——咚—— }
      - { announcer: 往北的列車，即將進站。, as: 廣播, via: speaker }
      - { sfx: train_brake, at: front, text: 嘰———— }
      - yuan: 妳還會回來嗎？
      - pause: 2
      - me: 會。
      - if: "know.k_six_letters"
        then:
          - me: 我行李箱裡有六封信，我姊寄的。我一直沒拆。
          - me: 下次回來，想請你念給我聽。
          - pause: 1.5
          - yuan: ……好。
          - yuan: 一次念一封。
      - narr: 車門還沒開。我從包包裡拿出點字板，夾進一張卡片。
      - punch:
          cells: [[3, 4, 5, 6], [1, 4, 5]]
          label: "4"
          prompt: 從背面打，左右是反的
      - { sfx: paper_rustle, at: center, dist: near, text: 沙 }
      - narr: 我把卡片抽出來翻到正面，放進他的手心。
      - narr: 我拉著他的食指放到第一格。他從左邊摸過去，指腹在第二格停住，又往回摸。
      - yuan: ……這個是什麼？
      - me: 四。今天四號。
      - pause: 1.5
      - narr: 他把卡片收進胸前的口袋，隔著布按了按。
      - { me: 這次回去，是為了以後還能再回來。, mem: m_f_come_back }
      - { sfx: train_door, at: left, dist: near, text: 噗嘶 }
      - narr: 車門關上的時候，我沒有在數秒。
      - narr: 雨打在車窗上。下一站會是什麼聲音，我不知道。
      - pause: 3
      - end: ending_c

  # ─────────────────────────── Ending A ───────────────────────────
  - id: f_end_a
    cast: { yuan: right }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - phone: 鬧鐘。二十三點五十九分。
      - pause: 2
      - { sfx: bell_toll, at: front, dist: far, text: 噹——, vib: bell }
      - narr: 一聲。
      - heart: fast
      - pause: 3
      - narr: 我在等第二聲。兩隻手抓著台階的邊緣，水泥的顆粒刺進指腹。
      - wait: 5
      - narr: 第二聲一直沒有來。
      - tension: -12
      - narr: 它停在半空中，像一個人話講到一半，決定不講了。
      - heart: off
      - pause: 3
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 十月四日，零點零分。
      - think: 往前走了。
      - { think: 只有今天。, mem: m_f_only_today }
    next: f_epilogue_a

  - id: f_epilogue_a
    time: "10月4日 17:50"
    place: 舊車站外
    ambience: [wind_open, street_evening]
    beats:
      - narr: 十月四日傍晚，我一個人來的。
      - narr: 今天沒有人打電話來，說誰怎麼了。
      - narr: 路過的人在講，更新工程下禮拜要繼續做。
      - { sfx: construction_drill, at: back-right, dist: far, text: 噠噠噠 }
      - pause: 3
      - { sfx: hum_rise, at: front-right, dist: far, text: 嗡…… }
      - narr: 很淡，從舊站的東側傳過來。
      - narr: 現在不是十八點三十一分，它也還是在那裡。
      - if: "flag.g2"
        then:
          - think: 予安拔掉的接頭還沒接回去，可是我讓庭安恢復了主路徑的權限。留著供電的機櫃，又開始低低地響。
      - think: 我封起來的，只有昨天那一天。
      - if: flag.f_page_sealed
        then:
          - think: 知夏寫我的那一頁，跟昨天一起封了。可是寫它的那台機器還開著。
      - if: know.k_my_death_page && !flag.f_page_sealed
        then:
          - think: 知夏寫我的那一頁還在。機器還開著，那一頁上的事，就還可能被算出來。
      - if: "know.k_zhixia_voice"
        then:
          - think: 知夏在錄音裡說，她看過結果。昨天以後的事，我一件都沒有看過。
      - think: 明天、後天，會不會有人站到那面牆前面，我不知道。
      - { sfx: hum_fall, at: front-right, dist: far, text: ……嗡 }
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 我轉身，手杖敲在碎石上。
      - narr: 它還在我背後。
      - pause: 2
      - end: ending_a

