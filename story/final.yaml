                      - me: 「但我會去接妳。」
                      - pause: 2.5
                      - narr: 鑷子擱到玻璃上，叮的一聲，然後就沒有再拿起來。
                      - yuan: ……我不記得我講過。
                      - yuan: 可是，聽起來是我會講的。
                      - me: 你今天早上也來了。所以這一次，換我來問你要不要。
                      - set: [f_y_resp, f_y_recall]
                  - mem: m_c5_on_time
                    then:
                      - me: 「那班車開得很準時。」
                      - pause: 3
                      - narr: 他手上那只錶的滴答，忽然變得很清楚。他把它放下了。
                      - yuan: ……誰跟妳講的？
                      - me: 你。在一間小餐館，電視在報明天的浪高。
                      - yuan: 我沒有跟誰講過那天我有去。
                      - me: 我知道。我不是要問那班車。今天的事，我想先讓你自己選。
                      - set: [f_y_resp, f_y_recall]
                  - mem: m_c1_not_alone
