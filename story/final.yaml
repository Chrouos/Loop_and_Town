              - { sfx: chair_scrape, at: back, dist: near, text: 嘎——, shake: light }
              - narr: 我站起來太急，膝蓋把椅子頂得往後滑，撞上身後的玻璃櫃。
              - think: 我拿他最痛的那一分鐘去撬他。
              - heart: off
              - { sfx: shop_bell, at: back, dist: near, text: 叮鈴 }
              - narr: 我推門出去站在騎樓下，機車一台一台從面前騎過去，等心跳自己慢回來。
