      - narr: 很遠的地方有玻璃掉下來碎了，沒有人叫。
      - narr: 身後的腳步全停住了，在等燈。我不用等。
      - { sfx: power_up, at: back, dist: mid, text: 嗡——喀 }
      - if: "know.k_hum_1831"
        then:
          - pause: 1
          - think: 這個聲音我聽過。第三次的時候，我站在舊站對面聽到的。
      - think: 哪一個，是跟著時間一起往上爬的？
      - choice:
          options:
            - text: （左邊——西牆那個）
              then:
                - set: f_wrong_left
            - text: （前面——售票口那個）
              then:
                - set: f_wrong_front
            - text: （右邊——東牆那個）
              then:
                - set: f_hear_right
      - if: "flag.f_wrong_left"
        then:
          - narr: 我往左走了兩步，手伸出去，碰到一片冰涼的鐵皮，在抖。
          - narr: 它從剛剛到現在都是同一個音，一點都沒有變高。
          - think: 不是這個。還有時間，再聽一次。
          - choice:
              options:
                - text: （前面——售票口那個）
                  then:
                    - set: f_wrong_twice
                - text: （右邊——東牆那個）
                  then:
                    - set: f_hear_right
      - if: "flag.f_wrong_front"
        then:
          - narr: 我往前走，摸到售票口的玻璃。玻璃後面那個嗡鳴一直往下掉。
          - think: 這個快睡著了，不是它。再聽一次。
          - choice:
              options:
                - text: （左邊——西牆那個）
                  then:
                    - set: f_wrong_twice
                - text: （右邊——東牆那個）
                  then:
                    - set: f_hear_right
      - if: "flag.f_hear_right && flag.ev_ruoqing"
        then:
          - narr: 我往右走。一步、兩步，第二根柱子。
          - if: "flag.ev_yuan"
            then:
              - { yuan: 小心，地上有線。, at: back-right, dist: near }
          - narr: 柱子後面是一個鐵皮櫃，比我高。門上有一排小燈，摸起來是溫的。
          - { sfx: hum_rise, at: right, dist: near, text: 嗡—————, vib: tap }
          - narr: 我把手掌貼上去。它在我手底下，一點一點往上爬。
          - me: 這個。
          - { ruoqing: ……對，就是它。今年四月照片裡那個。, at: back, dist: mid }
          - if: "flag.ev_tingan"
            then:
              - { tingan: 主路徑這邊也在跳，兩邊同時。, at: right, dist: near, as: 電話裡的庭安 }
              - { tingan: 它們在對時。妳摸到的，是另外那一條。, at: right, dist: near, as: 電話裡的庭安 }
          - { think: 一條在研究所，一條在我手底下。, mem: m_f_two_hums }
          - set: g1
        else:
          - if: "flag.f_hear_right"
            then:
              - narr: 我往右走。手杖碰到柱子、碰到牆，又碰到一堆不知道是什麼的鐵。
              - narr: 嗡鳴在右邊，可是整面牆都在右邊。
              - think: 方向我聽得出來。它是什麼、裝在哪裡，我聽不出來。
              - think: 要是有人拍過這面牆就好了。
            else:
              - think: 是右邊。等我轉過去，已經來不及了。
      - { sfx: hum_fall, at: right, dist: mid, text: ……嗡 }
      - narr: 然後它降下去，好像什麼事都沒有發生過。
      - clock: "18:32"
      - phone: 十八點三十二分。
    threads:
      cab_left:
        beats:
          - { sfx: light_buzz, at: left, text: 滋——滋—— }
          - narr: 左邊，很近。燈管跟一個舊鐵箱一起在響。
          - { sfx: light_buzz, at: left, text: 滋——滋—— }
          - narr: 一直是同一個高度，像有人按著同一個琴鍵不放。
          - { sfx: light_buzz, at: left, text: 滋——滋—— }
          - narr: 它不知道現在幾點。
      cab_front:
        beats:
          - { sfx: hum_fall, at: front, dist: far, text: 嗡…… }
          - narr: 前面，很遠，售票口那一帶。
          - { sfx: hum_fall, at: front, dist: far, text: 嗡……… }
          - narr: 它一直往下掉，慢慢的，像一台快要睡著的冰箱。
          - { sfx: hum_fall, at: front, dist: far, text: ……嗡 }
          - narr: 手機報時從它旁邊經過，它也沒有反應。
      cab_right:
        beats:
          - { sfx: hum_rise, at: right, text: 嗡—— }
          - narr: 右邊，牆的那一頭。
          - { sfx: hum_rise, at: right, text: 嗡——— }
          - narr: 手機每報一次時，它就高一點。
          - { sfx: hum_rise, at: right, dist: near, text: 嗡———— }
          - narr: 像有人在牆裡面，把一根弦慢慢轉緊。
          - { sfx: hum_rise, at: right, dist: near, text: 嗡————— }
          - narr: 它在等某一個時間。
    next: f_gate2

  # ─────────────────────────── G2 撤銷主／備援 ───────────────────────────
  - id: f_gate2
    time: "19:00"
    place: 舊車站，東牆
    ambience: [old_station_hall]
    cast: { yuan: right, tingan: right, ruoqing: back }
    beats:
      - if: "flag.g1 && flag.ev_yuan && flag.ev_tingan"
        then:
          - { sfx: tools_clink, at: right, dist: near, text: 叮、叮 }
          - { yuan: 面板四顆螺絲。……我爸這支起子剛好。, dist: near }
          - { sfx: box_open, at: right, dist: near, text: 喀 }
          - yuan: 兩排端子。上面那排是醫院跟路燈的備援電，那排不要碰。
          - yuan: 下排……一、二、三。第三條是舊的，鐘樓那條。
          - yuan: 膠布是我爸纏的。他每次都會多繞一圈，摸得出來。
          - yuan: 這條沒有電，是訊號線。從這裡通到研究所，那邊也會回過來。
          - { tingan: 好，主路徑的權限我這邊撤了。換你們。, at: right, dist: near, as: 電話裡的庭安 }
          - { tingan: 等一下，先不要拔！我說拔再拔。, at: right, dist: near, as: 電話裡的庭安 }
          - { tingan: 順序反過來的話，它會當成線路故障，自己再接回去。, at: right, dist: near, as: 電話裡的庭安 }
          - yuan: ……了解。
          - narr: 他的手指捏著那條線，沒有動。我聽得到他在用鼻子慢慢吐氣。
          - pause: 2
          - { tingan: 備援權限撤銷……跑完了。好，拔。, at: right, dist: near, as: 電話裡的庭安 }
          - yuan: 拔了。
          - { sfx: relay_click, at: right, dist: near, text: 喀噠 }
          - { sfx: hum_fall, at: right, dist: near, text: 嗡…… }
          - narr: 我把手掌貼在鐵皮上。剛剛一直往上爬的那個東西，停住了。
          - { tingan: 它現在只是關起來，壞了也不會自己打開。, at: right, dist: near, as: 電話裡的庭安 }
          - { tingan: 可是還沒寫死。要等最後封存才算數。, at: right, dist: near, as: 電話裡的庭安 }
          - if: "flag.ev_boxun"
            then:
              - { sfx: phone_notify, at: right, dist: near, text: 叮 }
              - phone: 陳柏勳：醫院的燈沒有閃。
          - pause: 1.5
          - yuan: 我八點有約。賣不賣，我還沒決定。
          - yuan: 可是我想自己去聽，他怎麼講。
          - me: 嗯。去吧。
          - { sfx: step, at: back-right, dist: far, text: 叩、叩 }
          - set: g2
        else:
          - if: "!flag.g1"
            then:
              - if: "flag.ev_tingan"
                then:
                  - { tingan: 主路徑我可以撤。可是備援在哪裡？妳找到了嗎？, at: right, dist: near, as: 電話裡的庭安 }
                  - me: 沒有。我沒找到。
                  - { tingan: 那只撤這邊沒有用。它會從另一條接回去。, at: right, dist: near, as: 電話裡的庭安 }
                else:
                  - think: 庭安不在。牆後面那個東西，連名字都沒有人知道。
              - think: 只關一條，另一條會接手。這件事我知道，可是知道也沒用。
            else:
              - if: "!flag.ev_yuan"
                then:
                  - narr: 我的手放在面板上，摸到螺絲。後面是兩排一模一樣的端子。
                  - think: 哪一條是醫院的電、哪一條不是，我摸不出來。
                  - if: "flag.ev_yuan_partial"
                    then:
                      - think: 予安寫的那張紙，我讓手機念了三次。三個銅片，中間那片比較長。
                      - think: 可是每一個都是三個銅片。
                  - think: 認得這些接頭的人，不在這裡。
                  - think: 亂拔的話，醫院今晚就沒有備援電。醫院裡的人，我不能拿他們去賭。
                else:
                  - yuan: 是哪一條我知道。可是拔了以後呢？
                  - yuan: 研究所那邊如果權限還在，它會從別的地方再要回去吧。
                  - think: 能從那邊把門關上的人，不在這裡。
          - narr: 東牆的鐵皮還是溫的。它在等明天的十八點三十一分。
    next: f_gate3

  # ─────────────────────────── G3 Epoch Fencing ───────────────────────────
  - id: f_gate3
    time: "20:40"
    place: 舊研究所，機房
    ambience: [research_facility]
    cast: { tingan: front, zhiyuan: back-left }
    beats:
      - if: "flag.ev_tingan"
        then:
          - { sfx: typing, at: front, dist: near, text: 噠噠噠噠 }
          - tingan: 佇列裡還有舊的確認。五年前的，今年春天的。
          - tingan: 欸，還有幾筆簽的是今天的日期。今天明明還沒過完啊。
          - pause: 2
          - tingan: 這些都可能被它當成新的命令。我把它們隔離起來，只能讀，不能執行。
          - { sfx: relay_click, at: front, dist: mid, text: 喀 }
          - tingan: 預測的部分我留著。下次颱風來，醫院還用得到。
          - { think: 它還能替醫院算颱風，只是再也不能動手改今天。, mem: m_f_say_not_do }
          - if: "flag.ev_zhiyuan"
            then:
              - { sfx: pen_scratch, at: back-left, dist: mid, text: 沙沙 }
              - zhiyuan: 二十點四十六分。操作人，葉庭安。記下來了。
          - set: g3
        else:
          - narr: 機房的門鎖著。裡面的伺服器在轉，門板貼著我的手心在震。
          - think: 那些舊的確認還留在裡面，以前的、今天的都有。
          - think: 會開這扇門的人，今天沒有幫我開門。
          - if: "flag.ev_tingan_partial"
            then:
              - think: 我拿她不知道的事去敲她的門。她給我的，就只有公開的那一份。
    next: f_gate4

  # ─────────────────────────── G4 獨立驗證 ───────────────────────────
  - id: f_gate4
    time: "22:00"
    place: 舊車站，東牆
    ambience: [old_station_hall]
    cast: { zhiyuan: front, boxun: right, tingan: right }
    beats:
      - if: "flag.ev_zhiyuan"
        then:
          - { sfx: pen_scratch, at: front, dist: near, text: 沙沙 }
          - zhiyuan: 二十二點整。東牆機櫃。封條編號我念一次。
          - zhiyuan: 零、三、一、八。經手人，周志遠。
      - if: "flag.ev_boxun"
        then:
          - { sfx: phone_ring, at: right, dist: near, text: 鈴—— }
          - { boxun: 醫院的分流預測還在跑，現在是唯讀。它說今晚不會下雨。, at: right, dist: near, as: 電話裡的陳醫生 }
          - { boxun: 十八點三十一分到現在，急診沒有異常。我查了三次。, at: right, dist: near, as: 電話裡的陳醫生 }
      - narr: 接下來，所有人都在等我的耳朵。
      - choice:
          options:
            - text: （把耳朵貼上冰冷的鐵皮）
              then:
                - narr: 鐵皮冰得我耳朵發痛。
            - text: （請所有人連呼吸都放輕）
              then:
                - me: 拜託，一分鐘就好。
                - narr: 呼吸聲一個接一個退下去。
      - pause: 3
      - if: "flag.g2"
        then:
          - narr: 鐵皮裡面，沒有東西在往上爬。
          - clock: "22:30"
          - amb: [research_facility]
          - narr: 二十二點三十分，研究所，主路徑的機櫃前。
          - narr: 伺服器還在轉。那是預測，它在算明天的風。
          - narr: 那個跟著時間往上爬的聲音，這裡也沒有了。
          - think: 兩邊都安靜了。
        else:
          - { sfx: hum_rise, at: right, dist: far, text: 嗡—— }
          - narr: 很淡，可是還在。
          - think: 它還在等。
      - if: "flag.g2 && flag.ev_zhiyuan && flag.ev_boxun"
        then:
          - zhiyuan: 三個來源。紀錄、醫院，還有妳的耳朵。
          - { zhiyuan: 妳的耳朵我也照記。證人，林小姐。, mem: m_f_witness }
          - set: g4
        else:
          - if: "!flag.ev_zhiyuan"
            then:
              - think: 沒有人能證明今晚的紀錄沒被改過。我記得的不算數。
          - if: "!flag.ev_boxun"
            then:
              - think: 醫院那邊到底有沒有照常在走，沒有人講得出來。
          - if: "!flag.g2"
            then:
              - think: 而且它根本還沒停。
          - think: 光是我說「它停了」不夠，要別人也查得到才行。
    next: f_gate5

  # ─────────────────────────── G5 Forward Seal ───────────────────────────
  - id: f_gate5
    time: "23:30"
    place: 舊研究所，機房
    ambience: [research_facility]
    cast: { tingan: front, yuan: right, ruoqing: left, zhiyuan: back-left, boxun: back-right }
    beats:
      - if: "flag.ev_yuan"
        then:
          - { sfx: step, at: right, dist: mid, text: 叩、叩 }
          - yuan: 我回來了。我跟房仲說，我還要再想。
          - yuan: ……這次是真的在想。
      - if: "flag.g2 && flag.g3 && flag.g4"
        then:
          - tingan: 最後一步，封存。
          - tingan: 封存的意思是，它正式放棄重算今天。
          - tingan: 已經發生的就是唯一的版本，只能往前走。
          - tingan: 送法有兩種。
          - tingan: 一種只封今天。權限沒有寫死，明天它還會在。
          - tingan: 另一種，先把撤銷寫死，再封。
          - tingan: 寫死以後，誰都沒辦法再叫它改一次今天。我們不行，妳也不行。
          - pause: 2
          - tingan: 大家那一欄都簽了。最後一欄是觀測者。
          - tingan: 就是聽過今天最多次的那個人。
          - set: g5
        else:
          - if: "flag.ev_tingan"
            then:
              - tingan: 現在只剩一種送法。
              - tingan: 我可以把今天封起來，一次。這個權限我有。
              - if: "!flag.g2"
                then:
                  - tingan: 可是兩條路的權限，沒有一起撤掉。
                else:
                  - tingan: 可是沒有人能證明，它真的停了。
              - tingan: 一個不確定有沒有停的東西，寫死了也只是在騙自己。
              - tingan: 明天它還會在。我只能讓它今天不能再重算。
            else:
              - narr: 機房的門鎖著。
              - think: 怎麼把今天封起來，沒有人知道。
              - think: 很多事我都知道，偏偏這件不知道。
    next: f_choice

  # ─────────────────────────── 23:40 ───────────────────────────
  - id: f_choice
    time: "23:40"
    place: 舊研究所，機房
    ambience: [research_facility]
    cast: { tingan: front, yuan: right, ruoqing: left }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - phone: 二十三點四十分。
      - think: 我可以重來。
      - think: 我知道怎麼讓明天的若晴不用站在門口，予安不用去碰那條線。
      - think: 再來一次，每個人都可以排得更好。
      - if: "know.k_zhixia_voice"
        then:
          - think: 「我看過結果。」知夏這樣講過。我也看過，看過好多個。
      - if: "know.k_dont_become_me"
        then:
          - think: 不要讓她變成我。
      - pause: 2
      - choice:
          options:
            - text: 「撤銷所有改寫，然後封存今天。」
              if: "flag.g1 && flag.g2 && flag.g3 && flag.g4 && flag.g5"
              then:
                - set: f_pick_c
                - pause: 1.5
                - tingan: ……好。
                - { sfx: typing, at: front, dist: near, text: 噠、噠、噠 }
                - tingan: 撤銷，寫死。
                - { sfx: relay_click, at: front, dist: mid, text: 喀噠 }
                - tingan: 封存。觀測者那一欄——
                - me: 林。知夏的妹妹。
                - { sfx: relay_click, at: front, dist: far, text: 喀 }
                - narr: 伺服器還在轉。現在它只能算，不能再動手了。
            - text: 「只封存這一個今天。」
              if: "flag.ev_tingan"
              then:
                - set: f_pick_a
                - if: "flag.g5"
                  then:
                    - tingan: 不寫死？
                    - me: 萬一哪天，真的有人需要它呢。
                    - pause: 2
                    - tingan: ……那一欄是妳的。
                - { sfx: typing, at: front, dist: near, text: 噠、噠 }
                - tingan: 只封今天。送出。
                - { sfx: relay_click, at: front, dist: mid, text: 喀 }
            - text: 「……再一次。」
              then:
                - set: f_pick_b
                - learn: f_again
                - pause: 3
                - narr: 機房裡只剩伺服器在轉。
                - if: "flag.ev_tingan"
                  then:
                    - tingan: 再一次……什麼再一次？
                    - narr: 我沒有回答。他們不會記得我沒回答。
                - think: 我又替所有人選了一次。
    next: f_midnight

  # ─────────────────────────── 等待午夜 ───────────────────────────
  - id: f_midnight
    time: "23:50"
    place: 舊研究所外的台階
    ambience: [wind_open, night_insects]
    cast: { yuan: right, ruoqing: left, tingan: back, zhiyuan: back-left, boxun: back-right }
    life:
      - { text: 呼……, sfx: breath, at: [left, right], dist: near }
      - { text: 沙, sfx: cloth_rustle, at: [right, back, back-left, back-right], dist: mid }
      - { text: 叩, at: [back, back-left, back-right], dist: mid }
    beats:
      - narr: 我們走到外面。水泥台階還留著一點白天的溫度。
      - narr: 鎮在坡下面。鐘樓在正前方，很遠。
      - if: "flag.ev_yuan"
        then:
          - { sfx: cloth_rustle, at: right, dist: near, text: 沙 }
          - narr: 予安在我右邊坐下，外套的袖子擦過我的手臂。
      - if: "flag.ev_ruoqing"
        then:
          - { sfx: strap_click, at: left, dist: near, text: 喀 }
          - narr: 若晴在左邊。背帶扣響了一聲，就沒再響。
      - if: "flag.f_pick_b"
        then:
          - narr: 沒有人問我為什麼。他們以為明天會來。
      - { sfx: breath, at: right, dist: near }
      - { wait: 40, clock: "23:50", until: "23:55" }
      - { sfx: wind_gust, at: front, dist: far, text: 颯—— }
      - narr: 風從鎮上吹上來，帶著海的鹹味。
      - { sfx: breath, at: left, dist: near }
      - narr: 左右兩邊的呼吸，快慢不一樣。
      - { wait: 30, clock: "23:55", until: "23:59" }
      - if: "flag.f_pick_c"
        then:
          - goto: f_end_c
      - if: "flag.f_pick_a"
        then:
          - goto: f_end_a
      - goto: f_end_b

  # ─────────────────────────── Ending C ───────────────────────────
  - id: f_end_c
    cast: { yuan: right, ruoqing: left, tingan: back }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - phone: 二十三點五十九分。
      - wait: 3
      - narr: 我在等第一聲。
      - wait: 5
      - narr: 風，很遠的車，右邊有人在呼吸。
      - wait: 5
      - narr: 鐘沒有響。
      - pause: 3
      - narr: 看得見的人，大概只會覺得這是一個普通的晚上。
      - narr: 對我來說，這片安靜就是全部了。
      - wait: 4
      - { sfx: heartbeat, at: center, dist: near, vib: heartbeat }
      - narr: 我數自己的心跳，數到十二，再數到十三。
      - pause: 3
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - { phone: 十月四日，零點零分。, mem: m_f_oct4 }
      - pause: 4
      - yuan: ……妳在哭嗎？
      - me: 沒有。
      - me: 我在聽。
      - { sfx: camera_shutter, at: left, dist: near, text: 喀嚓 }
      - ruoqing: 啊，歹勢，手自己按下去的。
      - ruoqing: 十月四日的第一張。
    next: f_epilogue_c

  - id: f_epilogue_c
    time: "10月4日 07:10"
    place: 林家老屋
    ambience: [old_house, rain_on_window]
    beats:
      - pause: 2
      - { sfx: rain_burst, at: front, dist: mid, text: 嘩—— }
      - narr: 我在灰潮鎮醒來的時候，外面在下雨。
      - think: 十月三日的早上，從來沒有下過雨。
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - phone: 十月四日。七點十分。
      - { sfx: car_pass, at: left, dist: far, text: 噗、噗噗—— }
      - narr: 巷口有台機車發不動，踩了三次，旁邊有人在笑它。
      - narr: 這些聲音我一個都不認得，全部都是第一次聽到。
      - think: 下一分鐘會發生什麼，我不知道。
      - think: 我都快忘了，原來是這種感覺。
      - pause: 2
      - { sfx: phone_notify, at: right, dist: near, text: 叮咚 }
      - phone: 許若晴。
      - phone: 外地那個課我報名了！我媽說她早就叫我去了，講得好像是她的功勞。
      - phone: 週末我會回來。這是我自己排的喔。
      - { sfx: phone_notify, at: right, dist: near, text: 叮咚 }
      - phone: 葉庭安。
      - phone: 稿子寫好了。署名在最上面，我做過的事也寫在裡面。
      - phone: 灰潮鎮這一套關掉了。別的地方，還有類似的東西。
      - phone: 要不要讀，大家自己決定。
      - { sfx: phone_notify, at: right, dist: near, text: 叮咚 }
      - phone: 周志遠。
      - phone: 錄音機登錄了。下午督察找我。該講的，我會講。
      - { sfx: phone_notify, at: right, dist: near, text: 叮咚 }
      - phone: 陳柏勳。
      - phone: 今天去見十二天前那位的家屬。紀錄是他們的。
      - phone: 要不要知道，由他們決定。
      - pause: 2
      - { sfx: envelope, at: center, dist: near, text: 沙 }
      - narr: 我把信拿出來。那一行凸點，每一格都壓得很深。
      - if: "know.k_yuan_sent_letter"
        then:
          - narr: 知夏的鉛筆字在紙的另一面，淡到我摸不出來。
          - narr: 我摸得到的，是予安照著她的字，一格一格打出來的那一行。
      - think: 不要回來。
      - if: "know.k_six_letters"
        then:
          - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
          - narr: 行李箱的夾層裡，六封信還用橡皮筋綁著。
          - narr: 我把橡皮筋拆下來，把這一封放在最後面，七封疊成一疊。
          - narr: 它們本來要放回她房間，跟房子一起處理掉。我把它們放回行李箱。
        else:
          - narr: 我把它摺好，放回外套內側的口袋。
    next: f_epilogue_station

  - id: f_epilogue_station
    time: "10月4日 15:20"
    place: 灰潮鎮車站
    ambience: [platform, rain]
    cast: { yuan: right, announcer: front }
    beats:
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 月台的導盲磚在右邊。這一次，我往反方向走。
      - { sfx: step_wet, at: right, dist: near, text: 啪、啪 }
      - narr: 他的腳步停在我右邊，比昨天早上近了半步。
      - yuan: 我的左手肘，在妳的右手邊。
      - narr: 其實不用講。他話還沒講完，我的手已經搭上去了。
      - yuan: 早上我想好了。
      - yuan: 店不賣。可是也不要照以前那樣開。
      - yuan: 我想先去把以前沒念完的書念完。店關三個月。
      - { yuan: 要不要回來開，到時候我自己決定。, mem: m_f_yuan_decides }
      - think: 他講了「我想」。我沒有特地去數，可是我聽到了。
      - if: "know.k_yuan_went_station"
        then:
          - me: 五年前，你也在這裡。
          - pause: 2
          - yuan: ……那班車開得很準時。
          - yuan: 這次我站得比較近。
      - if: "flag.f_y_thanks"
        then:
          - yuan: 昨天在店裡，妳講的那句話。
          - yuan: 我想了一個晚上，還是想不通妳怎麼會知道。
          - me: 等我回來再跟你講。很長。
          - yuan: ……嗯。
      - if: "mem.m_yuan_pickup"
        then:
          - think: 「但我會去接妳。」第一個今天，他坐在老屋的椅子上講的。
          - think: 他不記得。我記得就好。
      - { sfx: station_chime, at: front, dist: far, text: 叮——咚—— }
      - { announcer: 往北的列車，即將進站。, as: 廣播 }
      - { sfx: train_brake, at: front, text: 嘰———— }
      - yuan: 妳還會回來嗎？
      - pause: 2
      - me: 會。
      - if: "know.k_six_letters"
        then:
          - me: 我行李箱裡有六封信，我姊寄的。我一直沒拆。
          - me: 下次回來，想請你念給我聽。
          - pause: 1.5
          - yuan: ……好。
          - yuan: 一次念一封。
      - { me: 這次回去，是為了以後還能再回來。, mem: m_f_come_back }
      - { sfx: train_door, at: left, dist: near, text: 噗嘶 }
      - narr: 車門關上的時候，我沒有在數秒。
      - narr: 雨打在車窗上。下一站會是什麼聲音，我不知道。
      - pause: 3
      - end: ending_c

  # ─────────────────────────── Ending A ───────────────────────────
  - id: f_end_a
    cast: { yuan: right }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
      - phone: 二十三點五十九分。
      - pause: 2
      - { sfx: bell_toll, at: front, dist: far, text: 噹——, vib: bell }
      - narr: 一聲。
      - pause: 3
      - narr: 我在等第二聲。
      - wait: 5
      - narr: 第二聲一直沒有來。
      - narr: 它停在半空中，像一個人話講到一半，決定不講了。
      - pause: 3
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 十月四日，零點零分。
      - think: 往前走了。
      - { think: 只有今天。, mem: m_f_only_today }
    next: f_epilogue_a

  - id: f_epilogue_a
    time: "10月4日 17:50"
    place: 舊車站外
    ambience: [wind_open, street_evening]
    beats:
      - narr: 十月四日傍晚，我一個人來的。
      - narr: 今天沒有人打電話來，說誰怎麼了。
      - narr: 路過的人在講，更新工程下禮拜要繼續做。
      - { sfx: construction_drill, at: back-right, dist: far, text: 噠噠噠 }
      - pause: 3
      - { sfx: hum_rise, at: front-right, dist: far, text: 嗡…… }
      - narr: 很淡，從舊站的東側傳過來。
      - narr: 現在不是十八點三十一分，它也還是在那裡。
      - if: "flag.g2"
        then:
          - think: 予安拔掉的那一條沒有寫死，它自己又接回去了。
      - think: 我封起來的，只有昨天那一天。
      - think: 明天、後天，會不會有人站到那面牆前面，我不知道。
      - { sfx: hum_fall, at: front-right, dist: far, text: ……嗡 }
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 我轉身，手杖敲在碎石上。
      - narr: 它還在我背後。
      - pause: 2
      - end: ending_a

  # ─────────────────────────── Ending B ───────────────────────────
  - id: f_end_b
    cast: { tingan: back }
    beats:
