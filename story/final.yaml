  # ─────────────────────────── 柏勳 ───────────────────────────
  - id: f_boxun
    place: 灰潮鎮醫院，病歷室外的走廊
    ambience: [hospital]
    cast: { boxun: front }
    beats:
      - set: v_boxun
      - { sfx: step, at: back-right, dist: far, text: 叩、叩 }
      - narr: 消毒水的味道。推車輪子壓過地板的接縫，喀隆一聲。
      - pause: 1
      - boxun: ……林小姐？
      - think: 他開口之前，一定會先停一下。
      - if: "flag.slot5"
        then:
          - boxun: 我五點多要出去一趟。妳的時間不多。
      - choice:
          options:
            - text: 「我想請你查一件事。先說清楚，我手上有的只是推測。」
              then:
                - set: f_b_resp
            - text: （等他先開口）
              then:
                - set: f_b_resp
                - pause: 3
                - boxun: 妳是為了知夏來的。
                - me: 一半。另一半是為了今天。
            - text: 「你排除過睡眠、壓力、神經、藥物。最後是鄭阿姨的手腕。」
              if: "know.k_medical_records"
              then:
                - set: f_b_resp
                - pause: 2.5
                - boxun: ……那是知夏的諮詢紀錄。除了我，沒有人讀過。
                - me: 你念給我聽過。你不用相信我，像那時候一樣，一項一項排除就好。
            - text: 「知夏走前十二天的那個人。你一直覺得他不該死。」
              if: "know.k_record_12days"
              then:
                - set: f_b_resp
                - pause: 2
                - boxun: ……這件事，妳從哪裡知道的？
                - me: 你告訴我的。我知道這聽起來像什麼。
            - text: 「這是第幾次？你不用問。上一次，你死在維修通道裡。」
              then:
                - set: f_b_push
      - if: "flag.f_b_resp"
        then:
          - me: 十八點三十一分，舊車站附近會出事。每一次出事的人都不一樣。
          - me: 有時候在大廳，有時候在通道。
          - me: 我想知道，是不是一定要有一個人。
          - me: 答案我不知道，所以才來拜託你查。
          - boxun: 那是病人的紀錄。
          - me: 我知道。要不要查、查到哪裡，你決定。
          - pause: 2
          - { sfx: typing, at: front, dist: near, text: 噠、噠、噠 }
          - boxun: 五年前，知夏走前十二天。電擊傷，舊站側邊。
          - boxun: 然後是知夏。舊站，十八點三十一分。
          - boxun: 今年四月，一名工人。十八點三十二分，手臂灼傷，舊站東側。
          - boxun: 這五年其他的十八點三十一分，沒有紀錄。
          - { boxun: 從這幾筆看，跟人數沒有關係。跟誰剛好站在哪裡、碰到什麼有關係。, mem: m_f_not_one }
          - boxun: 我能確定的只有這些。再多，就是推測了。
          - boxun: 影本給妳。原件不能出醫院，這是我的條件。
          - set: ev_boxun
        else:
          - pause: 3
          - narr: 推車過去了。走廊只剩空調在吹。
          - boxun: 妳是在威脅我嗎？
          - boxun: 我不會把推測當成事實。我建議妳也不要。
          - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
          - boxun: 一份影本。其他的，等妳拿得出證據再說。
          - think: 我拿他自己的死去壓他。對他來說，那只是一句沒有根據的話。
          - set: ev_boxun_partial
      - goto: f_hub

  # ─────────────────────────── 志遠 ───────────────────────────
  - id: f_zhiyuan
    place: 灰潮鎮派出所
    ambience: [police_office]
    cast: { zhiyuan: front }
    beats:
      - set: v_zhiyuan
