      - narr: 電扇轉得很吵。有菸味，可是沒有人在抽。
      - zhiyuan: 小姐，有什麼事？
      - me: 我姓林。林知夏是我姊姊。
      - pause: 2
      - zhiyuan: ……我姓周。
      - choice:
          options:
            - text: 「我想請你做一件事。先告訴你，它對你有什麼風險。」
              then:
                - set: f_z_resp
            - text: （坐下，等他把電扇關小）
              then:
                - set: f_z_resp
                - pause: 2
                - narr: 電扇的聲音轉小了一格。他沒有叫我走。
            - text: 「錄音裡有你的聲音。那時候，你還在路上。」
              if: "know.k_recorder_voice"
              then:
                - set: f_z_resp
                - pause: 3
                - zhiyuan: ……這件事，沒人知道。
                - me: 我不是來檢舉你的。那台機器今晚可能用得到。要不要用，你決定。
            - text: 「你抽屜深處有一台沒登錄的錄音機。不交出來，我就去找督察。」
              then:
                - set: f_z_push
      - if: "flag.f_z_resp"
        then:
          - me: 今晚需要有人證明，我們做了什麼、幾點做的。
          - me: 不能只是我講的。要是別人拿去查得到的紀錄。
          - me: 你如果把那台錄音機正式登錄，你自己可能會被調查。
          - me: 你五年沒交出來，我不覺得你錯。我只是來問你。
          - pause: 2
          - { sfx: drawer, at: front, dist: near, text: 喀啦 }
          - { sfx: tape_hiss, at: front, dist: near, text: 沙———— }
          - narr: 抽屜拉到最底。磁帶的底噪很輕，一直沙沙地響。
          - zhiyuan: 證物要有保全鏈。誰拿過、幾點、封在哪裡。
          - zhiyuan: 從現在開始，每樣東西經過誰的手，我一筆一筆記。
          - { zhiyuan: 這台錄音機，用我的名字登錄。, mem: m_f_my_name }
          - zhiyuan: 那天晚上的事，我欠一個交代。拖五年了。
          - set: ev_zhiyuan
        else:
          - pause: 2
          - zhiyuan: 歹勢，妳要去就去。
          - zhiyuan: 我就在這裡，哪裡都不去。
          - narr: 抽屜沒有拉開。電扇轉過來，又轉過去。
          - think: 他什麼時候該講出來，我替他決定了。
      - goto: f_hub

  # ─────────────────────────── 17:42 會議室 ───────────────────────────
