                      - me: 「這個時間，我都不太想一個人待著。」
                      - pause: 3
                      - narr: 他手上起子的聲音停了。滿屋子的滴答，一只疊著一只。
                      - yuan: ……我講過？
                      - me: 那天我沒有問為什麼，今天也不問。
                      - me: 我只是想跟你說，今天傍晚，你不用一個人。要不要來，你自己決定。
                      - set: [f_y_resp, f_y_recall]
