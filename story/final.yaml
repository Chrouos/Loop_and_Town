      - wait: 3
      - { sfx: bell_toll, at: front, text: 噹——, vib: bell }
      - wait: 3
      - { sfx: bell_toll, at: front, text: 噹—— }
      - think: 下一次，我會做得更好。
      - wait: 3
      - { sfx: bell_toll, at: front, text: 噹——, vib: bell }
      - wait: 3
      - { sfx: bell_toll, at: front, text: 噹—— }
      - think: 知夏以前一定也這樣跟自己講過。
      - wait: 3
      - { sfx: bell_toll, at: front, text: 噹——, vib: bell }
      - wait: 3
      - { sfx: bell_toll, at: front, text: 噹—— }
      - wait: 3
      - { sfx: bell_toll, at: front, text: 噹——, vib: bell }
      - wait: 3
      - { sfx: bell_toll, at: front, text: 噹—— }
      - { think: 下一次，真的會是最後一次嗎？, mem: m_f_last_time }
      - wait: 3
      - { sfx: bell_toll, at: front, dist: near, text: 噹———, vib: long }
      - { sfx: silence_drop, at: center }
      - pause: 1.5
      - { sfx: heartbeat, at: center, dist: near, vib: heartbeat }
      - end: ending_b
