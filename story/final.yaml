# 最終章｜18:31
# 盲眼主角版。格式見 docs/design.md §11；故事見 docs/story.md §5。
# 機制：docs/story-canon-mechanism.md（G1–G5、Ending A/B/C）。
# 信：她已經知道第七封是知夏寫、予安打成點字寄出的（k_yuan_sent_letter），也聽過那六封（k_six_letters）。予安不記得他說過。
#
# 本輪旗標
#   v_*            今天已經去找過這個人（hub 隱藏選項）
#   slot1..slot5   白天剛好五段時間
#   ev_*           對方在知情之下，自己決定給出完整的東西
#   ev_*_partial   被輪迴知識施壓後，只給了一部分（不足以通過 Gate）
#   g1..g5         Ending C 的五個 Gate
#   f_pick_a/b/c   23:40 的選擇
#   f_y_thanks     在鐘錶店跟予安道謝（不影響任何 Gate）
chapter: final
title: "18:31"
start: f_train
advance:
  - if: "true"
    to: final

scenes:
  # ─────────────────────────── 06:12 列車 ───────────────────────────
  - id: f_train
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    beats:
      - pause: 1
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 十月三日。六點十二分。
      - if: "know.f_again"
        then:
          - think: 上一次到最後，我說了「再一次」。
          - think: 所以又是六點十二分。
          - pause: 1.5
      - narr: 鐵軌的接縫從腳底一節一節傳上來，喀噠、喀噠。
      - narr: 我沒有站起來，也沒有在腦子裡把今天再排一遍。
      - think: 若晴六點零五分會走進舊站大廳。陳醫生六點十二分，從側邊的通道下去。
      - think: 誰在哪一分鐘走到哪裡，我都背得出來。
      - pause: 1.5
      - think: 知夏以前也背得出來。
      - pause: 1
      - { think: 這一次，我不安排任何人。, mem: m_f_no_arranging }
      - pause: 2
      - { cue: gossip, at: back-left, text: 窸窸窣窣, sfx: whisper }
      - if: "know.k_yuan_sent_letter"
        then:
          - narr: 我隔著外套按了一下內側的口袋。信還在，點字的凸點頂著手指。
          - think: 字是知夏用鉛筆寫的。予安借了點字板，從背面一格一格把它打出來。
          - think: 他打得很用力，怕我摸不到。
        else:
          - narr: 口袋裡，點字還是那一行，指尖下是同樣的凸點。
      - think: 不要回來。
      - think: 我還是回來了。第幾次，我已經不數了。
      - if: "know.k_six_letters"
        then:
          - narr: 行李箱靠在我腳邊。夾層裡那六封信，橡皮筋還綁著，跟每一次一樣。
      - { sfx: station_chime, at: front, dist: far, text: 叮——咚—— }
      - { announcer: 下一站，灰潮鎮。, as: 廣播 }
      - { sfx: cane_tap, at: front, dist: near, text: 叩 }
      - narr: 我把手杖一節一節卡好。最後那一節卡進去的聲音，每次都比前面響。
    threads:
      gossip:
        beats:
          - { woman: 舊車站那個備援，今天傍晚又要測了。, at: back-left }
          - { man: 測什麼啦？, at: back-left }
          - { woman: 說是以後颱風來，醫院就不會斷電。, at: back-left }
          - { man: 那是好事啊。, at: back-left }
          - narr: 是好事啊。我在心裡也跟著講了一遍。
    next: f_arrival

  # ─────────────────────────── 07:40 抵達 ───────────────────────────
  - id: f_arrival
    time: "07:40"
    place: 灰潮鎮車站
    ambience: [platform]
    cast: { yuan: front-right }
    beats:
      - { sfx: train_door, at: left, dist: near, text: 噗嘶 }
      - { sfx: step, at: front-right, text: 叩、叩 }
      - yuan: 比我想的早。
      - me: 車沒誤點。
      - narr: 這兩句我聽過太多次，就讓它們照原樣過去。
      - yuan: 我的左手肘，在妳的右手邊。
      - narr: 機油和黃銅的味道。他走得很慢，配合我的步子。
      - if: "know.k_yuan_sent_letter"
        then:
          - think: 前天傍晚，他才把那封信投進郵筒，然後照樣來接我。
          - think: 這件事，他一個字都不會提。
        else:
          - think: 他不記得。每一次都不記得。
      - me: 予安，我今天會去找幾個人，你也是其中一個。
      - me: 到時候我會拜託你一件事。你可以說不。
      - pause: 1.5
      - yuan: ……妳講得好像很嚴重。
      - me: 有多嚴重，我也還不知道。這個到時候也會跟你講。
      - yuan: 喔。好。我在店裡。
    next: f_hub

  # ─────────────────────────── 白天：五段時間 ───────────────────────────
  - id: f_hub
    beats:
      - if: "flag.v_tingan && flag.v_yuan && flag.v_ruoqing && flag.v_boxun && flag.v_zhiyuan"
        then:
          - clock: "17:30"
          - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
          - phone: 十七點三十分。
          - think: 五個人都找過了。手杖的握把被風吹得有點涼。
          - goto: f_meeting
      - if: "!flag.slot1"
        then:
          - set: slot1
          - clock: "08:40"
          - if: "know.k_spare_key"
            then:
              - { sfx: key_jingle, at: front, dist: near, text: 鏘啷 }
              - narr: 門口第三個花盆底下，鑰匙還在。予安沒有問，自己回店裡去了。
            else:
              - { sfx: door_creak, at: front, dist: near, text: 碰——吱呀 }
              - narr: 老家的門還是卡住。予安用肩膀頂開，就回店裡去了。
          - { sfx: phone_buzz, at: right, dist: near, text: 嗡 }
          - phone: 八點四十分。
          - think: 時間剛好夠找五個人，多一個都不行。
        else:
          - if: "!flag.slot2"
            then:
              - set: slot2
              - clock: "10:30"
              - { sfx: bicycle_bell, at: left, dist: mid, text: 叮叮 }
              - phone: 十點三十分。
              - think: 還有四個人。
            else:
              - if: "!flag.slot3"
                then:
                  - set: slot3
                  - clock: "12:20"
                  - { sfx: construction_drill, at: back-right, dist: far, text: 噠噠噠噠 }
                  - phone: 十二點二十分。
                  - think: 施工停了一陣子，大概是去買便當，現在又開始了。
                else:
                  - if: "!flag.slot4"
                    then:
                      - set: slot4
                      - clock: "14:10"
                      - { sfx: seagull, at: front-left, dist: far, text: 啊——啊—— }
                      - phone: 十四點十分。
                      - think: 風轉了，開始從海那邊吹過來。
                    else:
                      - set: slot5
                      - clock: "15:50"
                      - { sfx: car_pass, at: right, dist: far, text: 嗚—— }
                      - phone: 十五點五十分。
                      - think: 最後一個人。
    next: f_hub_pick

  - id: f_hub_pick
    beats:
      - think: 下一個，去找誰？
      - choice:
          options:
            - text: （去港邊的民宿，找庭安）
              if: "!flag.v_tingan"
              goto: f_tingan
            - text: （去鐘錶店，找予安）
              if: "!flag.v_yuan"
              goto: f_yuan
            - text: （去咖啡店，找若晴）
              if: "!flag.v_ruoqing"
              goto: f_ruoqing
            - text: （去醫院，找陳醫生）
              if: "!flag.v_boxun"
              goto: f_boxun
            - text: （去派出所，找周警官）
              if: "!flag.v_zhiyuan"
              goto: f_zhiyuan
            - text: （先站一下，聽這座鎮）
              then:
                - pause: 2
                - narr: 對面的鐵捲門拉上去，嘩啦啦一路響到頂。遠一點有阿伯在喊今天剛到的白帶魚。
                - narr: 一張紙被風捲過來，貼著我的腳踝停住，又被吹走。
                - think: 這些都會自己發生，不用我去動。
      - goto: f_hub_pick

  # ─────────────────────────── 庭安 ───────────────────────────
  - id: f_tingan
    place: 港邊的民宿，二樓
    ambience: [room_tone, sea_far]
    cast: { tingan: front }
    beats:
      - set: v_tingan
      - { sfx: hammer, at: front, dist: near, text: 叩、叩、叩 }
      - { sfx: door_open, at: front, dist: near, text: 吱 }
      - { sfx: cloth_rustle, at: front, dist: near, text: 沙沙 }
      - narr: 雨衣沙沙響。她在屋子裡也沒脫。
      - tingan: ……請問妳找誰？
      - think: 她不認得我的聲音。我認得她的。
      - me: 葉庭安。
      - tingan: 妳怎麼知道我的名字？誰跟妳說我住這裡的？
      - narr: 她背後的鍵盤聲停了。再過去一點，是海。
      - choice:
          options:
            - text: 「我先說我不知道的事。」
              then:
                - set: f_t_resp
                - me: 我知道今天傍晚舊車站會出事。為什麼會這樣，我不知道。
                - me: 妳聽完會不會把門關上，我也不知道。
            - text: （把手杖收起來，問她能不能進去坐）
              then:
                - set: f_t_resp
                - me: 我會講很久。妳想叫我走，隨時都可以。
                - pause: 1
                - tingan: ……妳是林知夏的妹妹？
                - me: 嗯。我不是來問妳為什麼騙我。
            - text: 「妳們做的，本來是讓颱風夜少死幾個人的東西。」
              if: "know.k_research_purpose"
              then:
                - set: f_t_resp
                - pause: 2
                - tingan: ……妳到底是誰？
                - me: 林知夏的妹妹。我不是來找妳算帳的。
            - text: 「『看過結果，不代表那個選擇就是妳的。』」
              if: "know.k_zhixia_voice"
              then:
                - set: f_t_resp
                - narr: 她身上的雨衣不響了。
                - tingan: 這句話……妳從哪裡聽來的？
                - me: 一卷錄音。錄的是妳跟我姊。
                - me: 妳那時候是對的。我今天不是來跟妳吵這個。
            - text: 「我知道妳今晚九點十四分，會一個人進研究所。」
              then:
                - set: f_t_push
                - pause: 1.5
                - tingan: ……妳跟蹤我？
                - tingan: 誰叫妳來的？研究所？還是鎮公所？
                - me: 沒有人。我就是知道。
                - think: 我講得太快了，像把一張她不可能贏的牌直接甩到桌上。
      - if: "flag.f_t_resp"
        then:
          - { sfx: chair_scrape, at: front, dist: near, text: 嘎 }
          - tingan: ……進來講吧。門口風很大。
          - me: 舊車站東邊有個東西，會在十八點三十一分醒過來。
          - me: 那附近的人會受傷，有時候會死。每一次都不太一樣。
          - me: 到了午夜，今天會重來一次。記得的只有我。
          - tingan: 等一下。重來，是什麼意思？
          - me: 就是字面上的意思。妳不信也沒關係。
          - pause: 2
          - tingan: 好，先假設我信。那妳要我給妳什麼？
          - me: 研究的目標、權限怎麼流，還有舊的備援紀錄。
          - tingan: 拿去幹嘛？給誰看？
          - me: 傍晚全部攤在桌上，給每一個會被它影響的人看。妳也是其中一個。
          - me: 妳不想給，我現在就走。
          - pause: 2.5
          - { sfx: typing, at: front, dist: near, text: 噠、噠 }
          - tingan: 五年前，妳姊要我答應她一件事。
          - tingan: 如果妳哪天回來，不要讓妳知道她做過什麼。
          - tingan: 我守了五年。替一個已經不在的人守，很蠢吧？
          - if: "know.k_dont_become_me"
            then:
              - think: 知夏的筆記裡還有另一句。不要讓她變成我。
              - think: 我沒有講出來。那句話不該拿來說服人。
          - tingan: 可是妳看起來，不太像是來要答案的。
          - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
          - tingan: 研究的目標，是災害的時候怎麼分流。颱風、封路、醫院。一開始跟時間完全沒關係。
          - tingan: 權限的圖我念給妳。回寫的主路徑在研究所。
          - tingan: 今年春天，舊站那邊多接了一條備援。
          - { tingan: 主路徑斷了，備援會接手。備援斷了，主路徑也會接回去。, mem: m_f_two_paths }
          - tingan: 所以只關一條，等於沒關。
          - tingan: 我去。這件事我幫人瞞太久了。
          - set: ev_tingan
        else:
          - narr: 鍵盤又響了，打得很快，像在一個一個關視窗。
          - tingan: 研究目標我可以給妳。公開的版本，網路上就查得到。
          - { sfx: paper_rustle, at: front, dist: near, text: 沙 }
          - tingan: 其他的，我不知道妳在講什麼。
          - { sfx: door_close, at: front, dist: near, text: 碰 }
          - narr: 我手裡多了一張紙。門關上，鎖從裡面轉了兩圈。
          - think: 換成是我，我也會鎖門。
          - set: ev_tingan_partial
      - goto: f_hub

  # ─────────────────────────── 予安 ───────────────────────────
  - id: f_yuan
    place: 周家鐘錶店
    ambience: [clock_shop]
    cast: { yuan: front }
    beats:
      - set: v_yuan
      - { sfx: shop_bell, at: back, dist: near, text: 叮鈴 }
      - narr: 滿屋子的錶各走各的，沒有兩只對得上。
      - { sfx: tools_clink, at: front, dist: near, text: 叮 }
      - yuan: 後面有椅子。
      - if: "know.k_six_letters"
        then:
          - narr: 我坐下。扶手上有一道裂縫，剛好卡得進指甲。
          - think: 有一次，他就坐在我對面，把那六封信念給我聽。
          - think: 念到第六封，他停了好久。整間店只剩錶在走。
      - if: "flag.slot5"
        then:
          - yuan: 我還以為妳不會來了。
      - yuan: 妳說要問我一件事。
      - choice:
          options:
            - text: 「我先跟你說，我知道什麼，不知道什麼。」
              then:
                - set: f_y_resp
            - text: （坐下，等他把手上那只錶放下）
              then:
                - set: f_y_resp
                - { sfx: tools_clink, at: front, dist: near, text: 叩 }
                - narr: 他把錶放下了。滿屋子的滴答裡，空出一小塊安靜。
            - text: 「你爸那箱工具，今年春天被借走了，對不對？」
              if: "know.k_tower_kit"
              then:
                - set: f_y_resp
                - pause: 1.5
                - yuan: ……妳怎麼知道？
                - me: 你跟我講過。你不記得而已。
            - text: 「五年前，你有來車站。」
              if: "know.k_yuan_went_station"
              then:
                - set: f_y_resp
                - pause: 2.5
                - yuan: ……那班車開得很準時。
                - me: 我不是要問那個。只是想讓你知道，我知道。
            - text: 「今晚會有人死。只有你幫得上忙。」
              then:
                - set: f_y_push
                - pause: 1
                - yuan: ……好。
                - think: 他連為什麼都沒問。
            - text: 「知夏打給你那通電話，你沒接。這次也要錯過嗎？」
              if: "know.k_yuan_1758"
              then:
                - set: f_y_push_1758
      - if: "flag.f_y_resp"
        then:
          - me: 舊車站東邊，有一個東西會在十八點三十一分醒過來。
          - me: 它可能跟鐘樓以前的線接在一起。這個我不確定。
          - me: 靠近它的人可能會受傷。你也是，我沒辦法保證。
          - me: 你可以說不。你晚上八點，還有自己的約。
          - pause: 1.5
          - yuan: ……妳怎麼知道我八點有約？
          - me: 跟其他的事一樣。晚上再講給你聽，如果你想聽的話。
          - { sfx: clock_wind, at: front, dist: near, text: 嘰嘰嘰 }
          - narr: 他拿起另一只錶上發條。他想事情的時候，手停不下來。
          - if: "know.k_yuan_1758"
            then:
              - think: 十七點五十八分對他是什麼，我知道。
              - think: 那一分鐘是他的。我不會拿來用。
          - yuan: 我爸以前在保養鐘樓那口鐘。一個月爬上去一次。
          - yuan: 鐘樓的舊線，以前跟舊車站的廣播是接在一起的。颱風天要一起響。
          - { yuan: 那些接頭，我閉著眼睛都摸得出來。, mem: m_f_connector }
          - if: "!know.k_tower_kit"
            then:
              - yuan: 他那箱工具，今年春天被借走了。說要找舊線路的接頭。
          - pause: 2
          - yuan: 我去。
          - yuan: 我想知道，我爸的東西被拿去接了什麼。
          - yuan: 八點的約我也會去。那個我自己處理。
          - think: 「我想知道。」他很少這樣講話。
          - set: ev_yuan
        else:
          - if: "flag.f_y_push_1758"
            then:
              - pause: 3
              - narr: 他手上的起子一直沒有放下來。滴答聲一只疊著一只，越疊越密。
              - yuan: ……妳怎麼會知道。
              - yuan: 請妳先回去。
              - { sfx: tools_clink, at: front, dist: near, text: 叮 }
              - narr: 他轉回工作檯，背對著我，沒有再轉過來。
              - think: 我拿他最痛的那一分鐘去撬他。
            else:
              - yuan: 妳要什麼？我寫給妳。
              - { sfx: pen_scratch, at: front, dist: near, text: 沙沙沙 }
              - yuan: 舊線的接頭。三個銅片，中間那片比較長。
              - narr: 他把紙塞進我手裡，就回去修錶了。
              - think: 他會幫忙，他一直都會。可是他自己想要什麼，他一個字都沒講。
              - think: 我要的不是這種「好」。
              - set: ev_yuan_partial
      - if: "know.k_yuan_sent_letter && !flag.f_y_push_1758"
        then:
          - narr: 我站起來，手杖碰到門邊那個裝零件的鐵盒，叮了一聲。
          - choice:
              options:
                - text: 「謝謝你五年前沒有把它丟掉。」
                  then:
                    - set: f_y_thanks
                    - { sfx: tools_clink, at: front, dist: near, text: 叮、叮 }
                    - narr: 起子掉在工作檯上，滾了半圈。
                    - yuan: ……丟掉什麼？
                    - me: 我知道你聽不懂。我只是想跟你講一次。
                    - pause: 2
