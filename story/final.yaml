          - me: 十八點三十一分它會醒過來，那附近的人會有危險。
          - me: 它在哪裡、長什麼樣子，我不知道。沒有人跟我講過。
          - me: 妳的照片，可能是唯一的地圖。
          - me: 上一次待在大廳裡的人，沒有走出來。
          - me: 要不要給我，要不要去，妳自己決定。
          - { sfx: strap_click, at: front, dist: near, text: 喀、喀 }
          - think: 背帶的扣。她在找理由的時候，手就會去弄它。
          - think: 這次我不幫她找。
          - pause: 2
          - ruoqing: 妳一直講「妳自己決定」耶。
          - ruoqing: 以前只有知夏姊會這樣跟我講話。
          - ruoqing: 好啦。我拿給妳……啊不是，我講給妳聽。
          - { sfx: page_turn, at: front, dist: near, text: 沙啦 }
          - ruoqing: 這兩張是《退潮以後》沒放進去的。
          - ruoqing: 去年冬天拍的。東牆的磁磚掉了一半，水漬看起來像一張地圖。
          - ruoqing: 今年四月，同一面牆。從正門進去，右手邊第二根柱子後面。
          - { ruoqing: 多了一個灰色的鐵櫃，比人高一點。, mem: m_f_cabinet }
          - ruoqing: 側面貼黃色貼紙，寫「備援」。黑色的新線一路鑽到地下去。
          - ruoqing: 傍晚我會去。可是我站門口就好。
          - ruoqing: 這個位置是我自己挑的喔。
