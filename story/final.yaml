        else:
          - narr: 周警官沒有來。
      - me: 我把今天知道的，全部講一次。
      - narr: 我從第一個十月三日講起。若晴倒在大廳，陳醫生倒在通道裡。
      - narr: 還有那個誰都沒死、午夜照樣重來的晚上。
      - narr: 我也講我不知道的：午夜的鐘是誰在敲，這一次做了到底有沒有用。
      - if: "know.k_yuan_sent_letter"
        then:
