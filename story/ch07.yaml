# 第七章｜林知夏
# 盲眼主角版。格式見 docs/design.md §11；故事見 docs/story.md §2、§5。
# 這一輪她不安排任何人。早上不打電話；傍晚把知道的、不知道的、風險，一個一個說給會承受的人，讓他們自己選。
# 信是誰寄的，她已經知道（第六章，k_yuan_sent_letter）。這一輪的予安不知道她知道。
# 17:58 鐘錶店：她請予安念行李箱裡那六封沒拆的信（k_six_letters）。
chapter: 7
title: 林知夏
start: c7_train
# 過章：聽完知夏留下的東西（錄音、最後一句、六封信），而且傍晚四個人，一個都沒有被她安排。
# 只要有一句話是在替別人決定（c7_placed），十八點三十一分就會有人因此受傷，這一天重來。
advance:
  - if: know.k_six_letters && know.k_zhixia_voice && know.k_dont_become_me && !flag.c7_placed
    to: final

scenes:
  # ─────────────────────────── 06:12 列車 ───────────────────────────
  - id: c7_train
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 六點十二分。
      - narr: 車廂在晃。我的手放在膝蓋上，沒有伸進口袋。
      - if: chloop >= 2
        then:
          - if: know.c7_lead_zhiyuan
            then:
              - think: 我叫周警官去。他就走進大廳裡面，站在玻璃底下。
          - if: know.c7_lead_boxun
            then:
              - think: 我叫陳醫生不准交出去。他為了不被人看見，走了那條通道。
          - if: know.c7_lead_ruoqing
            then:
              - think: 我叫若晴不要去。她偏要去，還走進了大廳。
          - if: know.c7_lead_tingan
            then:
              - think: 我叫庭安留下來。她留了，訊息裡寫：我照妳說的看著。
          - think: 我說的是我知道的事，可是我說話的方式，替他們做了決定。今天再說一次。
        else:
          - think: 昨天這個時候，我已經在腦子裡打完三通電話了。今天一通也不打。
      - pause: 2
      - { sfx: cough, at: back-left, dist: mid, text: 咳 }
      - narr: 後面有人咳嗽。斜後方有人在剝橘子，皮一撕開，味道就散到整節車廂。
      - think: 他們都在自己的位置上，不是我放的。
      - pause: 1.5
      - { sfx: thud, at: front-left, dist: near, gain: 0.18, text: 叩 }
      - narr: 頭上的行李架，我的行李箱跟著車廂輕輕撞。最底層那六封信，橡皮筋還綁著。
      - think: 五年了，我一封都沒有讓人念過。
      - think: 今天想去聽她最後寫了什麼。寫在紙上的，跟寄給我的。
      - { think: 我怕的是，我已經知道了。, mem: m_c7_afraid }
      - heart: slow
      - narr: 膝蓋上的手指沿著褲子的縫線來回刮，刮到布都熱了。
      - { wait: 12, clock: "06:12" }
      - { sfx: station_chime, at: front, dist: far, text: 叮——咚—— }
      - { announcer: 下一站，灰潮鎮。, as: 廣播 }
      - { sfx: train_brake, at: front, dist: mid, text: 嘰—— }
    next: c7_arrival

  # ─────────────────────────── 07:40 月台 ───────────────────────────
  - id: c7_arrival
    time: "07:40"
    place: 灰潮鎮站
    ambience: [platform]
    cast: { yuan: front-right, tingan: right }
    beats:
      - { sfx: train_door, at: left, dist: near, text: 噗嘶 }
      - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
      - yuan: 比我想的早。
      - narr: 我讓它照原樣過去。機油、黃銅，左手肘在我右手邊。
      - think: 前天傍晚，他把那封信丟進郵局門口的郵筒。今天七點多，他還是到了。
      - think: 這一個他，不知道我知道。
      - yuan: 今天要先去哪裡？我可以帶妳——
      - me: 你今天本來要做什麼？
      - narr: 他把我的行李箱換到另一隻手。輪子在月台磁磚的縫上喀了一下。
      - yuan: ……開店啊。下午有客人要來拿錶。
      - me: 那就去開店。傍晚我去店裡找你。
      - yuan: 好。
      - think: 這一次，我沒有說六點到七點不要出門。
      - { sfx: cloth_rustle, at: front-right, dist: near, text: 沙 }
      - narr: 我蹲下去拉開行李箱，把最底層那疊信換到側背包裡。他沒有問。
      - { sfx: step, at: right, dist: far, text: 叩……叩…… }
      - phone: 撥號中。葉庭安。
      - heart: slow
      - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
      - narr: 嘟聲響到第四下，我才發現自己的腳尖一直在月台的導盲磚上，順著凸點來回蹭。
      - tingan: 喂？哪位？
      - me: 林知夏的妹妹。
      - pause: 2.5
      - tingan: ……我不認識她。
      - me: 妳答應過她。如果我回來，不讓我知道她做過什麼。
      - pause: 2.5
      - tingan: 誰跟妳說的？
      - me: 妳。在一個妳不會記得的今天。
      - pause: 1.5
      - me: 我知道妳答應過她。可是那是我的事，妳能不能也聽我說一次？
      - pause: 2.5
      - if: know.k_zhixia_voice && know.k_dont_become_me && know.k_not_best_day
        then:
          - me: 下午四點半，我上去找妳。早上那些筆記、那卷錄音，我已經聽過了。
          - pause: 2
          - tingan: ……妳到底是誰？
          - me: 四點半。妳會在門口。
          - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
          - think: 筆記、那一頁、那卷帶子，她最後一句話。我都帶著。今天只剩傍晚那幾句要重講。
          - goto: c7_letter
      - tingan: ……研究所。八點半。
      - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
      - heart: off
      - narr: 我把手機放回口袋，腳尖從導盲磚上收回來。
    next: c7_notes

  # ─────────────────────────── 08:30 最後一批筆記 ───────────────────────────
  - id: c7_notes
    time: "08:30"
    place: 舊研究所，資料室
    ambience: [research_facility]
    cast: { tingan: front-right, man: back-left }
    threads:
      workers:
        beats:
          - { man: 東牆那個櫃子，說傍晚會自己測一次。, at: back-left, as: 窗外的工人 }
          - { man: 自己？誰按的？, at: back-left, as: 另一個工人 }
          - { man: 沒人按啦。時間到，它自己跑。, at: back-left, as: 窗外的工人 }
    beats:
      - { sfx: door_creak, at: back, dist: near, text: 嘎——吱 }
      - narr: 門後很冷。左邊一排機器低低地轉。
      - { sfx: cloth_rustle, at: front-right, dist: near, text: 沙沙 }
      - tingan: 妳一個人上來的喔。
      - me: 嗯。
      - { cue: workers, at: back-left, text: 鏗、鏗, sfx: hammer }
      - tingan: 如果妳聽完，會恨她呢？
      - choice:
          timeout: 15
          default: 2
          options:
            - text: 「那也是我自己的事。」
              then:
                - pause: 2
                - tingan: ……好。
            - text: 「我已經恨過她五年了。」
              then:
                - tingan: 那妳可能會換一種方式恨她。
            - text: （不回答，等她）
              then:
                - pause: 3
                - { sfx: sigh, at: front-right, dist: near }
                - narr: 她吐了一口氣，雨衣的領子跟著沙了一聲。
            - recall:
                accept:
                  - mem: m_c4_hate_her
                    then:
                      - me: 我以前是這樣想的。
                      - me: 「只要我恨她，我就會活著。」
                      - me: 她就是這樣算的。我恨她，就會走。走了，就不會在這裡。
                      - pause: 2.5
                      - { sfx: cloth_rustle, at: front-right, dist: near, text: 沙 }
                      - tingan: ……妳講話的順序，跟她一模一樣。
                      - tingan: 先講結果，再把自己也算進去。
                      - set: c7_t_recall
                  - mem: m_c4_saw_you_die
                    then:
                      - me: 「她看過妳死。」
                      - me: 這一句，妳本來不打算跟我講吧。
                      - pause: 3
                      - narr: 她手上的紙停了。連翻頁的聲音都沒有。
                      - tingan: ……我答應過她，絕對不講。這一句，我連自己都沒念出來過。
                      - tingan: 妳到底聽過多少？
                      - me: 不夠多，所以才上來。
                      - me: 我不會恨她。我只是想知道，她一個人算了多久。
                      - set: c7_t_recall
                miss:
                  - think: 不是這句。這句回答不了她。
      - if: flag.c7_t_recall
        then:
          - pause: 2
          - tingan: 妳去念書以後，她每天晚上都會查一個網站。妳那個城市的天氣。
          - tingan: 那邊下雨的話，她會小聲講一句：「她又沒帶傘。」
          - tingan: 我問她怎麼知道。她說，妳從小就不帶。
          - pause: 1.5
          - me: ……我現在也不帶。手只有兩隻。
          - { sfx: laugh_soft, at: front-right, dist: near, text: 哼 }
          - narr: 她鼻子哼了一下，雨衣的領子跟著抖。是在笑。
      - { sfx: box_open, at: front, dist: near, text: 喀 }
      - tingan: 她最後一批筆記。我一直沒有公開。
      - tingan: 拿出去，看起來會像一份名單。誰可以死。
      - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
      - tingan: 這些是五年前的紀錄。她改過的日子不只一天，編號也不是重過同一天的次數。
      - tingan: 第十四。
      - tingan: 若晴，存活。陳柏勳，死亡。
      - pause: 2
      - tingan: 第十九。
      - tingan: 柏勳，存活。周志遠，重傷。
      - pause: 2
      - tingan: 第二十三。
      - heart: slow
      - pause: 2
      - { tingan: 妳。仍在灰潮鎮。十八點三十一分以後，失聯。, learn: k_variants, mem: m_c7_variants }
      - narr: 我把手從那疊紙上收回來，夾進大腿中間，手還是冰的。
      - daze: light
      - narr: 左邊那排機器的低鳴變得很悶，好像有人用手掌把我的耳朵摀起來。
      - pause: 3
      - daze: off
      - { sfx: hammer, at: back-left, dist: far, text: 鏗 }
      - narr: 窗外的工人又敲了一下。機器的聲音跟著回到左手邊，跟原來一樣近。
      - think: 十四，十九，二十三。中間那些數字呢？
      - me: 一共有幾個？
      - tingan: 我數過。後來就不數了。
      - pause: 1.5
      - narr: 她把一疊紙推到我手邊。前面幾頁的凹痕很深，一筆一筆，像怕寫錯。
      - tingan: 這是早期的。
      - tingan: 「若晴今天本來要去上課。」
      - tingan: 「她不應該因為我們的系統，失去這件事。」
      - pause: 1.5
      - tingan: 「予安十七點四十可能在店裡。先問他。」
      - tingan: 「不要直接改他的行程。」
      - think: 先問他。
      - { sfx: page_turn, at: front, dist: near, text: 沙啦 }
      - narr: 我往後翻。凹痕越來越淺，一筆和下一筆幾乎黏在一起。
      - tingan: 字越寫越小了。每個名字後面，都列著時間跟路線。
      - tingan: 後面……她開始用英文寫名字。
      - pause: 1.5
      - tingan: Ruoqing。十七點四十到十八點十分。Unavailable。
      - narr: 她念英文的時候，聲音是乾的。
      - tingan: Yuan。Route B，preferred。
      - tingan: Bo-xun。Deviation，加十二分鐘。
      - pause: 3
      - think: 一開始是記得一個人會怎麼選，後來是猜他會怎麼選。
      - think: 最後，他的選擇變成一格可以調的數字。
      - pause: 2
      - think: 三通電話，十一分鐘。
      - { think: 我昨天做的，跟這一頁有什麼不一樣？, mem: m_c7_same_page }
      - narr: 胃裡有東西往上頂。我把嘴閉緊，等它自己退下去。
    next: c7_page

  # ─────────────────────────── 09:20 那一頁 ───────────────────────────
  - id: c7_page
    time: "09:20"
    place: 舊研究所，資料室
    ambience: [research_facility]
    cast: { tingan: front-right }
    beats:
      - { sfx: page_turn, at: front, dist: near, text: 沙 }
      - narr: 最後面夾著一張單獨的紙，摺過兩次。
      - { sfx: breath, at: front-right, dist: near }
      - narr: 我把它打開的時候，庭安吸了一口氣，就憋在那裡。
      - heart: slow
      - narr: 摺痕被我壓平，一放手又翹起來。我只好用兩根手指按住紙的兩個角。
      - tingan: 那張……妳確定喔？
      - choice:
          options:
            - text: （用手指讀）
              then:
                - narr: 字不多，凹痕很深。這一頁她寫得很用力。
                - narr: 第一個字我認得，是我的姓。後面兩個字是我的名字。
                - think: 小時候她幫我填聯絡簿封面，寫過很多次。我的姓名那一欄，她總比我自己寫得整齊。
                - narr: 下一行是數字。一、八，冒號，三、一。
                - narr: 最後兩個字筆畫很多。我的指腹在上面來回走了好幾趟。
                - { think: 死亡。, learn: k_my_death_page, mem: m_c7_my_death }
            - text: （讓手機念）
              then:
                - phone: 偵測到手寫文字。
                - narr: 讀屏先念出我的名字，咬字很清楚，像在點名。
                - phone: 十八點三十一分。
                - { phone: 死亡。, learn: k_my_death_page, mem: m_c7_my_death }
            - text: 「妳念給我聽。」
              then:
                - pause: 2
                - tingan: 妳的名字。
                - tingan: 十八點三十一分。
                - { tingan: 死亡。, learn: k_my_death_page, mem: m_c7_my_death }
      - pause: 3.5
      - heart: pound
      - { sfx: chair_scrape, at: center, dist: near, text: 嘎—— }
      - { sfx: thud, at: back, dist: near, text: 匡啷, shake: hard }
      - narr: 我整個人往後退，鐵椅被我撞翻，砸在水泥地上。
      - daze: heavy
      - { sfx: tinnitus, at: center }
      - narr: 鐵椅倒地的回音還沒停，就被一條很高很細的聲音蓋過去，從左耳穿到右耳。
      - narr: 那張紙還捏在我手裡，捏到指尖發麻。
      - daze: light
      - think: 我死過，在一個沒有人記得的今天。
      - think: 只有她記得。
      - pause: 2.5
      - if: know.k_zhixia_saw_my_death
        then:
          - think: 庭安說過她看過我死。那時候是聽懂了，現在是摸到了。
      - daze: off
      - { sfx: chair_scrape, at: back, dist: near, text: 嘎 }
      - narr: 椅腳刮過水泥地，那一聲突然就在我腿後面。機器的低鳴也回來了，一樣冷。
      - narr: 庭安把椅子扶起來，推到我腿後面。我坐下去，大口吸了一次氣。
      - heart: fast
      - tingan: 她沒有寫怎麼死的。我問過，她不說。
      - narr: 紙的右下角皺皺的，像濕過，又乾了。
    next: c7_quarrel

  # ─────────────────────────── 10:40 那一架 ───────────────────────────
  - id: c7_quarrel
    time: "10:40"
    place: 舊研究所外，長椅
    ambience: [wind_open, sea_far]
    cast: { tingan: right }
    beats:
      - { sfx: wind_gust, at: front, dist: mid, text: 颯—— }
      - narr: 我說要出去吹風。她跟出來，坐在長椅另一頭，雨衣被風吹得貼在椅背上。
      - narr: 那一天我一直記得，那時候我還看得見。她背著光站在門口，手上拿著我的鑰匙。
      - think: 「走了，就不要再回來。」
      - think: 她一直是最支持我走的人。幫我查學校，幫我改自傳，改到半夜。
      - think: 所以那一句，我以為是她的真心話。
      - pause: 2
      - me: 她是故意的。
      - tingan: 她知道妳會怎麼回。她太了解妳了。
      - tingan: 她知道說哪一句，妳就一定會走。
      - pause: 2
      - { tingan: 她是想救妳。, mem: m_c7_save_you }
      - pause: 1.5
      - { tingan: 這不代表她有權用任何方法，決定妳的人生。, mem: m_c7_no_right }
      - pause: 3
      - choice:
          timeout: 15
          options:
            - text: 「可是她救了我。」
              then:
                - tingan: 也許吧。
                - tingan: 也許妳本來可以自己選一條，不用恨她的路。
            - text: 「那天，我也說了很難聽的話。」
              then:
                - pause: 2
                - tingan: 她跟我說過。
                - tingan: 她說，妳終於學會頂嘴了。
                - { sfx: laugh_soft, at: right, dist: near, text: 呵 }
                - narr: 庭安笑了一聲，很短，像是不小心漏出來的。
            - text: （不說話）
              then:
                - { sfx: cloth_rustle, at: right, dist: near, text: 沙沙 }
                - narr: 風把她的雨衣吹得沙沙響。她也沒有再開口。
      - think: 她用她對我的了解，把我推走。我用我對每個人的了解，把他們推到安全的地方。
      - pause: 2
      - think: 推的方向不一樣，手是同一隻。
    next: c7_tape

  # ─────────────────────────── 13:40 錄音 ───────────────────────────
  - id: c7_tape
    time: "13:40"
    place: 舊研究所，資料室
    ambience: [research_facility]
    cast: { tingan: right, zhixia: "front:near" }
    beats:
      - tingan: 還有一樣東西。我只聽過一次。
      - { sfx: box_open, at: front, dist: near, text: 喀 }
      - narr: 一台很小的錄音機放在我面前的桌上。塑膠殼，按鍵很硬。
      - tingan: 五年前的研究會議。那天最後只剩我們兩個。
      - tingan: 我按了錄音，就忘了關。機器留在桌上，隔天才回來拿。
      - pause: 2
      - tingan: 裡面有她的聲音。
      - heart: slow
      - pause: 3
      - think: 五年了。我記得她的臉，以為那樣就夠了。
      - think: 記憶裡她說過的話，其實都是我自己替她說的。
      - choice:
          options:
            - text: （按下去）
              then:
                - narr: 我的手指找到最右邊那個鍵。
            - text: 「等一下。」
              then:
                - pause: 5
                - narr: 我把手放回膝蓋上。手在抖。
                - narr: 庭安沒有催我。
                - pause: 3
                - think: ……好。
      - { sfx: recorder_click, at: front, dist: near, text: 喀嚓 }
      - { sfx: tape_hiss, at: front, dist: near, text: 沙———— }
      - { wait: 6 }
      - narr: 機器的低鳴，跟現在這個房間裡的是同一種。
      - { sfx: pen_scratch, at: front, dist: near, text: 沙沙 }
      - narr: 有人在紙上寫字，寫得很用力。
      - { wait: 5 }
      - { tingan: 妳現在不是只在提醒他們。, as: 錄音裡的庭安, at: front, dist: near }
      - pause: 3
      - { sfx: breath, at: front, dist: near }
      - narr: 有人吸了一口氣。
      - pause: 2
      - zhixia: 如果我把全部告訴他們，結果只會更亂。
      - { wait: 8 }
      - heart: fast
      - daze: light
      - narr: 我沒有聽見下一句。我只聽見她。
      - pause: 3
      - think: 姊。
      - narr: 我用手背壓住嘴，壓到嘴唇抵著牙齒，才沒有出聲。
      - pause: 3.5
      - think: 她的聲音比我記得的低，也比我記得的累。
      - think: 「亂」的尾音往上收了一下。小時候罵我房間亂，也是這樣收的。
      - daze: off
      - narr: 帶子的沙沙聲重新浮上來，我把手背從嘴上拿開，嘴唇被壓得發麻。
      - { wait: 6 }
      - { tingan: 所以妳就替他們決定？, as: 錄音裡的庭安, at: front, dist: near }
      - pause: 2.5
      - { zhixia: 我看過結果。, learn: k_zhixia_voice, mem: m_c7_seen_results }
      - pause: 4
      - { tingan: 看過結果，不代表那個選擇就是妳的。, as: 錄音裡的庭安, at: front, dist: near }
      - pause: 2.5
      - { sfx: chair_scrape, at: front, dist: mid, text: 嘎—— }
      - { sfx: door_close, at: front, dist: far, text: 碰 }
      - narr: 錄音裡，門關上了。
      - { sfx: breath, at: right, dist: near }
      - narr: 我右邊的庭安，很輕地吸了一口氣。
      - { wait: 10 }
      - narr: 帶子還在轉。錄音裡的房間只剩她一個人，機器在響，她的筆停了。
      - { sfx: breath, at: front, dist: near }
      - pause: 4
      - { zhixia: ……再一次。, mem: m_c7_once_more }
      - pause: 3
      - { sfx: recorder_click, at: front, dist: near, text: 喀 }
      - { wait: 8 }
      - narr: 帶子到底了。
      - heart: slow
      - pause: 3
      - tingan: ……我那天走了。
      - tingan: 我不知道她後來一個人在裡面坐了多久。
      - choice:
          options:
            - text: （再聽一次）
              then:
                - { sfx: tape_rewind, at: front, dist: near, text: 嘰嘰嘰嘰—— }
                - { sfx: recorder_click, at: front, dist: near, text: 喀嚓 }
                - narr: 這一次我不聽那些話，我聽她呼吸。
                - { sfx: breath, at: front, dist: near }
                - pause: 3
                - zhixia: 我看過結果。
                - pause: 3
                - think: 這個聲音叫過我的名字幾千次。這一卷帶子裡，她一次也沒有叫。
                - { sfx: recorder_click, at: front, dist: near, text: 喀 }
            - text: （讓它停在這裡）
              then:
                - narr: 我把手放在機器上。塑膠殼是溫的。
                - think: 再聽一次，我會想一直聽下去。
            - text: 「她說『再一次』。」
              then:
                - pause: 2
                - tingan: 嗯。她每次都這樣說。
                - tingan: 我以前以為那只是她的口頭禪。
      - me: 謝謝妳留著它。
      - tingan: 我留著，是因為我不敢丟。
    next: c7_late

  # ─────────────────────────── 15:00 後期筆記 ───────────────────────────
  - id: c7_late
