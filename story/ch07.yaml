      - phone: 偵測到手寫文字。
      - phone: 再試一次。
      - { sfx: page_turn, at: front, dist: near, text: 沙 }
      - phone: 如果先讓 A 離開？
      - { sfx: page_turn, at: front, dist: near, text: 沙 }
      - phone: 為什麼每次，只是換一個地方出問題？
      - pause: 2
      - phone: 我是不是一直在問錯問題？
      - pause: 3
      - think: 剛剛那個聲音說「我看過結果」。現在這個聲音一個字一樣重，念著她的字。
      - { sfx: page_turn, at: front, dist: near, text: 沙啦 }
