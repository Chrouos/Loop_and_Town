# 第七章｜林知夏
# 盲眼主角版。格式見 docs/listening-town-design.md §11；故事見 docs/listening-town-story.md §5。
# 這一輪她不安排任何人。早上不打電話；傍晚把知道的、不知道的、風險，一個一個說給會承受的人，讓他們自己選。
chapter: 7
title: 林知夏
start: c7_train
advance:
  - if: "true"
    to: final

scenes:
  # ─────────────────────────── 06:12 列車 ───────────────────────────
  - id: c7_train
    time: "06:12"
    place: 返鄉列車
    ambience: [train_interior]
    cast: { announcer: front }
    beats:
      - { sfx: phone_buzz, at: right, dist: near, text: 嗡, vib: buzz }
      - phone: 六點十二分。
      - narr: 車廂在晃。我的手放在膝蓋上，沒有伸進口袋。
      - think: 昨天的這個時候，我已經在腦子裡打完三通電話了。
      - think: 今天，一通也不打。
      - pause: 2
      - { sfx: cough, at: back-left, dist: mid, text: 咳 }
      - narr: 後面有人咳嗽。斜後方有人在剝橘子。
      - think: 他們都在自己的位置上。不是我放的。
      - pause: 1.5
      - think: 今天我只做一件事。去聽她最後寫了什麼。
      - { think: 我怕的是，我已經知道了。, mem: m_c7_afraid }
      - { wait: 12, clock: "06:12" }
      - { sfx: station_chime, at: front, dist: far, text: 叮——咚—— }
      - { announcer: 下一站，灰潮鎮。, as: 廣播 }
      - { sfx: train_brake, at: front, dist: mid, text: 嘰—— }
    next: c7_arrival

  # ─────────────────────────── 07:40 月台 ───────────────────────────
  - id: c7_arrival
    time: "07:40"
    place: 灰潮鎮站
    ambience: [platform]
    cast: { yuan: front-right, tingan: right }
    beats:
      - { sfx: train_door, at: left, dist: near, text: 噗嘶 }
      - { sfx: step, at: front-right, dist: mid, text: 叩、叩 }
      - yuan: 比我想的早。
      - narr: 我讓它照原樣過去。機油，黃銅，左手肘。
      - yuan: 今天要先去哪裡？我可以帶妳——
      - me: 你今天，本來要做什麼？
      - pause: 1.5
      - yuan: ……開店。下午有客人要來拿錶。
      - me: 那就去開店。傍晚，我去店裡找你。
      - yuan: 好。
      - think: 這一次，我沒有說「六點到七點不要出門」。
      - { sfx: step, at: right, dist: far, text: 叩……叩…… }
      - phone: 撥號中。葉庭安。
      - { sfx: phone_ring, at: right, dist: near, text: 嘟——嘟—— }
      - tingan: 喂？哪位？
      - me: 林知夏的妹妹。
      - pause: 2.5
      - tingan: ……我不認識她。
      - me: 妳答應過她。如果我回來，不讓我知道她做過什麼。
      - pause: 3
      - tingan: 誰告訴妳的。
      - me: 妳。在一個妳不會記得的今天。
      - pause: 1.5
      - me: 我不是要妳食言。我想自己決定，要不要知道。
      - pause: 3
      - tingan: ……研究所。八點半。
      - { sfx: phone_hangup, at: right, dist: near, text: 嘟 }
    next: c7_notes

  # ─────────────────────────── 08:30 最後一批筆記 ───────────────────────────
  - id: c7_notes
    time: "08:30"
    place: 舊研究所，資料室
    ambience: [research_facility]
    cast: { tingan: front-right, man: back-left }
    threads:
      workers:
        beats:
          - { man: 東牆那個櫃子，說傍晚會自己測一次。, at: back-left, as: 窗外的工人 }
          - { man: 自己？誰按的？, at: back-left, as: 另一個工人 }
          - { man: 沒人按。時間到，它自己跑。, at: back-left, as: 窗外的工人 }
    beats:
      - { sfx: door_creak, at: back, dist: near, text: 嘎——吱 }
      - narr: 門後很冷。一排機器在左邊低低地轉。
      - { sfx: cloth_rustle, at: front-right, dist: near, text: 沙沙 }
      - tingan: 妳一個人上來的。
      - me: 嗯。
      - { cue: workers, at: back-left, text: 鏗、鏗, sfx: hammer }
      - tingan: 如果妳聽完，會恨她呢？
      - choice:
          timeout: 15
          options:
            - text: 「那也是我自己的事。」
              then:
                - pause: 2
                - tingan: ……好。
            - text: 「我已經恨過她五年了。」
              then:
                - tingan: 那妳可能會換一種方式恨她。
            - text: （不回答，等她）
              then:
                - pause: 4
                - narr: 她嘆了一口氣。很長。
      - { sfx: box_open, at: front, dist: near, text: 喀 }
      - tingan: 她最後一批筆記。我一直沒有公開。
      - tingan: 拿出去，看起來會像一份名單。誰可以死。
      - { sfx: paper_rustle, at: front, dist: near, text: 沙沙 }
      - tingan: 第十四。
      - tingan: 若晴，存活。陳柏勳，死亡。
      - pause: 2
      - tingan: 第十九。
      - tingan: 柏勳，存活。周志遠，重傷。
      - pause: 2
      - tingan: 第二十三。
      - pause: 2.5
      - { tingan: 妳。仍在灰潮鎮。十八點三十一分以後，失聯。, learn: k_variants, mem: m_c7_variants }
      - pause: 3
      - think: 十四。十九。二十三。
      - think: 中間那些數字呢？
      - me: 一共有幾個？
      - tingan: 我數過。後來就不數了。
      - pause: 2
      - narr: 她把一疊紙推到我手邊。
      - narr: 前面幾頁，凹痕很深。一筆一筆，像怕寫錯。
      - tingan: 這是早期的。
      - tingan: 「若晴今天本來要去上課。」
      - tingan: 「她不應該因為我們的系統，失去這件事。」
      - pause: 1.5
      - tingan: 「予安十七點四十可能在店裡。先問他。」
      - tingan: 「不要直接改他的行程。」
      - think: 先問他。
      - { sfx: page_turn, at: front, dist: near, text: 沙啦 }
      - narr: 我往後翻。凹痕變淺了。字變小，變快。像在填一張表。
      - tingan: 後面……她開始用英文寫名字。
      - pause: 1.5
      - tingan: Ruoqing。十七點四十到十八點十分。Unavailable。
      - narr: 她念英文的時候，聲音是乾的。
      - tingan: Yuan。Route B，preferred。
      - tingan: Bo-xun。Deviation，加十二分鐘。
      - pause: 3
      - think: 認識一個人。記得他的選擇。
      - think: 預測他的選擇。
      - think: 然後，把他的選擇，當成一個可以調的數字。
      - pause: 2
      - think: 三通電話。十一分鐘。
      - { think: 我昨天做的，跟這一頁有什麼不一樣？, mem: m_c7_same_page }
    next: c7_page

  # ─────────────────────────── 09:20 那一頁 ───────────────────────────
  - id: c7_page
    time: "09:20"
    place: 舊研究所，資料室
    ambience: [research_facility]
    cast: { tingan: front-right }
    beats:
      - { sfx: page_turn, at: front, dist: near, text: 沙 }
      - narr: 最後面，夾著一張單獨的紙。摺過兩次。
      - { sfx: breath, at: front-right, dist: near }
      - narr: 我打開它的時候，庭安的呼吸停了一下。
      - tingan: 那張……妳確定？
      - choice:
          options:
            - text: （用手指讀）
              then:
                - narr: 字不多。凹痕很深。這一頁，她寫得很用力。
                - narr: 第一個字，我認得。我的姓。
                - narr: 後面兩個字，是我的名字。
                - think: 她很少寫我的全名。小時候，在聯絡簿上幫我簽過。
                - narr: 下一行是數字。一、八。冒號。三、一。
                - narr: 最後兩個字，筆畫很多。我摸了很久。
                - { think: 死亡。, learn: k_my_death_page, mem: m_c7_my_death }
            - text: （讓手機念）
              then:
                - phone: 偵測到手寫文字。
                - narr: 讀屏先念出我的名字。很清楚，像在點名。
                - phone: 十八點三十一分。
                - { phone: 死亡。, learn: k_my_death_page, mem: m_c7_my_death }
            - text: 「妳念給我聽。」
              then:
                - pause: 2
                - tingan: 妳的名字。
                - tingan: 十八點三十一分。
                - { tingan: 死亡。, learn: k_my_death_page, mem: m_c7_my_death }
      - pause: 4
      - { sfx: heartbeat, at: center, dist: near, vib: heartbeat }
      - think: 我死過。
      - think: 在一個沒有人記得的今天。
      - think: 只有她記得。
      - pause: 3
      - if: know.k_zhixia_saw_my_death
        then:
          - think: 庭安說過，她看過我死。那時候我聽懂了。
          - think: 現在，我摸到了。
      - tingan: 她沒有寫怎麼死的。我問過。她不說。
      - narr: 紙的右下角皺皺的。像濕過，又乾了。
    next: c7_quarrel

  # ─────────────────────────── 10:40 那一架 ───────────────────────────
  - id: c7_quarrel
    time: "10:40"
    place: 舊研究所外，長椅
    ambience: [wind_open, sea_far]
    cast: { tingan: right }
    beats:
      - { sfx: wind_gust, at: front, dist: mid, text: 颯—— }
      - narr: 我說要出去吹風。她跟出來，坐在長椅另一頭。
      - narr: 那一天，我一直記得。那時候我還看得見。
      - narr: 她背著光站在門口，手上拿著我的鑰匙。
      - think: 「走了，就不要再回來。」
      - think: 她一直是最支持我走的人。幫我查學校，幫我改自傳。
      - think: 所以那一句，我以為是她的真心話。
      - pause: 2
      - me: 她是故意的。
      - tingan: 她知道妳會怎麼回答。她太了解妳了。
      - tingan: 她知道說哪一句，妳就一定會走。
      - pause: 2
      - { tingan: 她是想救妳。, mem: m_c7_save_you }
      - pause: 1.5
      - { tingan: 這不代表她有權用任何方法，決定妳的人生。, mem: m_c7_no_right }
      - pause: 3
      - choice:
          timeout: 15
          options:
            - text: 「可是她救了我。」
              then:
                - tingan: 也許。
                - tingan: 也許妳本來可以自己選一條，不用恨她的路。
            - text: 「那天，我也說了很難聽的話。」
              then:
                - pause: 2
                - tingan: 她跟我說過。
                - tingan: 她說，妳終於學會頂嘴了。
                - { sfx: laugh_soft, at: right, dist: near, text: 呵 }
                - narr: 庭安笑了一下。很短，像不小心。
            - text: （不說話）
              then:
                - { sfx: cloth_rustle, at: right, dist: near, text: 沙沙 }
                - narr: 風把她的雨衣吹得沙沙響。她也沒有再說話。
      - think: 她用她對我的了解，把我推走。
      - think: 我用我對每個人的了解，把他們推到安全的地方。
      - pause: 2
      - think: 推的方向不一樣。手是同一隻。
    next: c7_tape

  # ─────────────────────────── 13:40 錄音 ───────────────────────────
  - id: c7_tape
    time: "13:40"
    place: 舊研究所，資料室
    ambience: [research_facility]
    cast: { tingan: right, zhixia: "front:near" }
    beats:
      - tingan: 還有一樣東西。我一直沒有聽第二次。
      - { sfx: box_open, at: front, dist: near, text: 喀 }
      - narr: 一台很小的錄音機，放在我面前的桌上。塑膠殼，按鍵很硬。
      - tingan: 五年前的研究會議。那天，只剩我們兩個。
      - tingan: 我按了，就忘了關。
      - pause: 2
      - tingan: 裡面有她的聲音。
      - pause: 3
      - think: 五年。
      - think: 我記得她的臉。我以為那就夠了。
      - think: 記憶裡她說過的話，其實都是我自己替她說的。
      - choice:
          options:
            - text: （按下去）
              then:
                - narr: 我的手指找到最右邊那個鍵。
            - text: 「等一下。」
              then:
                - pause: 5
                - narr: 我把手放回膝蓋上。手在抖。
                - narr: 庭安沒有催我。
                - pause: 3
                - think: ……好。
      - { sfx: recorder_click, at: front, dist: near, text: 喀嚓 }
      - { sfx: tape_hiss, at: front, dist: near, text: 沙———— }
      - { wait: 6 }
      - narr: 機器的低鳴。跟現在這個房間裡的，是同一種。
      - { sfx: pen_scratch, at: front, dist: near, text: 沙沙 }
      - narr: 有人在紙上寫字。很用力。
      - { wait: 5 }
      - { tingan: 妳現在不是只在提醒他們。, as: 錄音裡的庭安, at: front, dist: near }
      - pause: 3
      - { sfx: breath, at: front, dist: near }
      - narr: 有人吸了一口氣。
      - pause: 2
      - zhixia: 如果我把全部告訴他們，結果只會更亂。
      - { wait: 8 }
      - narr: 我沒有聽見下一句。
      - narr: 我只聽見她。
      - pause: 3
      - think: 姊。
      - pause: 3.5
      - think: 她的聲音比我記得的低。比我記得的累。
      - think: 「亂」的尾音，往上收了一下。
      - think: 小時候罵我房間亂，也是這樣。
      - { wait: 6 }
      - { tingan: 所以妳就替他們決定？, as: 錄音裡的庭安, at: front, dist: near }
      - pause: 2.5
      - { zhixia: 我看過結果。, learn: k_zhixia_voice, mem: m_c7_seen_results }
      - pause: 4
      - { tingan: 看過結果，不代表那個選擇就是妳的。, as: 錄音裡的庭安, at: front, dist: near }
      - pause: 2.5
      - { sfx: chair_scrape, at: front, dist: mid, text: 嘎—— }
      - { sfx: door_close, at: front, dist: far, text: 碰 }
      - narr: 錄音裡，門關上了。
      - { sfx: breath, at: right, dist: near }
      - narr: 我右邊的庭安，很輕地吸了一口氣。
      - { wait: 10 }
      - narr: 帶子還在轉。房間裡只剩她一個人。
      - narr: 機器在響。她的筆停了。
      - { sfx: breath, at: front, dist: near }
      - pause: 4
      - { zhixia: ……再一次。, mem: m_c7_once_more }
      - pause: 3
      - { sfx: recorder_click, at: front, dist: near, text: 喀 }
      - { wait: 8 }
      - narr: 帶子到底了。
      - pause: 3
      - tingan: ……我那天走了。
      - tingan: 我不知道她後來一個人，在裡面坐了多久。
      - choice:
          options:
            - text: （再聽一次）
              then:
                - { sfx: tape_rewind, at: front, dist: near, text: 嘰嘰嘰嘰—— }
                - { sfx: recorder_click, at: front, dist: near, text: 喀嚓 }
                - narr: 這一次，我不聽那些話。我聽她呼吸。
                - { sfx: breath, at: front, dist: near }
                - pause: 3
                - zhixia: 我看過結果。
                - pause: 3
                - think: 這個聲音，叫過我的名字幾千次。
                - think: 這一卷帶子裡，她一次也沒有叫。
                - { sfx: recorder_click, at: front, dist: near, text: 喀 }
            - text: （讓它停在這裡）
              then:
                - narr: 我把手放在機器上。塑膠殼是溫的。
                - think: 再聽一次，我會想一直聽下去。
            - text: 「她說『再一次』。」
              then:
                - pause: 2
                - tingan: 嗯。她每次都這樣說。
                - tingan: 我以前以為，那只是她的口頭禪。
      - me: 謝謝妳留著它。
      - tingan: 我留著，是因為我不敢丟。
    next: c7_late

  # ─────────────────────────── 15:00 後期筆記 ───────────────────────────
  - id: c7_late
    time: "15:00"
    place: 舊研究所，資料室
    ambience: [research_facility]
    cast: { tingan: back-right }
    beats:
      - me: 後面的筆記，我想自己讀。
      - tingan: ……好。我在門口。
      - { sfx: step, at: back-right, dist: mid, text: 叩、叩 }
      - narr: 我把手機鏡頭貼近紙面。一頁一頁。
      - phone: 偵測到手寫文字。
      - phone: 再試一次。
      - { sfx: page_turn, at: front, dist: near, text: 沙 }
      - phone: 如果先讓 A 離開？
      - { sfx: page_turn, at: front, dist: near, text: 沙 }
      - phone: 為什麼每次，只是換一個地方出問題？
      - pause: 2
      - phone: 我是不是一直在問錯問題？
      - pause: 3
      - think: 剛剛那個聲音，說「我看過結果」。
      - think: 現在這個聲音，一個字一樣重，念著她的字。
      - { sfx: page_turn, at: front, dist: near, text: 沙啦 }
      - narr: 最後一頁只有一行。凹痕很淺。像寫字的人，已經按不下去了。
      - { phone: 不要再找「最好的一天」。, learn: k_not_best_day, mem: m_c7_not_best_day }
      - pause: 4
      - think: 最好的一天。
      - think: 第三次的時候，我站在舊車站對面，笑了一下。
      - think: 我以為我找到了。
      - if: know.k_note_not_success
        then:
          - think: 不要把「沒有人死」當成成功。她早就寫過了。
          - think: 我讀過。我還是笑了。
    next: c7_promise

  # ─────────────────────────── 15:40 如果她回來 ───────────────────────────
  - id: c7_promise
    time: "15:40"
    place: 舊研究所，門口
    ambience: [wind_open]
    cast: { tingan: right }
    beats:
      - { sfx: cloth_rustle, at: right, dist: near, text: 沙沙 }
      - tingan: 還有一句。不在紙上。
      - tingan: 她走之前四天，來找過我。我們已經很久不說話了。
      - tingan: 她站在門口，沒有進來。她說——
      - pause: 2
      - tingan: 如果她有一天，還是回來。
      - pause: 1.5
      - { tingan: 不要讓她變成我。, learn: k_dont_become_me, mem: m_c7_dont_become_me }
      - pause: 4
      - me: 「如果」。
      - tingan: 嗯。她說的是「如果」。
      - tingan: 她希望妳永遠不要回來。可是她知道，她管不了妳一輩子。
      - think: 不是邀請。
      - think: 是她替自己管不到的那一天，留下的一句話。
      - choice:
          timeout: 15
          options:
            - text: 「我已經開始變成她了。」
              then:
                - tingan: 我知道。
                - me: 妳怎麼知道？
                - tingan: 妳早上打給我。每一句，都知道我會怎麼回。
            - text: 「謝謝妳告訴我。」
              then:
                - tingan: 我本來不打算說的。
                - tingan: 可是妳問了。妳是自己問的。
            - text: （握住口袋裡的信）
              then:
                - { sfx: envelope, at: center, dist: near, text: 沙 }
                - narr: 信封的邊角，在我手心裡壓出一道線。
    next: c7_letter

