      - think: 我以為我找到了。
      - narr: 臉頰一下子熱起來，熱到耳朵後面。我把手機從紙上拿開，扣在大腿上。
      - if: know.k_note_not_success
        then:
          - think: 不要把「沒有人死」當成成功。我是那天晚上才讀到的。要是早幾個鐘頭讀到，我會信嗎？
    next: c7_promise

  # ─────────────────────────── 15:40 如果她回來 ───────────────────────────
  - id: c7_promise
    time: "15:40"
    place: 舊研究所，門口
    ambience: [wind_open]
    cast: { tingan: right }
    beats:
      - { sfx: cloth_rustle, at: right, dist: near, text: 沙沙 }
      - tingan: 還有一句。不在紙上。
      - tingan: 她走之前四天來找過我。我們那時候已經很久不講話了。
      - tingan: 她站在門口，沒有進來。她說——
      - pause: 2
      - tingan: 如果她有一天，還是回來。
      - pause: 1.5
      - { tingan: 不要讓她變成我。, learn: k_dont_become_me, mem: m_c7_dont_become_me }
      - pause: 4
      - me: 「如果」。
      - tingan: 嗯。她說的是「如果」。
      - tingan: 她希望妳永遠不要回來。可是她也知道，她管不了妳一輩子。
      - think: 她替自己管不到的那一天，先留了一句話。
      - choice:
          timeout: 15
          options:
            - text: 「我已經開始變成她了。」
              then:
                - tingan: 我知道。
                - me: 妳怎麼知道？
                - tingan: 妳早上打給我，每一句都知道我會怎麼回。
            - text: 「謝謝妳告訴我。」
              then:
                - tingan: 我本來不打算講的。
                - tingan: 可是妳問了。妳是自己問的。
            - text: （握住口袋裡的信）
              then:
                - { sfx: envelope, at: center, dist: near, text: 沙 }
                - narr: 信封的邊角在我手心壓出一道線。
    next: c7_letter

  # ─────────────────────────── 16:20 不要回來 ───────────────────────────
  - id: c7_letter
    time: "16:20"
    place: 往舊研究所的坡道
    ambience: [wind_open, sea_far]
    beats:
      - { sfx: seagull, at: right, dist: far, text: 嘎——嘎 }
      - narr: 我一個人坐在坡道邊的水泥護欄上。風從海那邊上來，帶著鹽，還有漁船的柴油味。
      - { sfx: envelope, at: center, dist: near, text: 沙 }
      - narr: 信紙攤在膝蓋上，我用指尖讀過去。
      - think: 不要回來。
      - think: 第一次我以為是惡作劇，後來以為是警告。再後來，我以為她在紙的另一邊等我。
      - think: 昨天晚上，予安說是他寄的。字是她寫的，點是他打的。
      - narr: 我把信紙翻到背面，指甲放輕，貼著那些小凹洞之間的縫往下找。有一道很淺的凹痕，往下走，轉了一個彎。
      - if: know.k_erased_line
        then:
          - think: 跟筆記本那一頁是同一個轉彎。連鉛筆，她都壓得出痕跡。
        else:
          - think: 鉛筆也壓得出痕跡。她寫字一直都這麼用力。
      - pause: 2
      - think: 五年前她做了一個選擇，然後一直做同一個。寫下來，擦掉，把我推走，再推一次。
      - { think: 她看過我死，卻從來不知道我現在是這樣活著。, mem: m_c7_alive_now }
      - think: 予安知道。他照著她的字，一格一格打給現在的我。
      - pause: 3
      - think: 剩下兩個小時。
      - { think: 這一次，我不把任何人放到任何地方。, mem: m_c7_no_one_placed }
      - think: 我去告訴他們，讓他們自己選。
    next: c7_tell_tingan

