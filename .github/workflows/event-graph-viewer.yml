name: Event Graph Viewer

on:
  pull_request:
    paths:
      - 'tools/event-graph-viewer/**'
      - 'story/**'
      - 'docs/**'
      - '.github/workflows/event-graph-viewer.yml'
      - '.github/workflows/deploy-event-graph-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-event-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/event-graph-viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/event-graph-viewer/package-lock.json
      # One-time read-only lockfile resolver, removed after recording the generated lock diff.
      - name: Resolve UI dependencies for lockfile
        run: |
          cp package-lock.json /tmp/loop-town-lock-before.json
          npm install motion embla-carousel-react@^8 --package-lock-only --ignore-scripts --no-audit --no-fund
          node - <<'NODE'
          const fs = require('node:fs');
          const old = JSON.parse(fs.readFileSync('/tmp/loop-town-lock-before.json', 'utf8'));
          const next = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const changed = Object.fromEntries(Object.entries(next.packages).filter(([key, value]) => JSON.stringify(old.packages[key]) !== JSON.stringify(value)));
          const removed = Object.keys(old.packages).filter(key => !(key in next.packages));
          console.log('LOCK_DELTA_BEGIN' + Buffer.from(JSON.stringify({deps:pkg.dependencies,changed,removed})).toString('base64') + 'LOCK_DELTA_END');
          NODE
      - name: Install locked dependencies
        run: npm ci
      - name: Sync story data
        run: npm run sync-story
      - name: Run tests
        run: npm test
      - name: Build viewer
        run: npm run build
      - name: Verify both entry points
        run: |
          test -s dist/index.html
          test -s dist/player.html
      - name: Build PR preview with its real Pages asset path
        if: github.event_name == 'pull_request'
        env:
          LOOP_TOWN_BASE: /Loop_and_Town/previews/pr-${{ github.event.pull_request.number }}/
        run: npm run build
      - name: Verify PR preview assets
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test -s dist/player.html
          test -s dist/story/manifests/loop_01.yaml
          grep -q "/Loop_and_Town/previews/pr-${PR_NUMBER}/assets/" dist/player.html
          grep -q "/Loop_and_Town/previews/pr-${PR_NUMBER}/assets/" dist/index.html
      - name: Archive PR preview build
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: loop-town-preview-${{ github.event.pull_request.number }}
          path: tools/event-graph-viewer/dist
          if-no-files-found: error
          retention-days: 7
