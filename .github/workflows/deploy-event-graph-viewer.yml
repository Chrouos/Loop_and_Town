name: Deploy Event Graph Viewer

on:
  push:
    branches: [main]
    paths:
      - 'tools/event-graph-viewer/**'
      - 'story/**'
      - 'docs/**'
      - '.github/workflows/event-graph-viewer.yml'
      - '.github/workflows/deploy-event-graph-viewer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # A workflow_dispatch from a PR branch must never publish preview content
    # over the production GitHub Pages site.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/event-graph-viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/event-graph-viewer/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Sync story data
        run: npm run sync-story
      - name: Run tests
        run: npm test
      - name: Build viewer
        run: npm run build
      - name: Verify both entry points
        run: |
          test -s dist/index.html
          test -s dist/player.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: tools/event-graph-viewer/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
