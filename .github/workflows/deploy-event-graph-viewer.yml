name: Deploy Event Graph Viewer

on:
  push:
    branches: [main]
    paths:
      - 'tools/event-graph-viewer/**'
      - 'story/**'
      - 'docs/**'
      - '.github/workflows/event-graph-viewer.yml'
      - '.github/workflows/deploy-event-graph-viewer.yml'
  workflow_dispatch:
  workflow_run:
    workflows: [Event Graph Viewer]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # A workflow_dispatch from a PR branch must never publish preview content
    # over the production GitHub Pages site.
    # Workflow_run executes this trusted workflow from main, never code from the PR workflow itself.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'pull_request' &&
         github.event.workflow_run.head_branch == 'docs/feature/black-screen-immersive-ui-v0.1' &&
         github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/event-graph-viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/event-graph-viewer/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Sync story data
        run: npm run sync-story
      - name: Run tests
        run: npm test
      - name: Build viewer
        run: npm run build
      - name: Verify both entry points
        run: |
          test -s dist/index.html
          test -s dist/player.html
      # Build unmerged PR code with read-only permissions, in a separate workspace.
      # Only the deploy job may obtain Pages write credentials.
      - name: Check PR 25 still open
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_NAME: ${{ github.repository }}
        run: |
          if [ "$(gh api "repos/${REPO_NAME}/pulls/25" --jq .state)" = "open" ]; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout PR preview sources
        if: steps.preview.outputs.active == 'true'
        uses: actions/checkout@v7
        with:
          ref: docs/feature/black-screen-immersive-ui-v0.1
          path: preview-source
          persist-credentials: false
      - name: Install PR preview dependencies
        if: steps.preview.outputs.active == 'true'
        working-directory: preview-source/tools/event-graph-viewer
        run: npm ci
      - name: Build PR preview in its independent Pages path
        if: steps.preview.outputs.active == 'true'
        working-directory: preview-source/tools/event-graph-viewer
        env:
          LOOP_TOWN_BASE: /Loop_and_Town/previews/pr-25/
        run: npm run build
      - name: Stage PR preview alongside the main site
        if: steps.preview.outputs.active == 'true'
        run: |
          target="$GITHUB_WORKSPACE/tools/event-graph-viewer/dist/previews/pr-25"
          source="$GITHUB_WORKSPACE/preview-source/tools/event-graph-viewer/dist"
          mkdir -p "$target"
          cp -a "$source/." "$target/"
          test -s "$target/player.html"
          test -s "$target/story/manifests/loop_01.yaml"
          grep -q "/Loop_and_Town/previews/pr-25/assets/" "$target/player.html"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: tools/event-graph-viewer/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
