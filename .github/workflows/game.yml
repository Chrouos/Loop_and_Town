name: Game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Test (scripts, engine, audio)
        run: npm test
      - name: Install mobile test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Test mobile Chromium and WebKit
        run: |
          npm run dev -- --host 127.0.0.1 --port 5180 > /tmp/game-vite.log 2>&1 &
          trap 'kill $!' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5180/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:mobile
      - name: Build
        run: npm run build
      - name: Check the game page exists
        run: test -s dist/index.html
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: game/dist

  deploy:
    # Only main publishes; the site root is the game.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
