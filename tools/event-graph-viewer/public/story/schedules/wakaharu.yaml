character_id: wakaharu
entries:
  - id: wakaharu_leave_cafe
    at: { day: 0, time: "17:45" }
    visibility: hidden
    when: { path: characters.wakaharu.route, op: eq, value: old_station }
    effects:
      - set: { path: characters.wakaharu.location, value: road_to_old_station }
  - id: wakaharu_go_home
    at: { day: 0, time: "17:45" }
    visibility: hidden
    when: { path: characters.wakaharu.route, op: eq, value: home }
    effects:
      - set: { path: characters.wakaharu.location, value: home }
  - id: wakaharu_arrive_station
    at: { day: 0, time: "18:05" }
    visibility: hidden
    when: { path: characters.wakaharu.route, op: eq, value: old_station }
    effects:
      - set: { path: characters.wakaharu.location, value: old_station }
  - id: wakaharu_submit_resignation
    at: { day: 0, time: "20:30" }
    visibility: hidden
    when:
      all:
        - { path: characters.wakaharu.status, op: eq, value: alive }
        - { path: characters.wakaharu.location, op: eq, value: home }
        - { path: relationships.protagonist_wakaharu.trust, op: eq, value: 2 }
    effects:
      - set: { path: characters.wakaharu.life_status, value: resignation_submitted }
