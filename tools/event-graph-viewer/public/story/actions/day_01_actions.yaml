    at: "18:20"
    duration_minutes: 5
    label: 泡咖啡
    effects: []

  - id: protect_wakaharu
    at: "18:20"
    label: 阻止若晴前往舊車站
    effects:
      - set:
          path: characters.wakaharu.location
          value: home
      - add_flag: flags.player_protected_wakaharu
      # Isolated 18:20 fixture: Wakaharu's absence already redirected the doctor's document route.
      - add_flag: world.doctor_maintenance_exposed

  - id: stop_doctor
    at: "18:20"
    label: 阻止醫生前往舊車站
    effects:
      - set:
          path: characters.doctor.location
          value: clinic
      - add_flag: flags.player_stopped_doctor
      # Stop the maintenance route when the doctor stays at the clinic.
      - set:
          path: world.doctor_maintenance_exposed
          value: false
