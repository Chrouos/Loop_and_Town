scenes:
  - id: loop07_0612_final_question
    title: 她最後的選擇
    at: { day: 0, time: "06:12" }
    kind: narration
    participants: [protagonist, zhixia]
    blocks:
      - type: narration
        text: "06:12，我在列車上醒來。信和昨天一樣，只寫著「不要回來」。"
      - type: narration
        text: "今天我要看知夏留下的工作筆記，而不是等信紙回答問題。"
      - type: monologue
        text: "她最後真正做過什麼選擇？"
  - id: loop07_0830_hidden_notebook
    title: 牆板後的筆記
    at: { day: 0, time: "08:30" }
    kind: dialogue
    participants: [protagonist, reporter, zhixia]
    blocks:
      - type: narration
        text: 庭安帶我進舊研究所資料室最裡面，把一塊鬆掉的牆板拆下來。後面不是設備，而是一本被塑膠袋包了五年的工作筆記。
      - type: dialogue
        speaker: reporter
        text: 我不是只燒過她的信。這一本，是我藏的。
      - type: narration
        text: 每一頁都不是「誰該死」，而是某條世界線發生過什麼：世界線 14，若晴存活，柏勳死亡。世界線 19，柏勳存活，志遠重傷。世界線 23，我留在灰潮鎮，18:31 後失聯。
      - type: dialogue
        speaker: reporter
        text: 一開始她每頁都寫「再試一次」。後來寫「不能全部保住」。再後來，只剩數字。

  - id: loop07_0920_worldline_31
    title: 世界線 31
    at: { day: 0, time: "09:20" }
    kind: narration
    participants: [protagonist, reporter, zhixia]
    blocks:
      - type: narration
        text: 我翻到世界線 31。那一頁比其他頁乾淨，只有我的名字、死亡，以及 18:31。
      - type: narration
        text: 五年前的那一輪，姊第一次真正把我留在灰潮鎮。我們沒有爭吵，甚至一起吃了晚餐。
      - type: narration
        text: 筆記只有我、18:31、死亡，沒有足以重建事故的完整紀錄。我不知道那條 Worldline 的自己具體怎麼死，只知道姊姊確實看過那個結果。
      - type: dialogue
        speaker: reporter
        text: 那是她開始變的那一輪。
      - type: monologue
        text: 她曾經成功讓我留下，卻在同一條 Worldline 看見我死亡。那不是任何人應該替別人決定人生的理由。

  - id: loop07_1040_designed_argument
    title: 那場爭吵
    at: { day: 0, time: "10:40" }
    kind: dialogue
    participants: [protagonist, reporter, zhixia]
    blocks:
      - type: narration
        text: 我一直記得死亡前半年那場爭吵。知夏突然冷下來，專挑我最不能忍的話說。
      - type: dialogue
        speaker: zhixia
        text: 妳不是一直都想離開嗎？那就走啊。
      - type: narration
        text: 我真的走了。五年沒有回來。現在才知道，她記得世界線 31，所以開始把「讓妹妹留下」改成「無論如何讓妹妹離開」。
      - type: dialogue
        speaker: protagonist
        text: 所以她是為了救我？
      - type: dialogue
        speaker: reporter
        text: 是。但這不代表她後來做的每件事都對。

  - id: loop07_1210_people_as_variables
    title: 被寫進筆記的人
    at: { day: 0, time: "12:10" }
    kind: narration
    participants: [protagonist, reporter, zhixia]
    blocks:
      - type: narration
        text: 筆記後半開始出現我很熟悉的東西：每個人的時間、路線、能被什麼話說服、哪一通電話會讓誰晚七分鐘出門。
      - type: narration
        text: 知夏沒有發現「死亡會自動轉移」。她發現的是更危險的事：只要改變行程，風險就會沿著新的因果鏈落到不同人身上。
      - type: narration
        text: 她有幾次明知道某個安排會讓另一個人更靠近危險，仍然選了那條世界線，因為她算過總傷亡更少，或者因為那條線能把我送出灰潮鎮。
      - type: monologue
        text: 她不是把死亡從我身上搬給別人。她是開始接受「別人承擔比較大的風險」作為可以比較的結果。

  - id: loop07_1340_final_break
    title: 疲倦的錄音
    at: { day: 0, time: "13:40" }
    kind: dialogue
    participants: [protagonist, reporter, zhixia]
    blocks:
      - type: narration
        text: 庭安把另一段舊錄音放進播放器。兩個人的聲音都很疲倦，像這場爭論早就重複過很多次。
      - type: dialogue
        speaker: reporter
        text: 妳現在已經不是在救人了。
      - type: dialogue
        speaker: zhixia
        text: 那我要怎麼辦？
      - type: dialogue
        speaker: reporter
        text: 至少不要替所有人決定。
      - type: dialogue
        speaker: zhixia
        text: 可是如果我不決定，死的人只會更多。
      - type: dialogue
        speaker: reporter
        text: 那妳有沒有問過他們？
      - type: dialogue
        speaker: zhixia
        text: ……來不及。

  - id: loop07_1500_do_not_become_me
    title: 最後一頁
    at: { day: 0, time: "15:00" }
    kind: narration
    participants: [protagonist, reporter, zhixia]
    blocks:
      - type: narration
        text: 工作筆記最後一頁沒有解法，也沒有下一條安全路線。
      - type: narration
        text: 只有一句話：如果她回來，不要讓她變成我。
      - type: dialogue
        speaker: reporter
        text: 我五年前沒有把這句交給妳。我以為妳不知道，就不會回來碰這些。
      - type: monologue
        text: 我早在收到信前就決定返鄉。姊姊的警告不是召喚，更不是要求我替她繼續計算完美答案。

  - id: loop07_1620_letter_reply
    title: 沒有新字
    at: { day: 0, time: "16:20" }
    kind: narration
    participants: [protagonist, zhixia]
    blocks:
      - type: narration
        text: "我把信放在工作筆記旁。沒有任何新字出現。"
      - type: narration
        text: "知夏在筆記裡留下「如果她回來，不要讓她變成我」，也記下自己曾經替別人計算風險。"
      - type: monologue
        text: "因為我一個人做錯了——我想這是她最後沒有說出口的意思。所以這一次，不該再由一個人決定。"
  - id: loop07_1758_yuan_choice
    title: 予安的電話
    at: { day: 0, time: "17:58" }
    kind: dialogue
    participants: [protagonist, yuan]
    blocks:
      - type: narration
        text: "17:58，予安收到仲介詢問鐘錶店出售進度的電話，不是五年前那通未接來電。"
      - type: dialogue
        speaker: yuan
        text: "妳覺得我該接嗎？"
      - type: dialogue
        speaker: protagonist
        text: "我可以說我知道的。但店要不要賣、現在要不要談，還是你自己決定。"
  - id: loop07_1758_yuan_answers
    title: 予安接了
    at: { day: 0, time: "17:58" }
    kind: dialogue
    participants: [protagonist, yuan]
    blocks:
      - type: narration
        text: "予安自己接起電話，聽完仲介提出的價格與買方條件。"
      - type: dialogue
        speaker: yuan
        text: "我聽到了。我得先想想，這是我家留下的店。"
      - type: narration
        text: "他得到資訊，沒有因此把人生決定交給我。"
  - id: loop07_1758_yuan_declines
    title: 予安沒接
    at: { day: 0, time: "17:58" }
    kind: dialogue
    participants: [protagonist, yuan]
    blocks:
      - type: narration
        text: "予安讓電話停止震動，傳訊息給仲介約明天再談。"
      - type: dialogue
        speaker: yuan
        text: "我不是永遠不接，只是想先把我自己的想法弄清楚。"
      - type: narration
        text: "我接受他今天不想談的選擇。"
  - id: loop07_1831_collective_convergence
    title: 一起面對的 18:31
    at: { day: 0, time: "18:31" }
    kind: narration
    participants: [protagonist, yuan, wakaharu, doctor, reporter, detective]
    blocks:
      - type: narration
        text: 18:31 到來時，若晴、予安、柏勳、庭安和志遠都知道我們為什麼聚在這裡。沒有人被我單獨安排到某個「安全位置」。
      - type: narration
        text: 燈光短暫熄滅。遠處傳來那口早已拆掉的鐘。沒有人倒下，也沒有人立刻按照我的指示移動。
      - type: monologue
        text: 世界沒有在等一個死人。至少這一次，看起來更像是在等我們怎麼面對同一件事。

  - id: loop07_1831_collective_burden
    title: 交還的風險
    at: { day: 0, time: "18:31" }
    kind: narration
    participants: [protagonist, yuan, wakaharu, doctor, reporter, detective, zhixia]
    blocks:
      - type: narration
        text: "18:31 的電力異常仍然到來，但大家都知道自己正在承擔什麼。"
      - type: narration
        text: "警告信沒有變字；若晴、予安、柏勳、庭安和志遠仍然有自己的去留。"
      - type: monologue
        text: "這次不要由我選誰活。我想把風險交還給真正要承擔的人。"