scenes:
  - id: loop06_0612_sort_carriers
    title: 列出來源
    at: { day: 0, time: "06:12" }
    kind: narration
    participants: [protagonist]
    blocks:
      - type: narration
        text: "06:12，我在返鄉列車醒來。這次要比對的是資料來源，而不是先宣告前六封和第七封是一套成功實驗。"
      - type: narration
        text: "我列出紙條、借閱卡、錄音、病歷、抄本和出發前收到的警告信。"
      - type: monologue
        text: "我把『七封』當作暫時分類，而不是正確答案。"
  - id: loop06_0830_first_note
    title: 地方誌的紙條
    at: { day: 0, time: "08:30" }
    kind: narration
    participants: [protagonist, zhixia]
    blocks:
      - type: narration
        text: "地方誌裡夾著手寫紙條，另一份影印本的日期卻不一致。"
      - type: narration
        text: "紙可能被改過，也可能只是抄寫錯誤。它能否跨 Reality Rewrite 保存，沒有證據。"
      - type: monologue
        text: "先記錄版本與來源。"
  - id: loop06_0940_library_card
    title: 借閱卡
    at: { day: 0, time: "09:40" }
    kind: narration
    participants: [protagonist, zhixia]
    blocks:
      - type: narration
        text: "圖書館借閱卡有第三方登錄時間，但與知夏私人筆記有出入。"
      - type: narration
        text: "外部紀錄可以被交叉查證，不代表能免疫世界線改寫。"
      - type: monologue
        text: "我需要的不只是紙，而是能核實的保管歷史。"
  - id: loop06_1100_sound_carrier
    title: 對不上的錄音
    at: { day: 0, time: "11:00" }
    kind: dialogue
    participants: [protagonist, detective, zhixia]
    blocks:
      - type: narration
        text: "志遠給我聽未登錄錄音器，錄音時間與舊案報告並不一致。"
      - type: dialogue
        speaker: detective
        text: "我只確定這台設備在現場，不能把時間錯位當成已證實的跨線聲音傳輸。"
      - type: monologue
        text: "可能是設備異常，也可能還有別的資料被改寫。"
  - id: loop06_1230_medical_record
    title: 原始病歷
    at: { day: 0, time: "12:30" }
    kind: dialogue
    participants: [protagonist, doctor, zhixia]
    blocks:
      - type: narration
        text: "柏勳拿出知夏生前病歷，幾次描述的時間與別處事故紀錄對不上。"
      - type: dialogue
        speaker: doctor
        text: "這些是當時確實記下的症狀，不是跨世界線實驗證明。"
      - type: monologue
        text: "這些原始紀錄能用來查核，不能直接證明一套傳輸架構。"
  - id: loop06_1410_fifth_letter
    title: 燒掉之後的抄本
    at: { day: 0, time: "14:10" }
    kind: dialogue
    participants: [protagonist, reporter, zhixia]
    blocks:
      - type: narration
        text: "庭安拿出當年燒毀原件後留下的內容抄本。"
      - type: dialogue
        speaker: reporter
        text: "我確實燒過信，但後來看見相似內容並不等於同一張紙回來了。"
      - type: monologue
        text: "備份、轉記或 Rewrite 異常，現在都不能排除。"
  - id: loop06_1510_insight_to_evidence
    title: 維修貼紙
    at: { day: 0, time: "15:10" }
    kind: dialogue
    participants: [protagonist, yuan, zhixia]
    blocks:
      - type: narration
        text: 錄音器底部有一張褪色維修貼紙，是予安父親的鐘錶店。我們回店裡找當年用來讀取舊式音訊的轉接器。
      - type: dialogue
        speaker: yuan
        text: 找不到就算了。我爸那些舊線材，可能早就被我丟了。
      - type: narration
        text: 我想起另一個已經不存在的晚上。他一件件擦父親留下的壞鐘，連斷掉的發條都重新收好。
      - type: monologue
        text: 這只是我看過的另一個 Moment，不是「予安絕對不會丟」的答案。
      - type: dialogue
        speaker: protagonist
        text: 還有別人動過這個櫃子嗎？或者你爸以前會記外借紀錄？
      - type: dialogue
        speaker: yuan
        text: ……他真的有一本維修簿。知夏姊以前也借過一批錄音設備。
      - type: narration
        text: 我們最後在最下面的維修簿找到紀錄：林知夏借用舊式音訊轉接器，歸還日期是死亡前一天。
      - type: monologue
        text: 我只是因為一段人物記憶，選擇多查了一條路。真正留下記錄的，是這一行五年前的字。

  - id: loop06_1600_sixth_carrier
    title: 只有我記得的事
    at: { day: 0, time: "16:00" }
    kind: narration
    participants: [protagonist, zhixia]
    blocks:
      - type: narration
        text: "若晴不記得自己曾死去，予安也不記得我們上一輪的晚飯。"
      - type: narration
        text: "我卻記得，知夏五年前也記得。Fixed Anchor 的主觀記憶並非普通紙張能複製的功能。"
      - type: monologue
        text: "我不能把自己記得，誤當作信件已能跨線傳輸。"
  - id: loop06_1740_why_seventh
    title: 為什麼是第七封
    at: { day: 0, time: "17:40" }
    kind: narration
    participants: [protagonist, zhixia]
    blocks:
      - type: narration
        text: "知夏已死五年，信卻在我出發前抵達，郵戳是昨天。"
      - type: narration
        text: "我一直叫它第七封，但前面六種來源也可能只是不同紀錄。"
      - type: monologue
        text: "投遞方法還沒有答案，不能先把假設當技術。"
  - id: loop06_1803_handoff_point
    title: 撥出與收到
    at: { day: 0, time: "18:03" }
    kind: narration
    participants: [protagonist, zhixia]
    blocks:
      - type: narration
        text: "五年前通聯紀錄把 18:03 註記為撥出，知夏筆記卻寫著「收到」。"
      - type: narration
        text: "沒有發話方向的獨立證據，這也可能只是登錄或同步異常。"
      - type: monologue
        text: "我還不能把它直接叫成跨線交接。"
  - id: loop06_1831_seventh_message
    title: 仍然只有四個字
    at: { day: 0, time: "18:31" }
    kind: narration
    participants: [protagonist, zhixia]
    blocks:
      - type: narration
        text: "18:31，我再次拿起那封署名知夏的信，紙上仍然只有「不要回來」。"
      - type: narration
        text: "沒有新增字，也沒有知夏的即時回覆。鎮上卻傳來短暫的供電異常聲。"
      - type: monologue
        text: "我要繼續追查姊最後做出的選擇，而不是等待信來告訴我答案。"